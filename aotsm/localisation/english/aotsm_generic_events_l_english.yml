l_english:

 #Тут ванильные ивенты расположены, которые реплейснуты файлами мода

 ace_promoted.1.t: "Ace pilot gets promoted"
 ace_promoted.2.t: "Return of the ace"
 ace_promoted.1.d: "Few risk themselves as desperately as the brave pilots of [Root.GetAdjective] Air Force. [From.GetName] [From.GetSurname], an experienced pilot with the callsign [From.GetCallsign], not only returns unscathed from flights over the [From.GetMissionRegion] region, but also achieves decisive victories in the most important aerial battles.\n\nA symbol of true [Root.GetAdjective] courage, [From.GetName] receives a well-deserved promotion, met with enthusiasm by the public. Although for ordinary people war is more of a hell than glory, heroes are needed to set an example."
 ace_promoted.1.d_major: "Few risk themselves as desperately as the brave pilots of [Root.GetAdjective] Air Force. [From.GetName] [From.GetSurname], an experienced pilot with the callsign [From.GetCallsign], not only returns unscathed from flights over the [From.GetMissionRegion] region, but also pilots his [From.GetWing] with extraordinary skill. The recent flight over the [From.GetMissionRegion] region proved that [From.GetName] is a true ace, whose contribution to combat operations is invaluable.\n\nA symbol of true [Root.GetAdjective] courage, [From.GetName] receives a thoroughly deserved promotion, met with enthusiasm by the public. Although for ordinary people war is more of a hell than glory, heroes are needed to set an example."
 ace_promoted.1.a: "Fortune favors the brave."
 ace_died.1.t: "Death of pilot [From.GetCallsign] over the [From.GetMissionRegion] region"
 ace_died.1.d: "The most famous ace-[From.GetAceType] of the state [From.Owner.GetName], [From.GetFullName], perished while carrying out a crucial mission over the [From.GetMissionRegion] region. Unfortunately, since [From.GetCallsign] is an idol to millions, such a death will not go unnoticed and will be a heavy blow to the people.\n\nWe would like to find a way to conceal this, but the prolonged absence of such a famous person as [From.GetName] would soon arouse suspicion. In the end, this death is also part of a great legend that will long outlive all our minor current hardships."
 ace_died.1.d_major: "The most famous ace-[From.GetAceType] of the state [From.Owner.GetName], [From.GetFullName], perished while carrying out a crucial mission. The [From.GetWingShort] aircraft was seen plunging in flames over the [From.GetMissionRegion] region after engaging the enemy. Unfortunately, since [From.GetCallsign] is an idol to millions, such a death will not go unnoticed and will be a heavy blow to the people.\n\nWe would like to find a way to conceal this, but the prolonged absence of such a famous person as [From.GetName] would soon arouse suspicion. In the end, this death is also part of a great legend that will long outlive all our minor current hardships."
 ace_died.1.a: "A living legend is even better."
 ace_killed_by_ace.1.t: "[From.GetFullName] shot down by ace with callsign [Prev.GetCallsign]"
 ace_killed_by_ace.1.d: "Pilots returning from the [From.GetMissionRegion] region report that a squadron of [Prev.Owner.GetAdjective] aircraft, led by the famous ace with callsign [Prev.GetCallsign], targeted [From.GetCallsign] for elimination. After shooting down several enemy aircraft and dodging [Prev.Owner.GetAdjective] fire multiple times, [From.GetCallsign] lost the duel to pilot [Prev.GetCallsign], who maneuvered more skillfully and pierced the fuel tank with a precise shot. [From.GetName] [From.GetSurname]'s aircraft caught fire and plunged down over the [From.GetMissionRegion] region, engulfed in flames.\n\nThe courage of pilot [From.GetFullName] has always been an example to many. The death of such a national hero will strike hard at the [From.Owner.GetAdjective] Air Force and will be a heavy loss for our entire nation. As we mourn, [Prev.Owner.GetName] celebrates [Prev.GetFullName] as a hero, making our tragedy even more bitter."
 ace_killed_by_ace.1.d_major: "Pilots returning from the [From.GetMissionRegion] region report that a squadron of [Prev.Owner.GetAdjective] aircraft, led by the famous ace with callsign [Prev.GetCallsign], attacked them. Their primary target was [From.GetCallsign]. After shooting down several enemy aircraft and dodging [Prev.Owner.GetAdjective] fire multiple times, [From.GetCallsign] was defeated: [Prev.GetCallsign] maneuvered more skillfully and pierced the fuel tank with a precise shot. The [Prev.GetWingShort] aircraft piloted by [From.GetName] [From.GetSurname] caught fire and plunged down over the [From.GetMissionRegion] region, engulfed in flames.\n\n[From.GetFullName] always displayed unparalleled courage and was an example to many. The death of such a national hero will strike hard at the [From.Owner.GetAdjective] Air Force and will be a heavy loss for the entire nation. As we mourn, [Prev.Owner.GetName] celebrates its hero, and the fact that [Prev.GetFullName] receives such praise makes the tragedy even more bitter."
 ace_killed_by_ace.1.a: "A devastating loss for all of us"
 ace_killed_other_ace.1.t: "[From.GetFullName] shot down ace with callsign [Prev.GetCallsign]"
 ace_killed_other_ace.1.d: "The last flight over the [From.GetMissionRegion] region turned out to be a great success for the [From.Owner.GetAdjective] Air Force for various reasons. Reports have come in about the heroism displayed by [From.GetFullName], who prevailed over the [Prev.Owner.GetAdjective] pilot [Prev.GetName] [Prev.GetSurname] with callsign [Prev.GetCallsign]. [From.GetCallsign] used himself as bait to lure [Prev.GetCallsign] into a trap, allowing [From.Owner.GetAdjective] pilots to destroy the squadron he was leading. [From.GetCallsign] confused the [Prev.Owner.GetAdjective] aircraft with a feint maneuver and secured victory with a single shot. [Prev.GetCallsign] burned over the [From.GetMissionRegion] region.\n\n[Prev.GetFullName] was a formidable enemy who had shot down many [From.Owner.GetAdjective] pilots. This is a great victory, demonstrating the greatness of our heroes and their deeds."
 ace_killed_other_ace.1.d_major: "The last flight over the [From.GetMissionRegion] region turned out to be a great success for the [From.Owner.GetAdjective] Air Force for various reasons. Reports have come in about the heroism displayed by [From.GetFullName], who prevailed over the [Prev.Owner.GetAdjective] pilot [Prev.GetName] [Prev.GetSurname] with callsign [Prev.GetCallsign]. [From.GetCallsign] used himself as bait to lure [Prev.GetCallsign] into a trap, allowing [From.Owner.GetAdjective] pilots to destroy the squadron he was leading. [From.GetCallsign] confused the [Prev.Owner.GetAdjective] aircraft with a feint maneuver and secured victory with a single shot. [Prev.GetCallsign] burned over the [From.GetMissionRegion] region.\n\n[Prev.GetFullName] was a formidable enemy who had shot down many [From.Owner.GetAdjective] pilots. This is a great victory, demonstrating the greatness of our heroes and their deeds."
 ace_killed_other_ace.1.a: "[From.Owner.GetName] will not forget such a victory!"
 aces_killed_each_other.1.t: "[From.GetFullName] perished"
 aces_killed_each_other.1.d: "While carrying out his last mission, our famous ace-[From.GetAceType] [From.GetFullname] engaged in combat with a pilot named [Prev.GetFullName]. Having expended all ammunition and with no chance to escape, [From.GetCallsign] maneuvered to evade [Prev.Owner.GetAdjective] fire and rammed [Prev.GetCallsign].\n[From.GetCallsign] and [Prev.GetCallsign] perished, their aircraft burning over the [From.GetMissionRegion] region.\n\nWe can take solace in the fact that the best [Prev.Owner.GetAdjective] ace [Prev.GetCallsign] no longer poses a threat to us, but we have lost a public favorite and a hero who inspired the entire [From.Owner.GetAdjective] people."
 aces_killed_each_other.1.d_major: "While carrying out his last mission, our famous ace-[From.GetAceType] [From.GetFullname] engaged in combat with a pilot named [Prev.GetFullName]. Having expended all ammunition and with no chance to escape, [From.GetCallsign] maneuvered to evade [Prev.Owner.GetAdjective] fire and rammed [Prev.GetCallsign].\n[From.GetCallsign] and [Prev.GetCallsign] perished, their aircraft burning over the [From.GetMissionRegion] region.\n\nWe can take solace in the fact that the best [Prev.Owner.GetAdjective] ace [Prev.GetCallsign] no longer poses a threat to us, but we have lost a public favorite and a hero who inspired the entire [From.Owner.GetAdjective] people."
 aces_killed_each_other.1.a: "A tremendous loss for all of us"

 generic.1.t: "The state of [From.GetName] is influencing our politics"
 generic.1.d_neutral_good: "For quite some time now, the [From.GetAdjective] government has demonstrated a desire to bring the historical paths of our countries closer and has shown particular interest in [Root.GetAdjective] politics. Recently this has become more noticeable: the [From.GetRulingParty] party has begun promoting [From.GetRulingIdeologyNoun_lower_Acc], making public speeches and distributing printed materials among the [Root.GetAdjective] population.\n\nNow even some politicians and prominent officials, influenced by [From.GetAdjective] propaganda, have begun to advocate for the tenets of this ideology to become dominant in the state of [Root.GetName]."
 generic.1.d_bad: "For quite some time now, the [From.GetAdjective] government has demonstrated a desire to bring the historical paths of our countries closer, often interfering in the internal affairs of [Root.GetNameRuGen]. Recently this interference has become particularly active, and the [From.GetRulingParty] party has begun openly promoting [From.GetRulingIdeologyNoun_lower_Acc], completely disregarding [Root.GetAdjective] political traditions. Numerous materials praising [From.GetRulingIdeologyNoun_lower_Nom] are also being distributed among the [Root.GetAdjective] population. It seems that even some politicians and prominent officials, influenced by [From.GetAdjective] propaganda, have begun to advocate for the tenets of this ideology to become dominant in the state of [Root.GetName]."
 generic.1.a: "Interesting..."
 generic.1.b: "How dare they!"

 generic.2.t: "The state of [From.GetNameDefCap] wants to join the [Root.GetFactionName] alliance"
 generic.2.d.a: "Amid the growing threat to democratic values, the [alliance_applicant.GetAdjective] authorities see us as defenders of freedom. They wish to join our alliance to benefit from our protection and help us repel anti-democratic forces."
 generic.2.d.b: "Our attempts to change the existing world order have not gone unnoticed by like-minded countries. The [alliance_applicant.GetAdjective] authorities recognize that their best hope for a prosperous future is to side with us in the coming conflict. Therefore, they have officially proposed to stand as a united front against our enemies."
 generic.2.d.c: "[alliance_applicant.GetNameDefCap] recognizes that it must unite with other socialist republics to strengthen the position of communism on the world stage. Acknowledging our leading role in the struggle for the rights of proletarians of all countries, the [alliance_applicant.GetAdjective] authorities have officially expressed their desire to form an alliance with us."
 generic.2.d.e: "The echoes of recent upheavals on the international political stage continue to resound across the planet. The [alliance_applicant.GetAdjective] authorities believe that we are their best hope for survival in these difficult times. In this regard, they have sent us a request to join our alliance, so that we may weather the coming storm together."
 generic.2.a: "We welcome all who share the ideals of freedom and democracy."
 generic.2.b: "The world will belong to the strongest powers!"
 generic.2.c: "If we join forces, the revolution is bound to succeed."
 generic.2.e: "And we shall withstand its onslaught!"
 generic.2.f: "We are better off without them."
 generic.2.g: "We already have enough allies."
 generic.3.t: "The state of [alliance_inviter.GetNameDefCap] invites us to join the [alliance_inviter.GetFactionName] alliance"
 generic.3.d: "The state of [alliance_inviter.GetNameDefCap] has approved our application to join the [alliance_inviter.GetFactionName] alliance. Together with them, we will either stand or fall."
 generic.3.a: "Together we will defend democracy."
 generic.3.b: "Nothing can stop us now!"
 generic.3.c: "There are no better fighters for the rights of the proletariat than us!"
 generic.3.e: "For a while, we put our differences aside."
 generic.4.t: "The state of [alliance_inviter.GetNameDefCap] rejects the application to join the [alliance_inviter.GetFactionName] alliance"
 generic.4.d: "The state of [alliance_inviter.GetNameDefCap] has rejected our application to join the [alliance_inviter.GetFactionName] alliance. We will have to act without their help."
 generic.4.a: "And they call themselves defenders of freedom?!"
 generic.4.b: "Then we will crush them too!"
 generic.4.c: "Their revolution is rotten to the core!"
 generic.4.e: "There are too many serious disagreements between us."
 generic.5.t: "The state of [From.GetNameDefCap] invites the state of [Root.GetNameDef] to join the '[From.GetFactionName]' alliance"
 generic.5.d.a: "Concerned about recent events on the world stage, the state of [alliance_inviter.GetNameDef] has extended a hand of friendship, offering its protection and calling on us to stand together in defense of the principles of freedom and democracy. By joining the [alliance_inviter.GetFactionName] alliance, we will be able to guarantee the freedom of our citizens."
 generic.5.d.b: "Realizing that even the mighty need allies, the [alliance_inviter.GetAdjective] authorities have invited us to join the [alliance_inviter.GetFactionName] alliance. If we accept their offer, we will have a chance to find our place in the sun."
 generic.5.d.c: "Our ideological comrades from [alliance_inviter.GetNameRuGen] have taken note of our modest contribution to the defense of working-class interests, and this morning we received an offer to join the [alliance_inviter.GetFactionName] alliance. By joining forces with other socialist countries, we will fan the flames of world revolution with renewed vigor."
 generic.5.d.e: "It seems that the [alliance_inviter.GetAdjective] authorities consider us a strategically important partner and believe that it is far more advantageous for us to work together than to bicker over ideological differences. This morning, the [alliance_inviter.GetAdjective] ambassador sent us an invitation to join the [alliance_inviter.GetFactionName] alliance."
 generic.5.a: "We will stay together."
 generic.5.b: "We only need a few thousand dead..."
 generic.5.c: "We will fight side by side with our comrades!"
 generic.5.e: "This is a beneficial offer."
 generic.6.t: "The state of [alliance_applicant.GetNameDefCap] accepts the invitation to join the [alliance_inviter.GetFactionName] alliance"
 generic.6.d: "The state of [alliance_applicant.GetNameDefCap] has accepted our offer to join the [alliance_inviter.GetFactionName] alliance. Together with them, we will either stand or fall."
 generic.7.t: "The state of [alliance_applicant.GetNameDefCap] rejects the invitation to join the [alliance_inviter.GetFactionName] alliance"
 generic.7.d: "The state of [alliance_applicant.GetNameDefCap] has rejected our offer to join the [alliance_inviter.GetFactionName] alliance. We will have to act without their help."
 generic.7.a: "They don't need our help."

 generic.8.t: "Masters of the Atom"
 generic.8.d: "We are the first in the world to use nuclear weapons, which has allowed us to take the lead in the arms race. Our immense expenditures have paid off, and now all that remains for others is to marvel at our might. Perhaps someday some countries will catch up with us, but they will never pull ahead."
 generic.8.a: "Let us grind our enemies to dust!"
 generic.9.t: "In the Shadow of Others"
 generic.9.d: "Another country has become the first in the world to use nuclear weapons, allowing it to take the lead in the arms race. Despite all our efforts, we have not created means of defense or retaliation. In light of such undeniable superiority, we have no choice but to redouble our efforts and close the gap before the leader of the race fully demonstrates its crushing power."
 generic.9.a: "We must allocate every possible resource to the program."
 generic.10.t: "Mighty Friends"
 generic.10.d: "Our allies have become the first in the world to use nuclear weapons, thanks to which our alliance now firmly holds first place in the arms race. Although we have been outdone in this race, we will still be able to respond adequately if the enemy also possesses this weapon."
 generic.10.a: "An acceptable outcome."

 generic.11.t: "End of the Civil War"
 generic.11.d: "The war that has been tearing our country apart has finally come to an end. Now we can unite the people and rebuild what was destroyed."
 generic.11.a: "Together we will build a better future!"
 generic.12.t: "[From.GetAdjective] saboteurs attempt to sabotage the Suez Canal"
 generic.12.d: "Military intelligence reports that [From.GetAdjective] saboteurs intend to use powerful explosive charges and scuttled ships to carry out sabotage on the Suez Canal. If we want to stop the enemy, we have little time."
 generic.12.a: "We will not allow this!"
 generic.13.t: "[From.GetAdjective] saboteurs attempt to sabotage the Panama Canal"
 generic.13.d: "Military intelligence reports that [From.GetAdjective] saboteurs intend to use powerful explosive charges and scuttled ships to carry out sabotage on the Panama Canal. If we want to stop the enemy, we have little time."
 generic.14.t: "[From.GetName] issues an official diplomatic protest"
 generic.14.d: "[From.GetAdjective] envoys have lodged a diplomatic protest with our government regarding the presence of our attachés in countries with which their state is currently engaged in military conflict. They demand the immediate withdrawal of our military mission."
 generic.14.a: "This is a reasonable demand."
 generic.14.b: "We will send our attachés wherever we want."

 generic.15.t: "[From.GetName] recalls attachés"
 generic.15.d: "In response to our demands, the state of [From.GetNameDef] has withdrawn its military missions from countries hostile to us."
 generic.16.t: "[From.GetName] does not recall attachés"
 generic.16.d: "Despite our demands, the state of [From.GetNameDef] has refused to withdraw its military missions from countries hostile to us, stating that 'it is not our business to interfere in [From.GetAdjective] internal affairs'."
 generic.16.a: "We will deal with this."
 
 generic.19.t: "[From.GetName] Sends Industrial Support"
 generic.19.d: "[From.GetNameDefCap] has informed us that they support our cause, and will provide us with a certain measure of industrial aid to strengthen our position against our common enemies."
 generic.20.t: "[From.GetNameDefCap] Demands Our Submission"
 generic.20.d_friends: "We received a delegation today expressing [From.GetLeader]'s interest in extending the relations between our countries and taking steps to unite the [Root.GetAdjective] people together with [From.GetNameDef]. Agreeing to [From.GetLeader]'s proposal would make [Root.GetNameDef] a moderately autonomous puppet of [From.GetNameDef] and our government will be reorganized into something more in line with [From.GetLeader]'s vision.\n\nThe question remains, is [Root.GetAdjective] independence more important than our friendship with [From.GetNameDef]?"
 generic.20.d_enemies: "A message arrived from [From.GetNameDef] today demanding that [Root.GetLeader] recognizes [From.GetLeader] as head of state and that our nation should be reorganized into something more in line with the [From.GetAdjective] government's vision for [Root.GetNameDef]. Accepting would make us a puppet of [From.GetNameDef].\n\nThough we would rather not surrender our independence to our enemies across the border, there's a definite element of threat in their message that would lead us to believe that if we do not meet [From.GetLeader]'s demands, we will soon find ourselves in a state of war with [From.GetNameDef]."
 generic.20.a: "Submit to their demands."
 generic.20.b: "I, for one, welcome our new [From.GetAdjective] overlords."
 generic.20.c: "Absolutely not!"
 generic.21.t: "[From.GetNameDefCap] Submits"
 generic.21.d: "The [From.GetAdjective] government has agreed to abandon their independence and become a puppet state of [Root.GetNameDef]. We are sure this will lead to greatness and advance [Root.GetAdjective] interest in the region."
 generic.21.a: "Excellent."
 generic.22.t: "[From.GetNameDefCap] Defiant!"
 generic.22.d: "Diplomats from [From.GetNameDef] arrived today to announce that they decline our offer to unite [From.GetNameDef] with [Root.GetNameDef]. Disappointing as it may be, the option to bring [From.GetNameDef] to heel by force remains a valid and tempting option."
 generic.22.a: "Disappointing."
 generic.23.t: "[From.GetNameDefCap] Demands Control of [demanded_prov_target.GetName]"
 generic.23.d: "We have received a hostile delegation from [From.GetNameDef] today, claiming ownership of the entirety of the [demanded_prov_target.GetName] state. [From.GetLeader] demands that we return the territory immediately or war will be inevitable. They claim that [demanded_prov_target.Owner.GetAdjective] ownership of the region is illegitimate and that [demanded_prov_target.GetName] is an integral part of the [From.GetAdjective] state.\n\nShould we accept their demands, [demanded_prov_target.GetName] will be ceded to [From.GetNameDef] but we shall maintain any cores or claims we have over the region. Should we refuse, war between our nations seems inevitable."
 generic.23.a: "We have no choice."
 generic.23.b: "[demanded_prov_target.GetName] will remain [Root.GetAdjective]!"
 generic.24.t: "[demanded_prov_target.GetName] Ceded!"
 generic.24.d: "[From.GetNameDefCap] has decided to accept our rightful claim of [demanded_prov_target.GetName] and has ceded the region to [Root.GetNameDef].\nWith this matter dealt with in such an expedient and courteous manner, we are certain that the peace between [Root.GetNameDef] and [From.GetNameDef] shall continue in perpetuity."
 generic.25.t: "[From.GetNameDefCap] Defiant!"
 generic.25.d: "[From.GetNameDefCap] has refused our demands and now we must decide whether or not to fulfill our promise to invade. Failing to carry out our word will greatly damage public perception of [Root.GetLeader] and the legitimacy of the [Root.GetAdjective] government."
 generic.25.a: "One way or another, [demanded_prov_target.GetName] will be our