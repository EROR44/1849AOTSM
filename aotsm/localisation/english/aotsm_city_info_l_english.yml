 AOTSM_CITY_MOSCOW_BODY:0 "      The first chronicle reference to §YMoscow§! dates to §G1147§! and concerns a meeting between Prince §YYuri Dolgoruky§! and §YSviatoslav Olgovich§!. The settlement predates this reference; the beginning of its fortification is traditionally associated with §YDolgoruky§!. Its position on river and overland routes encouraged the development of a centre for trade and defence.\n\n      The historic core comprises the §YKremlin§!, §YKitay-gorod§! and surrounding trading settlements. Cathedrals, monasteries and merchants’ estates preserve the character of the former capital. §YMoscow§! is known for its large markets, craft districts and university, established in §G1755§!. Its radial street pattern reflects the gradual expansion of development around the §YKremlin§! fortifications.\n\n      §YMoscow§! remains a leading commercial, manufacturing and educational centre of the §YRussian State§!. Manufactories and workshops are linked with the economy of the central provinces, while trading houses distribute goods between regions. Although the highest state institutions are located in §YPetrograd§!, a substantial share of cultural and business activity remains concentrated here."

 #CITY REFERENCES
 aotsm_city_info_unavailable_t:0 "Reference unavailable"
 AOTSM_CITY_SPB_BODY:0 "      The city was founded in §G1703§! by order of §YPeter I§!. The laying of the §YPeter and Paul Fortress§! at the mouth of the §YNeva§! marked the establishment of a fortified centre intended to defend access to the §YBaltic Sea§!. Residential and trading quarters developed around the fortress, §YAdmiralty§! shipyards and first quays.\n\n      The city occupies islands in the §YNeva§! delta. Planned streets, canals and embankments connect palace ensembles with government buildings, shipyards and harbour warehouses. Principal landmarks include the §YPeter and Paul Fortress§!, the §YAdmiralty§! and the §YWinter Palace§!; the city’s layout reflects its original purpose as a maritime capital.\n\n      §YPetrograd§! houses the highest institutions of the §YRussian State§! and the residence of the §YProtector§!. Following the transition to republican government, the capital retained its position as the principal administrative centre. Shipbuilding, foreign trade and supplies for the garrison sustain the urban economy; the port provides connections with Baltic and western European markets."
 AOTSM_CITY_BERLIN_BODY:0 "      §YBerlin§! grew from two neighbouring trading settlements on the §YSpree§!. §YCölln§!, mentioned in §G1237§!, occupied a river island, while §YBerlin§!, recorded from §G1244§!, stood opposite. A shared crossing and trading routes drew the settlements together, forming the basis of the future city.\n\n      The §YRoyal Palace§!, arsenal and §YUnter den Linden§! define the administrative centre. Educational institutions and art collections stand beside barracks and industrial quarters. The planned streets reflect the city’s long development under the patronage of the Prussian monarchy.\n\n      §YBerlin§! is the capital of §YPrussia§! and a centre of its military industry. State orders support engineering and arms production. Rivalry with the §YAustrian Empire§! for influence in the German lands increases the importance of military offices, engineering projects and political negotiations."
 AOTSM_CITY_BUDAPEST_BODY:0 "      The urban complex developed from the settlements of §YBuda§!, §YPest§! and Óbuda, each with its own history. Fortified §YBuda§! is associated with King §YBéla IV§!, who established a protected centre on Castle Hill after the Mongol invasion of §G1241–1242§!. Settlements on the opposite bank developed as trading places.\n\n      The §YDanube§! separates hilly §YBuda§! and its royal residence from low-lying §YPest§! with its markets and craft quarters. Crossings maintain the economic unity of both banks. Castle ensembles, religious buildings and merchants’ houses reflect the centre’s importance to the Hungarian lands.\n\n      §YBuda§! and §YPest§! are under the authority of the §YAustrian Empire§!. The suppression of the Hungarian revolutionary movement with Russian military support restored imperial control without ending local discontent. §YDanube§! commerce and regional supplies continue under increased military and administrative supervision."
 AOTSM_CITY_CONSTANTINOPOL_BODY:0 "      The city was founded as Byzantium by Greek settlers from §YMegara§! in the §Gseventh century§! BC. In §G330§! §YConstantine I§! formally inaugurated the expanded settlement as a new imperial capital. Its position on the §YBosporus§! controlled the straits and routes between Europe and Asia.\n\n      §YConstantinople§! rightfully bears the title §0“capital of the world”§!. With almost §G18§! §Ymillion inhabitants§!, the city spans the §YBosporus§!, bringing together vast bazaars, busy ports and warehouse districts. §YHagia Sophia§!, imperial ensembles and defensive walls define the capital’s appearance, while the §YSilk Road§! connects its trading houses with Europe and Asia.\n\n      §YConstantinople§! is the capital of the §YRoman Empire§! and the residence of the §YZakhareas§! dynasty. The convergence of global trade routes makes it a leading centre of exchange and an expression of the state’s economic power. Shipyards and government offices serve European and overseas possessions, while rivalry with the §YRussian State§! increases the importance of diplomatic and military institutions."
 AOTSM_CITY_KIEV_BODY:0 "      §YKyiv§!’s origins are associated with early settlements on the §YDnieper§! heights. Chronicle tradition attributes its foundation to §YKyi§!, §YShchek§!, §YKhoryv§! and their sister §YLybid§!; the exact date is unknown. The city appears under the year §G862§! in the chronicle account of §YAskold§! and §YDir§!. Its position near crossings and river routes encouraged the development of a fortified trading centre.\n\n      The urban area comprises the §YUpper Town§!, §YPechersk§! and §YPodil§!, districts with distinct terrain and functions. §YSaint Sophia Cathedral§! and the §YKyiv Pechersk Lavra§! establish the city’s importance as a religious centre. §YPodil§!’s markets and craft quarters connect with the §YDnieper§! quays, while monastic complexes and ancient fortifications occupy the commanding heights.\n\n      §YKyiv§! serves as an important administrative, commercial and religious centre in the southwestern lands of the §YRussian State§!. Pilgrimage supports local crafts and trade, while river transport connects the city with agricultural regions. New quarters are developing, but ravines and hills continue to divide the built-up area into separate districts."
 AOTSM_CITY_LISABON_BODY:0 "      §YLisbon§!’s origins reach back to a settlement at the mouth of the §YTagus§! in the §Gfirst millennium§! BC. Its development is associated with Phoenician sailors and merchants using the sheltered harbour. Known as Olisipo in Roman times, it connected ocean routes with the interior.\n\n      Hills, quays and commercial squares define §YLisbon§!’s historic appearance. Older quarters stand beside the planned Baixa district, created after the earthquake of §G1755§!. Saint George’s Castle and the monuments of Belém preserve the history of successive stages of the maritime capital’s development.\n\n      §YLisbon§! is the capital of the §YPortuguese Kingdom§! and the residence of §YMaria II§!. Court and parliamentary affairs are accompanied by political factionalism and the severe consequences of civil wars. The port retains its role in overseas commerce, but public debt and economic instability constrain the recovery of urban prosperity."
 AOTSM_CITY_MUNCHEN_BODY:0 "      §YMunich§!’s first documented mention dates to §G1158§! and is associated with Duke §YHenry the Lion§!. A crossing over the §YIsar§! and control of the salt trade shaped the settlement’s development. A market and customs post provided the basis for the future urban centre.\n\n      The §YFrauenkirche§!, ducal residence and §YMarienplatz§! form the principal ensembles of the old town. Monastic buildings and merchants’ houses stand beside newer squares and art collections. Court patronage supports architecture, painting and artistic crafts.\n\n      §YMunich§! remains the capital of the §YBavarian Kingdom§! and the centre of its administrative and cultural life. Workshops and commercial enterprises supply the court and local market. Rivalry between the major German powers increases the importance of an independent §YBavarian§! policy and relations with neighbouring states."
 AOTSM_CITY_NEAPOL_BODY:0 "      §YNeapolis§! was founded by Greek settlers from §YCumae§! at the turn of the §Gsixth and fifth centuries§! BC beside the earlier §YParthenope§!. The new settlement was established as an independent trading centre on a sheltered bay. Sea routes connected it with Greek colonies and the Italian interior.\n\n      The ancient plan survives in the arrangement of central streets. §YCastel Nuovo§!, Castel dell’Ovo, palace ensembles and the San Carlo Theatre define §YNaples§!’ historic appearance. Harbour quarters and crowded craft streets lie below the heights facing §YVesuvius§!.\n\n      §YNaples§! is a leading capital and economic centre of southern §YItaly§!. The port, ship workshops and consumer production serve a broad urban market. Court and government institutions stand beside artisans’ quarters, while social inequalities and political unrest complicate the maintenance of order."
 AOTSM_CITY_PARIS_BODY:0 "      §YParis§! grew from a settlement of the Gallic §YParisii§! on the §YSeine§!. §YLutetia§! appears in written sources concerning §YCaesar§!’s campaigns in §G52§! BC. Convenient crossings and river commerce supported the settlement’s growth, with the quarters of the future French capital gradually developing around it.\n\n      The city’s expansion along both banks of the §YSeine§! shaped its principal architectural ensembles. §YNotre-Dame§!, the §YLouvre§! and old trading quarters reflect successive stages of its history. Universities, theatres and printing houses give §YParis§! its importance as a major educational and cultural centre.\n\n      §YParis§! is the capital of the §YFourth French Republic§! and the seat of its highest institutions. Recent political reforms have expanded the activities of parties and national workshops. Competition between public movements, workers’ conditions and the organisation of production remain central questions of urban life."
 AOTSM_CITY_PEKIN_BODY:0 "      §YBeijing§!’s origins reach back to the ancient city of §YJi§!, associated with the states of northern §YChina§! in the §Gfirst millennium§! BC. Roads between the plain and the northern frontier gave it military and commercial importance. Under the §YYongle Emperor§! it was rebuilt as the §YMing§! capital, providing the basis for the later imperial residence.\n\n      The §YForbidden City§!, §YTemple of Heaven§! and fortified districts define §YBeijing§!’s appearance. Palace ensembles and main streets follow a strict plan reflecting court hierarchy. Residential lanes, markets and craft quarters sustain the capital’s daily life and supply its many institutions.\n\n      §YBeijing§! is the capital of the §YQing Empire§! and the residence of the §YDaoguang Emperor§!. The highest government offices, military command and institutions administering the provinces are concentrated here. Court life coexists with trading houses and workshops, while supplying the court, garrison and numerous residents sustains constant economic connections with other regions of §YChina§!."
 AOTSM_CITY_ROME_BODY:0 "      Ancient tradition attributes §YRome§!’s foundation to §YRomulus§! in §G753§! BC. The city developed gradually as settlements on the hills beside the §YTiber§! grew closer together. Crossings and its position between the regions of central §YItaly§! encouraged their union and the development of a shared commercial and military centre.\n\n      The Colosseum, Forum and ancient walls stand beside basilicas, monasteries and palaces. Saint Peter’s Basilica and the Vatican establish §YRome§!’s importance as the centre of the Catholic world. Old streets and squares connect buildings from successive periods.\n\n      §YRome§! is the residence of the Pope and the seat of church institutions. Pilgrimage, artistic crafts and services for the clergy hold an important place in its economy. Political unrest in the Italian lands increases tensions between defenders of ecclesiastical authority and supporters of reform."
 AOTSM_CITY_VENA_BODY:0 "      §YVienna§!’s origins are associated with the Roman military camp of Vindobona, established in the §Gfirst century§! to guard the §YDanube§! frontier. A settlement survived after Roman rule ended. Medieval development was shaped by trading routes and the presence of a princely residence.\n\n      Saint Stephen’s Cathedral, the §YHofburg§! and palace ensembles define §YVienna§!’s historic appearance. Suburbs containing workshops and residential quarters surround the old centre. Theatres, musical institutions and art collections make it one of Europe’s leading cultural centres.\n\n      §YVienna§! is the capital of the §YAustrian Empire§! and the residence of §YFranz Joseph I§!. Recent unrest and the change of monarch have increased the importance of the army and central offices. Government of the multinational possessions is concentrated at court, while deep social and national tensions persist despite the restoration of order."
 AOTSM_CITY_WARSAWA_BODY:0 "      §YWarsaw§!’s formation as a town dates to the turn of the §Gthirteenth and fourteenth centuries§! and is associated with Duke §YBoleslaw II§! of §YMasovia§!. A trading settlement arose beside the ducal stronghold. The high bank of the §YVistula§! provided control over river traffic and crossings, while serving routes through the Masovian lands.\n\n      The §YOld Town§!, §YMarket Square§! and §YRoyal Castle§! form the historic centre. Palaces, churches and urban residences reflect §YWarsaw§!’s former importance as a centre of Polish statehood. Trading streets connect the old core with the suburbs, while the §YVistula§! links the city with inland regions and Baltic ports.\n\n      Within the §YRussian State§!, §YWarsaw§! retains its importance as a major Polish administrative and cultural centre. Its economy combines craft workshops, commercial enterprises and services for public institutions. Differences between local traditions of government and the practices of the central authorities give particular importance to relations between the administration and urban society."
 AOTSM_CITY_TENOCHTITLAN_BODY:0 "      §YTenochtitlan§! was founded by the Aztecs in §G1325§! on an island in §YLake Texcoco§!. According to tradition, the god §YHuitzilopochtli§! indicated the site through the sign of an eagle on a cactus. Initially dependent on §YAzcapotzalco§!, the city gained a path to independence through its alliance with §YTexcoco§! and §YTlacopan§! and their victory in §G1428§!, becoming the centre of an extensive state.\n\n      Causeways and canals connect urban quarters with the lakeshore, while artificial agricultural plots supply the markets with food. Temple complexes and palaces stand beside trading squares and craft yards. Stone buildings and orderly streets are supplemented by European-style architecture and gas lamps, reflecting changes in the capital’s daily life.\n\n      §YTenochtitlan§! is the capital of the §YAztec Empire§! and the residence of §YMontezuma IV§!. Government offices, publishers and educational institutions sustain the changes begun by §YIccohtli I§!. The aftermath of cholera burdens urban life, while Austrian companies limit economic independence. At court, advocates of modernisation continue to debate defenders of tradition led by the supreme §YTlamacazque§!."
 AOTSM_CITY_ATHENS_BODY:0 "      Permanent settlements in the §YAthens§! area existed in the §Gfourth millennium§! BC. Ancient tradition associates the union of §YAttica§!’s communities with §YTheseus§!. The fortified §YAcropolis§! provided protection, while the surrounding plains and roads supported the development of an agricultural and trading centre.\n\n      The §YAcropolis§! with the §YParthenon§!, the ancient Agora and surviving classical buildings establish the city’s historic importance. Residential quarters and markets occupy the foot of the fortified height. Monuments of ancient Greek culture stand alongside churches and buildings from later periods.\n\n      §YAthens§! is part of the §YRoman Empire§! and remains a local administrative, commercial and religious centre. Crafts and exchanges with §YAttica§!’s agricultural districts sustain its economy. Roads to the coast connect the city with maritime transport, while its cultural heritage preserves a special place among the Greek lands."
 AOTSM_CITY_ZAKHARIAPOLIC_BODY:0 "      §YZakhareaspolis§! grew from a §YCaspian§! settlement on the §YAbsheron Peninsula§! formerly known as §YBaku§!. A convenient harbour and roads linking the coast with the Caucasian interior shaped its development. Fortifications protected trading routes and neighbouring settlements, while maritime transport helped establish a regional centre.\n\n      Coastal quarters and trading yards connect with the harbour and Caucasian roads. Older fortifications stand beside administrative and church buildings. The Cathedral of the Nativity of the Virgin holds an important place in the public and ceremonial life of §YZakhareaspolis§!.\n\n      §YZakhareaspolis§! is a significant administrative and commercial centre of the §YRoman Empire§!’s Caucasian possessions. Imperial institutions and the local aristocracy shape its political position. §YCaspian§! shipping and overland connections sustain its economy, while the presence of members of the ruling dynasty gives court ceremonies particular importance."
 AOTSM_CITY_JERUSALEM_BODY:0 "      §YJerusalem§! appears in Egyptian sources from the early §Gsecond millennium§! BC. The city developed as a fortified settlement on heights between the §YMediterranean§! coast and the interior. Religious traditions and the activities of ancient rulers gradually established its importance as a sacred centre.\n\n      The §YChurch of the Holy Sepulchre§!, §YTemple Mount§! and numerous religious houses occupy the compact old quarters. Streets and markets connect the sacred places of different communities, while walls separate the urban core from surrounding settlements. Pilgrimage gives local commerce and crafts a distinctive character.\n\n      §YJerusalem§! holds a central position in the §YJudean Federate§! associated with the §YRoman Empire§!. Local administration and religious institutions participate in governing the city and serving pilgrims. Trading yards, workshops and transport provide supplies, while relations between communities require continual agreement over rights to sacred places and public order."
 AOTSM_CITY_ALEXANDRIA_BODY:0 "      §YAlexandria§! was founded by §YAlexander the Great§! in §G331§! BC on §YEgypt§!’s Mediterranean coast. Its position between the sea and §YLake Mareotis§! provided suitable harbours and connected maritime commerce with the country’s interior. Under the §YPtolemies§!, the city became §YEgypt§!’s capital and one of the largest centres of the Hellenistic world.\n\n      Coastal quarters, harbours and fortifications define §YAlexandria§!’s appearance. The §YCitadel of Qaitbay§! occupies the site of the ancient §YPharos Lighthouse§!, once a landmark for arriving ships. The city is associated with the famous §YLibrary of Alexandria§! and the §YMouseion§!, where mathematics, astronomy and medicine flourished. Its ancient heritage coexists with monuments of Christian and Muslim traditions.\n\n      §YAlexandria§! is the capital of the §YEgyptian Kingdom§!, where power is held by the Copts, and its foremost Mediterranean port. Government institutions, trading houses, warehouses and shipbuilding workshops are concentrated here. Goods from the §YNile§! valley and overseas possessions pass through its harbours. The capital’s position connects the country’s domestic affairs with the interests of the §YRoman Empire§!, under whose protectorate §YEgypt§! stands."
 AOTSM_CITY_CAIR_BODY:0 "      §YCairo§! was founded in §G969§! by the commander §YJawhar al-Siqilli§! on the orders of the Fatimid caliph §Yal-Muizz§!. The new city was built north of earlier settlements as the ruler’s residence and the capital of the §YFatimid Caliphate§!. Over time, the palace centre merged with commercial and craft quarters, inheriting the importance of neighbouring §YFustat§!.\n\n      The city stands at the southern tip of the §YNile§! delta, where river and overland routes meet. A citadel established under §YSaladin§! rises above the dense urban fabric. §YAl-Azhar Mosque§! is known as a centre of theological learning, while old Coptic churches preserve the memory of §YEgypt§!’s Christian past. Bazaars, workshops and residential courtyards form a closely connected urban environment.\n\n      §YCairo§! is a major centre of trade and crafts in the §YEgyptian Kingdom§!. Grain, textiles and other goods from the §YNile§! valley are distributed through its markets. Although the capital’s institutions are concentrated in §YAlexandria§!, the city retains its economic and religious importance. Coptic communities, Muslim educational institutions and merchant associations continue to shape daily life in its quarters."
 AOTSM_CITY_TIFLIS_BODY:0 "      §YTiflis§!’s development as a royal centre is associated with §YVakhtang Gorgasali§! in the second half of the §Gfifth century§!. Earlier settlements on the §YKura§! expanded around convenient crossings and warm springs. Fortifications protected the road through the valley and supported government of neighbouring Georgian lands.\n\n      §YNarikala Fortress§!, religious ensembles and sulphur-bath quarters define the city’s historic appearance. Hillside streets connect residential development with trading yards and crossings over the §YKura§!. Diverse communities and craft traditions reflect §YTiflis§!’s position at the meeting of Caucasian routes.\n\n      §YTiflis§! is an important administrative and commercial centre of the §YRoman Empire§!’s Caucasian possessions. Local institutions, trading houses and the garrison maintain connections between mountain and lowland regions. The relative independence of regional government coexists with imperial influence and persistent local tensions."
 AOTSM_CITY_EREVAN_BODY:0 "      §YErebuni§!’s written history begins with the fortress founded by King §YArgishti I§! in §G782§! BC. The fortified centre secured §YUrartian§! authority in the §YArarat§! valley and housed a garrison. The later development of valley settlements formed an urban environment that inherited the ancient name.\n\n      Fortified heights and residential quarters are linked by roads with the valley’s agricultural lands. Churches, markets and craft yards shape a city where local and long-distance routes meet. The memory of its §YUrartian§! past coexists with Armenian religious and cultural traditions.\n\n      §YErebuni§! remains an administrative and commercial centre in the §YRoman Empire§!’s Caucasian possessions. Farming settlements in the §YArarat§! valley supply the city. Earlier religious conflicts, the continuing influence of Armenian families and the need to maintain order shape relations between local communities and the imperial administration."
 AOTSM_CITY_LONDON_BODY:0 "      §YLondon§! was founded by the Romans around AD §G47§! as a trading settlement beside a §YThames§! crossing. Convenient river approaches and overland connections ensured rapid growth. Quays, fortifications and administrative buildings made the settlement one of Roman Britain’s principal towns.\n\n      The City, Tower of §YLondon§!, Saint Paul’s Cathedral and §YWestminster§! represent successive periods of urban history. The commercial core connects with docklands and extensive residential development. Banks, exchanges, printing houses and learned societies reflect its varied occupations.\n\n      §YLondon§! is the capital of the §YConfederation of the British Isles§! and the centre of its foreign trade. Government institutions, financial houses and trading companies coordinate overseas connections. Docks, warehouses and industry sustain the economy, while supplying its many residents requires a continuous flow of cargo along the §YThames§! and overland routes."
 AOTSM_CITY_DUBLIN_BODY:0 "      The urban centre originated in a fortified camp established by Scandinavian settlers in §G841§! where the Poddle meets the §YLiffey§!. The settlement served as a base for ships, commerce and military operations. Earlier Irish settlements and the later development of the port also contributed to the city’s formation.\n\n      The castle, Saint Patrick’s and Christ Church cathedrals, §YTrinity College§! and the §YLiffey§! quays form the principal historic ensembles. Medieval streets stand beside planned squares and residential quarters. Maritime links and educational institutions underpin §YDublin§!’s importance in the Irish lands.\n\n      §YDublin§! remains a major administrative, commercial and cultural centre of §YIreland§!. The port serves exchanges with neighbouring islands and the interior. Publishing, crafts and agricultural processing sustain the economy, while the condition of the urban poor remains an important public issue."
 AOTSM_CITY_EDINBURG_BODY:0 "      §YEdinburgh§! developed beside a hilltop stronghold occupied long before royal administration appeared. Under §YDavid I§! in the early §Gtwelfth century§!, the settlement received the rights of a royal town, confirmed by a document of §G1127§!. The castle provided protection, while the market below served neighbouring lands.\n\n      §YEdinburgh§! Castle, Saint Giles’ Cathedral and the road to §YHolyrood§! form the basis of the Old Town. Its crowded multistorey buildings contrast with the planned streets of the New Town. The university, publishers and learned societies make §YEdinburgh§! a leading intellectual centre of the Scottish lands.\n\n      Public administration, legal professions and education remain important to urban life. Publishing and craft enterprises serve domestic and external markets. Connections with §YLeith§! provide maritime transport, while living conditions differ markedly between the old quarters and newer districts."
 AOTSM_CITY_CARDIFF_BODY:0 "      The medieval town arose beside a Norman castle built in the late §Geleventh century§! on the site of a Roman fort. A settlement at its southern gate served the garrison and local commerce. Its position beside the §YTaff§! connected the coast with routes into inland §YWales§!.\n\n      The castle, parish churches and old market streets form §YCardiff§!’s historic core. Development gradually extends towards the harbour. Transport connections and the nearby coal-rich valleys give the port an importance beyond that of an ordinary coastal market.\n\n      Growing coal commerce places greater demands on docks, warehouses and transport enterprises. The port connects the economy of the South §YWales§! valleys with maritime markets, attracting merchants and workers. Employment growth accompanies residential expansion and increasingly pressing questions of supplies, sanitation and municipal government."
 AOTSM_CITY_FRANKFURT_BODY:0 "      Frankfurt’s first documented mention dates to §G794§!, when §YCharlemagne§!’s court was present and a church council met here. An earlier settlement occupied an important ford across the Main. The royal residence and trading routes encouraged a market and fortified urban centre.\n\n      Saint Bartholomew’s Cathedral, the Römer town hall and market streets define the historic core. The city is associated with the election and coronation of German rulers. Fairs, publishing and merchant associations made Frankfurt renowned far beyond its immediate surroundings.\n\n      Frankfurt remains a major commercial and financial centre of the German lands. Banking houses and fair connections support exchanges between numerous states. Debate over German unity increases public activity, while the interests of urban business circles require stable interregional connections."
 AOTSM_CITY_KENINGZBERG_BODY:0 "      The city arose beside a fortress founded by the Teutonic Order in §G1255§! on the site of the Prussian settlement of Twangste. It was named in honour of King §YOttokar II§! of Bohemia, who participated in the Order’s campaign. The stronghold secured authority over conquered lands and controlled river routes.\n\n      Historic development unites settlements on the banks and islands of the §YPregel§!. The castle, cathedral and university form the principal ensembles. Bridges connect residential quarters with markets, quays and warehouses serving commerce with the §YBaltic§! coast.\n\n      §YKönigsberg§! remains the chief administrative and commercial centre of §YPrussia§!’s eastern possessions. Goods from the interior pass through the port, while its university and institutions sustain cultural life. The garrison, fortifications and supply routes underpin its military importance in the east."
 AOTSM_CITY_PRAHA_BODY:0 "      §YPrague§! developed from fortified settlements on the §YVltava§!. The foundation of §YPrague§! Castle around §G880§! is attributed to Prince §YBořivoj I§! of the Přemyslid dynasty. The fortress and princely residence controlled crossings around which trading and craft quarters grew.\n\n      §YPrague§! Castle, §YSaint Vitus Cathedral§! and §YCharles Bridge§! connect the principal parts of the historic city. The Old Town, New Town and §YLesser Town§! retain their distinctive layouts. Its university, monasteries and old market squares establish §YPrague§!’s cultural and educational importance.\n\n      §YPrague§! is a principal city of the §YAustrian Empire§!’s Bohemian possessions. Craft enterprises and manufactories serve a broad domestic market. The growth of Czech publishing and cultural associations accompanies tensions between the local national movement and the central government’s Germanisation policy."
 AOTSM_CITY_LEMBERG_BODY:0 "      The first chronicle reference to the city dates to §G1256§!. Its foundation is traditionally associated with Prince §YDaniel Romanovich§!, and its name with his son Lev. The fortified settlement arose where routes connected §YGalicia§! with central European and eastern markets.\n\n      The Market Square, town hall and religious ensembles form §YLemberg§!’s historic core. Catholic, Orthodox, Armenian and Jewish communities created a diverse urban environment. Merchants’ houses and craft quarters preserve traces of centuries of exchanges between neighbouring regions.\n\n      §YLemberg§! performs administrative and cultural functions in the §YAustrian Empire§!’s Galician possessions. Educational institutions, publishing and commerce sustain its regional importance. Relations between the Polish and Ruthenian population and imperial authority are complicated by national tensions and centralisation."
 AOTSM_CITY_VENEZIA_BODY:0 "      Venetian tradition dates the city’s foundation to §G421§!. Lagoon settlements developed gradually, partly through migration from the mainland by people seeking protection from war. Fishing, salt production and maritime exchange supported their growth and eventual union as an independent urban centre.\n\n      The city occupies islands connected by bridges and canals. §YSaint Mark’s Square§!, the §YDoge’s Palace§! and the §YGrand Canal§! form its principal architectural ensembles. The Arsenal, merchants’ palaces and quays recall an independent maritime power and advanced craft traditions.\n\n      §YVenice§! is part of the §YAustrian Empire§!. Port activity, shipbuilding and artistic production sustain the urban economy. Imperial government encounters strong local traditions, while political unrest increases tensions between the administration and supporters of restored independence."
 AOTSM_CITY_BRNO_BODY:0 "      The first written reference to §YBrünn§! dates to §G1091§! and concerns a princely fortress in §YMoravia§!. Settlements near crossings and trading routes existed earlier. The fortified centre administered neighbouring lands and protected the market around which urban development took shape.\n\n      §YŠpilberk Castle§! and the Cathedral of Saints Peter and Paul define the skyline. Market squares connect with craft streets and merchants’ quarters. The old core retains its fortified character, while industrial settlements gradually extend beyond the walls.\n\n      §YBrünn§! is an important administrative and industrial centre of §YMoravia§! within the §YAustrian Empire§!. Textile production is the leading occupation, drawing workers from the countryside. Economic development strengthens connections between enterprises, trading houses and the imperial administration."
 AOTSM_CITY_STOGHOLM_BODY:0 "      §YStockholm§!’s name first appears in documents of §G1252§! associated with §YBirger Jarl§! and King §YValdemar§!. The settlement developed to control the passage between Lake §YMälaren§! and the §YBaltic Sea§!. Fortifications and a harbour protected the interior and its trading routes.\n\n      The island centre contains the §YRoyal Palace§!, churches and old trading quarters. Bridges and embankments link it with mainland districts and harbour areas. Its maritime position combines with administrative and cultural functions developed around the Swedish court.\n\n      §YStockholm§! holds a central position in the §YScandinavian Union§! under §YGustav V§!. The union of northern kingdoms increases the importance of the court and shared institutions while retaining local government. German trade supports the port, while rivalry with §YRussia§! maintains the importance of §YBaltic§! defence."
 AOTSM_CITY_KOPENHAVEN_BODY:0 "      The city developed from a trading settlement beside the Øresund. Its traditional foundation date is §G1167§!, when Bishop §YAbsalon§! began building a fortress near the harbour. The settlement already existed, and the stronghold was intended to protect coastal commerce and shipping.\n\n      The centre contains palace ensembles, the exchange and dense quarters enclosed by fortifications. Harbours, shipyards and warehouses define its maritime character. Its position on the passage between the §YBaltic§! and the outer seas gives §YCopenhagen§! particular economic and military importance.\n\n      §YCopenhagen§! retains Danish administrative institutions and an important position within the §YScandinavian Union§!. Recognition of §YGustav V§!’s authority brings local representatives into shared political structures. Maritime commerce and naval activity remain central to the economy, while Danish elites seek to preserve their influence under the united monarchy."
 AOTSM_CITY_OSLO_BODY:0 "      Medieval tradition dates §YOslo§!’s foundation to §G1048§! and associates it with King §YHarald Hardrada§!. The settlement at the head of the fjord developed as a royal and trading centre. Sheltered sea approaches and roads to inland valleys connected the coast with the Norwegian lands.\n\n      §YAkershus Fortress§!, the harbour and planned streets define the city’s historic appearance. After the fire of §G1624§! its centre was moved closer to the fortress. Merchants’ houses, warehouses and timber quays connect residential quarters with maritime transport and the surrounding economy.\n\n      §YOslo§! is a principal Norwegian centre within the §YScandinavian Union§!. Local institutions and commercial circles retain their importance as ties with the Swedish crown strengthen. Timber exports, shipping and crafts sustain its economy, while participation in common institutions requires agreement between Norwegian and wider Union interests."
 AOTSM_CITY_HELLSINKI_BODY:0 "      The city was founded in §G1550§! by order of King §YGustav Vasa§! of §YSweden§! as a centre of trade and a port. The new settlement was intended to redirect Baltic commerce and provide a counterweight to §YReval§!. The original town stood at the mouth of the §YVantaa§!; its centre was later moved closer to more suitable sea harbours.\n\n      §YHelsingfors§! stands on the indented coast of the §YGulf of Finland§!. Planned squares and public buildings adjoin wooden residential quarters, quays and warehouse areas. The nearby island fortress of §YSveaborg§! is particularly important, protecting the sea approaches and linking the city with naval activity.\n\n      Following the transfer of the Finnish lands to Russian rule, confirmed by the peace treaty of §G1810§!, the city became part of the §YRussian State§!’s Baltic network. The port serves merchant shipping and supplies coastal garrisons. Workshops, transport and local markets maintain economic connections with the Finnish interior."
 AOTSM_CITY_RIGA_BODY:0 "      §YRiga§!’s foundation is dated to §G1201§! and associated with §YBishop Albert§!, who established his residence here. The settlement on the lower §YDaugava§! was created as a base for ecclesiastical authority and maritime commerce. A sheltered harbour and access to river routes attracted merchants and encouraged the formation of an urban trading community.\n\n      The historic centre is distinguished by dense development, narrow streets and large churches. §YRiga Cathedral§!, §YSaint Peter’s Church§! and merchants’ houses reflect the city’s importance in Baltic commerce. Fortifications separate the old quarters from the suburbs, while quays and warehouse yards connect the urban market with the §YDaugava§! and maritime transport.\n\n      §YRiga§! holds an important place in the §YRussian State§!’s foreign trade. Timber and agricultural goods from the inland provinces are exported through its port; overseas manufactures and raw materials travel in the opposite direction. Merchant associations, workshops and port services shape the economy of a city that retains its own legal and cultural traditions."
 AOTSM_CITY_MINKS_BODY:0 "      The first chronicle reference to §YMinsk§! dates to §G1067§! and concerns the campaign of the sons of §YYaroslav§! and the Battle of the §YNemiga§!. A fortified settlement already existed at that time; its exact foundation date and founder are unknown. Its development was shaped by routes connecting the lands of §YPolotsk§!, §YSmolensk§! and the middle §YDnieper§!.\n\n      The city stands on the §YSvislach§! near its confluence with the §YNemiga§!. The castle site, §YUpper Town§! and trading quarters form the historic core. Orthodox churches, Catholic monastic complexes and synagogues reflect the diversity of its communities. Stone public buildings stand beside predominantly wooden residential development.\n\n      §YMinsk§! performs administrative and commercial functions in the western lands of the §YRussian State§!. Crafts, small-scale production and exchanges with neighbouring agricultural districts form the basis of its economy. Fairs, shops and inns serve the movement of goods and visitors, while provincial institutions administer the surrounding territories."
 AOTSM_CITY_ROSTOV_BODY:0 "      §YRostov§!’s history is conventionally dated from the establishment of the §YTemernik§! customs house by decree of Empress §YElizabeth Petrovna§! in §G1749§!. The customs post on the §YDon§! was intended to regulate southern trade and collect duties. A settlement developed beside it, its growth associated with river quays and the subsequent construction of the §YFortress of Saint Demetrius of Rostov§!.\n\n      The city stands on the right bank of the §YDon§! near the mouth of the §YTemernik§!. Trading streets and merchants’ yards gravitate towards the quays; residential quarters stand alongside warehouses and production sites. §YRostov§!’s importance rests on the combination of a river port, overland routes and access to the §YSea of Azov§!.\n\n      §YRostov§! serves as a trading intermediary between the §YDon§! lands, inland provinces and southern maritime markets. Grain and other agricultural goods pass through its quays; workshops serve vessels, carriers and local residents. The development of the port strengthens the city’s role in supplying the southern regions of the §YRussian State§!."
 AOTSM_CITY_CROMWELL_BODY:0 "      §YCromwell§! developed on the banks of the §YPotomac§! during European settlement of §YKromwelland§!’s eastern coast. River connections and access to §YChesapeake Bay§! favoured trade with coastal settlements and inland regions. The city’s name is associated with §YOliver Cromwell§! and the political tradition of British settlers.\n\n      Urban development follows the river, connecting wharves with trading yards and residential quarters. Warehouses and craft workshops serve transport, while roads link the settlement with its agricultural hinterland. Its position between inland territories and the Atlantic coast defines its importance as a place for exchanging goods.\n\n      §YCromwell§!’s economic life depends on river trade, supplies for its residents and connections with neighbouring regions. Merchant offices maintain relations with European enterprises, while workshops process incoming raw materials. Expanding transport enlarges the urban market and increases the importance of the wharves for surrounding settlements."
 AOTSM_CITY_HOUSTON_BODY:0 "      §YHouston§! was founded by the brothers §YAugustus§! and §YJohn Allen§! as a trading settlement on waterways leading to the §YGulf of Saint Leopold§!. The city was named after §YSamuel Houston§!. Its site was chosen to facilitate the movement of goods between the coast and the interior. Wharves and storage grounds formed the basis of the settlement’s subsequent development.\n\n      Urban development is concentrated around markets, trading yards and craft quarters. Low residential buildings stand beside offices and outbuildings. River transport supplies food, raw materials and imported manufactures, while overland roads connect the city with its agricultural hinterland.\n\n      §YHouston§! is an important economic and political centre of §YMittelkromwelland§!. The interests of local authorities, trading companies and representatives of the §YAustrian Empire§! intersect here. Relations with the §YAztec Empire§! give the city a role as a venue for diplomatic negotiations. Financial difficulties affecting European enterprises complicate trade and the maintenance of institutions dependent on them."
 AOTSM_CITY_EDO_BODY:0 "      §YEdo§!’s development is associated with the castle built by the military commander §YOta Dokan§! in §G1457§!. The stronghold controlled approaches to the §YKanto§! Plain and settlements beside the bay. Trading and craft quarters gradually spread around the castle, using river channels and suitable places to unload vessels.\n\n      The castle, moats and extensive residential districts form the basis of the city’s plan. Canals connect warehouses and markets with quays receiving food and building materials. Commercial streets stand alongside military residences, religious precincts and artisans’ quarters.\n\n      §YEdo§! is one of Japan’s principal commercial and manufacturing centres. Free-trade policy expands opportunities for merchant associations and strengthens their participation in state affairs. Supplying its many residents sustains connections across §YKanto§!, while tensions between military families and central institutions affect the position of urban elites."
 AOTSM_CITY_KIOTO_BODY:0 "      The city was founded in §G794§! by order of §YEmperor Kanmu§! as the new capital of §YHeian-kyo§!. The spacious valley allowed a residence with planned streets and administrative quarters. Its layout followed Chinese capital models and affirmed the special position of imperial authority.\n\n      The Imperial Palace, religious complexes and old craft streets define §YKyoto§!’s appearance. The city is known for weaving, artistic production and court traditions. Monasteries, shrines and trading quarters form an environment where ceremonial life coexists with the daily work of workshops and markets.\n\n      §YKyoto§! is Japan’s capital and the seat of the imperial court and central institutions. The order established after §YIshida Mitsunari§!’s victory rests on state councils and preserves his family’s influence. Debate over military reforms and foreign commerce increases rivalry between court, military and merchant groups."
 AOTSM_CITY_SHIN_KANTO_BODY:0 "      §YShin-Kanto§! emerged during Japanese settlement of §YWestern Kromwelland§!, authorised by the emperor in §G1846§!. Settlers, merchants and soldiers established outposts of the §YNisei§! colony here. The city’s name preserves its connection with the §YKanto§! region and reflects the desire to bring familiar forms of social life to a new coast.\n\n      The city is a young coastal settlement with wharves, warehouses and residential quarters. Outbuildings stand beside areas of new construction. Maritime connections bring people, tools and food, while roads leading inland connect the harbour with newly settled lands.\n\n      §YShin-Kanto§! serves as an outpost of Japanese presence in §YWestern Kromwelland§!. Trading associations seek to expand commerce, while soldiers protect settlements and transport routes. Colonial expansion brings clashes with indigenous peoples. Supplies from §YJapan§! and the establishment of a local economy remain essential to the city’s further growth."
 AOTSM_CITY_BAODING_BODY:0 "      §YBaoding§!’s history is connected with settlements on the §YNorth China Plain§! that existed during the §YHan§! dynasty. Destroyed by Mongol armies, the city was rebuilt in §G1227§!. The name §YBaoding§! was adopted in §G1275§!, reflecting its role as a fortified centre securing the capital region.\n\n      Walls and gates enclose old administrative, religious and commercial quarters. The §YAncient Lotus Pond§! garden and officials’ residences shape the city’s appearance. Its position on roads to §YBeijing§! combines the functions of a regional market, garrison town and administrative centre for surrounding agricultural lands.\n\n      §YBaoding§! is the administrative centre of §YZhili Province§!, which surrounds the §YQing Empire§!’s capital region. The governor-general’s residence, local offices and garrison administer extensive agricultural territories. Trading houses and workshops serve the provincial population, while roads to §YBeijing§! sustain a steady movement of officials, merchants and cargo."
 AOTSM_CITY_NANJING_BODY:0 "      §YNanjing§! developed from fortified and craft settlements on the §YYangtze§! during the Warring States period. In later centuries it repeatedly served as the residence of rulers of southern Chinese states. Under the §YMing§! dynasty its role as a capital was consolidated by the construction of a palace centre and extensive fortifications.\n\n      The city is known for its §YMing§! walls, temples and §YXiaoling Mausoleum§!. Residential and craft quarters stand beside gardens and open land within the fortified area. §YYangtze§! quays connect trading streets with river routes linking the interior and the coast.\n\n      §YNanjing§! is known as the Southern Capital of the Middle Kingdom, reflecting its historic importance and special position among the cities of the §YQing Empire§!. Textile production, craft workshops and trading houses maintain connections with agricultural regions. The §YYangtze§! is the principal cargo route, while institutions and cultural traditions sustain the city’s role as an important regional centre."
 AOTSM_CITY_HANYANG_BODY:0 "      §YHanyang§!’s development as a capital began in §G1394§!, when §YKing Taejo§!, founder of the §YJoseon§! dynasty, transferred his court here. A settlement in a valley protected by mountains was transformed into an administrative centre. Walls, gates and palace precincts provided defence and accommodation for the new dynasty’s institutions.\n\n      §YGyeongbokgung§! and §YChangdeokgung§! palaces, §YJongmyo Shrine§! and fortifications define the city’s historic appearance. Main streets connect ceremonial spaces with markets and residential quarters. Roads to the §YHan River§! provide food supplies and connections with the interior.\n\n      §YHanyang§! is the residence of the §YJoseon§! court and the administrative centre of the Korean lands. Treaties with Japan expanded foreign trade and intensified debate over reform. Declining §YQing§! influence changes the court’s diplomatic position, requiring officials to seek new ways to safeguard the state’s independence."
 AOTSM_CITY_SENDAI_BODY:0 "      §YSendai§!’s development as a castle town began in §G1601§! on the initiative of §YDate Masamune§!. The fortified hilltop residence was intended to administer his possessions and protect neighbouring roads. Military households, religious precincts and settlements of merchants and artisans grew around the castle.\n\n      The castle height above the §YHirose§! and a planned street network shape the city. Military and commercial quarters retain their original distinctions. Shrines and craft streets stand alongside markets serving the agricultural regions of §YTohoku§!.\n\n      §YSendai§! remains an important centre of northeastern Japan. Rice commerce, crafts and administration of neighbouring lands sustain its economy. The recent threat of crop failure increased the importance of food reserves and coordinated supplies, while central reforms affect relations between local military families and imperial authority."
 aotsm_city_info_date_tt:0 "The information in this reference is current as of §G1 January 1849§!"
