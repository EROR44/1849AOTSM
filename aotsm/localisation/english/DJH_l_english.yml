 #CHARACTERS
 DJH_Ma_Hualong_t:0 "Ma Hualong"

 #IDEAS
 DJH_ma_hualong:0 "Ma Hualong"
 DJH_ma_hualong_desc:0 "§YMa Hualong§!, who succeeded his father §YMa Yide§! as leader of the §YJahriyya§! §Yreligious order§!, enjoys considerable respect among its followers. His position as a §Yspiritual guide§! enables him to unite scattered communities, maintain connections between religious centers, and coordinate the activities of local leaders. §YMa Hualong's§! personal authority helps strengthen internal order and political unity, while the loyalty of his followers provides an important foundation for the emerging state."
 DJH_trading_networks:0 "Jahriyya Trade Networks"
 DJH_trading_networks_desc:0 "Through its connections among §YMuslim communities§! in §YGansu§!, §YNingxia§!, and neighboring regions, the §YJahriyya§! order maintains an extensive network of commercial and economic relationships. §YCaravan trade§!, landed property, and contributions from followers provide the order's leadership with the resources needed to maintain religious institutions and support the local economy. These connections facilitate the movement of goods, the development of transport routes, and the organization of production, helping to compensate for limited state resources."
 DJH_jinjipu_stronghold:0 "The Jinjipu Stronghold"
 DJH_jinjipu_stronghold_desc:0 "§YJinjipu§! serves as the principal stronghold of §YMa Hualong's§! movement, bringing together the administrative, economic, and religious institutions of the §YJahriyya§! order. Its fortifications, storehouses, and organized defenses allow local forces to withstand superior enemy armies for extended periods. At the same time, the concentration of substantial resources around a single §Yfortified center§! restricts military mobility and makes the movement particularly vulnerable to prolonged sieges and the disruption of supply routes."
