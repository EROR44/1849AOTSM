 #CHARACTERS
 DNG_Bai_Yanhu_t:0 "Bai Yanhu"

 #IDEAS
 DNG_hui_community_militias:0 "Hui Community Militias"
 DNG_hui_community_militias_desc:0 "The §YMuslim communities§! of the northwestern provinces have long relied on their own networks of mutual assistance, local elders, and religious teachers. During armed conflict, these communities provide the foundation for militias capable of rapidly gathering recruits and organizing the defense of their settlements. Knowledge of the local terrain, communal solidarity, and the determination to protect their families strengthen the resilience of rebel forces, especially when defending their own territory."
 DNG_divided_resistance_centers:0 "Divided Centers of Resistance"
 DNG_divided_resistance_centers_desc:0 "The rebel movements of §YShaanxi§! and §YGansu§! are organized around individual towns, communities, and influential military leaders, each commanding his own forces and sources of supply. Despite shared interests and occasional joint operations, their leaders lack a stable chain of command. Disagreements over military objectives, resource distribution, and methods of struggle make it difficult to develop a unified strategy and weaken coordination between rebel forces."
 DNG_intercommunal_tensions:0 "Intercommunal Tensions"
 DNG_intercommunal_tensions_desc:0 "Long-standing economic disputes, competition over land and water, local clashes, and mutual distrust are gradually worsening relations between §YMuslim and non-Muslim communities§! in the northwestern provinces. The imperial administration's failure to resolve these grievances fairly encourages the spread of armed militias and growing public discontent. These tensions undermine economic life and obstruct the restoration of order, while also increasing the population's willingness to support its own armed organizations."
