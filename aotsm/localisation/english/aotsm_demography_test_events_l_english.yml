 aotsm_demography_test_2_desc_t:0 "This test targets the largest ethnic group in the capital state when an option is selected. The change is relative to its current share: for example, +10% changes 50% to 55%. Other groups change proportionally. Population and the state religion remain unchanged. To target another group, replace the leader variable with its ID in the event code."
