l_english:
 aotsm_demography_test_cancel_t:0 "Close without changes"
 aotsm_demography_test_change_tt:0 "Changes the current share of the largest group in the capital state. Other shares are redistributed proportionally; the total remains 100%. Unavailable before initialization or when the target share is 100%."
 aotsm_demography_test_1_1_t:0 "Increase the current share by 1%"
 aotsm_demography_test_1_5_t:0 "Increase the current share by 5%"
 aotsm_demography_test_1_10_t:0 "Increase the current share by 10%"
 aotsm_demography_test_1_title_t:0 "Test: increase culture share"
 aotsm_demography_test_1_desc_t:0 "This test targets the largest ethnic group in the capital state when an option is selected. The change is relative to its current share: for example, +10% changes 50% to 55%. Other groups change proportionally. Population and the state religion remain unchanged. To target another group, replace the leader variable with its ID in the event code."
 aotsm_demography_test_2_1_t:0 "Decrease the current share by 1%"
 aotsm_demography_test_2_5_t:0 "Decrease the current share by 5%"
 aotsm_demography_test_2_10_t:0 "Decrease the current share by 10%"
