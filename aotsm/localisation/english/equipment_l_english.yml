l_english:
 submarine: "Submarine"
 submarine_desc: "Stealth and powerful torpedoes help submarines destroy enemy convoys."
 both_cruisers_desc: "Light cruiser - a small screening ship. Protects larger ships from enemy small vessels, but also carries torpedoes capable of seriously damaging larger enemy ships.\n\nHeavy cruiser - a large armored cruiser. Versatile, well suited for countries unable to build battleships."
 light_cruiser: "Light Cruiser"
 light_cruiser_desc: "Light escort ship, whose main task is to protect larger ships from enemy light vessels. Also capable of inflicting serious damage on large ships with powerful torpedoes."
 heavy_cruiser: "Heavy Cruiser"
 heavy_cruiser_desc: "Large armored cruiser capable of performing various tasks. A good choice for countries unable to build larger ships."
 destroyer: "Destroyer"
 destroyer_desc: "The lightest escort ship. Protects larger ships and also searches for and destroys submarines."
 ship_hull_light: "Light Hull"
 ship_hull_light_desc: "The lightest escort ship. Protects larger ships and also searches for and destroys submarines."
 carrier: "Aircraft Carrier"
 carrier_desc: "A large ship capable of carrying deck aircraft squadrons. Can also be used as a floating airfield near enemy coast."
 battleship: "Battleship"
 battleship_desc: "The largest warship, equipped with the largest guns and the strongest armor. Such an expensive project should be protected by a screen of smaller ships."
 armor_desc: "The best and strongest armor available."
 battle_cruiser: "Battlecruiser"
 battle_cruiser_desc: "A large ship, almost equal to a battleship in armament, but with weaker armor and high speed."
 convoy: "Convoy"
 convoy_desc: "Convoys are used for international trade of goods and resources; they can also transport troops and participate in naval invasions."
 sh_battleship: "Super-heavy Battleship"
 sh_battleship_desc: "The largest warship, equipped with the largest guns and the strongest armor. Such an expensive project should be protected by a screen of smaller ships."
 light_airframe: "Light Airframe"
 light_airframe_desc: "Aircraft based on light airframe"
 medium_airframe: "Medium Airframe"
 medium_airframe_desc: "Aircraft based on medium airframe"
 heavy_airframe: "Heavy Airframe"
 heavy_airframe_desc: "Aircraft based on heavy airframe"
 jet_engines: "Jet Engines"
 JET_ENGINES_SPECIAL: "To create jet aviation, a jet engine must be developed. This project is necessary for researching advanced aircraft."
 jet_engines_desc: "The jet engine, a technological breakthrough for aviation, allows the creation of a fundamentally new generation of aircraft."
 convoy_1: "Convoy"
 armored_car_equipment: "Armored Car"
 armored_car_equipment_desc: "Light armored wheeled vehicles. Often used for reconnaissance and suppressing resistance, but can also carry heavier weapons."
 motorized_equipment: "Truck"
 motorized_equipment_desc: "Trucks are designed for transporting troops and supplies, as well as for motorizing divisions."
 motorized_equipment_0: "Early Truck"
 motorized_equipment_0_desc: "During the Great War, troops began using ordinary civilian trucks to transport supplies and equipment. Since then, such trucks have become an integral part of most armies."
 motorized_equipment_1: "Trucks"
 motorized_equipment_1_desc: "Motor transport is the first step towards army mechanization. Civilian trucks are easily adapted to military needs: they carry soldiers, tow guns, and deliver supplies. This significantly enhances the strategic mobility of infantry units that would otherwise have to march."
 support_equipment_short: "Support Eq."
 support_equipment: "Support Equipment"
 support_equipment_desc: "Radios, vehicles, pontoons, and other additional army equipment."
 tech_support: "Support Equipment"
 support_equipment_1: "Support Equipment"
 support_equipment_1_desc: "Radios, vehicles, pontoons, and other additional army equipment."
