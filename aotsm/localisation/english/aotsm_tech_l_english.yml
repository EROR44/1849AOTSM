 aotsm_handicraft_production_tech:0 "Handicraft Production"
 aotsm_handicraft_production_tech_desc:0 "Products are manufactured by hand by skilled craftsmen who pass down the secrets of metalworking from generation to generation. Quality and productivity depend entirely on the individual skill of the worker. This method of production remains extremely slow and does not allow for the mass production of identical items within acceptable timeframes."

 aotsm_manufactory_production_tech:0 "Manufactory Production"
 aotsm_manufactory_production_tech_desc:0 "The division of labour has been introduced among groups of workers, each performing strictly defined operations. This significantly increases productivity compared to individual craftsmanship. However, the absence of uniform standards and gauges still leads to a considerable percentage of defects."

 aotsm_basic_machine_tools_tech:0 "Basic Machine Tools"
 aotsm_basic_machine_tools_tech_desc:0 "Simple lathes and drilling machines powered by water wheels or manual drive allow metal workpieces to be processed with acceptable precision. The design of the machines has certain drawbacks: vibration and play reduce the quality of finished parts, requiring subsequent finishing with a file."

 aotsm_improved_machine_tools_tech:0 "Improved Machine Tools"
 aotsm_improved_machine_tools_tech_desc:0 "Cast-iron beds and reinforced construction have reduced vibration, ensuring cleaner surface finishing. Parts are now manufactured with smaller tolerances, reducing the amount of manual fitting required. Productivity increases alongside the stability of the equipment."

 aotsm_advanced_machine_tools_tech:0 "Advanced Machine Tools"
 aotsm_advanced_machine_tools_tech_desc:0 "Self-centering chucks, mechanical tool rests and automatic feed mechanisms elevate machining to a new level of precision. The production speed of components doubles, and parts interchangeability becomes a reality. The equipment requires skilled maintenance but fully justifies its cost."

 aotsm_basic_equipment_refinement_tech:0 "Basic Equipment Refinement"
 aotsm_basic_equipment_refinement_tech_desc:0 "Experienced armourers adjust standard small arms to suit the individual anthropometric parameters of the soldier. Adjustments to the stock, installation of a more comfortable front sight and simple balancing improve accuracy. The work is carried out in field workshops without the use of complex equipment."

 aotsm_improved_equipment_refinement_tech:0 "Improved Equipment Refinement"
 aotsm_improved_equipment_refinement_tech_desc:0 "The introduction of rifled barrels and optical sights requires fine tuning of trigger mechanisms, bolt groups and sighting devices. Workshops are equipped with measuring instruments to control trigger pull and bore alignment. Each example is test-fired before being sent to the troops."

 aotsm_advanced_equipment_refinement_tech:0 "Advanced Equipment Refinement"
 aotsm_advanced_equipment_refinement_tech_desc:0 "Individual weapon fitting has been introduced using adjustable sights and ergonomic stocks contoured to the shooter's shoulder. Ballistic characteristics are verified on specialised stands. Refinement has become a precise engineering process, reducing the influence of human factors on combat accuracy."

 aotsm_primitive_conveyor_tech:0 "Primitive Conveyor"
 aotsm_primitive_conveyor_tech_desc:0 "Cast-iron rollers and wooden guides have been installed between machine tools for the mechanised transfer of workpieces. This frees workers from the heavy physical labour of carrying parts and streamlines the production process. Insufficient reliability of the mechanisms and frequent jams require constant supervision."

 aotsm_conveyor_production_tech:0 "Conveyor Production"
 aotsm_conveyor_production_tech_desc:0 "A continuous production chain has been established: the workpiece passes successively through all machine tools without intermediate storage. Each worker performs only their own operation, which increases output and reduces downtime. The production rhythm becomes stable and predictable."

 aotsm_improved_conveyor_tech:0 "Improved Conveyor"
 aotsm_improved_conveyor_tech_desc:0 "Steel rollers on bearings and a belt drive powered by a steam engine ensure smooth movement of workpieces without jerking. The reduction of friction and mechanical losses has made it possible to increase conveyor speed and reduce the time between operations. Line downtime has been reduced by half."

 aotsm_flexible_conveyor_i_tech:0 "Flexible Conveyor I"
 aotsm_flexible_conveyor_i_tech_desc:0 "The conveyor design has been supplemented with removable guides, allowing the line to be reconfigured for various product sizes. The changeover time from one product range to another is reduced to one shift. Production flexibility is achieved at the expense of reliability, which requires additional oversight."

 aotsm_flexible_conveyor_ii_tech:0 "Flexible Conveyor II"
 aotsm_flexible_conveyor_ii_tech_desc:0 "A modular system has been developed with adjustable stops and universal fixtures, enabling rapid retooling within two hours. The conveyor can be easily adapted for the production of various types of weaponry without replacing the base units. This enhances the efficiency of small-batch production."

 aotsm_standardized_conveyor_i_tech:0 "Standardized Conveyor I"
 aotsm_standardized_conveyor_i_tech_desc:0 "Unified standard dimensions for rollers, sprockets and belts have been introduced for all conveyor lines at the plant. Standardisation of spare parts simplifies repairs and reduces dependence on custom orders from turning shops. The time required to fix malfunctions is reduced from days to hours."

 aotsm_standardized_conveyor_ii_tech:0 "Standardized Conveyor II"
 aotsm_standardized_conveyor_ii_tech_desc:0 "Full interchangeability of all conveyor components and parts within the enterprise has been achieved. Maintenance personnel are provided with spare parts kits that allow line restoration without delays. This drastically reduces equipment downtime and improves overall productivity."

 aotsm_production_standardization_tech:0 "Production Standardization"
 aotsm_production_standardization_tech_desc:0 "A unified system of drawings, tolerances and gauges has been introduced for all workshop departments. Parts manufactured in different sections are fully interchangeable. This allows efforts to be focused on increasing production volumes rather than on hand-fitting each individual item."

 aotsm_modern_construction_standards_tech:0 "Modern Construction Standards"
 aotsm_modern_construction_standards_tech_desc:0 "The use of rolled steel and unified truss structures makes it possible to erect factory buildings according to standardised designs. Construction time is reduced threefold, and building strength is sufficient for the installation of heavy steam engines and hammers. Standardised dimensions simplify equipment logistics."

 aotsm_smokeless_powder_tech:0 "Smokeless Powder"
 aotsm_smokeless_powder_tech_desc:0 "A new type of propellant charge based on pyrocellulose has been developed, producing virtually no smoke upon firing. The significant reduction in the masking effect allows shooters to maintain concealment on the battlefield. Muzzle velocity increases by 25% while maintaining the same powder charge weight."

 aotsm_double_base_propellant_application_tech:0 "Double-Base Propellant Application"
 aotsm_double_base_propellant_application_tech_desc:0 "The double-base composition containing nitrocellulose and nitroglycerin provides increased combustion energy and a stable ballistic curve. This makes it possible to increase the range and accuracy of field artillery fire. Application requires special safety measures due to the high sensitivity of the mixture."

 aotsm_synthetic_nitrogen_usage_tech:0 "Synthetic Nitrogen Usage"
 aotsm_synthetic_nitrogen_usage_tech_desc:0 "Industrial production of nitrogen compounds directly from atmospheric air has been developed using chemical methods. This approach provides the production of explosives with the necessary raw materials without reliance on natural deposits. Supply stability is no longer dependent on external factors and transport routes."

 aotsm_improved_nitrogen_synthesis_tech:0 "Improved Nitrogen Synthesis"
 aotsm_improved_nitrogen_synthesis_tech_desc:0 "The parameters of pressure and temperature in the reaction columns have been optimised, and a more efficient catalyst has been selected. Ammonia yield has nearly doubled without increasing raw material consumption. The introduction of a continuous production scheme reduces energy consumption per unit of output."

 aotsm_modernized_nitrogen_synthesis_tech:0 "Modernized Nitrogen Synthesis"
 aotsm_modernized_nitrogen_synthesis_tech_desc:0 "Reaction vessels have been equipped with steam heating and a forced circulation system for the gas mixture. The conversion rate has increased by 40%, and the purity of the final product has reached levels sufficient for the production of high-grade explosives. Losses of reagents and toxic emissions have been reduced."

 aotsm_advanced_nitrogen_synthesis_tech:0 "Advanced Nitrogen Synthesis"
 aotsm_advanced_nitrogen_synthesis_tech_desc:0 "A continuous catalytic cycle with complete recovery of waste heat has been established. The output capacity of the factory complex has reached volumes sufficient to supply the active army with explosives. This technology is recognised as the most advanced in its class."

 aotsm_steam_engine_tech:0 "Steam Engine"
 aotsm_steam_engine_tech_desc:0 "A universal heat engine that converts steam energy into mechanical work. The installation of steam engines in factories makes it possible to abandon water wheels and windmills, providing a stable source of energy independent of weather conditions and seasons. The productivity of enterprises increases manifold, and the location of factories is no longer tied to riverbanks."

 aotsm_main_transmission_shaft_tech:0 "Main Transmission Shaft"
 aotsm_main_transmission_shaft_tech_desc:0 "A central shaft that transmits power from the steam engine to all workshop machine tools through a system of belts and gears. A single drive synchronises the operation of equipment and simplifies production management. The introduction of transmission reduces the costs of building individual engines for each machine tool and increases the reliability of the factory mechanism."

 aotsm_steam_hammer_tech:0 "Steam Hammer"
 aotsm_steam_hammer_tech_desc:0 "A forging hammer with steam drive capable of processing metal workpieces of enormous mass. The impact force of such a hammer is dozens of times greater than manual labour, allowing the forging of large-calibre gun barrels and ship shafts. The precision of impact dosage opens new possibilities for obtaining forgings of complex shapes."

 aotsm_bessemer_process_tech:0 "Bessemer Process"
 aotsm_bessemer_process_tech_desc:0 "A method of converting pig iron into steel by blowing air through molten metal. The oxygen in the air burns off excess carbon and other impurities, transforming brittle cast iron into strong and malleable steel. This invention enables the mass production of inexpensive steel on an industrial scale, fundamentally changing both military and civil engineering."

 aotsm_steam_turbine_application_tech:0 "Steam Turbine Application"
 aotsm_steam_turbine_application_tech_desc:0 "The introduction of steam turbines instead of reciprocating engines in large industrial enterprises. The rotational motion of the impeller under the action of a steam jet provides higher efficiency and smoother operation. Turbines are indispensable for driving generators and powerful pumps, allowing energy to be transmitted over considerable distances without intermediate conversions."

 aotsm_electricity_generation:0 "Electricity Generation"
 aotsm_electricity_generation_desc:0 "Industrial production of electrical energy using steam turbines and dynamos. The rotation of the rotor in a magnetic field generates electric current suitable for transmission over distances. The ability to illuminate factory workshops and power electric motors opens a new era in industry, free from cumbersome steam transmissions."

 aotsm_lamp_electrical_engineering:0 "Lamp Electrical Engineering"
 aotsm_lamp_electrical_engineering_desc:0 "The introduction of incandescent electric lamps for lighting industrial and domestic premises. Reliable light sources allow round-the-clock operation of factories and significantly improve workplace safety during night shifts. The transition from gas and oil lighting to electric marks the arrival of a new technological era."

 aotsm_analytical_engine_tech:0 "Analytical Engine"
 aotsm_analytical_engine_tech_desc:0 "A programmable computing device based on gears and punched cards, capable of performing complex arithmetic and logical operations. The machine enables automation of ballistic table calculations, supply inventories and financial reports. The use of interchangeable program media makes the device a universal tool for a wide range of tasks."

 aotsm_mechanical_interpreters_tech:0 "Mechanical Interpreters"
 aotsm_mechanical_interpreters_tech_desc:0 "Specialised devices for automatically performing repetitive mathematical operations. Interpreters significantly accelerate data processing and reduce the risk of errors in record-keeping at industrial enterprises and artillery commands."

 aotsm_modernized_mechanical_machine_tech:0 "Modernized Mechanical Machine"
 aotsm_modernized_mechanical_machine_tech_desc:0 "An improved version of the analytical engine with increased memory capacity and an extended set of operations. The introduction of new materials and optimisation of gear trains increase computation speed and reliability. The machine becomes an essential tool for design bureaus and ballistic laboratories."

 aotsm_electromechanical_summing_machine_tech:0 "Electromechanical Summing Machine"
 aotsm_electromechanical_summing_machine_tech_desc:0 "A device combining electric drive with a mechanical counting mechanism. The use of electric motors and relay switches significantly accelerates addition and multiplication operations. Compactness and ease of maintenance make the summing machine accessible to accounting services and army calculation tables."

 aotsm_differential_analyzer_tech:0 "Differential Analyzer"
 aotsm_differential_analyzer_tech_desc:0 "A specialised analogue computing instrument for solving differential equations. The device can simulate complex physical processes, including projectile flight and mechanism operation. The analyzer is indispensable for designing artillery systems and ballistic calculations requiring high precision."

 aotsm_early_fire_control_system_tech:0 "Early Fire Control System"
 aotsm_early_fire_control_system_tech_desc:0 "The first experimental models of fire control systems for naval and coastal artillery. Mechanical calculators allow for adjustments accounting for target distance and wind speed. The system significantly increases hit probability, although it remains cumbersome and requires lengthy calculation preparation."

 aotsm_basic_fire_control_system_tech:0 "Basic Fire Control System"
 aotsm_basic_fire_control_system_tech_desc:0 "The introduction of full-fledged fire control systems with mechanical calculators in the navy and coastal defence. Consideration of distance, own speed and target course enables aimed fire at moving ships. Improved accuracy provides a tangible advantage in naval engagements."

 aotsm_improved_fire_control_system_tech:0 "Improved Fire Control System"
 aotsm_improved_fire_control_system_tech_desc:0 "Modernised fire control systems with more complex computing devices. Added capability to account for air temperature, humidity and gun barrel ballistic wear. Automated data transmission from rangefinders reduces the time between target detection and commencement of fire."

 aotsm_advanced_fire_control_system_tech:0 "Advanced Fire Control System"
 aotsm_advanced_fire_control_system_tech_desc:0 "A next-generation fire control system integrating data from rangefinders, gyroscopic stabilisers and ballistic computers. Automatic compensation for ship roll, wind speed and propellant temperature enables effective fire even in adverse weather conditions. Data transmission via electrical communication lines reduces artillery crew reaction time to a minimum, providing a significant advantage in naval engagements."

 aotsm_wired_telegraph_tech:0 "Wired Telegraph"
 aotsm_wired_telegraph_tech_desc:0 "A system for transmitting information over distances using electrical signals and wire communication lines. Coding messages in Morse code allows data exchange almost instantaneously over thousands of versts. The introduction of the telegraph fundamentally changes the command and supply organisation, making communication fast and reliable."

 aotsm_wireless_telegraph_tech:0 "Wireless Telegraph"
 aotsm_wireless_telegraph_tech_desc:0 "Signal transmission through the air using electromagnetic waves, free from the need to lay cables. Radio communication enables operational control of battlefield formations and ships on the high seas. Mobility and rapid deployment make the wireless telegraph an indispensable means of communication."

 aotsm_amplitude_modulation_tech:0 "Amplitude Modulation"
 aotsm_amplitude_modulation_tech_desc:0 "A method of transmitting information by varying the amplitude of the carrier wave in accordance with the transmitted signal. This technique enables the transmission of speech and music, opening the era of radio broadcasting. In military applications, amplitude modulation is used for transmitting voice commands and reconnaissance data without the need for code decryption."

 aotsm_radar_i_tech:0 "Radar I"
 aotsm_radar_i_tech_desc:0 "The first experimental radio detection installations using reflected radio waves to detect objects. Simplest transmitters and receivers allow the detection of large targets such as ships and airships. Limited accuracy and short range do not yet allow radar to be used for precise targeting, but already provide a tactical advantage."

 aotsm_radar_ii_tech:0 "Radar II"
 aotsm_radar_ii_tech_desc:0 "Improved radar installations with increased range and the ability to determine approximate distance to target. The introduction of pulse operation and more powerful generators enhances detection accuracy. Radar becomes a reliable means of early warning of approaching enemy ships and aircraft."

 aotsm_radar_iii_tech:0 "Radar III"
 aotsm_radar_iii_tech_desc:0 "Advanced radars capable of determining not only range but also target azimuth. The use of narrow-beam directional antennas allows for 360-degree surveillance and precise determination of air and sea target coordinates. The system is integrated with anti-aircraft and naval artillery for highly accurate gun laying."

 aotsm_radar_iv_tech:0 "Radar IV"
 aotsm_radar_iv_tech_desc:0 "Next-generation radar stations with automatic target tracking and fire control data output. The use of multiple frequency channels and moving target selection effectively suppresses interference and distinguishes targets from background clutter. High resolution enables the differentiation of aircraft types and ensures complete information superiority."

 aotsm_basic_encryption:1 "Encryption - Polyalphabetical Ciphers"
 aotsm_basic_encryption_desc:0 "With new methods of communication comes new risks for interception. Rotor cipher machines can be used to allow for rapid, complex encryption."
 aotsm_improved_encryption:1 "Encryption - Cyclic Permutations"
 aotsm_improved_encryption_desc:0 "Limitation in the randomization of cipher machines can be exploited to break the ciphers. By improving the randomness of the rotor mechanics, we can make this kind of cryptanalysis more difficult."
 aotsm_advanced_encryption:1 "Encryption - Pulse-code Modulation"
 aotsm_advanced_encryption_desc:0 "Technological improvements and hard-earned experience allows us to implement more traffic flow security measures in our communication."
 aotsm_basic_decryption:1 "Decryption - Frequency Analysis"
 aotsm_basic_decryption_desc:0 "Cryptanalysis is increasingly becoming an advanced mathematical science. Systems like card catalogs and devices like cyclometers can aid the necessary work."
 aotsm_improved_decryption:1 "Decryption - Side-channel Attack"
 aotsm_improved_decryption_desc:0 "The development of more sophisticated computers allows for new applications of cryptanalysis methods like differencing, which can be used to break advanced cyphers when combined with new hand codebreaking methods."
 aotsm_advanced_decryption:1 "Decryption - Automated Deduction"
 aotsm_advanced_decryption_desc:0 "The increased computation power that improved our cryptanalysis so far threatens to create nearly unbreakable ciphers in the future. To stay ahead, we must be prepared to work more aggressively on gaining inside information on the technology."
 

 # PANZER MODULES

 aotsm_tank_flags:0 "Signal Flags"
 aotsm_tank_flags_desc:0 "The introduction of a signal flag system for commanding armoured units in the absence of reliable radio communications. The platoon commander issues orders using coloured flags indicating changes of direction, movement speed and combat formation. This method remains the only reliable means of operational command in conditions of smoke, dust and battle noise. The system's simplicity and clarity enable effective coordination of unit actions without additional equipment."