 aotsm_handicraft_production_tech:0 "Handicraft Production"
 aotsm_handicraft_production_tech_desc:0 "Products are manufactured by hand by skilled craftsmen who pass down the secrets of metalworking from generation to generation. Quality and productivity depend entirely on the individual skill of the worker. This method of production remains extremely slow and does not allow for the mass production of identical items within acceptable timeframes."

 aotsm_manufactory_production_tech:0 "Manufactory Production"
 aotsm_manufactory_production_tech_desc:0 "The division of labour has been introduced among groups of workers, each performing strictly defined operations. This significantly increases productivity compared to individual craftsmanship. However, the absence of uniform standards and gauges still leads to a considerable percentage of defects."

 aotsm_basic_machine_tools_tech:0 "Basic Machine Tools"
 aotsm_basic_machine_tools_tech_desc:0 "Simple lathes and drilling machines powered by water wheels or manual drive allow metal workpieces to be processed with acceptable precision. The design of the machines has certain drawbacks: vibration and play reduce the quality of finished parts, requiring subsequent finishing with a file."

 aotsm_improved_machine_tools_tech:0 "Improved Machine Tools"
 aotsm_improved_machine_tools_tech_desc:0 "Cast-iron beds and reinforced construction have reduced vibration, ensuring cleaner surface finishing. Parts are now manufactured with smaller tolerances, reducing the amount of manual fitting required. Productivity increases alongside the stability of the equipment."

 aotsm_advanced_machine_tools_tech:0 "Advanced Machine Tools"
 aotsm_advanced_machine_tools_tech_desc:0 "Self-centering chucks, mechanical tool rests and automatic feed mechanisms elevate machining to a new level of precision. The production speed of components doubles, and parts interchangeability becomes a reality. The equipment requires skilled maintenance but fully justifies its cost."

 aotsm_basic_equipment_refinement_tech:0 "Basic Equipment Refinement"
 aotsm_basic_equipment_refinement_tech_desc:0 "Experienced armourers adjust standard small arms to suit the individual anthropometric parameters of the soldier. Adjustments to the stock, installation of a more comfortable front sight and simple balancing improve accuracy. The work is carried out in field workshops without the use of complex equipment."

 aotsm_improved_equipment_refinement_tech:0 "Improved Equipment Refinement"
 aotsm_improved_equipment_refinement_tech_desc:0 "The introduction of rifled barrels and optical sights requires fine tuning of trigger mechanisms, bolt groups and sighting devices. Workshops are equipped with measuring instruments to control trigger pull and bore alignment. Each example is test-fired before being sent to the troops."

 aotsm_advanced_equipment_refinement_tech:0 "Advanced Equipment Refinement"
 aotsm_advanced_equipment_refinement_tech_desc:0 "Individual weapon fitting has been introduced using adjustable sights and ergonomic stocks contoured to the shooter's shoulder. Ballistic characteristics are verified on specialised stands. Refinement has become a precise engineering process, reducing the influence of human factors on combat accuracy."

 aotsm_primitive_conveyor_tech:0 "Primitive Conveyor"
 aotsm_primitive_conveyor_tech_desc:0 "Cast-iron rollers and wooden guides have been installed between machine tools for the mechanised transfer of workpieces. This frees workers from the heavy physical labour of carrying parts and streamlines the production process. Insufficient reliability of the mechanisms and frequent jams require constant supervision."

 aotsm_conveyor_production_tech:0 "Conveyor Production"
 aotsm_conveyor_production_tech_desc:0 "A continuous production chain has been established: the workpiece passes successively through all machine tools without intermediate storage. Each worker performs only their own operation, which increases output and reduces downtime. The production rhythm becomes stable and predictable."

 aotsm_improved_conveyor_tech:0 "Improved Conveyor"
 aotsm_improved_conveyor_tech_desc:0 "Steel rollers on bearings and a belt drive powered by a steam engine ensure smooth movement of workpieces without jerking. The reduction of friction and mechanical losses has made it possible to increase conveyor speed and reduce the time between operations. Line downtime has been reduced by half."

 aotsm_flexible_conveyor_i_tech:0 "Flexible Conveyor I"
 aotsm_flexible_conveyor_i_tech_desc:0 "The conveyor design has been supplemented with removable guides, allowing the line to be reconfigured for various product sizes. The changeover time from one product range to another is reduced to one shift. Production flexibility is achieved at the expense of reliability, which requires additional oversight."

 aotsm_flexible_conveyor_ii_tech:0 "Flexible Conveyor II"
 aotsm_flexible_conveyor_ii_tech_desc:0 "A modular system has been developed with adjustable stops and universal fixtures, enabling rapid retooling within two hours. The conveyor can be easily adapted for the production of various types of weaponry without replacing the base units. This enhances the efficiency of small-batch production."

 aotsm_standardized_conveyor_i_tech:0 "Standardized Conveyor I"
 aotsm_standardized_conveyor_i_tech_desc:0 "Unified standard dimensions for rollers, sprockets and belts have been introduced for all conveyor lines at the plant. Standardisation of spare parts simplifies repairs and reduces dependence on custom orders from turning shops. The time required to fix malfunctions is reduced from days to hours."

 aotsm_standardized_conveyor_ii_tech:0 "Standardized Conveyor II"
 aotsm_standardized_conveyor_ii_tech_desc:0 "Full interchangeability of all conveyor components and parts within the enterprise has been achieved. Maintenance personnel are provided with spare parts kits that allow line restoration without delays. This drastically reduces equipment downtime and improves overall productivity."

 aotsm_production_standardization_tech:0 "Production Standardization"
 aotsm_production_standardization_tech_desc:0 "A unified system of drawings, tolerances and gauges has been introduced for all workshop departments. Parts manufactured in different sections are fully interchangeable. This allows efforts to be focused on increasing production volumes rather than on hand-fitting each individual item."

 aotsm_modern_construction_standards_tech:0 "Modern Construction Standards"
 aotsm_modern_construction_standards_tech_desc:0 "The use of rolled steel and unified truss structures makes it possible to erect factory buildings according to standardised designs. Construction time is reduced threefold, and building strength is sufficient for the installation of heavy steam engines and hammers. Standardised dimensions simplify equipment logistics."

 aotsm_smokeless_powder_tech:0 "Smokeless Powder"
 aotsm_smokeless_powder_tech_desc:0 "A new type of propellant charge based on pyrocellulose has been developed, producing virtually no smoke upon firing. The significant reduction in the masking effect allows shooters to maintain concealment on the battlefield. Muzzle velocity increases by 25% while maintaining the same powder charge weight."

 aotsm_double_base_propellant_application_tech:0 "Double-Base Propellant Application"
 aotsm_double_base_propellant_application_tech_desc:0 "The double-base composition containing nitrocellulose and nitroglycerin provides increased combustion energy and a stable ballistic curve. This makes it possible to increase the range and accuracy of field artillery fire. Application requires special safety measures due to the high sensitivity of the mixture."

 aotsm_synthetic_nitrogen_usage_tech:0 "Synthetic Nitrogen Usage"
 aotsm_synthetic_nitrogen_usage_tech_desc:0 "Industrial production of nitrogen compounds directly from atmospheric air has been developed using chemical methods. This approach provides the production of explosives with the necessary raw materials without reliance on natural deposits. Supply stability is no longer dependent on external factors and transport routes."

 aotsm_improved_nitrogen_synthesis_tech:0 "Improved Nitrogen Synthesis"
 aotsm_improved_nitrogen_synthesis_tech_desc:0 "The parameters of pressure and temperature in the reaction columns have been optimised, and a more efficient catalyst has been selected. Ammonia yield has nearly doubled without increasing raw material consumption. The introduction of a continuous production scheme reduces energy consumption per unit of output."

 aotsm_modernized_nitrogen_synthesis_tech:0 "Modernized Nitrogen Synthesis"
 aotsm_modernized_nitrogen_synthesis_tech_desc:0 "Reaction vessels have been equipped with steam heating and a forced circulation system for the gas mixture. The conversion rate has increased by 40%, and the purity of the final product has reached levels sufficient for the production of high-grade explosives. Losses of reagents and toxic emissions have been reduced."

 aotsm_advanced_nitrogen_synthesis_tech:0 "Advanced Nitrogen Synthesis"
 aotsm_advanced_nitrogen_synthesis_tech_desc:0 "A continuous catalytic cycle with complete recovery of waste heat has been established. The output capacity of the factory complex has reached volumes sufficient to supply the active army with explosives. This technology is recognised as the most advanced in its class."