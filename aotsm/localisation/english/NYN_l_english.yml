 #CHARACTERS
 NYN_Zhang_Lexin_t:0 "Zhang Lexin"

 #IDEAS
 NYN_mobile_detachments:0 "Mobile Nian Detachments"
 NYN_mobile_detachments_desc:0 "The armed bands of the §YNian§! are accustomed to operating in small, §Ymobile detachments§!, avoiding prolonged engagements with superior enemy forces. §YMounted fighters§! conduct rapid marches, launch surprise attacks against supply convoys and garrisons, and withdraw before the enemy can organize a pursuit. This method of warfare allows the rebels to compensate for their lack of heavy weaponry and regular military training."
 NYN_fragmented_rebel_bands:0 "Fragmented Rebel Bands"
 NYN_fragmented_rebel_bands_desc:0 "The §YNian§! constitute an alliance of numerous armed groups united by common interests, kinship ties, and opposition to the imperial administration. Each leader commands his own followers and seeks to preserve his independence in decision-making. The absence of a firm §Ymilitary hierarchy§! complicates the coordination of major operations and the subordination of individual detachments to a unified command, although local chiefs can rapidly rally new supporters."
 NYN_huaibei_smuggling:0 "Huaibei Smuggling Networks"
 NYN_huaibei_smuggling_desc:0 "For many years, the people of §YHuaibei§! (a region north of the Huai River encompassing northern §YAnhui§! and §YJiangsu§!) have engaged in §Yillicit salt trading§!, transporting goods around government checkpoints, and other activities beyond the control of imperial officials. These enterprises provide local armed groups with money, provisions, and a steady influx of recruits. However, dependence on unofficial commerce and the absence of a stable taxation system hinder the establishment of a functioning state economy and the development of organized production."
