 #
 SON_guarda_imperial_do_norte:0 "Guarda Imperial do Norte"
 SON_guarda_imperial_do_norte_desc:0 "The Imperial Guard of the North is a military structure originally created in the territories of Sonora to protect key regions and cities. At present, it is effectively a professional army trained along the lines of the finest European units. It is divided into regular formations (Lanceiros, Caçadores) and irregular militias (Voluntários da Fronteira).\n\nThe composition of the Guard's units is multifaceted: the core consists of a small number of officers who arrived from the metropole, while the bulk is recruited from newcomers and the local population (city dwellers, Indians, mestizos, and others)."
 SON_serebryanaya_papageria:0 "Serebryanaya Papageria"
 SON_serebryanaya_papageria_desc:0 "In the 1830s, rich silver and gold deposits were discovered in the northwest of Sonora, leading to the rapid development of mines in the region amid the so-called "Gold Rush." \n\nDespite the constant need for the presence of "Guarda Imperial do Norte" units and the virtual rampant crime in Papageria, the region steadily replenishes the country's treasury, making it one of the key sources of state revenue."
 SON_portugal_colonial_administration:0 "Portuguese Colonial Administration"
 SON_portugal_colonial_administration_desc:0 "The Portuguese colonial administration links Sonora to the metropole through a system of trade privileges, licenses, and tax exemptions. In return, it demands loyalty, accountability, and adherence to the Crown's interests. The higher the loyalty, the broader the access to markets, credit, and protection. However, privileges are a double-edged sword — as they increase, so does dependence on Lisbon."
 SON_apache_raids:0 "Apache Raids"
 SON_apache_raids_desc:0 "Apache culture is a culture of warriors! Their path is strictly determined from birth — for them a warrior is not a profession but an identity. Combined with the presence of borders with their lands in the northwest of the country, this leads to periodic raids that devastate remote regions."

