l_english:

 POL_nationalist_resistance_dynamic_modifier:0 "Polish Nationalism"
 POL_nationalist_resistance_dynamic_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_pol_nationalist_resistance\n\n\n\n\n\n\n\nThe desire for §Yrestoration§! of an §Oindependent§! §Ystate§!, §Rfree from the rule§! of §YRussia§!, has always §Rburned§! in the hearts of Poles. This §Onationalist fervor§!, intertwined with §Oseparatist sentiments§!, creates §Rnumerous difficulties§!..."
 FIN_separatism_dynamic_modifier:0 "Finnish Separatism"
 FIN_separatism_dynamic_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_fin_separatism\n\n\n\n\n\n\n\nThe long-standing policy of the §YRussian§! government towards the §YFinnish region§! and its population, accompanied by everyday racism and neglect from the central authorities, has given rise to powerful separatist movements.\n\nCultural and economic demands of the population are §Rsystematically§! §Oignored§!, which exacerbates the divide. The region's desire for secession, fueled by a sense of humiliation, is one of the most §Rserious threats§! to the country's integrity and sovereignty."
 FIN_separatism_dynamic_modifier_1:0 "Finnish Separatism"
 FIN_separatism_dynamic_modifier_1_desc:0 "\n\n\n\n\n£GFX_modifier_desc_fin_separatism\n\n\n\n\n\n\n\nThe long-standing policy of the §YRussian§! government, marked by racist prejudices and ignoring the legitimate problems of the Finnish population, has led to a §Rrise§! in §Oseparatist sentiments§! in the §YFinnish region§!.\n\nRecognizing the §Oseriousness of the threat§!, the authorities have §Gbegun§! taking steps towards dialogue and resolving accumulated issues. A §Gfight§! against discrimination has also §Gbeen initiated§!, however these measures are not yet widespread and do not fundamentally change the situation."
 FIN_separatism_dynamic_modifier_2:0 "Finnish Separatism"
 FIN_separatism_dynamic_modifier_2_desc:0 "\n\n\n\n\n£GFX_modifier_desc_fin_separatism\n\n\n\n\n\n\n\nThe long-standing policy of the §YRussian§! government towards the population of the §YFinnish region§!, which included instances of everyday racism and ignoring local demands, contributed to a §Orise in tensions§!.\n\nCurrently, attempts are being made to resolve accumulated problems. Efforts are underway to combat discriminatory practices and integrate the region into the national space, taking its specifics into account. These measures are aimed at reducing separatist sentiments and stabilizing the situation in the region."
 RUS_integrated_finland_dynamic_modifier:0 "Integration Discontent"
 RUS_integrated_finland_dynamic_modifier_desc:0 ""

 RUS_small_autonomy_modifier:0 "Self-Governing Region"
 RUS_small_autonomy_modifier_desc:0 "The region has a number of privileges compared to provinces and is governed more autonomously."

 RUS_autonomy_modifier:0 "Special Status"
 RUS_autonomy_modifier_desc:0 "This region has a special economic and administrative status."
 
 #QIN modifiers

 QIN_god_worshipping_society_state_modifier:0 "God Worshipping Society"
 QIN_god_worshipping_society_state_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_qin_god_worshipping_society\n\n\n\n\n\n\n\nA sect widely spread among the poor strata of southern China. According to its founder - §YHong Xiuquan§!, the doctrine professed by believers is a revival of the ancient religion of §YShangdi§!.\n\nHowever, at present, the scale of the sect is becoming §Oan escalating problem§!, and moreover, those familiar with the tracts professed by the sectarians claim that their content resembles a mixture of §CProtestantism§! with §CBuddhism§! and §Oposes a threat§! to the stability of the country..."

 QIN_nomad_region_state_modifier:0 "Nomadic Region"
 QIN_nomad_region_state_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_qin_nomad_region\n\n\n\n\n\n\n\nThis region is inhabited by nomads, which significantly slows its development. However, due to the sparse population of the area, we require significantly fewer garrisons."

 QIN_undeveloped_region_state_modifier:0 "Undeveloped Region"
 QIN_undeveloped_region_state_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_qin_undeveloped_region\n\n\n\n\n\n\n\nA territory located in an area of China remote from the capital and developed coastal lands. The region's location creates difficulties in its development, as well as weakened control of the central government over it."

 QIN_agricultural_region_state_modifier:0 "Agricultural Region"
 QIN_agricultural_region_state_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_qin_agricultural_region\n\n\n\n\n\n\n\nThis region contains extensive agricultural lands and the majority of the population is engaged in agricultural activities. However, this situation also has negative aspects: resource extraction, as well as the construction of industrial enterprises in the region, will be significantly hampered."

 QIN_industrial_region_1_state_modifier:0 "Industrializing Region"
 QIN_industrial_region_1_state_modifierr_desc:0 "\n\n\n\n\n£GFX_modifier_desc_QIN_industrial_region_1\n\n\n\n\n\n\n\nThis area is undergoing rapid industrialization, allowing industry to be concentrated here. However, such activity requires significant labor input and is not always met with approval by the region's population."

 QIN_industrial_region_2_state_modifier:0 "Industrial Region"
 QIN_industrial_region_2_state_modifierr_desc:0 "\n\n\n\n\n£GFX_modifier_desc_QIN_industrial_region_2\n\n\n\n\n\n\n\nA region with extensive industry concentrated within it. A large number of factories and mines allows for the extraction of minerals and the production of industrial goods in accordance with modern standards."

 QIN_mountain_region_state_modifier:0 "Mountain Region"
 QIN_mountain_region_state_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_qin_mountain_region\n\n\n\n\n\n\n\nThe region is located in mountainous terrain, which complicates both its development and movement across the lands themselves."
 
 QIN_dissatisfaction_of_the_islamic_population_state_modifier:0 "Dissatisfaction of the Islamic Population"
 QIN_dissatisfaction_of_the_islamic_population_state_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_qin_dissatisfaction_of_the_islamic_population\n\n\n\n\n\n\n\nThe Muslim population of this region expresses growing discontent with imperial policies, creating tensions that could escalate into unrest if left unaddressed."

 QIN_capital_of_empire_state_modifier:0 "Capital of the Empire"
 QIN_capital_of_empire_state_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_qin_capital_of_empire\n\n\n\n\n\n\n\n§YBeijing§! — the heart of the §YQing Empire§!, where the Forbidden City unites the imperial residence and the center of administration. Capital troops patrol key areas, and infrastructure is oriented toward supplying the elite."
 
 QIN_administrative_center_state_modifier:0 "Administrative Center"
 QIN_administrative_center_state_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_qin_administrative_center\n\n\n\n\n\n\n\nThis city serves as the administrative center of the province, which means many of its residents are employed in the bureaucratic apparatus. However, there are also advantages to this situation."

 QIN_trade_factoria_state_modifier:0 "Trade Factory Region"
 QIN_trade_factoria_state_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_qin_trade_factoria\n\n\n\n\n\n\n\nThis territory is under the control of a foreign state or company. Commercial activity predominates in the region, but full colonial governance and mass resettlement of metropolitan citizens does not occur. The factory serves as a key trading post, ensuring economic presence without direct political influence over inland territories."
 
 #Japan State Modifiers
 
 JP_state_kioto_modifier:0 "Imperial Throne"
 JP_state_kioto_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_jap_state_kioto\n\n\n\n\n\n\n\nThe ancient capital, where the heart of Japan beats beneath the shadow of golden pagodas and imperial gardens. Here, in the halls of the Gosho Palace, the Emperor approves reform decrees, while scholars of the Rangaku Academy work wonders: steam turbines stand alongside silk looms, and observatories calculate comet trajectories. Kyoto is a symbol of the synthesis of tradition and progress, where every stone preserves the spirit of the "enlightened monarchy." But behind the high walls, intrigues simmer: shogunate supporters whisper in tea houses, and merchants from Osaka buy up land for factories..."
 JP_state_edo_modifier:0 "Capital of the East"
 JP_state_edo_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_jap_state_edo\n\n\n\n\n\n\n\nA city of contrasts, where factory smoke blots out the sun and barges laden with coal and steel glide along the canals. Edo is the crucible of Japanese industry: shipyards build ironclads to new designs, textile manufactories supply all of Asia, and the speech of Dutch engineers is heard in the streets. There is no place here for shogunate prejudices or imperial ceremony; Edo's only god is progress, measured in tons of pig iron and miles of railway. But its neutrality is fragile: clans sponsor strikes, and Sendai spies steal patents."
 JP_state_sendai_modifier:0 "Shogun's Stronghold"
 JP_state_sendai_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_jap_state_sendai\n\n\n\n\n\n\n\nA harsh northern bastion, where arsenals replace factories and bushidō schools replace universities. Behind the walls of Date Masamune's castle, the shogun dispenses justice, his samurai swear fealty by the sword, and peasants pay tribute in rice and gunpowder. Here, the "heretical" machines from Edo are forbidden, but forges produce Japan's finest blades. Sendai is the stronghold of the old order: here they honor the code of honor, despise the Emperor's reforms, and prepare for war. Even the air is steeped in iron and fury."
 JP_state_kanto_modifier:0 "Special Region"
 JP_state_kanto_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_jap_state_kanto\n\n\n\n\n\n\n\nA land where, over a century, rice paddies have transformed into a forest of smokestacks and rails. The Kantō Plain is the engine of Japan's miracle: private railways connect Maebashi's textile factories to Yokohama's ports, chemical plants poison the Tama River, and thousands of peasants turned workers live in domain barracks. The government calls it "progress," but for the shogun, Kantō is a festering sore on Japan's body, and for farmers, the end of their familiar world. Here, the future is born, smelling of sulfur and sweat."
 JP_state_industrial_land_modifier:0 "Industrial Region"
 JP_state_industrial_land_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_jap_industrial_land\n\n\n\n\n\n\n\nFrom the smoking shipyards of Satsuma to the fiery domains of Kantō stretches the belt of Japan's miracle. Here, rice paddies have given way to factory chimneys, peasants have traded hoes for steam engine levers, and samurai clans invest gold in railways and textile manufactories. Day and night, hammers thunder in Osaka's forges, barges laden with Mikawa coal ply the rivers, and goods stamped "Made in the Empire" are loaded onto Confederate ships in Yokohama. But progress is not merciful: children toil at blazing furnaces, toxic runoff from copper mines poisons rivers, and rumors of "machines that steal souls" stir the villages. This is the price of power - and the region pays it in full."
 JP_state_shogun_land_modifier:0 "Region under Shogunate Control"
 JP_state_shogun_land_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_jap_shogun_land\n\n\n\n\n\n\n\nLands where time stands still: the samurai elite rule from castles, peasants plow by hand, and the "Emperor's reforms" are empty words. The shogun has forbidden the construction of factories ("lest they defile the ancestors' spirits"), restricted trade with Edo, and executes "traitors" who buy steam plows. Only secretly, by night, do contraband rifles and chemistry books slip through. But pressure mounts: hunger riots and rumors of railways in Kantō sow doubt even among loyal bushi."
 JP_state_prison_island_modifier:0 "Prison Island"
 JP_state_prison_island_modifier_desc:0 "A grim cliff in the Sea of Japan, where enemies of the regime are exiled: reformers demanding a constitution, rebellious peasants, and scholars who dared to criticize the shogunate. Here there are no factories or roads - only convicts in rags, mining sulfur under the overseer's whip. Letters from the island never reach their destination, escapes drown in the fog, and imperial inspectors call Oki "a place of soul purification." But in the caves, prisoners write poems of freedom..."
 JP_state_tsusima_island_modifier:0 "Island of Special Designation"
 JP_state_tsusima_island_modifier_desc:0 "The key to the Korea Strait, contested for centuries by Japan and Joseon. Tsushima is not just a rock: its harbors are filled with smugglers trading opium and rifles, fortresses watch for Confederate ships, and villages live under the dual yoke of samurai garrisons and Korean taxes. The local daimyo navigates between Seoul and Edo, but in taverns they whisper: "It will soon be decided by force." Here the air smells of gunpowder and the salt wind of change."
 JP_state_okinawa_trade_node_modifier:0 "All-Asian Port"
 JP_state_okinawa_trade_node_modifier_desc:0 "The pearl of the East China Sea, where the paths of Europe and Asia converge. In Naha harbor, Confederate clippers unload machinery and textiles, Chinese junks carry tea and porcelain, and Japanese envoys buy weapons. Ryukyu is a "free city" under a straw neutral umbrella, but behind the market façades lies a brutal reality: 90% of revenues go to Kyoto, the shogun dreams of annexing the island, and local princes beg the Emperor for protection. Trade here is a delicate game on a katana's edge."
 
 #Aztec State Modifiers
 
 AZT_collapse_of_the_extractive_industry_state_modifier:0 "Collapse of the extractive industry"
 AZT_collapse_of_the_extractive_industry_state_modifier_desc:0 "Unfortunately, we were unable to maintain the stability of our resource extraction industry, so we are forced to restore previous extraction levels before this affects other regions."
