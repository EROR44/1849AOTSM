 qin_death_of_emperor_chain_event.10.t:0 "Lights in the Forbidden City"
 qin_death_of_emperor_chain_event.10.d:0 "      During the night, guards saw lights in palace chambers that should have been empty. Hurried footsteps and muffled voices echoed through the galleries, but the lights vanished when the watch approached. Servants claimed to have seen nothing, and by morning rumours had spread through the court.\n\n      The uncertainty surrounding the succession deepened their unease. The emperor, some said, had not made his final choice. Courtiers whispered that someone had searched for the genuine testament, while others feared that documents had been altered to pass another man’s wishes off as the Son of Heaven’s will. There was no proof; before an heir could be proclaimed, the papers and the events of the night would have to be examined."
 qin_death_of_emperor_chain_event.10.a:0 "The documents must be examined carefully."
 qin_death_of_emperor_chain_event.11.t:0 "Imperial Edict on the Succession"
 qin_death_of_emperor_chain_event.11.d:0 "      By the will of Heaven and the grace of Our ancestors, We received the great inheritance of the Qing dynasty and have borne the burden of governing the realm for many years. Following the precepts of former sovereigns, We have sought to preserve peace within the empire, protect the people from calamity, strengthen the laws and maintain order among officials and soldiers. Yet affairs of state are without number, and human life is not eternal. Mindful of the welfare of the imperial house and the peace of millions of Our subjects, We deem it necessary to name a successor to the great throne in advance, so that after Our passing no discord may arise among the princes and dignitaries, nor the order established by Our ancestors be disturbed.\n\n      Having carefully considered the merits of Our sons, their upbringing, moral character and ability to govern, We have determined that [QIN_get_chosen_heir_name] shall inherit the imperial throne. We command that he be recognised as the lawful heir of the great Qing dynasty and future sovereign of the realm. Let him follow the teachings of the ancestors, honour Heaven, show filial virtue, care for the welfare of the people and permit no abuses among the dignitaries. The other princes of the imperial house shall live in harmony, set aside rivalry and serve the new sovereign with the same loyalty they owe to Us.\n\n      We command that Our present will be written in Manchu and Chinese, authenticated with the imperial seal and kept secret until the appointed time. One copy of this edict shall be placed in a sealed casket behind the Zhengda Guangming tablet in the Palace of Heavenly Purity; another shall be kept in the sovereign's possession. After Our passing, the imperial princes, senior dignitaries and members of the Grand Council shall together open the documents, verify their authenticity and proclaim Our will. We command all civil and military officials to support the heir in unity, safeguard the interests of the state and the welfare of the people, and permit neither disorder nor wilful acts. May the greatness of the Qing dynasty endure for generations. Honour this command and carry it out faithfully."
 qin_death_of_emperor_chain_event.11.a:0 "The imperial will is sealed. May the throne stand firm!"

 qin_death_of_emperor_chain_event.12.t:0 "The Heir to the Celestial Empire"
 qin_death_of_emperor_chain_event.12.d:0 "      The court gathers in mourning to hear the proclamation of the successor. Before the ancestral tablets, the princes and ministers acknowledge the new Son of Heaven, while messengers prepare the imperial decrees for the provinces.\n\n      The rites of succession must be observed even as the empire mourns. The Grand Council prepares to inform governors and commanders, asking them to preserve order and continue their duties under the new sovereign.\n\n      Petitions concerning the treasury, unrest and foreign merchants await the new ruler. The court looks to the Son of Heaven to uphold the ancestral traditions and answer the troubles facing the Celestial Empire."
 qin_death_of_emperor_chain_event.12.a:0 "Long live Emperor Yizhu!"
 qin_death_of_emperor_chain_event.12.b:0 "Long live Emperor Yixin!"
 qin_death_of_emperor_chain_event.12.c:0 "Long live Emperor Yixuan!"
 qin_death_of_emperor_chain_event.13.t:0 "Mourning Across the Empire"
 qin_death_of_emperor_chain_event.13.d:0 "      Officials and citizens gather outside the Forbidden City as a herald announces the death of Emperor Daoguang. White mourning cloth hangs from the walls, and bells carry the news across the capital.\n\n      An imperial proclamation orders the court and provincial officials to observe the mourning rites. Messengers depart for the governors, bearing instructions to maintain order and continue their duties.\n\n      As the news spreads through Beijing, the court prepares the memorial rites and the succession ceremony. The initial period of court mourning will end before the enthronement; the late emperor’s funeral rites will continue."
 qin_death_of_emperor_chain_event.13.a:0 "The Celestial Empire mourns."
 qin_death_of_emperor_chain_event.14.t:0 "The Emperor’s Enthronement"
 qin_death_of_emperor_chain_event.14.d:0 "[QIN_get_enthronement_description]"
 qin_death_of_emperor_chain_event.14.a:0 "May peace endure under Heaven."

 qin_death_of_emperor_chain_event.15.t:0 "The Question of the Regency"
 qin_death_of_emperor_chain_event.15.d:0 "      After young Yixuan ascended the throne, senior dignitaries and princes of the imperial house gathered in a hall of the Forbidden City. Their chief concern was the establishment of a regency to govern the realm until the new sovereign came of age. Sushun spoke first:\n      — Honoured princes and dignitaries, the late Emperor Mianning entrusted the throne to his youngest son, but affairs of state cannot await his maturity. I propose a council of loyal princes and experienced dignitaries to act in the name of the Son of Heaven and safeguard the established order.\n\n      Some officials approved, but Noble Consort Lin, the new Emperor's mother, voiced her disagreement:\n      — My son is too young to understand affairs of state. But does that mean his fate should be entrusted entirely to dignitaries? As the sovereign's mother, I must protect him and watch those who intend to rule in his name.\n      — Your Highness, — Sushun replied, — governing the realm requires experience and knowledge of state institutions. It is not fitting for the Inner Palace to interfere in matters entrusted to senior dignitaries.\n      — And who will guarantee that your councillors will not use the throne for their own advantage? — Lin answered coldly.\n\n      After this exchange, the senior dignitaries spoke again. Some supported Sushun, believing government should remain in the hands of experienced officials and imperial princes. Others recalled Lin's position as mother of the Son of Heaven and her right to care for her son's future, arguing that the Inner Palace could not be excluded entirely from power. The dispute gradually divided the assembly into two camps, each arguing for its own form of regency. Yet even a majority could not finally settle the question: neither side wished to yield, and the regency's authority still required recognition by the whole imperial court. The dignitaries now had to decide whose claims deserved support, knowing their decision might prove only the beginning of a new struggle for power."
 qin_death_of_emperor_chain_event.15.a:0 "The realm should be entrusted to experienced dignitaries."
 qin_death_of_emperor_chain_event.15.b:0 "The sovereign's mother must not be excluded from his upbringing or government."
 qin_death_of_emperor_chain_event.15.c:0 "Harmony at court matters more than personal claims."

 qin_death_of_emperor_chain_event.16.t:0 "The Young Sovereign’s Will"
 qin_death_of_emperor_chain_event.16.d:0 "      An unusual silence filled the chambers of the young Emperor Yixuan. He was seated before his study scrolls when Noble Consort Lin entered. Since Mianning's death, courtiers had increasingly asked the boy questions he did not yet fully understand. His mother sat beside him and gently took his hand.\n      — My son, you now rule the realm, but many will wish to wield your authority. Remember that not everyone who promises loyalty wishes you well.\n      — But are the dignitaries not obliged to obey my commands? — Yixuan asked.\n      — They are, — she replied. — First, however, you must learn to distinguish faithful servants from those who seek their own gain.\n\n      News of their conversation soon reached Sushun. An Yumin, a senior eunuch trusted by some palace servants, told him of Lin's growing influence.\n      — My lord, her people accompany the sovereign more and more often. Soon no order will pass without her consent.\n      Sushun frowned.\n      — A mother may raise her son, but she must not govern the state.\n      At his urging, several dignitaries prepared an address reminding Yixuan to heed experienced officials and observe the institutions established by the ancestors.\n\n      The young Emperor faced a difficult choice. His mother's words comforted him, while the dignitaries spoke of duty to the dynasty and millions of subjects. Yixuan understood that sovereign power was his, but did not yet know whom to trust with exercising it. His attendants awaited an answer, knowing that even a few words from the young Son of Heaven could alter the balance at court."
 qin_death_of_emperor_chain_event.16.a:0 "My mother wishes me well. I should heed her guidance."
 qin_death_of_emperor_chain_event.16.b:0 "Experienced dignitaries will help me fulfil my duty to the realm."
 qin_death_of_emperor_chain_event.16.c:0 "I shall hear everyone before deciding."

 qin_death_of_emperor_chain_event.17.t:0 "The Seal of Imperial Authority"
 qin_death_of_emperor_chain_event.17.d:0 "      Disagreements over the future of government deepened in the Forbidden City. Supporters of Noble Consort Lin prepared a petition to elevate her to Empress Dowager and grant her a role in state affairs on behalf of her young son. They intended to submit it to Yixuan for approval with the imperial seal. Learning of their plans, Sushun summoned the senior dignitaries.\n      — Honoured gentlemen, no one disputes the sovereign's mother's merits. But if she is given control of the realm, what authority will remain to the institutions established by our ancestors?\n\n      Some officials supported Sushun; others insisted that the Emperor had the right to elevate his mother and entrust her with the throne's care. Meanwhile, An Yumin told Sushun of preparations in the Inner Palace.\n      — Lin's people intend to secure approval before the council reaches agreement.\n      — Then remind them that imperial orders must undergo the established review, — Sushun replied.\n      Consideration of the petition was soon delayed, angering the imperial mother's supporters.\n\n      When disagreement reached its height, the dignitaries assembled for a final discussion. Some demanded recognition of Yixuan's right to elevate Lin; others warned that this would make the Inner Palace a separate centre of power. The imperial seal remained a symbol of legitimacy, yet its impression alone could not compel opponents to obey. Those assembled had to decide whose claims deserved support, knowing that their decision might restore harmony or divide the court beyond repair."
 qin_death_of_emperor_chain_event.17.a:0 "The Son of Heaven’s will must be obeyed. Approve the petition."
 qin_death_of_emperor_chain_event.17.b:0 "The imperial seal must not serve courtly ambitions."
 qin_death_of_emperor_chain_event.17.c:0 "First seek agreement among the princes and dignitaries."

 qin_death_of_emperor_chain_event.18.t:0 "The Will of the Son of Heaven"
 qin_death_of_emperor_chain_event.18.d:0 "      Imperial princes and senior dignitaries gathered in the audience hall. After prolonged disputes, supporters of Noble Consort Lin had secured the backing of much of the court for her participation in government. Young Emperor Yixuan's decree elevating his mother to Empress Dowager and granting her regency until he came of age was proclaimed. The dignitaries bowed, recognising the Son of Heaven's will and the new order.\n\n      Sushun remained outwardly calm, though his displeasure was plain to his closest supporters.\n      — The sovereign has made his will known, — a dignitary said. — We must carry out his command.\n      — Of course, — Sushun replied with restraint. — But let no one forget that responsibility for the empire's welfare does not rest with the Inner Palace alone.\n      Lin addressed the assembly:\n      — I do not seek to take power from my son. My duty is to preserve his throne until he can bear the burden of rule himself.\n\n      News of the regency's establishment soon spread through the court. Major decisions would henceforth be made under the Empress Dowager's supervision, while Yixuan remained the lawful Son of Heaven. Lin's victory strengthened the Inner Palace but did not end resistance. Sushun and his supporters had to recognise the new order, while hoping one day to regain their authority. Power had found a new guardian, but peace at court remained fragile."
 qin_death_of_emperor_chain_event.18.a:0 "May the Empress Dowager faithfully guard the throne!"

 qin_death_of_emperor_chain_event.19.t:0 "The Council of Regents"
 qin_death_of_emperor_chain_event.19.d:0 "      After weeks of courtly disagreement, senior dignitaries and imperial princes assembled again to resolve the regency. Noble Consort Lin's supporters had failed to secure enough backing to grant her state authority. Most present favoured a council to govern in the name of the young Emperor Yixuan. Sushun, its chief advocate, addressed them:\n      — The state needs firm authority founded on law and the teachings of the ancestors. The council will bear this burden until the Son of Heaven comes of age.\n\n      News reached Lin in her chambers. A dignitary told her that she would continue to oversee the Emperor's upbringing, while affairs of state would pass to the council.\n      — So I may care for my son, but not for the throne he inherited? — she asked coldly.\n      — Your Highness, such is the will of the majority of princes and dignitaries.\n      Meanwhile An Yumin hurried to congratulate Sushun.\n      — Order will now return to the palace, my lord.\n      — We must still preserve it, — Sushun replied. — See that the council's orders are carried out without delay.\n\n      The council's establishment secured Sushun and his supporters' influence over government. In Yixuan's name it could consider major reports, prepare decrees and direct appointments. Lin retained her position as the Emperor's mother, but her claim to participate in government was rejected. Even the council's victory could not end her influence: the young sovereign remained attached to his mother, and the Inner Palace retained supporters at court. For now, the realm rested in the hands of regents who promised to guard the throne until the Emperor came of age."
 qin_death_of_emperor_chain_event.19.a:0 "May the council guard the throne until the sovereign comes of age!"

 qin_death_of_emperor_chain_event.20.t:0 "Time to Take Power"
 qin_death_of_emperor_chain_event.20.d:0 "      Several years have passed since Emperor Yixuan inherited the throne of his father, Mianning. The young sovereign has grown considerably, mastered the foundations of Confucian teaching and shown increasing interest in affairs of state. At a meeting in the Forbidden City, senior dignitaries raised the question of the realm's future government. One senior official bowed respectfully and addressed the assembly:\n      — The sovereign can now understand the reports and reason about the empire's affairs. Is it not time to prepare him to rule independently?\n\n      The proposal prompted lively discussion. Some dignitaries reminded the assembly that Yixuan was still young and needed the advice of experienced statesmen. Others argued that prolonging the regency might weaken imperial authority. When their views were presented to the sovereign, he replied:\n      — From my earliest years I have been taught the duties of the Son of Heaven. I am grateful to those who guarded the throne, but can I forever remain a mere witness to decisions made in my name?\n\n      Yixuan's words impressed the courtiers. Despite his youth, he clearly wished to assume responsibility for governing the state. After discussion, the dignitaries agreed to prepare a ceremony marking the beginning of his independent rule. The transfer of authority had to be arranged, the senior institutions informed and a decree drafted. The regents would complete their duties while retaining the right to advise the sovereign. Thus approached the day when Yixuan would assume the full powers of the throne."
 qin_death_of_emperor_chain_event.20.a:0 "The Son of Heaven must bear the burden of governing the realm himself."

 qin_death_of_emperor_chain_event.21.t:0 "The Son of Heaven Rules in His Own Right"
 qin_death_of_emperor_chain_event.21.d:0 "      From early morning the Forbidden City prepared for a solemn ceremony. Princes of the imperial house, senior dignitaries and civil and military officials in ceremonial robes gathered in the Hall of Supreme Harmony. When Emperor Yixuan took his place on the Dragon Throne, the masters of ceremonies announced the beginning of the proceedings. After the prescribed rites, an imperial decree was read before the assembly, ending the regency and transferring full state authority to the reigning sovereign. Those present made the customary bows, affirming their loyalty to the Son of Heaven.\n\n      After the decree was read, the senior dignitaries addressed the Emperor:\n      — Your Majesty, from this day the government of the realm returns fully to your hands. We hope that the teachings of the ancestors and the advice of faithful servants will help you fulfil the duty entrusted to you by Heaven.\n      Yixuan listened and replied:\n      — I am grateful to those who guarded the throne during my minority. From this day, responsibility for the empire's fate rests with me. Let each of you continue to serve the state with the same diligence, and I shall do all I can to justify the trust of our ancestors and our people.\n\n      Following the ceremony, orders were sent throughout the provinces announcing the Emperor's independent rule. State institutions were instructed to submit the most important matters directly to Yixuan, and the former regency was declared ended. The dignitaries retained their offices and duties, but the final decision once again belonged to the Son of Heaven himself. The young sovereign's period of guardianship had ended, and the years in which he would determine the future of the great Qing dynasty had begun."
 qin_death_of_emperor_chain_event.21.a:0 "Let the will of the Son of Heaven be law throughout the realm!"



 qin_event.1.t:0 "Death of the Emperor"
 qin_event.1.d:0 "      Early in the morning, as the first rays of sunlight barely touched the roofs of the Old Summer Palace, servants carrying trays of hot tea quietly entered the private chambers. The Sovereign lay motionless beneath an old silk blanket with neat patches - his face serene, hands peacefully folded on his chest, as if he had simply fallen into a deep sleep.\n\n      One of the eunuchs cautiously approached and softly called: "Your Majesty..." - there was no reply. He touched the hand - it was already cold. Silence filled the chamber, followed by a muffled cry. The candle at the bedside had burned out long ago, and on the small table lay open scrolls bearing the Emperor's fine, careful notes. The servants fell to their knees, bowing their heads to the floor - the Emperor had quietly passed away during the night..."
 qin_event.1.a:0 "Life is fleeting..."

 qin_political_event.1.t:0 "Council in the Forbidden City"
 qin_political_event.1.d:0 "      The sun dipped behind the walls of the Forbidden City, casting a faint glow on the tiled roofs. In the throne room, where the air was thick with the scent of incense, senior ministers gathered. Emperor Daoguang sat in his place, clad in a robe trimmed with silver. His face was pale, his eyes weary but piercing.\n\n      Nergingga, tall and stern, stood foremost among the advisors. His pride was evident even in his bow—sharp, without excessive theatrics. Beside him was Li Wen’an, an official who had already proven himself as someone who saw beyond the words of decrees.\n      — 'We fight bandits and theft, trying every means to support the people,' the emperor’s voice rang out, dry but still commanding. — 'Why is the populace still discontent?' \n\n      Silence. Only the breathing of the eunuchs at the doors and the faint whisper of the wind outside.\n      — 'Your Majesty,' Nergingga began, kneeling, — 'corruption is not a disease but a part of the empire’s body. People pay for every justice, and foreigners take what they want. We can do nothing against them—their merchants live by their own rules. All because of humiliating treaties.'\n\n      Li Wen’an remained silent, but his eyes betrayed tension. He knew: if he didn’t speak now, the moment would be lost.\n      — 'In the southern provinces, a sect called the "True God" has emerged,' he said cautiously. — 'They claim the Mandate of Heaven is lost. But it’s not just them causing concern: in Peking, the influence of Shintoist preachers is already noticeable. They speak of gods interfering in the fates of emperors and rituals binding people to the forces of nature. Many residents are listening to them.'\n\n      The emperor frowned, his gaze hardening.\n      — 'This violates the principle of harmony between heaven and earth!' he said, not hiding his frustration. — 'But if we start persecuting everyone who speaks of other beliefs, it will only strengthen their influence. Other measures are needed.'\n\n      Nergingga raised his head, his voice confident:\n      — 'We must ban all foreign beliefs. Let them know: in the Qing Empire, only Confucius and Buddha are revered.'\n\n      Li Wen’an cleared his throat before speaking:\n      — 'But, Your Majesty, if we ban sects, discontent will only grow. And if the ban extends to Christianity and Shintoism, it will lead to conflicts with Europeans and Japanese. It’s better to use old methods: bribe the leaders, divide them, make them fight among themselves.'\n\n      In the shadows, by a pillar, the eunuch Jialiang closely followed the conversation. He knew: the empire already had Christian churches and places where people prayed to Japanese kami. Yet foreign religions remained outside the Forbidden City—no courtier dared mention them aloud. For now.\n\n      Daoguang slowly rose from the throne, leaning on his staff. His face grew even wearier.\n      — 'I must think,' he said quietly but firmly. — 'These matters... are too complex for one day. Leave.'\n\n      The ministers bowed to the floor, not daring to object. Eunuchs stepped forward to open the doors, and cold night air rushed into the hall.\n\n      When the last footsteps faded beyond the door, the emperor was left alone. He slowly sank onto the cushions, his eyes fixed on the carved dragon on the ceiling—a symbol of power that now seemed as fragile as paper.\n      — 'Think...' he whispered, his voice devoid of confidence or anger. Only weariness."
 qin_political_event.1.a:0 "Shadows gather over the empire..."

 qin_political_event.2.t:0 "Reflections by the Fire"
 qin_political_event.2.d:0 "      Night fell over the Forbidden City, heavy as a silk curtain. In his chambers of carved wood, draped with thick woolen carpets, Emperor Daoguang sat alone. His face, worn by illness, reflected the shadows of past and future. Before him, on a bronze brazier, embers burned low, spreading the scent of incense and ash. In his hand, he held a yellow scroll—a report of uprisings in Hunan.\n\n      'Peasants rob officials, and officials rob peasants. Europeans and Japanese take what they want without truly paying. Sects whisper of a lost Mandate of Heaven...' he thought, staring into the fire.\n\n      'Yizhu is gentle as an autumn breeze. He knows how to listen, but can he hold the empire together if the rebellion spreads beyond the southern provinces?'\n\n      'Yixin is a warrior, like a sword in its sheath. But his sword has long rested in the hands of those who whisper, "Why isn’t Yixin the heir?"'\n\n      'Yixuan… A child. Only ten. Yet many courtiers say his name is like a flame in the dark. But what then of the empire?'\n\n      The silence was broken by the creak of a door. Jialiang, the senior eunuch, entered noiselessly, like a shadow. He bowed, kneeling, and spoke in a soft, almost feminine voice:\n\n      — 'Your Majesty, may I speak?'\n\n      Daoguang didn’t answer immediately. He slowly rolled up the scroll, placed it on the table, and then nodded.\n\n      — 'Speak.'\n\n      — 'Your Majesty, there is whispering in Peking. They say your son Yizhu cannot weather the storm. They say Yixin is too dangerous for the throne. And Yixuan...' (a pause) 'He’s still a child, but his name is like a flame in the dark.'\n\n      The emperor frowned.\n\n      — 'Are you saying a child can hold the empire?'\n\n      Jialiang gave a faint smile, hiding it in the folds of his silk robes.\n\n      — 'Your Majesty, sometimes a child is the best shield. While he is young, his name does not frighten but unites. And those who stand behind him...' (another pause) '...they will ensure stability.'\n\n      — 'You mean those who stand behind him?' Daoguang’s voice was quiet but piercing.\n\n      — 'I mean those who see the empire as a temple: if the stones do not hold together, the roof will collapse.'\n\n      Daoguang stood, leaning on his staff. His gaze fell on the dragon carved on the wall—a symbol of unity, strength, and solitude.\n\n      — 'You speak like a sage but act like a spider weaving a web.'\n\n      Jialiang bowed lower:\n\n      — 'Your Majesty, if you reject Yixuan, whom will you entrust with the throne? Yizhu? But he is too gentle. Yixin? But his warriors already whisper of a new order. And the empire... the empire does not tolerate weakness.'\n\n      — 'You fear a war within the family?' the emperor asked.\n\n      — 'I fear a war within the empire,' the eunuch replied softly.\n\n      A long silence. The fire in the brazier died, leaving only glowing embers.\n\n      — 'Jialiang, go,' Daoguang finally said. — 'I need to think.'\n\n      The eunuch retreated backward, vanishing like a ghost.\n\n      The emperor remained alone. His hands, gripping the staff, trembled. He thought of each son, each advisor, each decree he had written...\n\n      The wind outside grew stronger."
 qin_political_event.2.a:0 "There is sense in Jialiang’s words."
 qin_political_event.2.b:0 "What if no one can handle it?"

 qin_political_event.3.t:0 "The Emperor’s Sons"
 qin_political_event.3.d:0 "      In the Forbidden City, every step, every glance, every word around the throne becomes part of an intrigue. Emperor Daoguang, feeling the approach of his end, must balance tradition, strength, and the possibility of compromise. Before him are three sons, three paths, three fates that will decide the future of the Qing.\n\n      Yizhu, the eldest son, embodies continuity. His education and gentleness make him the natural candidate. Confucian officials see him as a pillar of order, but they fear his kindness could turn to weakness in the face of rebellions and foreigners. His entourage is already dividing power, turning the heir into a symbol behind which others’ ambitions hide.\n\n      Yixin is a warrior to his core. His reforms in the Forbidden City’s garrison inspire officers, but the army beyond the walls weakens. Peasants flee from recruiters, commanders steal from the treasury. His strength is frightening: supporters whisper that he has long been worthy of the throne. But even his allies know—strength can save the empire or destroy it if the direction is unclear.\n\n      Yixuan, a ten-year-old child, does not yet know his name has become a key to regency. Noble Consort Lin, his mother, and Su Shun see him as a 'neutral choice.' Behind him stand eunuchs and part of the aristocracy, but their eyes burn not with childish innocence but with calculated coldness. The regency, unspoken but contemplated, could be salvation or the beginning of the end.\n\n      Three sons, three paths, three factions pulling the strings. Yizhu is legitimacy, but his gentleness raises concerns. Yixin is a sword ready to defend, but a sword can wound its wielder. Yixuan is a child behind whom adult games are played. There is no unity in the palace: eunuchs whisper with officials, officials watch the military, and the military awaits a signal. Emperor Daoguang knows: his decision will not only choose an heir but test the very empire."
 qin_political_event.3.a:0 "And who will the choice fall upon?"

 qin_political_event.4.t:0 "A Gifted Prince"
 qin_political_event.4.d:0 "      The highest dignitaries had gathered in a hall of the imperial palace in the Forbidden City to discuss the affairs of the imperial family. Emperor Mianning sat before a small table covered with reports, silently studying those assembled. Nergingge was the first to speak, respectfully bowing his head:\n      — Your Majesty, Prince Yizhu has reached an age at which his merits may be judged. He respects his elders, is diligent in his studies and faithfully follows the teachings of the ancestors. He is the eldest of your surviving sons, and many therefore consider him the most worthy of the throne.\n\n      The Emperor turned to Li Wen'an, who had remained silent until then.\n      — Tell me, do you share this opinion?\n      — Sire, — the official replied cautiously, — the prince's virtue is beyond doubt. Yet good conduct alone does not prove an ability to govern the realm. Affairs of state require resolve, and Yizhu sometimes relies too heavily on the counsel of others.\n      Nergingge frowned:\n      — Is caution worthy of reproach? Better a sovereign who listens to wise advisers than one whose haste endangers the whole empire.\n\n      — Resolve, you say... — Mianning murmured, speaking more to himself than to his advisers. He remembered the confidence with which he had once taken up the affairs of state, believing that a firm will was enough to overcome any difficulty. Yixin reminded him of his younger self: just as energetic and inquisitive, just as convinced of the power of his own mind. But would that confidence become wilfulness once the prince held the full power of the throne? And yet the realm needed men who could see beyond familiar teachings. The Emperor rose and walked to the window. Beyond the palace walls stretched a vast empire, whose fate would one day rest in the hands of one of his sons."
 qin_political_event.4.a:0 "Yizhu possesses virtues worthy of a future Son of Heaven."
 qin_political_event.4.b:0 "Filial respect is worthy of praise, but the throne demands more."

 qin_political_event.5.t:0 "Inspection of the Palace Guard"
 qin_political_event.5.d:0 "      From early morning, officers' commands and the measured tread of soldiers echoed through the inner courtyard of the Forbidden City. By Emperor Mianning's order, units of the palace guard were being inspected under the direction of Prince Yixin. Banner soldiers armed with spears, sabres and muskets stood along the stone paths. When the Emperor appeared with his dignitaries, the prince stepped forward, bowed respectfully and reported:\n      — Your Majesty, the guards are assembled and ready to carry out your command. Permit us to begin the inspection.\n\n      At Yixin's signal, the officers gave their orders and the soldiers began their drills. The prince watched the ranks closely, noting mistakes and demanding their immediate correction. His confidence impressed the commanders present.\n      — The prince shows remarkable diligence, — one commander observed. — He understands military order and knows how to command obedience.\n      Nergingge, standing beside the Emperor, replied with restraint:\n      — Directing a palace inspection is not the same as leading troops against an enemy. Yet we must acknowledge that the prince has performed his duty well.\n\n      When the inspection ended, Mianning summoned his son and briefly praised his efforts. Yixin bowed, concealing his satisfaction, while the assembled officers exchanged approving glances. The Emperor noticed their regard for the prince and reflected on what such support might mean. In troubled times, the loyalty of the troops could uphold the throne, but excessive military influence could bring the state as much trouble as disobedience. The sovereign had to decide whether to encourage Yixin's abilities by entrusting him with new duties, or simply acknowledge his success."
 qin_political_event.5.a:0 "Yixin has earned the soldiers' trust. Let us entrust him with new duties."
 qin_political_event.5.b:0 "The inspection was well conducted. Let the prince continue his studies."

 qin_political_event.6.t:0 "A Worthy Successor"
 qin_political_event.6.d:0 "      The highest dignitaries had gathered in a hall of the imperial palace in the Forbidden City to discuss the affairs of the imperial family. Emperor Mianning sat before a small table covered with reports, silently studying those assembled. Nergingge was the first to speak, respectfully bowing his head:\n      — Your Majesty, Prince Yizhu has reached an age at which his merits may be judged. He respects his elders, is diligent in his studies and faithfully follows the teachings of the ancestors. He is the eldest of your surviving sons, and many therefore consider him the most worthy of the throne.\n\n      The Emperor turned to Li Wen'an, who had remained silent until then.\n      — Tell me, do you share this opinion?\n      — Sire, — the official replied cautiously, — the prince's virtue is beyond doubt. Yet good conduct alone does not prove an ability to govern the realm. Affairs of state require resolve, and Yizhu sometimes relies too heavily on the counsel of others.\n      Nergingge frowned:\n      — Is caution worthy of reproach? Better a sovereign who listens to wise advisers than one whose haste endangers the whole empire.\n\n      Nergingge's words reminded the Emperor of the first years of his own reign. Then he had still believed that the teachings of the ancestors and the integrity of his officials could protect the realm from any upheaval. But the years had shown him how heavy the burden of power could be. Yizhu possessed qualities Mianning sincerely valued in his son, but were they enough for a future sovereign? Perhaps his caution would ensure a wise reign; perhaps it would allow the dignitaries to conduct affairs of state as they pleased. The Emperor looked closely at Nergingge, who awaited an answer, confident in his arguments. But Mianning knew that inheriting the throne and being worthy of it were far from one and the same."
 qin_political_event.6.a:0 "Yizhu possesses virtues worthy of a future Son of Heaven."
 qin_political_event.6.b:0 "Filial respect is worthy of praise, but the throne demands more."

 qin_political_event.7.t:0 "The Voice of the Senior Dignitaries"
 qin_political_event.7.d:0 "      In the imperial audience hall, senior dignitaries gathered at Mianning's invitation to discuss the future of the dynasty. The sovereign had long noticed the differing opinions among his courtiers concerning his sons and wished to hear their arguments himself. Nergingge spoke first, respectfully kneeling:\n      — Your Majesty, Prince Yizhu is the eldest of your surviving sons. His virtue and respectfulness are known throughout the court. I believe he can preserve order and continue the glorious traditions of our ancestors.\n      Having heard the dignitary, Li Wen'an cautiously objected:\n      — Yizhu's virtues are beyond doubt, but the state needs a ruler capable of decisive action. Prince Yixin has a sharp mind and enjoys the respect of the military. His abilities may prove especially valuable in the present circumstances.\n      — But should we dismiss the younger prince? — a member of the imperial family interjected. — Yixuan is still a child, but wise mentors can raise him to be a worthy sovereign. Until he comes of age, faithful dignitaries will govern the realm.\n      — Or rule in his stead, — Nergingge observed dryly.\n\n      Mianning raised his hand, calling the assembly to silence. Each adviser had made reasonable arguments, but the sovereign understood that their speeches concealed not only concern for the dynasty, but their own interests. Yizhu promised continuity; Yixin, an active reign; and Yixuan would allow experienced dignitaries to govern until he came of age. Yet to which of them could the fate of the realm truly be entrusted? The Emperor slowly surveyed those present. They did not yet expect him to name an heir, but at least a sign of favour that might alter the balance of power at court."
 qin_political_event.7.a:0 "Yizhu is the eldest of my sons and deserves special consideration."
 qin_political_event.7.b:0 "Yixin's abilities deserve our recognition."
 qin_political_event.7.c:0 "We must not forget young Yixuan and his future."
 qin_political_event.7.e:0 "My sons are equal before me. Let time decide."

 qin_political_event.8.t:0 "The Young Son of Heaven"
 qin_political_event.8.d:0 "      In a hall of the Inner Palace, Emperor Mianning received several trusted dignitaries to discuss the future of the younger princes. The conversation turned to Yixuan, whose upbringing was a particular concern of his mother, Noble Consort Lin. A member of the imperial family bowed respectfully and spoke:\n      — Your Majesty, Prince Yixuan is still young, but he is obedient and diligent. With proper guidance, he may grow into a worthy sovereign. Some of your ancestors also ascended the throne at an early age, and their reigns were not denied Heaven's blessing.\n\n      Nergingge listened and expressed his doubts:\n      — Sire, the young prince cannot govern the realm himself. Until he comes of age, power must pass to regents, and there will be dignitaries eager to take advantage of the situation.\n      — But can the throne's faithful servants not protect a young ruler? — another courtier objected. — Experienced advisers will preserve order until the sovereign reaches maturity.\n      — And who will guarantee that those advisers will not rule for their own gain? — Nergingge replied dryly.\n\n      Silence fell over the hall. Mianning understood all too well that the proposal to place a young prince on the throne concealed a far more dangerous question: who would govern the realm in his name? Today the dignitaries assured their sovereign of their loyalty, but would they remain faithful when no one could call them to account? The Emperor thought of Noble Consort Lin and her sincere concern for her son's future, and wondered whether she might one day be drawn into a struggle for power. Yixuan knew nothing yet of the courtiers' ambitions or the burden of state. Perhaps that was his advantage: the young sovereign could be raised to become a worthy ruler. Yet Mianning feared that by the time his son learned to govern, power would already belong to others."
 qin_political_event.8.a:0 "Under the watch of faithful dignitaries, Yixuan will grow into a worthy Son of Heaven."
 qin_political_event.8.b:0 "The throne must not depend on the will of regents."

 qin_political_event.9.t:0 "Disputes in the Grand Council"
 qin_political_event.9.d:0 "      The Grand Council met in a hall of the Forbidden City. Reports on the provinces, military expenditures and abuses by local officials lay before Emperor Mianning. As the discussion wore on, the dignitaries disagreed over what should be done.\n      — Your Majesty, — Li Wen'an said, — the old orders have failed to bring the desired results. We need men able not merely to follow established rules, but to remedy their shortcomings.\n      Nergingge shook his head.\n      — The trouble lies not in the rules, Sire, but in those who neglect their duties. We should enforce the laws, not seek new arrangements.\n\n      — But who can carry out the necessary changes? — Li Wen'an replied. — Prince Yixin has shown an interest in affairs of state. His judgement and resolve have earned the respect of military commanders. Perhaps he should be given more opportunity to show his abilities.\n      — He is still too young to judge such matters, — Nergingge observed dryly.\n\n      Mianning silently leafed through the reports. Repeating old orders was no longer enough, yet he feared entrusting important affairs to those without experience. Yixin had shown ability, but the support of commanders and dignitaries might make him overconfident. Should the young prince be allowed to test himself in affairs of state, or restrained from premature involvement?"
 qin_political_event.9.a:0 "Yixin should be given the chance to show his abilities."
 qin_political_event.9.b:0 "Let the prince study state affairs under experienced dignitaries."
 qin_political_event.9.c:0 "The Grand Council should attend to its duties, not advance princes."

 qin_political_event.10.t:0 "Behind the Walls of the Inner Palace"
 qin_political_event.10.d:0 "      The Inner Palace followed customs hidden from most imperial dignitaries. Among the consorts’ chambers and the eunuchs’ quarters, news sometimes travelled faster than beyond the walls of the Grand Council. Of late Prince Yixuan’s name had been heard ever more often. Noble Consort Lin’s attendants praised his diligence and attention to his tutors. When word reached Emperor Mianning, he summoned a senior palace servant.\n      — Tell me, why is Yixuan’s name mentioned so often in the palace?\n      The servant knelt, afraid to raise his eyes.\n      — Your Majesty, Noble Consort Lin merely cares for her son’s future. Her attendants believe the prince deserves more of your attention.\n      — Do my other sons lack merit? — the Emperor asked with a frown.\n      — Certainly not, Sire! Yet some believe the young prince could become a worthy heir with proper guidance.\n      Nergingge intervened cautiously.\n      — Such talk is dangerous, Your Majesty. Today the servants praise the prince; tomorrow they may decide who should take the throne.\n\n      The Emperor dismissed the servant and left the dignitary at the door. He did not doubt Lin’s sincere concern for her son, but knew courtiers could turn even a mother’s love to their own advantage. Harsh punishment, however, might breed resentment within the imperial family. Order must be kept behind palace doors without letting suspicion destroy family ties. The sovereign had to decide how far the influence of Lin’s circle should extend."
 qin_political_event.10.a:0 "Noble Consort Lin has every right to care for her son’s future."
 qin_political_event.10.b:0 "Let the prince continue his studies, but the palace gossip must cease."
 qin_political_event.10.c:0 "Stop these intrigues. The Inner Palace must not interfere with the throne."

 qin_political_event.11.t:0 "A Conversation with Sushun"
 qin_political_event.11.d:0 "      Late one evening Emperor Mianning received Sushun, a member of the imperial family whose views on court affairs had caught his attention. Rivalry between the princes’ supporters was growing, and the sovereign wished to hear someone outside the closest circles of the possible heirs.\n      — I hear the dignitaries speak increasingly of my sons, — the Emperor said. — Do affairs of state leave them so much leisure?\n      Sushun bowed.\n      — Your Majesty, servants of the throne care for the dynasty’s future. Yet not all remember that loyalty to the sovereign must stand above personal attachments.\n      — And whom do you favour?\n      — The merits of your sons are known throughout the court. The danger lies not in the princes, but in those who seek advancement through them. Today they promise loyalty; tomorrow they may demand a reward.\n      — Do you suggest I distrust my own dignitaries?\n      — Only remember, Your Majesty, that power must remain with the Son of Heaven. Whoever inherits the throne, his attendants must serve the state, not command it.\n\n      Sushun’s candour surprised Mianning. His words showed knowledge of courtly ways, but also an ambition to gain a more prominent place among the imperial family. Such a man might restrain powerful dignitaries, though his own ambitions were troubling. The Emperor considered giving Sushun a role in state affairs to test his ability and loyalty; yet advancing another courtier might only complicate the struggle he sought to control."
 qin_political_event.11.a:0 "The throne needs such men. Give Sushun new duties."
 qin_political_event.11.b:0 "His warning is sound. We should observe him more closely."
 qin_political_event.11.c:0 "Sushun speaks too readily of the ambitions of others."

 qin_political_event.12.t:0 "A Mother’s Petition"
 qin_political_event.12.d:0 "      One day Noble Consort Lin requested a private audience with Emperor Mianning. He received her in his chambers, where she observed the proper ceremony and spoke of the upbringing of their son Yixuan, who, she said, was diligent in his studies and eager to follow his elders’ guidance.\n      — Your Majesty, — Lin said with a respectful bow, — our son is growing and needs worthy tutors. I ask only that special care be given to his education, so that he may become a man of service to the imperial house.\n      — You wish your son well, — Mianning replied, — but are his present teachers not diligent enough?\n      — Sire, I dare not question their merits. Yet Yixuan is young, and much depends on those who guide him. Allow the most worthy men to be entrusted with his instruction.\n      — I hear some of your attendants already foresee a great future for him.\n      Lin lowered her eyes.\n      — A mother may hope for the sovereign’s favour towards her child. But I do not wish my hopes to cause discord.\n\n      Long after she left, Mianning reflected on her words. There was nothing improper in her request: all his sons needed a good education. Yet special favour would attract new supporters to Yixuan, who might mistake concern for his studies as a sign of future advancement. The Emperor understood Lin’s hopes, but did not wish the princes’ education to become a matter of court rivalry. Should he grant her request or preserve the present arrangements?"
 qin_political_event.12.a:0 "Yixuan deserves the best tutors. Grant Noble Consort Lin’s request."
 qin_political_event.12.b:0 "Improve his studies, but grant him no special advantage over his brothers."
 qin_political_event.12.c:0 "His present education is sufficient. We should not single out one son."

 qin_political_event.13.t:0 "Time to Choose an Heir"
 qin_political_event.13.d:0 "      Evening silence descended upon the Forbidden City. In his chambers, Emperor Mianning sat before a table piled with reports and petitions. For months the court dignitaries had raised the question of succession with increasing urgency, arguing in favour of different princes. The sovereign had listened carefully, but had not hastened to declare his will. Now, feeling his strength gradually leave him, he understood that further delay could cause dangerous discord within the imperial family.\n\n      — Your Majesty, — Nergingge began cautiously at his evening audience, — uncertainty troubles the dignitaries. Many fear that, after your passing, rivalry between the princes' supporters will disturb the peace of the realm.\n      — I know of their fears, — Mianning replied. — Yizhu is respectful and prudent, Yixin possesses a sharp mind and resolve, and young Yixuan may yet be raised to become a worthy ruler. But none of them is without faults.\n      — Only the sovereign can decide who shall continue the rule of the great dynasty, — the dignitary said, bowing. — We shall carry out your will.\n\n      When Nergingge departed, the Emperor was left alone. Before him lay a clean sheet of paper; beside it stood a box containing the imperial seal. Mianning slowly took up his brush, but paused for a moment. His decision would determine the fate not only of his sons, but of millions of subjects. Yizhu's virtue promised continuity, Yixin's abilities offered hope of strengthening the state, and Yixuan's youth presented a chance to raise a ruler under the guidance of faithful dignitaries. Yet a choice had to be made. The sovereign bent over the paper, preparing to write the name of the future Son of Heaven in his own hand."
 qin_political_event.13.a:0 "Yizhu will carry on the work of our ancestors and preserve order in the realm."
 qin_political_event.13.b:0 "Yixin possesses the abilities a future sovereign needs."
 qin_political_event.13.c:0 "Yixuan shall inherit the throne, guided in his youth by faithful dignitaries."





