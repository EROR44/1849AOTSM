 #FOCUSES
 QIN_center_of_earth_and_others_desc:0 "The Middle Kingdom has long regarded itself as the centre of the world, but defeat in the Tea War and the war with Japan has revealed how its position has changed. The court must reassess its relations with neighbours and overseas powers, protect trade routes and restore the empire’s influence."
 QIN_aisin_gioro_ichzhu_desc:0 "Yizhu ascends the throne amid mourning for the late Emperor. His respect for ancestral teachings reassures the dignitaries, yet the exhausted realm needs more than a guardian of tradition. Before addressing its troubles, the new sovereign must reconcile the court and establish his authority."
 QIN_make_peace_with_isin_desc:0 "Yixin has a sharp mind and enjoys the regard of military men. Ignoring his disappointment would give the court a fresh cause for division. Yizhu will offer his brother a worthy place and seek to turn their rivalry to the dynasty’s advantage."
 QIN_counteract_empress_supporters_ichzhu_desc:0 "Noble Consort Lin’s circle still hopes to advance Yixuan. Open hostility towards the imperial family would only strengthen its supporters. The court should carefully limit their influence while showing respect to the young prince’s mother and preventing fresh intrigues."
 QIN_meeting_with_isuan_ichzhu_desc:0 "Young Yixuan is too young to answer for the hopes courtiers place in him. A meeting between the brothers can reassure the prince of imperial favour and shield him from others’ designs. Family harmony will deny malcontents a convenient banner for palace disputes."
 QIN_counteract_council_supporters_ichzhu_desc:0 "Some dignitaries would rather see power in the hands of a council free to act without the young Emperor. Their experience is valuable, but the throne cannot be a cover for another’s will. Yizhu must win over moderates and resist attempts to seize his authority."
 QIN_strengthen_emperor_authority_ichzhu_desc:0 "A sovereign’s virtue cannot bring peace if his decrees go unheeded. Yizhu must establish orderly reporting, secure the support of loyal dignitaries and remind the viceroys of their duty. Authority inherited from the ancestors requires care as well as resolve."
 QIN_remove_unloyal_officials_ichzhu_desc:0 "Behind respectful bows often lies loyalty to a patron rather than the throne. A review of appointments and reports will reveal officials who obstruct the sovereign’s will. With reliable men in their places, the court can turn its attention to the needs of the empire."
 QIN_time_for_phoenix_to_spread_its_wings_desc:0 "The disputes within the palace are subsiding, allowing Yizhu to turn to the affairs of the whole realm. It is time to heal the wounds of war and failed reforms, restore trust in the throne and offer the empire hope of renewal. Let the phoenix spread its wings over Qing."
 QIN_aisin_gioro_isin_desc:0 "The choice has fallen on Yixin. The energetic prince takes the throne after defeats and internal disputes have exhausted the empire, while courtiers still argue over its future. His resolve can strengthen the dynasty if he unites his family and prevents rivalry from dividing the court."
 QIN_make_peace_with_ichzhu_desc:0 "Yizhu, the elder brother, enjoyed the support of many dignitaries and had good reason to hope for the throne. Yixin should respect his position and offer reconciliation. Harmony between the brothers will weaken court factions and build trust in the new sovereign."
 QIN_counteract_empress_supporters_isin_desc:0 "Noble Consort Lin’s supporters have not abandoned their hopes for her young son. Left unchecked, her court connections could become a centre of opposition. Yixin must limit the faction’s influence without turning a family dispute into an open rift."
 QIN_meeting_with_isuan_isin_desc:0 "The Emperor’s younger brother has become the centre of a struggle he is not yet old enough to understand. A personal meeting will let Yixin learn his needs and assure him of the throne’s care. A secure future will make the prince harder for courtiers to exploit."
 QIN_counteract_council_supporters_isin_desc:0 "Supporters of a council fear an active sovereign unwilling to leave decisions in others’ hands. They may seek allies among officials and princes dissatisfied with the new order. Yixin must ease their fears where possible and resist attempts to constrain the throne."
 QIN_strengthen_emperor_authority_isin_desc:0 "The Emperor’s resolve must be matched by faithful execution of his orders. Yixin will strengthen ties between the throne, ministries and military commanders so that court disputes do not paralyse government. The realm needs a sovereign whose decrees are carried out."
 QIN_remove_unloyal_officials_isin_desc:0 "Not every official serves the new sovereign as diligently as his reports claim. Delayed decrees and secret ties to opponents weaken the empire. Yixin will review appointments and remove those who place personal allegiances above duty to the throne."
 QIN_time_for_dragon_to_wake_up_desc:0 "Yixin has secured his position and kept the court from open division. Beyond the palace walls, however, the empire faces the consequences of defeat, popular discontent and foreign pressure. The energy of the new reign must now be directed towards protecting and restoring the realm."
 QIN_regency_council_desc:0 "Young Yixuan occupies the throne but cannot govern the empire himself. While the Son of Heaven grows to maturity, affairs of state rest with a council of dignitaries. Its members promise to preserve order and protect the dynasty, though the court fears temporary authority may become permanent."
 QIN_pacify_consort_lin_desc:0 "The young sovereign’s mother will not remain indifferent to her son’s fate and listens to her own advisers. The council must assure Lin of Yixuan’s safety while limiting her ability to intervene in government. A mother’s concern must not become a struggle over decrees."
 QIN_suppress_ichzhu_supporters_council_desc:0 "Yizhu’s supporters believe the elder prince would provide steadier rule. As long as they retain connections in the ministries, any dispute within the council may invite a challenge to the succession. The regents must weaken the faction and prevent open disobedience."
 QIN_pacify_isuan_desc:0 "Though Yixuan is still young, people eager to speak in the sovereign’s name gather around him. The council must protect him from dangerous advice, provide a fitting education and explain the need for a regency. Trust between palace and council will leave less room for discord."
 QIN_suppress_isin_supporters_council_desc:0 "Yixin is respected by military men and officials who doubt the need for a regency. If the council allows the dissatisfied to unite around the prince, its decisions will be threatened. His supporters’ influence must be curbed without driving them into open rebellion."
 QIN_strengthen_council_positions_desc:0 "To govern a vast empire, the council needs more than seals and decrees: it needs the confidence of the ministries and agreement among the regents. Clear duties and loyal dignitaries will help carry its decisions into effect while the young Emperor prepares to rule."
 QIN_eliminate_unloyal_officials_desc:0 "Officials remain in the offices who are willing to pass information to the council’s opponents and delay its orders. The regents must review appointments and remove unreliable servants so that government can continue while the young sovereign is unable to rule alone."
 QIN_sun_rises_over_jade_palace_council_desc:0 "The council has retained control and compelled the court factions to recognise the new order. Yet quiet in the palace does not mean peace in the empire: the treasury is strained and discontent grows in the provinces. The regents must prove they can preserve the realm for the young Son of Heaven."
 QIN_widow_empress_desc:0 "Yixuan is still a child, and his mother has taken the decisive role in the struggle to govern in his name. Empress Dowager Lin intends to protect her son and the throne from court rivals. Her position remains precarious as dignitaries and princes seek to constrain the new regent."
 QIN_suppress_sushun_and_his_supporters_desc:0 "Sushun and his supporters hoped to exercise power at the young sovereign’s court on their own terms. While their connections in the capital endure, the Dowager’s position remains insecure. Lin must deprive the faction of its support before it can move against her."
 QIN_suppress_ichzhu_supporters_empress_desc:0 "To some officials, Yizhu remains the preferred heir and Lin’s regency a temporary obstacle. Their discussions undermine the young Emperor and encourage the dissatisfied. The Dowager must curb the faction’s influence and protect her son’s claim to the throne."
 QIN_encourage_isuan_desc:0 "The struggle at court has placed a heavy burden on young Yixuan. Lin must care for her son, find worthy tutors and help him gain confidence in his position. One day the Emperor must make decisions of his own, and his preparation should begin now."
 QIN_suppress_isin_supporters_empress_desc:0 "Yixin and his supporters retain influence among courtiers and military men who distrust the regent’s authority. The Dowager must separate moderates from the prince’s most uncompromising advisers and prevent her rivals from claiming to speak for the whole imperial family."
 QIN_strengthen_empress_positions_desc:0 "Having protected her son from his closest rivals, Lin must build confidence in her regency. She needs the support of dignitaries, reliable ties to the ministries and respect for established rites. Only then will palace orders be carried out in the capital and distant provinces alike."
 QIN_calm_down_unloyal_officials_desc:0 "Not every official who doubts the regency is ready to oppose the throne. Some can be reassured about Yixuan’s future, others reminded of their duties. Those who deliberately obstruct government and support intrigue, however, must be removed from public affairs."
 QIN_sun_rises_over_jade_palace_empress_desc:0 "The Empress Dowager has secured her position and given her son time to grow. The court must now address the needs of a realm weakened by wars and failed reforms. Lin must show that her regency can preserve the empire as well as protect the throne."

 QIN_audience_at_taihedian_hall_desc:0 "The highest dignitaries of the empire will gather beneath the roof of Taihedian to report the troubles facing the realm. The treasury is strained, unrest grows in the provinces, and foreign powers press for further concessions. Each adviser sees the cause of these misfortunes differently and offers a remedy of his own. Emperor Mianning must hear their arguments and decide how to preserve order without exposing the empire to still greater upheaval."
 QIN_meeting_with_isin_supporters_desc:0 "Prince Yixin has earned the respect of many courtiers through his sharp mind, diligence and resolve. His supporters believe that the realm needs such a sovereign in troubled times. Yet the Emperor fears that firmness may become wilfulness, while the favour of military men could deepen divisions at court. Before judging his son’s abilities, Mianning intends to hear the dignitaries and weigh the arguments they bring before him."
 QIN_army_review_desc:0 "Preparations are underway in the inner courtyard of the Forbidden City for an inspection of the palace guard. The Emperor has entrusted Prince Yixin with directing the formations and drills, hoping to judge his diligence and command for himself. Officers watch the young prince closely, while dignitaries debate the meaning of the honours granted to him. A successful inspection could strengthen trust in Yixin, but his closeness to the military calls for caution."
 QIN_meeting_with_ichzhu_supporters_desc:0 "Prince Yizhu, the Emperor’s eldest surviving son, is known for his respectfulness and diligence in study. Many dignitaries see him as a worthy successor to the dynasty and a guardian of ancestral teachings. Others doubt whether he has the resolve to govern in troubled times. Mianning has summoned his trusted advisers to hear their opinions and consider whether his son’s caution will bring wisdom or allow courtiers to govern in his name."
 QIN_dialogue_with_advisors_desc:0 "The dynasty’s future is increasingly the subject of cautious conversations at court. Yizhu’s supporters praise his virtue, Yixin’s backers place their hopes in his abilities, and other dignitaries look towards young Yixuan. The Emperor has invited his senior advisers to present their arguments openly. Behind their concern for the realm may lie personal ambitions, and even a single word from the sovereign could alter the balance of power in the Forbidden City."
 QIN_dialogue_with_yixuans_supporters_desc:0 "Some members of the imperial family believe that young Yixuan may become a worthy sovereign if wise mentors guide his education. Yet until the prince comes of age, the realm must inevitably be governed by regents. Will they remain faithful to the throne, or turn their authority to their own advantage? Mianning intends to hear both his younger son’s supporters and those who fear a struggle for influence during a minority."
 QIN_sun_setting_behind_western_hills_desc:0 "Emperor Mianning’s health is failing, and the hour feared throughout the Forbidden City draws near. Dignitaries debate the princes’ merits, courtiers listen for every word from the sovereign, and the future of the dynasty hangs upon his decision. As the realm faces unrest at home and demands from foreign powers, the Emperor must meet the final days of his reign and leave his heirs an empire in need of a steady hand."

 QIN_western_direction:0 "Western Policy"
 QIN_western_direction_desc:0 "Defeats in the Tea War and the war with Japan weaken the empire's position in the east. The khanates' markets and the roads to India remain open in the west. These ties must also be developed to expand trade and secure the borders without further concessions to European powers."
 QIN_persian_civil_war:0 "The Afghan Civil War"
 QIN_persian_civil_war_desc:0 "Civil war is raging in Afghanistan, where the government, pro-Rhomean forces and the Islamic minority struggle for power. The court must assess their strength and choose the side whose cooperation will bring China the greatest benefits."
 QIN_support_intervention_to_afghanistan:0 "Support Intervention in Afghanistan"
 QIN_support_intervention_to_afghanistan_desc:0 "Backing the Rhomean side in the Afghan war promises commercial benefits for China. Long-standing ties with the Rhomean Company provide a basis for an agreement. Its intervention should be supported in return for protection for merchants and access to western trade routes."
 QIN_guarantee_safe_trade:0 "Guarantee Safe Trade in the Rhomean Trading Company's Lands"
 QIN_guarantee_safe_trade_desc:0 "Cooperation with the Rhomean Company requires protection for Chinese merchants in its lands. Agreements must cover the security of caravans and warehouses, customs duties and compensation for losses. Existing ties should benefit both sides."
 QIN_trade_through_port_of_patalanoupolis:0 "Trade through the Port of Patalanoupolis"
 QIN_trade_through_port_of_patalanoupolis_desc:0 "Patalanoupolis gives Chinese merchants access to markets in the Rhomean Company's lands. Agreements are needed on warehouses, port dues and freight. Silk, tea and porcelain will find new buyers, while trade will bring much-needed silver into the treasury."
 QIN_support_afghanistan:0 "Support Afghanistan"
 QIN_support_afghanistan_desc:0 "The Afghan government faces forces backed by the Rhomeans. Supporting it offers a means to limit the company's influence and preserve an independent partner. Kabul should be offered assistance in return for caravan protection and favourable terms of trade."
 QIN_path_pekin_kabul:0 "The Peking–Kabul Route"
 QIN_path_pekin_kabul_desc:0 "Support for Kabul must be backed by a permanent route. Caravans through the western lands will link Chinese markets with Afghanistan. Mountain passes must be mapped, stopping places established and customs duties agreed upon to make the long journey profitable for merchants."
 QIN_expansion_of_trade_in_ports_of_balochistan:0 "Expand Trade in Balochistan's Ports"
 QIN_expansion_of_trade_in_ports_of_balochistan_desc:0 "Balochistan's harbours offer access to sea routes without relying on middlemen. Ties with Kabul make it possible to expand trade in this direction. Agreements with local authorities on warehouse protection and customs duties will help Chinese goods reach the coast."
 QIN_dialogue_with_dalai_lama:0 "Dialogue with the Dalai Lama"
 QIN_dialogue_with_dalai_lama_desc:0 "Under Kangxi, ties with Lhasa were strengthened through military force and patronage of Buddhism. Tibet's return to imperial rule must now be discussed with the Dalai Lama. Respect for faith and local customs will help secure an agreement and avoid another mountain campaign."
 QIN_returnment_by_force:0 "Return by Force"
 QIN_returnment_by_force_desc:0 "Talks with Lhasa are failing to produce the desired result. Tibet must be brought back by force of arms, as it was under Kangxi. Troops need reliable supplies along the mountain roads. Protecting monasteries and forbidding looting will help prevent resistance from the inhabitants."
 QIN_returnment_by_will:0 "Voluntary Return"
 QIN_returnment_by_will_desc:0 "Lhasa is offered recognition of imperial authority in return for preserving its religious institutions and customs. The terms and each side's duties must be set down in writing. Tibet's voluntary return will secure the western borders without a costly mountain campaign."
 QIN_status_of_tibet:0 "The Status of Tibet"
 QIN_status_of_tibet_desc:0 "Tibet's return requires clear rules of government. The rights of the Dalai Lama, the duties of local authorities and the powers of imperial representatives must be defined. Agreed rules for taxation and garrison upkeep will help preserve peace and defend the borders."
 QIN_establish_dialogue_with_central_asia:0 "Open Dialogue with Central Asia"
 QIN_establish_dialogue_with_central_asia_desc:0 "The khanates of Central Asia link China's western frontier with foreign markets. Relations with these neighbours require care after Qianlong's campaigns. Envoys should be exchanged to discuss trade, road security and disputes along the shared border, building mutual trust."
 QIN_expand_trade_with_region:0 "Expand Trade with the Region"
 QIN_expand_trade_with_region_desc:0 "Chinese goods reach the khanates' markets along old trade routes. This exchange must be expanded through agreements on customs duties and merchant protection. Overland trade will provide income after the losses in the east and reduce dependence on European middlemen."
 QIN_secure_caravans_in_western_provinces:0 "Secure Caravans in the Western Provinces"
 QIN_secure_caravans_in_western_provinces_desc:0 "Caravans bound for the Central Asian khanates pass through Xinjiang. Banditry and extortion make these roads dangerous and costly. Patrols must be strengthened and wells and stopping places repaired so that merchants can trade without fearing for their goods or their lives."
 QIN_path_pekin_tashkent:0 "The Peking–Tashkent Route"
 QIN_path_pekin_tashkent_desc:0 "Tashkent stands at a crossroads of caravan routes and draws merchants from neighbouring lands. Trade with Peking must be established, with agreed customs duties and protection for warehouses. This route will expand Chinese exports and strengthen ties with Central Asian markets."
 QIN_path_pekin_bukchara:0 "The Peking–Bukhara Route"
 QIN_path_pekin_bukchara_desc:0 "Bukharan merchants have long linked China with western markets. Their experience should also be used to develop regular trade with Peking. An agreement on customs duties, caravan protection and the rights of trading houses will help restore the importance of the old routes."
 QIN_path_pekin_hiva:0 "The Peking–Khiva Route"
 QIN_path_pekin_hiva_desc:0 "Khiva links the oases of Khwarezm with markets in neighbouring lands. Agreements with the khanate's authorities are needed on trade and the protection of Chinese merchants. Water reserves, reliable guides and clear customs duties will allow caravans from Peking to cross the desert roads without loss."
 QIN_condemn_intervention_in_central_asia:0 "Condemn Intervention in Central Asia"
 QIN_condemn_intervention_in_central_asia_desc:0 "Intervention in the khanates brings foreign troops closer to China's western borders. The lessons of the Tea War show the cost of outside pressure. The intervention must be condemned and negotiations supported to preserve the neighbours' independence and keep the roads safe."
 QIN_support_khans:0 "Support the Khanates"
 QIN_support_khans_desc:0 "Condemning the intervention is not enough. The khanates must be offered assistance to check the advance of foreign powers towards China's borders. Agreements on supplies and intelligence sharing will strengthen these neighbours while keeping western markets and caravan routes open."
 QIN_the_dragon_that_stretches_towards_the_west:0 "The Dragon Looks West"
 QIN_the_dragon_that_stretches_towards_the_west_desc:0 "After defeats in the east, the empire is strengthening its influence in the west. Ties with Tibet, the khanates and distant markets are becoming part of a common policy. Trade and border security must be coordinated so that every agreement serves China, whatever allies are chosen."

