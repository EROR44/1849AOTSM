 qin_great_embassy_event.96.t:0 "A Private Visit to the Confederacy"
 qin_great_embassy_event.96.d:0 "The government of the Confederacy has declined an official reception. Our representatives will travel incognito as private visitors, observing public industry and commerce. A brief report is expected in thirty days. Without official access, the full programme of audiences and industrial visits cannot take place."
 qin_great_embassy_event.96.a:0 "Send our representatives incognito."
 qin_great_embassy_event.102.t:0 "Private Visit Report: [CBI.GetName]"
 qin_great_embassy_event.102.d:0 "Our representatives have completed a thirty-day private visit to the Confederacy. Observations of workshops, markets and transport have provided a general picture of local industry. Without official audiences or access to restricted facilities, the information gathered is considerably more limited than the results of the official embassy programme."
 qin_great_embassy_event.102.a:0 "Take note of the report."
