 #FOCUSES

 QIN_western_direction:0 "Western Policy"
 QIN_western_direction_desc:0 "Defeats in the Tea War and the war with Japan weaken the empire's position in the east. The khanates' markets and the roads to India remain open in the west. These ties must also be developed to expand trade and secure the borders without further concessions to European powers."
 QIN_persian_civil_war:0 "The Afghan Civil War"
 QIN_persian_civil_war_desc:0 "Civil war is raging in Afghanistan, where the government, pro-Rhomean forces and the Islamic minority struggle for power. The court must assess their strength and choose the side whose cooperation will bring China the greatest benefits."
 QIN_support_intervention_to_afghanistan:0 "Support Intervention in Afghanistan"
 QIN_support_intervention_to_afghanistan_desc:0 "Backing the Rhomean side in the Afghan war promises commercial benefits for China. Long-standing ties with the Rhomean Company provide a basis for an agreement. Its intervention should be supported in return for protection for merchants and access to western trade routes."
 QIN_guarantee_safe_trade:0 "Guarantee Safe Trade in the Rhomean Trading Company's Lands"
 QIN_guarantee_safe_trade_desc:0 "Cooperation with the Rhomean Company requires protection for Chinese merchants in its lands. Agreements must cover the security of caravans and warehouses, customs duties and compensation for losses. Existing ties should benefit both sides."
 QIN_trade_through_port_of_patalanoupolis:0 "Trade through the Port of Patalanoupolis"
 QIN_trade_through_port_of_patalanoupolis_desc:0 "Patalanoupolis gives Chinese merchants access to markets in the Rhomean Company's lands. Agreements are needed on warehouses, port dues and freight. Silk, tea and porcelain will find new buyers, while trade will bring much-needed silver into the treasury."
 QIN_support_afghanistan:0 "Support Afghanistan"
 QIN_support_afghanistan_desc:0 "The Afghan government faces forces backed by the Rhomeans. Supporting it offers a means to limit the company's influence and preserve an independent partner. Kabul should be offered assistance in return for caravan protection and favourable terms of trade."
 QIN_path_pekin_kabul:0 "The Peking–Kabul Route"
 QIN_path_pekin_kabul_desc:0 "Support for Kabul must be backed by a permanent route. Caravans through the western lands will link Chinese markets with Afghanistan. Mountain passes must be mapped, stopping places established and customs duties agreed upon to make the long journey profitable for merchants."
 QIN_expansion_of_trade_in_ports_of_balochistan:0 "Expand Trade in Balochistan's Ports"
 QIN_expansion_of_trade_in_ports_of_balochistan_desc:0 "Balochistan's harbours offer access to sea routes without relying on middlemen. Ties with Kabul make it possible to expand trade in this direction. Agreements with local authorities on warehouse protection and customs duties will help Chinese goods reach the coast."
 QIN_dialogue_with_dalai_lama:0 "Dialogue with the Dalai Lama"
 QIN_dialogue_with_dalai_lama_desc:0 "Under Kangxi, ties with Lhasa were strengthened through military force and patronage of Buddhism. Tibet's return to imperial rule must now be discussed with the Dalai Lama. Respect for faith and local customs will help secure an agreement and avoid another mountain campaign."
 QIN_returnment_by_force:0 "Return by Force"
 QIN_returnment_by_force_desc:0 "Talks with Lhasa are failing to produce the desired result. Tibet must be brought back by force of arms, as it was under Kangxi. Troops need reliable supplies along the mountain roads. Protecting monasteries and forbidding looting will help prevent resistance from the inhabitants."
 QIN_returnment_by_will:0 "Voluntary Return"
 QIN_returnment_by_will_desc:0 "Lhasa is offered recognition of imperial authority in return for preserving its religious institutions and customs. The terms and each side's duties must be set down in writing. Tibet's voluntary return will secure the western borders without a costly mountain campaign."
 QIN_status_of_tibet:0 "The Status of Tibet"
 QIN_status_of_tibet_desc:0 "Tibet's return requires clear rules of government. The rights of the Dalai Lama, the duties of local authorities and the powers of imperial representatives must be defined. Agreed rules for taxation and garrison upkeep will help preserve peace and defend the borders."
 QIN_establish_dialogue_with_central_asia:0 "Open Dialogue with Central Asia"
 QIN_establish_dialogue_with_central_asia_desc:0 "The khanates of Central Asia link China's western frontier with foreign markets. Relations with these neighbours require care after Qianlong's campaigns. Envoys should be exchanged to discuss trade, road security and disputes along the shared border, building mutual trust."
 QIN_expand_trade_with_region:0 "Expand Trade with the Region"
 QIN_expand_trade_with_region_desc:0 "Chinese goods reach the khanates' markets along old trade routes. This exchange must be expanded through agreements on customs duties and merchant protection. Overland trade will provide income after the losses in the east and reduce dependence on European middlemen."
 QIN_secure_caravans_in_western_provinces:0 "Secure Caravans in the Western Provinces"
 QIN_secure_caravans_in_western_provinces_desc:0 "Caravans bound for the Central Asian khanates pass through Xinjiang. Banditry and extortion make these roads dangerous and costly. Patrols must be strengthened and wells and stopping places repaired so that merchants can trade without fearing for their goods or their lives."
 QIN_path_pekin_tashkent:0 "The Peking–Tashkent Route"
 QIN_path_pekin_tashkent_desc:0 "Tashkent stands at a crossroads of caravan routes and draws merchants from neighbouring lands. Trade with Peking must be established, with agreed customs duties and protection for warehouses. This route will expand Chinese exports and strengthen ties with Central Asian markets."
 QIN_path_pekin_bukchara:0 "The Peking–Bukhara Route"
 QIN_path_pekin_bukchara_desc:0 "Bukharan merchants have long linked China with western markets. Their experience should also be used to develop regular trade with Peking. An agreement on customs duties, caravan protection and the rights of trading houses will help restore the importance of the old routes."
 QIN_path_pekin_hiva:0 "The Peking–Khiva Route"
 QIN_path_pekin_hiva_desc:0 "Khiva links the oases of Khwarezm with markets in neighbouring lands. Agreements with the khanate's authorities are needed on trade and the protection of Chinese merchants. Water reserves, reliable guides and clear customs duties will allow caravans from Peking to cross the desert roads without loss."
 QIN_condemn_intervention_in_central_asia:0 "Condemn Intervention in Central Asia"
 QIN_condemn_intervention_in_central_asia_desc:0 "Intervention in the khanates brings foreign troops closer to China's western borders. The lessons of the Tea War show the cost of outside pressure. The intervention must be condemned and negotiations supported to preserve the neighbours' independence and keep the roads safe."
 QIN_support_khans:0 "Support the Khanates"
 QIN_support_khans_desc:0 "Condemning the intervention is not enough. The khanates must be offered assistance to check the advance of foreign powers towards China's borders. Agreements on supplies and intelligence sharing will strengthen these neighbours while keeping western markets and caravan routes open."
 QIN_the_dragon_that_stretches_towards_the_west:0 "The Dragon Looks West"
 QIN_the_dragon_that_stretches_towards_the_west_desc:0 "After defeats in the east, the empire is strengthening its influence in the west. Ties with Tibet, the khanates and distant markets are becoming part of a common policy. Trade and border security must be coordinated so that every agreement serves China, whatever allies are chosen."

