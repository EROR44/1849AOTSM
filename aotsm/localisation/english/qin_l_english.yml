 # Авиационные события Цин
 qin_air_event.1.t:0 "Conquest of the Sky"
 qin_air_event.1.d:0 "The empire begins its aviation programme, seeking to learn from European aircraft and airships."
 qin_air_event.1.a:0 "Continue."
 qin_air_event.2.t:0 "Studying European Designs"
 qin_air_event.2.d:0 "Our specialists study European aviation designs and consider their use in the empire."
 qin_air_event.2.a:0 "Continue."
 qin_air_event.3.t:0 "Creating Light Aviation"
 qin_air_event.3.d:0 "Work begins on light aircraft for reconnaissance and the delivery of dispatches."
 qin_air_event.3.a:0 "Continue."
 qin_air_event.4.t:0 "Designing Heavy Aircraft"
 qin_air_event.4.d:0 "Our engineers begin designing heavy aircraft and airships for imperial service."
 qin_air_event.4.a:0 "Continue."
 qin_air_event.5.t:0 "Building Airfields"
 qin_air_event.5.d:0 "Airfields will provide the infrastructure needed to operate and maintain the imperial air fleet."
 qin_air_event.5.a:0 "Continue."
 qin_air_event.6.t:0 "Aviation Tactics"
 qin_air_event.6.d:0 "The first principles for the coordinated use of aviation have been prepared."
 qin_air_event.6.a:0 "Continue."
 qin_air_event.7.t:0 "The Second Stage of Conquering the Sky"
 qin_air_event.7.d:0 "The aviation programme enters a new stage, expanding research, training and production."
 qin_air_event.7.a:0 "Continue."
 qin_air_event.8.t:0 "Research into Light Aviation"
 qin_air_event.8.d:0 "Further research into light aviation will improve the designs available to our specialists."
 qin_air_event.8.a:0 "Continue."
 qin_air_event.9.t:0 "Feng Yelun’s Developments"
 qin_air_event.9.d:0 "Feng Yelun’s developments will be examined as part of the imperial aviation programme."
 qin_air_event.9.a:0 "Continue."
 qin_air_event.10.t:0 "Research into Heavy Aviation"
 qin_air_event.10.d:0 "Further research into heavy aviation will guide the development of larger aircraft."
 qin_air_event.10.a:0 "Continue."
 qin_air_event.11.t:0 "Purchasing Light Aircraft Samples"
 qin_air_event.11.d:0 "Light aircraft samples will allow our engineers to study foreign designs in detail."
 qin_air_event.11.a:0 "Continue."
 qin_air_event.12.t:0 "Inviting Foreign Aviation Specialists"
 qin_air_event.12.d:0 "Foreign specialists will assist in developing the skills needed by our aviation industry."
 qin_air_event.12.a:0 "Continue."
 qin_air_event.13.t:0 "The Nanjing Pilot School"
 qin_air_event.13.d:0 "A pilot school in Nanjing will provide trained personnel for the imperial air fleet."
 qin_air_event.13.a:0 "Continue."
 qin_air_event.14.t:0 "Purchasing Heavy Aircraft Samples"
 qin_air_event.14.d:0 "Heavy aircraft samples will help our engineers study the construction and operation of larger aircraft."
 qin_air_event.14.a:0 "Continue."
 qin_air_event.15.t:0 "The Shenyang Industrial Zone"
 qin_air_event.15.d:0 "The Shenyang industrial zone will provide a foundation for domestic aviation production."
 qin_air_event.15.a:0 "Continue."
