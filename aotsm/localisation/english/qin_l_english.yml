 QIN_chosen_heir_ichzu_name:0 "Aisin Gioro Yizhu"
 QIN_chosen_heir_isin_name:0 "Aisin Gioro Yixin"
 QIN_chosen_heir_isuan_name:0 "Aisin Gioro Yixuan"

 QIN_enthronement_ichzu_desc:0 "      After the first days of mourning, guards and officials assemble in the palace for the solemn ceremony. Princes, ministers and provincial envoys take their places beneath the rising incense.\n\n      Yizhu, fourth son of the late emperor, is formally proclaimed Son of Heaven. Having already attended to urgent affairs, he now receives the imperial regalia before the court. His supporters hope that he will preserve his father’s institutions.\n\n      The officials perform their bows, and scribes prepare proclamations for the provinces. The court calls for order and faithful service as the empire enters a new reign."
 QIN_enthronement_isin_desc:0 "      After the first days of mourning, guards and officials assemble in the palace for the solemn ceremony. Princes, ministers and provincial envoys take their places beneath the rising incense.\n\n      Yixin enters the hall accompanied by princes and senior officers. After taking part in government during the transition, he is now formally proclaimed Son of Heaven. His supporters hope for a stronger army and await his first decisions.\n\n      The officials perform their bows, and scribes prepare proclamations for the provinces. The court calls for order and faithful service as the empire enters a new reign."
 QIN_enthronement_isuan_desc:0 "      After the first days of mourning, guards and officials assemble in the palace for the solemn ceremony. Princes, ministers and provincial envoys take their places beneath the rising incense.\n\n      The young Yixuan enters beside senior members of the imperial household. He is formally proclaimed Son of Heaven, while regents will bear the burden of government until he is old enough to rule independently.\n\n      The officials perform their bows, and scribes prepare proclamations for the provinces. The court calls for order and faithful service as the empire enters a new reign."
