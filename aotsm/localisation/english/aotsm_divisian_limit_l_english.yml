 unit_limit_label:0 "§HMaximum Number of Divisions§!"
 unit_limit_desc:0 "Each country, depending on its status, may have no more than the division limit. Otherwise, logistical problems will arise.§L\n\n- §YColonial Zone§! - 10 divisions\n- §YSmall Colony§! - 20 divisions\n- §YMedium-Sized Colony§! - 30 divisions\n- §YColonial Autonomy§! - 50 divisions\n\n- §YSmall Country§! - 20 divisions\n- §YMedium-Sized Country§! - 30 divisions\n- §YLarge Country§! - 50 divisions\n- §YPotential World Power§! - 100 divisions\n- §YWorld Power§! - 150 divisions\n\nCountries with a unique division limit:\n\n- §Y[RUS.GetName]§! - 250 divisions§Y\n- [QIN.GetName]§! - 250 divisions"
 
 unit_limit_desc_above_limit:0 "\n\n--------------\n\n§RWe have currently exceeded our capacity, and the only way to alleviate the stress on our country will be to remove some of our divisions.§!\n\nDivision Organisation: [?mobilisation_penalty_var|+=%1]\nConsumer Goods Factories: [?mobilisation_penalty_var_positive|=%H0]\nFactory Output: [?mobilisation_penalty_var|+=%]\nTraining Time: [?mobilisation_penalty_var_positive|-=%]\nReinforce Rate: [?mobilisation_penalty_var|+=%1]"