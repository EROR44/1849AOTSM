 #Ideas
 
 MOL_land_reform:0 "Successful Land Reform"
 MOL_land_reform_desc:0 "§YMoldavia§! has carried out a quiet revolution: the lands of the boyar-tax farmers were bought out by the state and transferred to the peasants on terms of perpetual lease. This not only eliminated feudal remnants, but also created a class of prosperous farmers. Their surplus grain, tobacco, and grapes are now exported to §YAustria§! and §YPrussia§!, and the proceeds are invested in manufactories. In §YIasi§! and §YKishinev§!, factories for processing agricultural products are already smoking, and workshops produce simple machine tools. Although an industrial leap is still far off, the principality is confidently moving from the plow to the steam plow, avoiding social upheavals."
 MOL_peaceful_politic:0 "Peaceful Policy"
 MOL_peaceful_politic_desc:0 "Wedged between the §YAustrian Empire§!, §YRussia§!, §YRomea§!, and §YBulgaria-Wallachia§!, §YMoldavia§! has chosen neutrality as the guarantee of survival. Its army — §G8,000§! bayonets — is symbolic, but its diplomats skillfully play on the contradictions of its neighbors. In §YBucharest§! and §YPetrograd§!, Moldavian ambassadors emphasize the benefits of transit trade, in §YConstantinople§! — the role of a shield against Russian influence. «§YOur strength is in our calm§!», says the princely motto. Even border conflicts with the Wallachians are settled by arbitration of §YVienna§!."
 MOL_people_rule:0 "Power in the Hands of the People"
 MOL_people_rule_desc:0 "The «§YZemsky Sobor§!» (Sfatul Tarii), unique for the Balkans, determines the fate of §YMoldavia§!. Once every §G5§! years, free male property owners elect district elders, who approve laws and control officials. The prince is elected for life, but only from candidates approved by the Sobor. After the death of §YStephen IX§! (§G1847§!), the nobility unsuccessfully tried to push through a pro-Russian candidate — the assembly of the lands preferred the liberal §YIoan Cuza§!, a supporter of an alliance with §YPrussia§!. Although the boyars grumble, the common people see in the Sobor a barrier against tyranny."
 MOL_antirussian_sentiment:0 "Anti-Russian Sentiment"
 MOL_antirussian_sentiment_desc:0 "Although the victory of the Decembrists in §G1825§! eliminated the threat of tsarist absolutism, the new §YRussia§! retained its imperial ambitions. By §G1848§!, §YPetrograd§! increased pressure on §YMoldavia§!, demanding «protection of Orthodox Christians» in §YBessarabia§!. In response, §YIasi§! concluded a secret defensive pact with §YAustria§!, banned the teaching of Russian in schools, and invited Prussian officers to reform the army. The church, maintaining loyalty to the Patriarchate of Constantinople, brands «Petrograd republican expansionism» as a threat to independence. On the streets one hears: «Better a Roman than a Russian commissar!». Local boyars connected with Russian oligarchs sabotage the land reform, but the Sobor of elders harshly curbs their influence through the courts."