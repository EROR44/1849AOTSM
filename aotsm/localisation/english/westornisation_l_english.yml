 #EVENTS

 aotsm_westernisation_event.1.t:0 "Choosing a Great Power Protector"
 aotsm_westernisation_event.1.d:0 " Six great powers tower over the political map of the modern world, their might determining the balance of power: [PRU.GetName], [FRR.GetName], [CBI.GetName], [AUS.GetName], [BYZ.GetName], and [RUS.GetName]. Each of these empires represents a powerful entity governed by the laws of the industrial age and benefiting from the fruits of the latest scientific discoveries. Our homeland, however, while remaining faithful to its ancient traditions, finds itself in a state described by observers as backward and non-Westernised, standing as if on the margins of the main course of historical development determined by the leading nations of the West.\n\n Thus, accelerated Westernisation, implying the systematic transformation of society and the transition to a modern European system, is an urgent necessity. Choosing a protector from among the great powers could serve as a catalyst for this transformation, facilitating and accelerating this difficult process. However, it must be stated clearly that this path is by no means the only one. Our homeland is free to choose the path of independent advancement, relying on internal resources and the will of its people. But we must recognise that this path will be incomparably more difficult, entail inevitable hardships, and require the nation to exert all its strength to the utmost, for it will have to move forward without external support, overcoming obstacles through its own perseverance alone."
 aotsm_westernisation_event.1.a:0 "[PRU.GetNameWithFlag]"
 aotsm_westernisation_event.1.b:0 "[FRR.GetNameWithFlag]"
 aotsm_westernisation_event.1.c:0 "[CBI.GetNameWithFlag]"
 aotsm_westernisation_event.1.e:0 "Next Page"

 aotsm_westernisation_event.2.t:0 "Choosing a Great Power Protector"
 aotsm_westernisation_event.2.d:0 " Six great powers tower over the political map of the modern world, their might determining the balance of power: [PRU.GetName], [FRR.GetName], [CBI.GetName], [AUS.GetName], [BYZ.GetName], and [RUS.GetName]. Each of these empires represents a powerful entity governed by the laws of the industrial age and benefiting from the fruits of the latest scientific discoveries. Our homeland, however, while remaining faithful to its ancient traditions, finds itself in a state described by observers as backward and non-Westernised, standing as if on the margins of the main course of historical development determined by the leading nations of the West.\n\n Thus, accelerated Westernisation, implying the systematic transformation of society and the transition to a modern European system, is an urgent necessity. Choosing a protector from among the great powers could serve as a catalyst for this transformation, facilitating and accelerating this difficult process. However, it must be stated clearly that this path is by no means the only one. Our homeland is free to choose the path of independent advancement, relying on internal resources and the will of its people. But we must recognise that this path will be incomparably more difficult, entail inevitable hardships, and require the nation to exert all its strength to the utmost, for it will have to move forward without external support, overcoming obstacles through its own perseverance alone."
 aotsm_westernisation_event.2.a:0 "[AUS.GetNameWithFlag]"
 aotsm_westernisation_event.2.b:0 "[BYZ.GetNameWithFlag]"
 aotsm_westernisation_event.2.c:0 "[RUS.GetNameWithFlag]"
 aotsm_westernisation_event.2.e:0 "Next Page"

 aotsm_westernisation_event.3.t:0 "Choosing a Great Power Protector"
 aotsm_westernisation_event.3.d:0 " Six great powers tower over the political map of the modern world, their might determining the balance of power: [PRU.GetName], [FRR.GetName], [CBI.GetName], [AUS.GetName], [BYZ.GetName], and [RUS.GetName]. Each of these empires represents a powerful entity governed by the laws of the industrial age and benefiting from the fruits of the latest scientific discoveries. Our homeland, however, while remaining faithful to its ancient traditions, finds itself in a state described by observers as backward and non-Westernised, standing as if on the margins of the main course of historical development determined by the leading nations of the West.\n\n Thus, accelerated Westernisation, implying the systematic transformation of society and the transition to a modern European system, is an urgent necessity. Choosing a protector from among the great powers could serve as a catalyst for this transformation, facilitating and accelerating this difficult process. However, it must be stated clearly that this path is by no means the only one. Our homeland is free to choose the path of independent advancement, relying on internal resources and the will of its people. But we must recognise that this path will be incomparably more difficult, entail inevitable hardships, and require the nation to exert all its strength to the utmost, for it will have to move forward without external support, overcoming obstacles through its own perseverance alone."
 aotsm_westernisation_event.3.a:0 "We Will Choose Our Own Path"
 aotsm_westernisation_event.3.b:0 "Previous Page"

 aotsm_westernisation_event.4.t:0 "Offer to Become a Protector"
 aotsm_westernisation_event.4.d:0 " Our state, while preserving deep respect for its historical traditions, recognises the pressing need for accelerated modernisation in all spheres of public life. We sincerely admire your state's impressive achievements in industrial development, scientific and technological progress, and state administration, seeing in them a worthy example to follow.\n\n In view of this, we respectfully propose establishing a protectorate relationship that would allow us to carry out the necessary systematic transformations. Your expert support and assistance in the fields of technology, education, and administrative reform would help our state make a smooth transition to a modern system, following the path established by the world's leading powers."
 aotsm_westernisation_event.4.a:0 "Accept."
 aotsm_westernisation_event.4.b:0 "Decline."

 aotsm_westernisation_event.5.t:0 "The Government of [FROM.GetName] Agrees"
 aotsm_westernisation_event.5.d:0 " Your proposal for a protectorate has been accepted with great satisfaction. We greatly appreciate the wisdom of your decision to choose the path of modernisation and are ready to provide comprehensive assistance in carrying out the necessary transformations. Our experts in public administration, military affairs, and industrial development will be dispatched to assist with the implementation of reforms. May our cooperation serve the prosperity of your people and strengthen mutual understanding between our states."
 aotsm_westernisation_event.5.a:0 "Excellent."

 aotsm_westernisation_event.6.t:0 "The Government of [FROM.GetName] Refused Our Offer"
 aotsm_westernisation_event.6.d:0 " Your proposal has been carefully considered, but our current domestic priorities and existing international commitments do not allow us to accept such a responsible mission. We recognise the importance of your path towards modernisation and wish you success in carrying out your transformations. While maintaining friendly relations between our states, we are compelled to focus on resolving our own strategic objectives during this period."
 aotsm_westernisation_event.6.a:0 "A shame."

 aotsm_westernisation_event.7.t:0 "The Client State of [FROM.GetName] Is Developing"
 aotsm_westernisation_event.7.d:0 " Steady progress is being observed in the development of the client state of [FROM.GetName]. With our support, advanced administrative methods and modern technologies are gradually being introduced in the country. Rising literacy rates and improvements in the healthcare system have been noted. Local authorities are actively adopting our experience in state administration. The country's economy is showing positive growth, aided by the introduction of new methods of economic management. These transformations demonstrate the success of the chosen course of gradual modernisation."
 aotsm_westernisation_event.7.a:0 "Excellent"

 aotsm_westernisation_event.8.t:0 "Client State of [FROM.GetName] Transfers Soldiers"
 aotsm_westernisation_event.8.d:0 " Another contingent of volunteers from the client state of [FROM.GetName] has arrived to serve in our armed forces. Young men from noble families have expressed their desire to adopt advanced military experience and receive training according to our regulations. The transfer of soldiers strengthens the traditional allied relations between our states. The arriving contingent has been assigned to training units to learn modern tactics and the use of the latest weaponry. This event demonstrates the growing prestige of our army in the region."
 aotsm_westernisation_event.8.a:0 "Excellent"

 aotsm_westernisation_event.9.t:0 "Popular Discontent with Westernising Policies"
 aotsm_westernisation_event.9.d:0 " The population is putting up persistent resistance to the reforms being implemented. Local residents perceive these changes as a threat to their established way of life. This circumstance creates additional difficulties in implementing the policy of Westernisation. Such a situation may negatively affect the pace of further transformations in these regions. It is strongly recommended that measures be developed to normalise public sentiment."
 aotsm_westernisation_event.9.a:0 "A shame"

 aotsm_westernisation_event.10.t:0 "Outbreak of an Unknown Disease"
 aotsm_westernisation_event.10.d:0 " The spread of a previously unknown disease has been observed in several regions. The new illness manifests itself through severe symptoms that cannot be treated using traditional methods. Local healers are powerless against the unfamiliar disease. Foreign physicians have been invited to attempt their own methods of treatment, but the effectiveness of their methods has yet to be proven. Anxiety is growing among the population, while trade and economic growth in the affected lands are experiencing significant difficulties."
 aotsm_westernisation_event.10.a:0 "Terrible news..."

 aotsm_westernisation_event.11.t:0 "Miners' Revolt"
 aotsm_westernisation_event.11.d:0 " Serious unrest has broken out among workers in the mining region. The miners are expressing dissatisfaction with existing working conditions and wages. The removal of extracted minerals from the region has been temporarily suspended. Additional guards have been dispatched to maintain order. Attempts are being made to resolve the conflict with the dissatisfied workers. The situation in the district remains unsettled."
 aotsm_westernisation_event.11.a:0 "The conflict must be resolved!"

 aotsm_westernisation_event.12.t:0 "The Population Supports the Reforms"
 aotsm_westernisation_event.12.d:0 " In several provinces, the common people readily accept the new order. Townspeople and peasants are adopting sensible foreign customs and diligently learning useful crafts. Initiatives in the field of public education receive particular approval. This voluntary acceptance of the path of transformation inspires hope for the successful advancement of reforms throughout the state. Local officials report exemplary diligence among the population in mastering these innovations."
 aotsm_westernisation_event.12.a:0 "Excellent"

 aotsm_westernisation_event.13.t:0 "Successes in Army Westernisation"
 aotsm_westernisation_event.13.d:0 " Military reforms are demonstrating steady progress. The troops are showing noticeable improvements in organisation and coordination. The professional skills of both enlisted personnel and the officer corps are increasing. Inspections and exercises have confirmed the improved level of combat training. The military administration notes the successful adoption of new principles of service. These achievements demonstrate the correctness of the chosen course of army modernisation."
 aotsm_westernisation_event.13.a:0 "Excellent"

 aotsm_westernisation_event.14.t:0 "Agricultural Breakthrough"
 aotsm_westernisation_event.14.d:0 " This year has been marked by an unprecedented harvest in the main agricultural regions. The grain harvest has significantly surpassed the results of last year's harvest. Favourable weather conditions and the introduction of new land-use methods contributed to such abundant yields. Barns and storage facilities are overflowing with harvested grain. This increase makes it possible to build substantial reserves and stimulate the grain trade. Rural inhabitants are pleased with the results of their labour."
 aotsm_westernisation_event.14.a:0 "Excellent"

 aotsm_westernisation_event.15.t:0 "Workers' Strike"
 aotsm_westernisation_event.15.d:0 " A strike has been declared at one of the major industrial facilities. The workers have stopped working, demanding a review of working conditions and higher wages. The production process has come to a complete halt. The factory owner is forced to negotiate with representatives elected by the workers. This situation is causing concern among the owners of other enterprises, who fear the unrest may spread."
 aotsm_westernisation_event.15.a:0 "A shame... But the conflict must be resolved."

 aotsm_westernisation_event.16.t:0 "Railway Disaster"
 aotsm_westernisation_event.16.d:0 " A train has derailed on one of the railway lines. The train left the tracks on a curve, causing several carriages to overturn. There are casualties among passengers and railway personnel. Medical workers and recovery crews have been dispatched to the scene. Traffic along this section has been temporarily suspended. An investigation into the causes of the disaster has begun, including an inspection of the condition of the tracks and the serviceability of the rolling stock."
 aotsm_westernisation_event.16.a:0 "Terrible news."

 aotsm_westernisation_event.17.t:0 "Successes in Industrial Development"
 aotsm_westernisation_event.17.d:0 " The state's industry is demonstrating steady growth and development. The commissioning of new enterprises and modernisation of existing facilities are allowing a significant increase in the output of various products. Improvements in the quality of manufactured goods and the adoption of advanced technologies have been noted. The expansion of the industrial sector is contributing to the country's economic strength and creating new jobs. These achievements demonstrate the effectiveness of the policy of supporting domestic production."
 aotsm_westernisation_event.17.a:0 "Excellent!"