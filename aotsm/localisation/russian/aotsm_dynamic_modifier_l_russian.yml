l_russian:

 POL_nationalist_resistance_dynamic_modifier:0 "Польский национализм"
 POL_nationalist_resistance_dynamic_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_pol_nationalist_resistance\n\n\n\n\n\n\n\nСтремление к §Yвосстановлению§! §Oнезависимого§! §Yгосударства§!, §Rсвободного от власти§! §YРоссии§!, всегда §Rпылает§! в сердцах поляков. Этот §Oнационалистический порыв§!, переплетённый с §Oсепаратистскими настроениями§!, порождает §Rмножество трудностей§!..."
 FIN_separatism_dynamic_modifier:0 "Финский сепаратизм"
 FIN_separatism_dynamic_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_fin_separatism\n\n\n\n\n\n\n\nМноголетняя политика правительства §YРоссии§! в отношении §YФинляндской области§! и ее населения, сопровождаемая бытовым расизмом и пренебрежением со стороны центральной власти, породила мощные сепаратистские движения. \n\nКультурные и экономические запросы населения §Rсистематически§! §Oигнорируются§!, что усиливает раскол. Стремление области к отделению, подпитываемое чувством унижения, является одной из самых §Rсерьезных угроз§! для целостности и суверенитета страны."
 FIN_separatism_dynamic_modifier_1:0 "Финский сепаратизм"
 FIN_separatism_dynamic_modifier_1_desc:0 "\n\n\n\n\n£GFX_modifier_desc_fin_separatism\n\n\n\n\n\n\n\nМноголетняя политика правительства §YРоссии§!, отмеченная расистскими предрассудками и игнорированием законных проблем финского населения, привела к §Rросту§!, §Oсепаратистских настроений§! в §YФинляндской области§!. \n\nОсознавая §Oсерьёзность угрозы§!, власти §Gначали§! предпринимать шаги для диалога и решения накопившихся вопросов. Так же, §Gначата§! борьба с дискриминацией, однако эти меры пока не носят массового характера и не меняют ситуацию коренным образом."
 FIN_separatism_dynamic_modifier_2:0 "Финский сепаратизм"
 FIN_separatism_dynamic_modifier_2_desc:0 "\n\n\n\n\n£GFX_modifier_desc_fin_separatism\n\n\n\n\n\n\n\nМноголетняя политика правительства §YРоссии§! в отношении населения §YФинляндской области§!, включавшая случаи бытового расизма и игнорирования местных запросов, способствовала §Oросту напряженности§!. \n\nВ настоящее время предпринимаются попытки решения накопленных проблем. Осуществляется работа по противодействию дискриминационным практикам и включению области в общегосударственное пространство с учётом её специфики. Данные меры направлены на снижение сепаратистских настроений и стабилизацию обстановки в регионе."
 RUS_integrated_finland_dynamic_modifier:0 "Недовольство интеграцией"
 RUS_integrated_finland_dynamic_modifier_desc:0 ""

 RUS_small_autonomy_modifier:0 "Самоуправляемый регион"
 RUS_small_autonomy_modifier_desc:0 "Регион имеет ряд привилегий перед губерниями, а так же, управляется более автономно."
 RUS_autonomy_modifier:0 "Особый статус"
 RUS_autonomy_modifier_desc:0 "Данный регион обладает особым экономическим и административным статусом."

 #QIN modifiers

 QIN_god_worshipping_society_state_modifier:0 "Общество поклонения Богу"
 QIN_god_worshipping_society_state_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_qin_god_worshipping_society\n\n\n\n\n\n\n\nСекта, которая широко распостранена среди бедных слоев населения на юге Китая. Как утверждает ее основатель - §YХун Сюцюань§!, учение, которое исповедуется верующими, является возрождением древней религии §YШанди§!.\n\nОдако, в текущий момент, размах секты становится §Oнарастающей проблемой§!, да и к тому же, те кто знаком с трактатами, исповедуемыми сектантами, утверждают, что их содержимое больше похоже на смесь §Cпротестантизма§! с §Cбуддизмом§! и §Oнесет угрозу§! стабильности страны..."

 QIN_nomad_region_state_modifier:0 "Кочевой регион"
 QIN_nomad_region_state_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_qin_nomad_region\n\n\n\n\n\n\n\nДанный регион населен кочевниками, что значительно замедляет его развитие. Однако, в виду немногочисленности населения области, нам необходимо значительно меньше гарнизонов."

 QIN_undeveloped_region_state_modifier:0 "Неразвитый регион"
 QIN_undeveloped_region_state_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_qin_undeveloped_region\n\n\n\n\n\n\n\nТерритория расположеная в отдаленной от столицы и развитых прибрежних земель области Китая. Расположение региона обуславливает трудности в его развитии, а так же, ослабленный контроль центральной власти страны над ним."

 QIN_agricultural_region_state_modifier:0 "Сельскохозяйственный регион"
 QIN_agricultural_region_state_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_qin_agricultural_region\n\n\n\n\n\n\n\nВ данном регионе расположены обширные сельскохозяйственные угодья и большинство населения области заняты деятельностью связанной с сельским хозяйством. Однако, у подобного положения дел есть и отрицательные стороны: разработка месторождений ресурсов, в прочем, как и строительство промышленных предприятий в регионе будут явно затруднены."

 QIN_industrial_region_1_state_modifier:0 "Индустриализируемый регион"
 QIN_industrial_region_1_state_modifierr_desc:0 "\n\n\n\n\n£GFX_modifier_desc_QIN_industrial_region_1\n\n\n\n\n\n\n\nДанная область находится в процессе бурной индустриализации, что позволяет начать концентрировать в ней проимышленность. Однако, подобная деятельность требует значительных трудозатрат и не всегда встречается населением региона положительно."

 QIN_industrial_region_2_state_modifier:0 "Промышленный регион"
 QIN_industrial_region_2_state_modifierr_desc:0 "\n\n\n\n\n£GFX_modifier_desc_QIN_industrial_region_2\n\n\n\n\n\n\n\nРегион с обширной промышленностью, сконцентрированной в нём. Большое количество заводов и шахт позволяет наладить добычу полезных ископаемых и выпуск промышленных изделий в соответсвии с современными стандартами."

 QIN_mountain_region_state_modifier:0 "Горный регион"
 QIN_mountain_region_state_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_qin_mountain_region\n\n\n\n\n\n\n\nРегион расположен в горной местности, что осложняет, как его развитие, так и перемещение по самим землям региона."
 
 QIN_dissatisfaction_of_the_islamic_population_state_modifier:0 "Недовольство исламского населения"
 QIN_dissatisfaction_of_the_islamic_population_state_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_qin_dissatisfaction_of_the_islamic_population\n\n\n\n\n\n\n\n"

 QIN_capital_of_empire_state_modifier:0 "Столица империи"
 QIN_capital_of_empire_state_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_qin_capital_of_empire\n\n\n\n\n\n\n\n§YПекин§! — сердце §YИмперии Цин§!, где Запретный город объединяет резиденцию императора и центр управления. Столичные войска патрулируют ключевые районы, а инфраструктура ориентирована на снабжение элиты."
 
 QIN_administrative_center_state_modifier:0 "Административный центр"
 QIN_administrative_center_state_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_qin_administrative_center\n\n\n\n\n\n\n\nДанный город является административным центром провиниции, из-за чего многие его жители задействованы в работе бюрократического аппарата. Однако, в этом есть и свои плюсы."

 QIN_trade_factoria_state_modifier:0 "Регион-фактория"
 QIN_trade_factoria_state_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_qin_trade_factoria\n\n\n\n\n\n\n\n Данная территория находится под контролем иностранного государства или компании. В регионе преобладает коммерческая деятельность, но при этом не осуществляется полноценное колониальное управление и не происходит массового переселения граждан метрополии. Фактория служит опорным торговым пунктом, обеспечивая экономическое присутствие без прямого политического влияния на глубинными территории."
 
 #Japan State Modifiers
 
 JP_state_kioto_modifier:0 "Императорский трон"
 JP_state_kioto_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_jap_state_kioto\n\n\n\n\n\n\n\nДревняя столица, где под сенью золотых пагод и императорских садов бьется сердце Японии. Здесь, в залах дворца Госё, Император утверждает указы о реформах, а ученые Академии Рангаку творят чудеса: паровые турбины соседствуют с шелкоткацкими станками, а в обсерваториях вычисляют траектории комет. Киото - символ синтеза традиции и прогресса, где каждый камень хранит дух «просвещенной монархии». Но за высокими стенами кипят интриги: сторонники сёгуната шепчутся в чайных домах, а купцы из Осаки скупают землю под заводы..."
 JP_state_edo_modifier:0 "Столица Востока"
 JP_state_edo_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_jap_state_edo\n\n\n\n\n\n\n\nГород контрастов, где дым фабричных труб затмевает солнце, а по каналам плывут баржи с углем и сталью. Эдо - тигель японской индустрии: верфи строят броненосцы по новым чертежам, текстильные мануфактуры снабжают всю Азию, а на улицах слышна речь голландских инженеров. Здесь нет места сёгунским предрассудкам или императорскому церемониалу; главный бог Эдо - прогресс, измеряемый в тоннах чугуна и длине железных дорог. Но нейтралитет хрупок: кланы спонсируют стачки, а шпионы Сендая воруют патенты."
 JP_state_sendai_modifier:0 "Крепость Сёгуна"
 JP_state_sendai_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_jap_state_sendai\n\n\n\n\n\n\n\nСуровый северный бастион, где вместо заводов - арсеналы, вместо университетов - школы бусидо. За стенами замка Дата-Масамунэ сёгун вершит суд, его самураи клянутся мечом верности, а крестьяне платят дань рисом и порохом. Здесь запрещены «еретические» станки из Эдо, зато кузницы куют лучшие клинки Японии. Сендай - оплот старого порядка: здесь чтят кодекс чести, презирают реформы Императора и готовятся к войне. Даже воздух пропитан железом и яростью."
 JP_state_kanto_modifier:0 "Особый регион"
 JP_state_kanto_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_jap_state_kanto\n\n\n\n\n\n\n\nЗемля, где за столетие рисовые поля превратились в лес труб и рельсов. Долина Канто - двигатель японского чуда: частные железные дороги связывают текстильные фабрики Маэбаси с портами Иокогамы, химические заводы отравляют реку Таму, а тысячи крестьян, ставших рабочими, живут в бараках у домен. Правительство зовет это «прогрессом», но для сёгуна Канто - гнойник на теле Японии, а для фермеров - конец привычного мира. Здесь рождается будущее, пахнущее серой и потом."
 JP_state_industrial_land_modifier:0 "Индустриальный регион"
 JP_state_industrial_land_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_jap_industrial_land\n\n\n\n\n\n\n\nОт дымящих верфей Сацумы до огненных домен Канто тянется пояс японского чуда. Здесь рисовые поля уступили место фабричным трубам, крестьяне сменили мотыги на рычаги паровых машин, а самурайские кланы вкладывают золото в железные дороги и текстильные мануфактуры. День и ночь грохочут молоты в кузницах Осаки, по рекам плывут баржи с углем из Микавы, а товары с клеймом «Сделано в Империи» грузят на корабли Конфедерации в Иокогаме. Но прогресс не милосерден: дети трудятся у раскаленных печей, ядовитые стоки медных рудников отравляют реки, а слухи о «машинах, крадущих души» будоражат деревни. Это плата за силу - и регион платит её сполна."
 JP_state_shogun_land_modifier:0 "Регион под контролем Сёгуна"
 JP_state_shogun_land_modifier_desc:0 "\n\n\n\n\n£GFX_modifier_desc_jap_shogun_land\n\n\n\n\n\n\n\nЗемли, где время замерло: в замках правит самурайская элита, крестьяне пашут вручную, а «реформы Императора» - пустой звук. Сёгун запретил строить фабрики («дабы не осквернять дух предков»), ограничил торговлю с Эдо и казнит «предателей», купивших паровые плуги. Лишь тайком, по ночам, сюда проникают контрабандные винтовки и книги по химии. Но давление растет: голодные бунты и слухи о железных дорогах в Канто сеют сомнения даже среди верных буси."
 JP_state_prison_island_modifier:0 "Тюремный остров"
 JP_state_prison_island_modifier_desc:0 "Мрачный утес в Японском море, куда ссылают врагов режима: реформаторов, требующих конституции, крестьян-бунтовщиков и учёных, осмелившихся критиковать сёгунат. Здесь нет ни заводов, ни дорог - только каторжники в рубищах, добывающие серу под кнутом надсмотрщиков. Письма с острова не доходят, побеги тонут в тумане, а императорские инспекторы называют Оки «местом очищения душ». Но в пещерах узники пишут стихи о свободе..."
 JP_state_tsusima_island_modifier:0 "Остров особого назначения"
 JP_state_tsusima_island_modifier_desc:0 "Ключ к Корейскому проливу, за который столетиями спорят Япония и Чосон. Цусима - не просто скала: её гавани полны контрабандистов, торгующих опиумом и ружьями, форты следят за кораблями Конфедерации, а деревни живут под двойным гнётом - самурайских гарнизонов и корейских налогов. Местный даймё лавирует между Сеулом и Эдо, но в тавернах шепчут: «Скоро решат силой». Здесь пахнет порохом и солёным ветром перемен."
 JP_state_okinawa_trade_node_modifier:0 "Все азиатский порт"
 JP_state_okinawa_trade_node_modifier_desc:0 "Жемчужина Восточно-Китайского моря, где сливаются пути Европы и Азии. В порту Наха разгружаются клиперы Конфедерации с машинами и тканями, китайские джонки везут чай и фарфор, а японские эмиссары скупают оружие. Рюкю - «вольный город» под соломенным зонтиком нейтралитета, но за фасадом рынков скрывается жестокая реальность: 90% доходов идёт в Киото, сёгун мечтает аннексировать остров, а местные князья молят Императора о защите. Торговля здесь — тонкая игра на лезвии катаны."
 
 #Aztec State Modifiers
 
 AZT_collapse_of_the_extractive_industry_state_modifier:0 "Крах добывающей промышленности"
 AZT_collapse_of_the_extractive_industry_state_modifier_desc:0 "К сожалению мы не смогли сдержать в стабильности нашу ресурсодобывающую промышленность, поэтому мы вынуждены восстановить прежние объемы добычи, пока это не сказалось на других регионах."
 AZT_collapse_of_the_extractive_industry_state_modifier_1:0 "Крах добывающей промышленности"
 AZT_collapse_of_the_extractive_industry_state_modifier_1_desc:0 "К сожалению мы не смогли сдержать в стабильности нашу ресурсодобывающую промышленность, поэтому мы вынуждены восстановить прежние объемы добычи, пока это не сказалось на других регионах."
 AZT_collapse_of_the_extractive_industry_state_modifier_2:0 "Крах добывающей промышленности"
 AZT_collapse_of_the_extractive_industry_state_modifier_2_desc:0 "К сожалению мы не смогли сдержать в стабильности нашу ресурсодобывающую промышленность, поэтому мы вынуждены восстановить прежние объемы добычи, пока это не сказалось на других регионах."
