 unit_limit_label:0 "§HМаксимальное количество дивизий§!"
 unit_limit_desc:0 "Каждая страна в зависимости от своего статуса может иметь не больше лимита дивизий. В противном случае будут возникать проблемы с логистикой.§L\n\n- §YКолониальная зона§! - 10 дивизий\n- §YНебольшая колония§! - 20 дивизий\n- §YКолония средних размеров§! - 30 дивизий\n- §YКолониальная автономия§! - 50 дивизий\n\n- §YМаленькая страна§! - 20 дивизий\n- §YСтрана средних размеров§! - 30 дивизий\n- §YБольшая страна§! - 50 дивизий\n- §YПотенциальная мировая держава§! - 100 дивизий\n- §YМировая держва§! - 150 дивизий\n\nСтраны с уникальным лимитом дивизий:\n\n- §Y[RUS.GetName]§! - 250 дивизий§Y\n- [QIN.GetName]§! - 250 дивизий"

 unit_limit_desc_above_limit:0 "\n\n--------------\n\n§RWe have currently exceeded our capacity, and the only way to alleviate the stress on our country will be to remove some of our divisions.§!\n\nDivision Organisation: [?mobilisation_penalty_var|+=%1]\nConsumer Goods Factories: [?mobilisation_penalty_var_positive|=%H0]\nFactory Output: [?mobilisation_penalty_var|+=%]\nTraining Time: [?mobilisation_penalty_var_positive|-=%]\nReinforce Rate: [?mobilisation_penalty_var|+=%1]"