 aotsm_common_story_text:0 "\n        Поворотным моментом для истории Балкан, да и мира в целом, стал провал турецкой экспансии за Босфор и Дарданеллы. Ослабшая и разоренная Византия смогла пережить своего противника и сохранить мир на Балканах для потомков. \n\n        В следствии сохранения «Хрустальной империи», торговля с Европы с Азией не была прервана и товарооборот между государствами двух регионов, не только, не уменьшился, но и во многом вырос. Из-за этого доводы о необходимости нахождения пути в Индию через Запад Колумба разбиваются в прах, а сам Христофор до конца жизни в 1514 году пытался получить согласие на оплату экспедиции, начиная от кастильских, арагонских и португальских, переходя мимо английского и французского, заканчивая даже норвежским королями и венецианским дожем. \n\n        Эпоха великих морских исследований начинается в 20-х годах XVI века, когда португальский мореплаватель Васко да Гама попытался оплыть Африку с юга и найти альтернативный путь в Индию. В 1519 году началась его экспедиция из Лиссабона и уже в 1521 году он доплывает до Индии и города Каликут, вернувшись обратно в Португалию в 1523 году с доказательствами в виде пряностей. Невероятный успех Гама смог вдохновить многих португальских мореплавателей на подвиг и повторить свой путь. В 20-х годах стали появляться первые фактории на африканском побережье, первой из которых становится фактория на Мысе Доброй надежды.  \n\n        В последующие годы к торговле и исследованию земель, расположенных вдоль морского пути вокруг Африки, присоединились и другие крупные европейские страны. Испания с экспедициями Бартоломе Ферро и Томаса де Барланга, а так же Великобритания и Франция с более мелкими экспедициями. Колонизация Африки была бессмысленна, поэтому на западном, южном и восточном берегу возникло множество факторий. \n\n        В 1553 году англичане по ошибке заплыли в устье Двины, где ныне находится Архангельск, где были радушно встречены, а после принятым царём русским. В 1554 году были заключены русско-английские торговые договоры, а в 1555 году была создана Московская компания, Россия стала для Англии важным торговым союзником, как и Англия для Москвы. \n\n        В XVI век Европа вступила с назревающим религиозным конфликтом между протестантами и католиками, который закончился в 1648 году Вестфальским миром подтвердивший раздробленность Священной Римской Империи и уравнял католиков и протестантов. \n\n        Активные экспедиции португальцев в Индийском океане позволил в 1542 году приплыть к берегам Японии, а в 1580 начать активную торговлю с Японскими сёгунами, в 1600 была начата активная торговля с Китаем, и общий поток товаров из Китая и Японии через Индийский океан вокруг Африки получил название «Морской Шёлковый Путь». \n\n        В 1640 году  началась Английская революция, которая окончилась в 1653 году с установлением протектората Кромвеля. По сути, в стране установилась диктатура, которая навела порядок, и подчинивший Шотландию и Ирландию, тем самым, образовав Конфедерацию Британских Островов. \n\n        Дальнейшая колонизация в XVII и XVIII веке позволили мореплавателям в 1762 году открыть и основать колонию на Гавайях, а в 1787 году и восточное побережье Кромвленда и позднее Амазонии. С этого момента начинается активное исследование земель "Нового Света".\n\n"
 
 aotsm_russian_story_1_text:0 "\n        В конце XV века начал назревать конфликт между Московским царством и Ромейской империей. Причинами соперничества стали религиозный конфликт между русской и ромейской православной церковью, а также личный конфликт правящих родов. Поход на Царьград, не смотря на  успехи в начале компании, войска  были полностью уничтожены под Константинополем, что привело к поражению и снятию со стен Константинополя символов былых побед . С этого момента Россия и Ромея станут соперничать за господство на Чёрном море и других регионах, а православие окончательно разделится на Ромейское и Московское\n\n        В июле 1652 года произошел очередной накал отношений между Москвой и Константинополем, на этот раз из-за религиозных реформ Московского патриарха Никона, которые Константинопольский патриарх отказался принимать и счёл еретическими. В центральных землях при Алексее Михайловиче окончательно утвердилось крепостное право. В стране стали часты восстания.Начало царствования Александра I сопроводила война 3 коалиции против сил Наполеона Бонапарта. Поддержав  коалицию, отправив 120 тысячный экспедиционный корпус под командованием Михаила Кутузова. Благодаря его полководческому таланту, русские войска внесли весомый вклад в боевые действия в ходе битвы при Аустерлице и последующих сражениях. Однако, французская армия успешно сохраняла инициативу в своих руках в плоть до битвы при Йене, где она была наголову разбита коалицией во главе с прусской армией.\n\n        C XVIII века России стратегически был необходим сухопутный доступ к великому шелковому пути, ради этого Александр I начал войну с Казахским ханством.  Попытка экспансии в Средней Азии встретила противодействие со стороны Ромеи. Командующим российскими войсками во время центрально-азиатской компании был назначен Николай Николаевич Раевский. По началу компании 1820-1821 года успех был на стороне русских войск, они смогли занять центральную часть Казахского ханства, но из-за сильного сопротивления местного населения, а так же повальной коррупции в рядах царской армии, войска Раевского исчерпали свой наступательный ресурс к весне 1822 года. Этим воспользовались мусульманские правители Средней Азии, которые выступили единым фронтом против русских, подписав в Ташкенте в марте 1822  года союзнические договорённости. В июле 1822 русская армия была побеждена и покинула Алмату. Поражение в битве привело к позорному уходу русской армии из Средней Азии.В результате провала кампании генерал Равеский  был расстрелян, а  русскому дворянского общества получило сильный удар, что повлекло за собой рост недовольства народа.\n\n        В 1816 году было создано тайное общество — «Союз Спасения».Через 2 года на его основе  формируется «Союз благоденствия», насчитывавший более 200 человек и настроенный более решительно. В 1821 году «Союз благоденствия» объявил о самороспуске, а на его основе были созданы «Северное» и «Южное тайные общества», лидеры которых имели программы революционных преобразований. Они надеялись захватить власть путём военного переворота в столице и поддержки его в провинции.\n\n"
 
 aotsm_russian_story_2_text:0 "\n        После смерти Александра Павловича и начала междуцарствия тайные общества решили выступить против нового императора, что привело к открытому восстанию в декабре 1825 года. Заговорщики решили воспользоваться сложной юридической ситуацией, сложившейся вокруг прав на престол после смерти императора. С одной стороны, имелся секретный документ, подтверждающий отказ от престола Константина Павловича, что делало наследником престола Николая. Он же, после его зачтения в сенате не признал действительным этот документ, без подтверждения своего брата Константина.\n\n        27 ноября 1825 года население было приведено к присяге Константину и формально в России появился новый император. Как только Константин узнал, что Николай отказывается принимать престол без подтверждения его отречения, он был вынужден отправиться в Петербург, дабы решить данное досадное недоразумение.\n\n        14 декабря в столице страны произошло восстание декабристов в связи с тем, что новоиспеченный император так и не объявился в Санкт-Петербурге. Состояние неопределённости длилось очень долго.\n\n        К 11 часам утра, 14 декабря 1825 года на Сенатскую площадь офицеры-декабристы (штабс-капитаны гвардии Александр Бестужев, Михаил Бестужев, Дмитрий Щепин-Ростовский) вывели ещё около 800 солдат Московского лейб-гвардии полка, также к ним присоединился и Александр Якубович с матросами и измайловским полком, несколько позже - рота лейб-гвардии Гренадерского полка поручика Александра Сутгофа, ещё позднее - новоявленный диктатор Трубецкой, который привёл на площадь гвардейский конный экипаж, лейб-гренадёров и финляндский полк. За несколько часов «молчаливого противостояния» было совершено лишь несколько случайных выстрелов в воздух. Не выдержав напряжения, представляющий правительственные силы, Николай Павлович лично вышел на площадь, чтобы избежать ненужных жертв и сохранить репутацию. В результате встречи с восставшими и под давлением сложившейся ситуации он подписал документ о своем отречении в случае становления императором всероссийским.\n\n        16 декабря Константин, находившийся в полном неведенье о ситуации в столице, прибыл в Петербург. Увидев город в руках декабристов, он решил подтвердить свое отречение, не найдя иного выхода из подобной ситуации. В связи с отказом обоих претендентов на престол от царствования, Сенат решил удовлетворить требования декабристов.\n\n        В результате реформ, последовавших за событиями декабря, Российская империя стала президентской республикой, где глава государства  избирался Народным Вече, однако вопрос срока его полномочий никем так и не был поднят. По итогам выборов 1 президентом обновленного государства стал князь Сергей Петрович Трубецкой. Однако,  ввиду сохранения сильного влияния дворянства, большинству обещанных реформ так и не суждено было сбыться.\n\n        В марте 1825 году с огромнейшими поправками был принят единый свод законов Российского государства за авторством проекта С.П. Трубецкого, закрепившая неопределённость политики декабристов.\n\n        В начале 1830 года, под давлением своего окружения и из-за сложной внутренней ситуации в стране Трубецкой покинул пост, уйдя на почетную пенсию. Новым президентом стал Иван Иванович Пущин, получивший в свои руки государство с множеством проблем.\n\n"
 
 aotsm_prussian_story_1_text:0 "\n                                                                           Формирование и становление Пруссии\n\n        История Пруссии берёт начало с XIII века, когда Тевтонский орден, германский рыцарский орден, основал свои владения в землях балтийских пруссов после крестовых походов против языческих племён. К XV веку орден контролировал обширные территории, включая Померанию и Восточную Пруссию, но его власть ослабла из-за внутренних конфликтов и поражений, особенно после битвы при Грюнвальде в 1410 году. В 1525 году великий магистр Тевтонского ордена Альбрехт Гогенцоллерн секуляризировал орденские земли, провозгласив Герцогство Пруссия, которое стало вассалом Польского королевства (Речи Посполитой). Этот шаг заложил основы для будущей независимости и укрепления Пруссии как государства.\n\n        Ключевым моментом стало подписание Велявско-Быгдощского трактата в 1657 году, освободившего Пруссию от вассальной зависимости от Речи Посполитой. Курфюрст Фридрих Вильгельм, известный как Великий курфюрст, использовал этот договор для укрепления независимости и начала объединения германских земель вокруг Берлина, противопоставляя его влиянию Вены, где доминировала Габсбургская монархия. В 1701 году Пруссия была провозглашена королевством, что значительно повысило её статус в Центральной Европе. Король Фридрих I и его преемники активно расширяли территории, в частности за счёт Силезии, укрепляя экономический и военный потенциал. В XVIII веке началась разработка новой военной доктрины, которая обеспечила Пруссии успехи в войнах против Наполеона и других противников.\n\n                                                                                    Участие в коалиционных войнах\n\n        В 1805 году Пруссия присоединилась к Третьей коалиции, куда также входили Конфедерация Британских островов, Австрийская империя и Неаполитанское королевство, для противодействия Наполеону. Франция, преобразованная в империю под руководством Наполеона, захватила Испанию, превратив её в марионеточное государство. Пруссия, опираясь на свою военную доктрину, активно готовилась к конфликту, укрепляя армию и оттачивая тактику. Ключевым событием стала битва при Йене в 1806 году, где прусские войска, воспользовавшись непогодой и поддержкой союзников, нанесли сокрушительное поражение армии Наполеона. Эта победа укрепила позиции Пруссии в германском регионе и повысила её престиж среди европейских держав.\n\n        Итогом войны стал Реймский мирный договор, подписанный в декабре 1806 года, который восстановил границы до начала коалиционных войн. Пруссия, Россия и Австрия договорились о переделе Польши, а Эльзас и Лотарингия отошли к проавстрийскому княжеству. Победа при Йене сделала Пруссию более уверенной, а изобретение лейпольдита и организация его безопасного производства стали важными достижениями. Германские инженеры совершенствовали военную доктрину, позже названную «блицкриг», а разработка прототипов «Panzer» — ранних бронированных машин — укрепила военную мощь Пруссии, позволив ей претендовать на лидерство в германском регионе.\n\n"

 aotsm_prussian_story_2_text:0 "\n                                                                            Отношения с Ромейской империей\n\n        Прусско-ромейские отношения начали укрепляться в конце XVIII века. В 1786 году был подписан Георгиевский трактат, установивший границы между Ромейской империей и Россией на Северном Кавказе, что позволило Пруссии и Ромее избегать прямых конфликтов и сосредоточиться на своих региональных целях. В 1797 году германский язык был объявлен третьим государственным в Ромее, что стало символом роста доверия между государствами. Во время войны Третьей коалиции (1803–1806) Ромейская империя направила экспедиционный корпус в 20 тысяч человек, понёсший тяжёлые потери (90%), но ромейский добровольческий легион сыграл важную роль в битве при Йене, поддержав прусские войска и внеся вклад в победу над Наполеоном.\n\n        В 1830–1833 годах, во время Месопотамской войны, когда арабское государство при поддержке Конфедерации Британских островов напало на ромейские земли на Ближнем Востоке, Пруссия оказала Ромее дипломатическую и материальную помощь. Это позволило ромейским войскам отбить нападение и вернуть свои территории, укрепив прусско-ромейский альянс. Сотрудничество в военных и дипломатических вопросах создало прочный фундамент для дальнейшего взаимодействия, хотя Ромея оставалась сосредоточенной на своих ближневосточных и азиатских территориях.\n\n                                                          Революция 1848 года и борьба за лидерство в Германии\n\n        К 1840 году соперничество между Пруссией и Австрийской империей за контроль над германскими землями достигло апогея. Пруссия стремилась объединить Германию под своим руководством, но организованность революционных сил препятствовала достижению решительного превосходства. В 1848 году вспыхнула Мартовская революция, известная как «Весна народов», которая привела к формированию Союза Германских Наций — попытки создать единое германское государство. Однако амбиции Пруссии столкнулись с противодействием Австрии, которая стремилась сохранить своё влияние в южной Германии.\n\n        Австрия предприняла попытки военного вторжения в южные германские земли, что вызвало резкую реакцию Пруссии. Прусский король, провозглашённый императором Германии, неоднократно требовал от Австрии вывести войска, но эти требования игнорировались. К 1849 году напряжение достигло предела, и Пруссия начала подготовку к военным действиям против Австрии за господство в германском регионе. Революционные волнения, охватившие Европу, осложняли ситуацию, но Пруссия использовала их для укрепления своих позиций, поддерживая националистические настроения в германских землях.\n\n"

 aotsm_prussian_story_3_text:0 "\n                                                                              Пруссия на пути к доминированию\n\n        К 1849 году Пруссия полностью перешла на военные рельсы, став одной из самых грозных сил в Европе. Победа при Йене, успешные военные реформы и технологические достижения, включая прототипы «Panzer», укрепили её военный потенциал. Дипломатические связи с Ромейской империей, подкреплённые совместной борьбой против Наполеона и поддержкой в Месопотамской войне, обеспечили Пруссии надёжного союзника, что усиливало её позиции в противостоянии с Австрией. Идея объединения Германии под прусским руководством и противостояния Австрии захватила умы граждан. Страны Европы ощущали мощь прусской военной машины, и вопрос оставался открытым: сможет ли Пруссия стать доминирующей силой в Германии или её амбиции рухнут, как карточный домик?\n\n"
 
 aotsm_byzantium_story_1_text:0 "\n                                                                                         Междуцарствие §21341 - 1344§! год\n\n     Летом 1341 года скончался император Андроник III Палеолог, управлявший государством на протяжении 15 лет. Девятилетний Иоанн V Палеолог не был коронован, хотя и был наследником - назначенным соправителем, что привело к вакууму власти, а позднее и к началу гражданской войны. Первоначально его главным соперником являлся Иоанн VI Кантакузин, однако в ходе боевых действий народ стал симпатизировать мудрому военачальнику Захариасу Захареас, который пытался облегчить жизнь мирных жителей в этот тяжелый момент. Захариас Захареас решил объединить зилотов, варлаамитов и паламитов следующим образом: отныне паламиты могли и дальше исповедовать свою веру, что поощрялось военачальником, а большая часть сэкономленных средств тратилась на налаживание отношений с варлаамитами - таким образом, Захариас Великий смог прийти к консенсусу и, согласно Фессалонскому мирному договору "Христианскому миру", преследования как православных, так и католиков прекратились; наказание за нарушение прав оных каралось смертной казнью. Со временем его влияние стало столь высоко, что оба претендента на престол под давлением граждан и военных, отказались от желанного титула, после чего жители Ромеи провозгласили Захариаса Великого новым императором.\n\n                                            Правление Захариаса I годы жизни: §21307 - 1379§! годы правления: §21344 - 1379§!\n\n     Будучи народным избранником, Захариас I Захареас понимал запросы своих подданных, поэтому первые годы правления он обеспечивал полное прекращение войн для восстановления экономики и торговли Ромейской империи после Гражданской войны. К началу 1346 года из-за усиления угрозы со стороны осколков Сельджукской империи Захариас Великий начал укреплять крепости в области Дарданелл. Несмотря на все предпринятые меры по усилению крепостей в Дарданеллах, полноценно реализовать полностью планы помешала вспышка «Чёрной смерти», которая, в связи с политикой помощи Захариаса I Захареаса по восстановлению страны и помощи народу Ромеи, была не столь смертоносна, как в Западной Европе. Опасения Захариаса Великого оправдались, когда в 1352 году османский султан Орхан Гази объявил ему войну и начал осаду крепости Цимцы. Осада длилась вплоть до начала 1354 года, и закончилась только из-за разрушившего небольшую часть стен Фракийского землетрясения, что, тем не менее, было весьма значительным ударом. После турки предприняли попытку вторжения на территорию Греции, но их истощённая долгой осадой армия потерпела сокрушительное поражение в Галлиполи, потеряв при отступлении большую часть турецкого флота, но положение ромеев было столь тяжёлым, что они решили подписать мир, по условиям которого турки получили всё восточное побережье Эгейского моря. Восстановив престиж империи после победы над турками, в 1355 году Захариас сумел заключить с Папой Римским «Святой пакт», основными целями которого были привлечение денежных потоков на восстановление разорённых земель государства и дальнейшей помощи в битвах с мусульмано-тюркскими захватчиками на территории Малой Азии. Взамен Ромейская Империя обязалась не предпринимать в дальнейшем попыток захвата земель в Европе.\n\n"
 
 aotsm_byzantium_story_2_text:0 "\n                                            Правление Константина XI годы жизни: §21349 - 1417§! годы правления: §21379 - 1417§!\n\n     Наследник Захариаса I Константин XI считал, что любая война будет слишком тяжелым бременем на плечах возрождающегося государства, поэтому агрессивной экспансии он предпочел хитрую дипломатию и укрепление империи в нынешних границах. Его организационный гений, вместе с финансовой поддержкой Святого престола,  принёс Ромейской Империи процветание и полностью восстановил экономику некогда дряхлеющей страны. Благодаря посредничеству со стороны Папы Римского, император Константин XI смог договориться с Венецией и Генуей о покупке островов, которые были получены ими в ходе Четвертого Крестового похода. Таким образом были возвращены Корфу, Крит и острова Киклады. Помимо очевидной политической и территориальной выгоды от этих сделок, ромеи получили и ключевые торговые точки, которые дали империи возможность монополизировать торговлю с Азией и сохранить контроль над Шёлковым путем.\n\n                                            Правление Михаила IX годы жизни: §21381 - 1469§! годы правления: §21417 - 1469§!\n\n     Правление Михаила IX считается одним из благоприятных в истории Ромейской империи. ОН начал военную кампанию по возвращению владений империи в Малой Азии, в 1467 году он объявил войну османскому султану Мехмеду II и разбил его армию под стенами Никомедии в 1468 году, навсегда ликвидировав бейлик-Осман как политическую силы в Малой Азии. В 1468 году, был созван крестовый поход против турецких бейликов в Анатолии. В октябре 1468 года состоялось генеральное сражение христианского войска, ведомого лично ромейским императором Михаилом IX и армии султана Ибрагима ll у небольшого поселения под названием Каледжик. Сражении длилось два дня, с перерывом на ночной отдых. На третий день битвы янычары Ибрагима ll, понимая что успех войны будет за христианским войском совершили открытый мятеж и свергли султана, преподнеся его голову ромейскому императору, озадаченные поступком янычар турецкие войска на четвертый день сложили оружие и сдались на милость христианского войска но венгерские рыцари и солдаты, убитый горем гибели Владислава III казнили большую их часть. После победы при Каледжике христианское войско вошло в Анкару, дальнейшее продвижение в глубь Малой Азии шла очень неспешно. Тем не менее граница упорно двигалась всё глубже и глубже на восток, ромеи и крестоносцы разбили тюркское ханство Ак-Коюнлу и завладели его столицей Диарбекиром, затем в конце 1468 году в Адане произошло армянское восстание против власти осколков Караманского Султана, в январе 1469 года в Адану высадился с небольшим войском король Кипра Жак ll де Лузиньян, которые имея юридические права быть королем Киликийской Армении и объявил себя им по факту, затем Жак ll присягнул на верность ромейскому императору Михаилу IX, что так же сделал и деспот Трапезунда Иоанн Комнин. Но Михаилу так и не суждено было закончить эту войну, ибо он скончался в 1469 году.\n\n"

 aotsm_byzantium_story_3_text:0 "\n                                            Правление Захариаса II годы жизни: §21417 - 1472§! годы правления: §21469 - 1472§!\n\n     Одновременно с анатолийским крестовым походом в 1457 году в Константинополе зародился ромейский ренессанс. Этот период во внутренней жизни Ромейской империи ознаменовал начало строительства библиотек, театров и многих других культурных и просветительных объектов по всей территории империи. Анатолийский крестовый поход был закончен в 1470 году с падением последнего оплота власти турецких бейликов и захватам крепости Карс, что открывало дальнейшую возможность Ромейской империи по освобождению всего Закавказья. Захариас II посвятил свое правление созданию системы управления, способной эффективно контролировать новоприобретенные земли. Для достижения этой цели он начал реформировать внутреннее новое административное устройство империи, однако завершить эту задумку предстояло уже следующему императору Михаилу X: во время одной из поездок по Анатолии император заболел «Болезнью аристократов» - Подагрой и скоропостижно скончался, просидев на троне всего 3 года.\n\n                                                Правление Михаила X годы жизни: §21419 - 1500§! годы правления: §21472 - 1500§!\n\n     Место покойного занял его брат Михаил X, считавший, что его предшественник пал жертвой заговора, а не случайной болезни. Одержимый этой идеей, новый правитель обновил судебник, ужесточив наказания за серьезные преступления, а также начал преследование несогласных со своей политикой, считая их возможными убийцами брата. Помимо этого, он покровительствовал процессу эллинизации Западной Анатолии. Но главным испытанием императора Михаила X стала война с Русским царством. Русское Царство, заявившее, что не признает византийских императоров из династии Захареас наследниками Рима, вторглась на их территорию в конце 1499 года. Война началась крайне неудачно для Ромейской империи - войску русского царства удалось захватить морские пограничные крепости и начать свой марш на Константинополь. Ситуация осложнялась еще и большим хаосом из-за смерти императора Михаила.\n\n                                            Правление Иоанна V годы жизни: §21452 - 1527§! годы правления: §21500 - 1527§!\n\n     Однако Иоанн смог быстро стабилизировать ситуацию и взять армию под личное управление, а после на голову разбить наступающие войска Московии, вынудив московского князя просить мира. С этого момента между Московским царством и Ромейской империей начались долгие враждебные отношения. В 1507 году был официально возрожден сенат Ромеи, слоган S.P.Q.R вновь стал украшать правительственные здания империи. Хоть такое решение и уменьшило власть императора, оно не смогло полностью изменить политический курс государства. Главным преимуществом сената стал рост доверия людских масс к власти. Особенно сильно сенат поддерживал Захариаса III, который запомнился как один из самых либеральных деятелей Ромейской империи.\n\n"
 
 aotsm_byzantium_story_4_text:0 "\n                                            Правление Захариаса III годы жизни: §21486 - 1567§! годы правления: §21527 - 1567§!\n\n     За свое сорокалетнее правление он значительно увеличил влияние сената и вернул возможность выходцам из низших слоев населения право избираться в сенат.Он же приложил большие усилия для восстановления и реформирования ромейской армии, также при нём началось активное перевооружение на стандартизированные образцы новейшего огнестрельного оружия. Закончив реформы армии, империя решила опробовать свои силы на закавказском направлении, поддержав христианские восстания в местных тюркских владениях. В ходе кампании 1530 - 1535 годов в лоно империи вернулись территории всего региона, а ромеи окончательно убедились в эффективности войск нового образца. В 1535 году Ишхан Захарян как тиран Армении и царь Грузии Лаурсаб Багратиони в добровольном порядке присягнули на верность греческом базилевсу Захарию III, с этого момента Армения и Грузия является частью Ромейской Империи.\n\n                                            Правление Захариаса IV годы жизни: §21503 - 1567§! годы правления: §21527 - 1567§!\n\n     В 1585 году под предводительством императора Захариаса IV Ромейская империя начала Великий Сирийский поход против Мамлюкского султаната, основной целью которого было получение контроля над Иерусалимом. В этом же походе Захариас IV в битве, император был сражен лучником мамлюкского султаната и погиб, просидев на троне меньше трёх лет.\n\n                                            Правление Константин XII годы жизни: §21537 - 1591§! годы правления: §21567 - 1591§!\n\n     Под командованием Константин XII война с Мамлюками шла достаточно успешно, однако приняла затяжной характер и истощила ресурсы империи после того, как против захватчиков сплотились мусульмане Ирака, Сирии и Египта. Это привело к тому, что в 1589 году военные действия в регионе были завершены, две враждующие державы заключили шаткий мир. К Ромейской империи отошли только земли Сирии, и «Священный город» - Иерусалим не был возвращен в состав империи.\n\n                                               Правление Иоанна VI годы жизни: §21572 - 1639§! годы правления: §21591 - 1639§!\n\n     Начиная с 1601 года ромейская армия успешно вела боевые действия с тюркским ханством Кара-Коюнлу и в междуречье, к 1637 году полностью подчинив себе все земли Месопотамского бассейна.По пути назад к берегам Эгейского моря армия, окрыленная своим успехом, предприняла попытку локального вторжения на Святую Землю. Из-за того, что мусульмане, погрязшие в междоусобицах, не ожидали атаки со стороны ромейского войска, ситуация на данной территории сложилась вполне успешно для Константинополя и из небольшого рейда это переросло в полномасштабное наступление. Менее чем за два года имперская армия смогла захватить земли от Бейрута до Синая, тем самым лишив мусульманских правителей Ближнего Востока выхода в Средиземное море.\n\n                                             Правление Михаила XI годы жизни: §21600 - 1667§! годы правления: §21639 - 1667§!\n\n     В 1640 году под руководством Михаила XI Захареаса началась первая большая реформа образования. Её целью было сделать греческий и латинский языки доступными всем в империи, также скупались книги из других стран для последующего перевода на них. За следующие десятилетия научная база страны укрепилась настолько, что Ромея стала общепризнанным научным центром. Теперь все ведущие учёные мира не могли обходиться без знания ромейского языка.\n\n"
 
 aotsm_byzantium_story_5_text:0 "\n                                            Правление Константина XIII годы жизни: §21628 - 1691§! годы правления: §21667 - 1691§!\n\n     1679 год является ключевым для Католической и Ромейской церкви. В этот год случилось, казалось бы, немыслимое: Папа Римский прочитал католическую проповедь в Соборе Святой Софии, а Вселенский Патриарх - православную в Соборе Святого Петра. Это был первый шаг к примирению двух ветвей одной религии.\n\n                                            Правление Константина XIV годы жизни: §21669 - 1721§! годы правления: §21691 - 1721§!\n\n     При правление Константина XIV государство ромеев начало активно расширять своё влияние на других материках. 1707 является годом основания факторий в Южной Африке. С 1709 по 1715 годы вливались огромные средства в Византийскую Индию. 12 мая 1710 года  Ромейская Империя, в лице патриарха Каллиника II Акарнанского, попыталась провести религиозную «реформу» на территории Армении и Киликии, это вызвало огромный всплеск недовольство властями Ромейской империи среди практически большинства армян, даже среди наиболее про-имперской армян. Также реформисты Каллиника II провели схожий план с грузинской и абхазской православными церквями. Если в Грузии это не вызвало больших масс недовольных то в Армении данное решение вызвало огромный всплеск антиромейских выступлений. Армении начали возникать партизанские отряды (гайдуки) именуемые себя «фидаинами» они боролись за отмену церковной реформы 1710 года, греческой администрации до нахиджеванского инцидента удавалась сохранять порядок в регионе жёсткими методами. В 1715 году город Нахиджеван был захвачен  вооружёнными  отрядами  местных тюркских аскяров, во главе с Махмудом Ханом. Ромейское правительство в лице кавказской администрации попыталось решить вопрос мирно и признать автономность данного образования, однако 12 мая мэр Нахиджевана Артур Арутюнян обратился  с призывом освободить город к Давид-Беку, на тот момент сыну князя Сюника и Арцаха.  Давид-Бек сделал прекрасную карьеру в византийской армии и отличался хорошим полководческим талантом. По договорённости с Артуром Арутюняном Давид-бек пришёл с ополчением в Нахиджеван и решил справиться с тюрками своими методами. Сам Артур Арутюнян позднее признаёт, что затея оказалась глупой, и что Давид-бек напрасно обвиняет Ромею и базилевса в последствиях. К тому же, как выясняется уже после подавления восстания братьев гор по донесениям ромейской разведки, Давид-бек уже тогда действовал в качестве русского агента.\n\n                                            Правление Константина XV годы жизни: §21701 - 1781§! годы правления: §21721 - 1781§!\n\n     С 1746 года, в связи с тем, что государственный аппарат перестал справляться с управлением землями, начался процесс децентрализации Византии. Так на картах появилось полу-автономные государства И.П. Анатолия и И.П. Кавказ. На картах стали выделять Иудейский и Месопотамский Федераты. Эти два государства относятся к Ромейской империи, но формально являются свободными. С 1722 по 1725 годы, при поддержке Мхитара Спарапета, Давид-Бек возглавил вооружённую борьбу армян областей Сюник и Арцах против ромейского базилевса и лояльных ему какое то время местных тюрков, приведшую к почти полному изгнанию кызылбашей и персов из Восточной Армении.\n\n"

 aotsm_byzantium_story_6_text:0 "\n     В 1726—1728 годах армяне под предводительством Давид-Бека боролись против ромейцев, стремившихся подавить это восстание. Давид-Бек со своими войсками брал одну ромейскую крепость за другой. Весной 1725 года большая ромейская армия вошла в Арран и Ганзак, а затем взяла в тиски Арцах и Сюник. На седьмой день неравных боев воины Давид-бека, выйдя ночью из крепости, неожиданно напали на врага, который в панике, неся большие потери, обратился в бегство.После блестящей победы под Алидзором Давид-Бек преследует врага. Новый тяжёлый удар ромеи получают летом у посёлка Мегри, где вновь терпят поражение. В итоге, спустя ещё 3 года Гражданской войны вынудили ромейского базилевса Константина XV Захареаса признать победу Давид-Бека и пошёл ему на уступки. 8 апреля 1728 году Константин XV и Давид-бек подписали мирное соглашение по которому Ромея отменяет реформу церкви на территории Армении. К 1730 году со смертью приемника Давид-бека Мхитара Спарапета бунты и восстания на территории Армении прекратились в связи с отменой церковной реформы.\n\n      Вместо мирных переговоров, которые были отложены, Давид-бек очень быстро захватил город, пытал женщин и казнил множество мирных жителей, как тюрков, так и армян, от мелких лавочников до стариков и подростков. Действия Давид-бека были осуждены Императором Константином XIV Захареасом  признаны военным преступлением, так как тюрки во время инцидента не проявляли никакой агрессии и предпринимали попытки получить признание со стороны Ромейской империи.Кроме того, когда в Нахиджеван прибыли имперские солдаты, чтобы навести порядок, Давид-бек отказался их пускать до тех пор, пока армянам не разрешат снова поклоняться богу, по своим обрядам, в своих церквях. Императору, стремящемуся прекратить бесчинства и восстановить законность, пришлось согласиться. Однако это было уловка чтобы выманить и арестовать Давид-бека на переговорах с ромейским делегатом. В этот день после пленения Давид-бека родилось движение Братьев Гор, движение за освобождение Армении от владычества Ромейской империи. Первоначально в движение входили только верные Давид-беку офицеру и ополченцы с подконтрольной его отцу вотчины, но со временем движение начинает набирать популярность среди большого количества армян. Во время пребывания Давид-бека в тюрьме, в Капане умирает его отец, князь Сюника и Арцаха. После обретения свободы Давид-бек возвращается в Капан и занимает его трон. В 1718 году Давид-бек вызывает на дуэль Фому Варагороса, ромейского губернатора Кавказа, и убивает его. Позже он сбежит из Эребуни, в чём ему поможет позднее казнённый Армен Атабекян. Сам же Давид-бек отказывается считать убийство губернатора преступлением. В том же году он едва не оказывается на плахе в Шуши, куда его привезли из Манцикерта, где ромейские легионеры организовали засаду. В небольшой укреплённый город прибыл лично генерал Эммануил Скляр, но казнь была сорвана нападением на город тюркских банд. Сбежавший во второй раз Давид-бек вернулся в Капан и гражданская война в Армении разгорелась с новой силой.\n\n"

 aotsm_byzantium_story_7_text:0 "\n                                            Правление Иоанна VII годы жизни: §21731 - 1783§! годы правления: §21781 - 1783§!\n\n     В 1782 году Коптский Египет, который ранее получил поддержку в борьбе с Мамлюками в Египте, стал верным протекторатом империи, сохранив возможность вести независимую политику. Это позволило в 1791 году начать грандиозный проект постройки канала «Византий», канал должен был соединить Средиземное и Красное моря.\n\n                                            Правление Михаила XII годы жизни: §21750 - 1790§! годы правления: §21783 - 1790§!\n\n     К концу XVIII столетия стала очевидной необходимость образования союзов с другими европейскими странами. Именно это и привело к началу ромейско-прусских дипломатических отношений. В 1786 году российской императрицей Екатериной ll Романовой и ромейским императором Михаилом Xll Захареасом был подписан Георгиевский трактат, он установил нынешние официальные границы двух империй на Северном Кавказе, признаваемые Ромеей и Россией. С этого момента соперничества двух империей на Северном Кавказе перешло из открытой в холодную фазу. В 1787 году, ввиду готовящегося разрыва между Россией и Ромеей, находившиеся в Закавказье ромейские войска были отозваны на укреплённую линию. Кабардинцы прекратили боевые действия в обмен на возвращение пахотных земель Пятигорья. Кроме того, учреждено было земское войско из осетин, ингушей и кабардинцев. Поняв, что Пятигорье не будет возвращено, кабардинцы в 1790 году вышли из состава ромейских войск. Генерал Потемисис, а потом генерал Текелис предпринимали экспедиции в Черкесию, но положение дел на линии существенно не менялось, и набеги горцев беспрерывно продолжались. В 1790 году горцы двинулись в Кабарду, но были разбиты генералом Германисисом в сражении при Абазинке. В июне 1791 года командующий Северокавказским корпусом и начальник Кавказской линии Фокинис штурмом взял горцев в Анапе, причём был захвачен в плен раненый шейх Мансур.\n\n                                            Правление Михаила XIII годы жизни: §21772 - 1820§! годы правления: §21790 - 1820§!\n\n     Смена веков произошла в гуще взрывов и клубов дыма. В Европе шла Война III коалиции. Впрочем, Ромейская Империя напрямую в ней участия не принимала, ограничившись только экспедиционным корпусом в 20 тысяч человек. Потери среди личного состава добровольческого формирования в 90% оказались ужасающими. Был нанесён сокрушительный удар по военным традициям, и потому в военных кругах стали задумываться о срочной модернизации армии. Внутри самой Хрустальной империи начало 19 века было отнюдь не спокойным, на подъёме национальных чувств в 1801 году в Анатолии вспыхивает Первая Турецкая революция, организованная движением Младотурок. Византийская армия смогла подавить восстание лишь к середине 1805 года.\n\n"     
 
 aotsm_byzantium_story_8_text:0 "\n     В конце 1805 года Анатолийская администрация провела операцию «Алмазный Нож», в результате которой из Анатолии в Персию было депортировано свыше 120 тысяч турок , а в их уже бывшие дома заселили 50 тысяч греков из Эллады. В связи с этими событиями Россия и Конфедерация Британских островов подняли мусульманский вопрос в Ромеи, что окончательно испортило отношения между странами. После победы над Францией в 1806 году Ромея начала активно призывать к инвестированию в строительство канала Византий, чтобы ускорить его открытие, так как рост британских и португальских колоний начал угрожать монополии на азиатские товары. Данное решение позволило к 1820 году достроить канал, но его открытие случилось лишь в 1824 году из-за долгих испытаний.\n\n                                            Правление Захариаса V годы жизни: §21802 - 1842§! годы правления: §21820 - 1842§!\n\n     В 1830 году Арабское государство, под покровительством Конфедерации Британских островов напало на ромейские ближневосточные земли, развязав в регионе страшную и кровопролитную Месопотамскую войну, которая чуть не разрушала Хрустальную империю в 1832 году, но благодаря дипломатической и материальной помощи от королевства Пруссия, ромейские войска смогли отбиться и контратаковать, попутно вернув свои земли на Ближнем востоке. К 1832 году сенатом началась проводится новая реформа образования и подготовка государства к переходу от двуязычной к трёхъязычной системе, однако этот процесс был заморожен из-за начавшейся Месопотамской войны, о нем заговорили только после окончания войны в 1836 году. Захариас V умер в 1842 году, в возрасте 40 лет во время конной прогулки по императорскому саду из-за остановки сердца.\n\n                                            Правление Августа II дата рождения §21820§! год, дата вступления на престол §21842§! год\n\n     Как только Август II занял императорский трон, он сразу начал преобразовывать страну и проводить в империи либеральные реформы. Одной из первых принятых реформ при новом базилевса стала реформа экономики, что позволило ослабить давление инфляцию на экономику в последующие годы, также была замедлен переход от двуязычной системы к трехъязычной. И переходу к более прагматичной дипломатии. Самым напряжённым стал 1848 год, когда Россия влезла в Святой Пакт между Ромеей и Балканами, тем самым развязав руки ромейской армии. Только время покажет, какой будет Ромея при новом императоре...\n\n     А дальнейшая история находится в ваших руках. Будет ли Ромея империей над которой никогда не заходит солнце или же империя погибнет, как её было суждено в 1444 году?\n\n"     

 aotsm_france_story_1_text:0 "\n     Потерпев сокрушительное поражение в битве при Йене в 1806 году, Наполеон был вынужден отступить с германских земель.Наблюдая эту довольно значимую неудачу Императора, военные, желавшие наконец избавить страну от лидера, приведшего страну к такому состоянию, при поддержке Жана Виктора Моро и министра иностранных дел Конфедерации Британских островов Чарльза Джеймса Фокса решили воспользоваться возможностью в его отсутствие в стране, захватив власть в свои руки.\n\n     По возвращении домой Наполеон был арестован и лишён всех титулов. «Заговор XIV года» увенчался успехом.Налоги в огромном размере, а также большая усталость от войны, нищета среди населения, снизившиеся выплаты для армии и недостаток средств на дальнейшее её продолжение вынудили новое, ещё до конца не сформированное правительство пойти на множество уступок для заключения мирного договора в Реймсе.\n\n                     Жан Виктор Моро (глава временного правительства 1806-1820) Партия Порядка (1820-1830)\n\n     В 1806 году, благодаря поддержке Лондона, был установлен передный режим, а одной из первых стран, признавших новое правительство в 1808 году, стала Россия.\n\n     Пользуясь чрезвычайными полномочиями, Жан Виктор Моро первым делом издал в 1807 году Декрет о запрете бонапартизма и запрете реставрации бурбоновского автократизма. Эта инициатива возымела успех благодаря поддержке со стороны авторитетного военного Жана-Батиста Жюля Бернадота.Несмотря на это, переходный режим стал работать над улучшением собственной репутации в международных делах и на пост министра иностранных дел в 1809 году был назначен Жан-Батист Жюль Бернадот. Благодаря его дипломатическим усилиям Временное Правительство Франции смогло добиться признания со стороны Пруссии, Австрии и Ромеи.\n\n     В 1810 году Моро назначил на пост министра финансов Жана-Батиста Сэя, убедившего руководство к 1811 году заключить ряд торговых соглашений со странами, с которыми были установлены дипломатические отношения, однако, под влиянием Бернадота, правительстьво Моро не решалось на полную реализацию плана восстановления, предложенного Сэем. С 1811 года началась выплата репараций, из-за чего бюджет государства стремительно уменьшался. в 1812 году репарации были выплачены Лондону в полной мере, к 1813 году - Константинополю, к 1814 году - Вене, к 1815 году - Санкт-Петербургу, к 1816 году - Берлину.\n\n     В 1817 году произошёл финансовый кризис, связанный с дефицитом бюджета страны, вследствие чего правительство Моро всё же решилось реализовать программу восстановления за авторством Сэя под названием Laissez-faire, в рамках которой прекращалось государственное финансирование нерентабельных предприятий, резко снижалась реальная зарплата, сводился к минимуму спрос на общественные блага (готовность платить за услуги, предоставляемые государством в качестве этих самых благ), объём общих расходов уменьшился на одну треть, сократились наполовину государственные расходы, активно шел процесс отчужджения казённых имуществ."
 
 aotsm_france_story_2_text:0 "\n     Несмотря на болезненность первых этапов реформ, эта программа принесла свои плоды: снижение втрое дефицита платежного баланса (ситуации, когда страна тратит за рубежом больше средств, чем получает оттуда, и для покрытия этого разрыва ей приходится привлекать внешние источники финансирования); ликвидация дефицита государственного бюджета; снижение инфляции; оживление динамики промышленного производства; модернизация государственного аппарата в сторону роста эффективности управления и сокращении числа занятых в нём, а также рост вложений капитала со стороны entrepreneur (этрэпренеров/предпринимателей).\n\n     В 1819 году Временное Правительство издало Кодекс, основанный на Декларации прав человека и гражданина и установивший смешанный республиканский режим. В январе 1820 года была создана Партия Порядка (parti de l'ordre), лидером которой был избран Жан Виктор Моро. В результате, он стал президентом Второй Республики. Полномочия президента были обширны из-за неопределенности его прав и обязанностей в Кодексе Второй Республики.\n\n     С 1821 года была развернута широкомасштабная пропагандистская кампания, в которой людей запугивали возвращением революционного террора в случае избрания либералов, сравниваемых с жирондистами (желавшими распространить свои идеи за пределы Франции); в случае избрания социалистов - с Робеспьером; бонапартистов также обвиняли в развязывании войн, а сторонников Бурбонов - в принуждении к возвращению старых порядков. Поэтому в общественном мнении Франции стало формироваться соответсвующее представление о вышеперечисленных фракциях.Уже к 1825 году инфляция снизилась до среднего уровня; безработица сократилась; удалось расплатиться по счетам, сократив тем самым уровень государственного долга.\n\n     В 1830 году, после смерти Моро, во Франции начались беспорядки среди рабочих и ремесленников, подстрекаемые представителями левой интеллигенции Луи Огюстом Бланки и Этьеном Кабе. Возмущенный нерешительностью правительства обеспечить порядок в стране и проводить политические реформы после смерти уважаемого всеми французскими военными маршала, Жан-Батист Жюль Бернадот решил взять власть в свои руки, консолидировав предыдущую администрацию вокруг своей фигуры, что в итоге привело к становлению Третьей Республики.\n\n               Жан-Батист Жюль Бернадот (ио 1830-1834 гг.; 1834 - 1838 гг.;1838 - 1842 гг.) Республиканская Партия\n\n     Ввёл избирательное право для мужчин, основанное на имущественном цензе и отменил чрезвычайные указы, благодаря чему срок полномочий президента ограничился 4 годами, но теперь он может переизбираться на три срока, а Третья Республика стала президентской - подобные положения начали действовать в Кодексе Третьей Республики от 1830 года, основанным так же, как и предыдущий Кодекс, на Декларации прав человека и гражданина. Новоизбранный президент создал систему, при которой каждый гражданин, имеющий достаточно средств, может быть избранным на пост главы государства. В результате, сложилась ситуация, при которой люди, обладающие амбициями, предпочитали идти в Республиканскую Партию для политической карьеры в силу действующих запретов на политическую деятельность бонапартистов и сторонников Реставрации Бурбонов. Возникла либеральная фракция во главе с Дюпоном де л'Эром, которая стала оппонировать консервативной фракции сторонников Бернадота.\n\n"

 aotsm_france_story_3_text:0 "\n                        Жак-Шарль Дюпон де л’Эр (1842 - 1846 гг.; 1846 - 1848 гг.) Республиканская Партия (либералы)\n\n     В 1834 году был избран президентом Жак-Шарль Дюпон де л’Эр, кандидатуру которого на пост от либеральной фракции Республиканской Партии поддержал Жозеф-Франсуа-Оскар Бернадот. Ввёл всеобщее избирательное право для мужчин от 21 года (независимо от их финансового положения) в 1844 году.\n\n     В 1846 году правительством в стране были учреждены Национальные Мастерские в попытках борьбы с безработицей и желая получить поддержку со стороны рабочих и ремесленников, однако успехом эта инициатива не отличилась - мастерские стали рассадником революционной агитации. В результате, используя нерешительность правительства Дюпона де л'Эра, Лагранж стал набирать популярность среди ремесленников, возглавив оппозицию Республиканской Партии.\n\n                                                                                                  «Весна Народов»\n\n     24 февраля 1848 года Шарль Лагранж объявил ультиматум правительству Дюпона де л'Эра, по условиям которого Республиканская Партия должна была уступить власть лидерам бастующих группировок. Низкая организованность правительства Республиканской Партии, нерешительность и неспособность справиться с ситуацией привели к тому, что правительство Третьей Республики было вынуждено пойти на такие уступки, что ознаменовало успех Февральской Революции.\n\n                                                                           Шарль Лагранж (1849 - ...). Партия Аксьон.\n\n     Первым делом, будучи ещё членом Законодательного Собрания, амнистировал политических заключённых, ввёл свободу слова, коммерции и увеличил автономию национальных мастерских (срок полномочий главы государства остался прежним - 4 года), разрешил политическую деятельность всем республиканским партиям при сохранении Декрета о запрете бонапартизма и запрете реставрации Бурбонов, а также отменил смертную казнь - всё это вошло в положения, отныне закреплённые в Конституции Четвёртой Французской Республики от 1848 года, основанной на Декларации прав человека и гражданина.\n\n     Законодательное собрание выдвинуло его кандидатуру на пост президента в 1848 году, и уже в январе 1849 года Шарль Лагранж вступил в должность."

 aotsm_cbi_story_1_text:0 "\n                                                   Формирование Конфедерации и ранние торговые связи (1485–1603)\n\n        С воцарением Генриха VII в 1485 году началась эпоха Тюдоров, ознаменовавшая новый порядок в Англии после тридцатилетней войны роз. Народ, уставший от конфликтов, жаждал мира, а экономика, пострадавшая от войн, требовала восстановления. Генрих VII рационально управлял бюджетом, сокращая расходы на армию и погащая долги, одновременно развивая торговлю через мирные соглашения с Францией (1490-е) и Шотландией (1502, «вечный мир»). Он ограничил влияние парламента, собрав его лишь раз за последние десять лет правления, и учредил суд «Звёздной палаты» для усиления королевской власти. В 1492 году Христофор Колумб обратился к Генриху за финансированием экспедиции, но получил лишь скромную поддержку.\n\n        Генрих VIII продолжил политику отца, редко созывая парламент и сосредоточив власть в своих руках. Изначально ярый католик, он поддерживал Папу в итальянских войнах, разорвав мир с Францией и Шотландией. Победы во Франции укрепили влияние Англии, но отсутствие поддержки Испании и высокие затраты вынудили вывести войска. Ссора с Папой из-за отказа в разводе стала поворотным моментом, приведя к разрыву с католичеством. После смерти Генриха VIII в 1547 году его десятилетний сын Эдуард VI стал королём под регентством лорда Сомерсета, чьё правление сопровождалось преследованиями католиков, продажей монастырских земель и восстаниями.\n\n        Эдуард VI умер в 1553 году от туберкулёза, и трон заняла Мария, развернувшая гонения на протестантов. Её война с Францией привела к потере порта Кале — последней территории во Франции. Мария умерла в 1558 году, и власть перешла к Елизавете I. Поддерживаемая народом, она стабилизировала религиозную ситуацию и минимизировала сопротивление парламента. При ней началась активная торговля с Россией через Московскую компанию: с 5–10 кораблей в 1555 году до 100 к 1580 году, что приносило прибыль обеим сторонам.\n\n        Елизавета инициировала экспедиции вокруг Африки, основав фактории в Лагосе (1557), Фриденбурге (1562) и Машише (1564). Эти шаги укрепили торговое присутствие Англии в Африке, заложив основу для колонизации. Высокие налоги вызывали недовольство, но не препятствовали экономическому росту, который стал основой для будущей мощи Конфедерации.\n\n                                                       Реформация в Англии и появление англиканства (1530-е–1603)\n\n        В 1530-х годах Генрих VIII инициировал Реформацию в Англии, вызванную конфликтом с Папой Римским, отказавшим в разрешении на развод с Екатериной Арагонской. В 1534 году Актом о супрематии Генрих провозгласил себя главой Церкви Англии, разорвав связи с Римом и создав англиканскую церковь. Это позволило конфисковать монастырские земли, укрепив королевскую казну, но вызвало раскол в обществе между католиками, протестантами и сторонниками новой церкви. Англиканство, сочетавшее элементы католичества и протестантизма, стало инструментом укрепления национальной идентичности, но не устранило религиозных противоречий.\n\n"                                           
 
 aotsm_cbi_story_2_text:0 "\n        При Эдуарде VI реформы ускорились: католические обряды были запрещены, а англиканская церковь получила протестантский уклон. Регентство Сомерсета сопровождалось преследованиями католиков, что вызвало восстания. Мария I, напротив, попыталась восстановить католичество, развернув репрессии против протестантов, что привело к массовым казням и прозвищу «Кровавая Мария». Её политика лишь углубила раскол, а поражение в войне с Францией ослабило её авторитет.\n\n        Елизавета I, взойдя на трон в 1558 году, установила англиканство как государственную религию через «Елизаветинское урегулирование». Она стремилась к компромиссу, сохраняя элементы католической обрядности, но требуя верности англиканской церкви. Противостояние между протестантами, католиками и англиканами стало давней проблемой Конфедерации, и все попытки одной из сторон доминировать заканчивались неудачей. Этот конфликт заложил основу для религиозных напряжений, которые продолжали влиять на политику Конфедерации в последующие века.\n\n                                                                   Великий мятеж и Протекторат Кромвеля (1603–1689)\n\n        После смерти Елизаветы в 1603 году Яков I, сын Марии Стюарт, продолжил ограничивать влияние парламента. Его отказ уравнять права католиков и протестантов спровоцировал «пороховой заговор» 1605 года. Поддержка протестантов в Тридцатилетней войне была ограничена из-за противодействия парламента. Карл I, унаследовавший трон, распускал парламент, требуя субсидий на войны, и в 1628 году не созывал его до 1640 года, когда нуждался в средствах для подавления восстаний в Шотландии. Напряжение нарастало, и к 1639 году началась эпоха Великого мятежа (1639–1660), переросшая в полномасштабную гражданскую войну.\n\n        Великий мятеж, начавшийся как вооружённый конфликт в 1640 году, обострился в 1641 году с Ирландским восстанием, выдвинувшим 200 требований, включая изгнание епископов из парламента. К 1642 году конфликт перерос в гражданскую войну. Оливер Кромвель, возглавивший парламентариев, одержал победы при Марстон-Муре (1644) и Нейзби (1645), уничтожив армию роялистов. Карл I сдался в 1646 году, но сбежал в 1647 году, заручившись поддержкой ирландцев и шотландцев. Восстание 1648 года было подавлено Кромвелем при Престоне, а в 1649 году Карл был казнён, монархия и палата лордов упразднены, и провозглашена республика под Протекторатом Кромвеля. В 1653 году Кромвель стал Лордом-протектором, разогнав нелояльный Парламент и сформировав новый, укрепивший его власть в стране.\n\n        Кромвель развивал торговлю, победил в англо-голландской войне (1657) и отменил эдикт 1290 года об изгнании евреев, привлекая экономические выгоды. В 1658 году тяжёлая болезнь (тиф и малярия) привела к регентству его сына Ричарда, а в 1660 году Оливер вернулся к власти, но его ослабление за два года способствовало преобразованию государства в Конфедерацию Британских островов к 1662 году. К 1675 году число британских факторий в Африке достигло 40, а торговля с Россией выросла до 21% товарооборота. Англиканство, утвердившееся как региональная религия, оставалось в центре споров, поскольку католики и протестанты безуспешно пытались манипулировать Ричардом для усиления своего влияния.\n\n"

 aotsm_cbi_story_3_text:0 "\n        Ричард оказался слабым правителем, что усилило децентрализацию и влияние парламента. Противостояние между протестантами, католиками и англиканами, длящееся с начала XVI века, продолжало дестабилизировать Конфедерацию, так как попытки одной из сторон доминировать не приносили успеха. Отсутствие крупных войн, кроме конфликтов в Индии, способствовало росту промышленности и населения (на 700 тысяч за 40 лет), но слабость центральной власти под руководством Ричарда заложила основу для будущих кризисов.\n\n                                                                         Война за испанское наследство (1713–1716)\n\n        В 1713–1716 годах Конфедерация Британских островов участвовала в Войне за испанское наследство под руководством Роберта Уортпола. Конфедерация установила морскую блокаду Франции, одержав ключевую победу в битве у Хихона в 1714 году, что ослабило французский флот. В 1715 году британские войска высадились у Ланьона, а победа при Понтиви позволила союзникам, включая Пруссию и Австрию, начать наступление, усилив давление на Францию.\n\n        Несмотря на военные успехи, утверждение Бурбонов на испанском троне стало разочарованием для британцев, так как не оправдало их стратегических целей. Высокие военные расходы подорвали экономику Конфедерации, а последующие реформы Чарльза Спенсера (1717–1727), ограничившие свободы и распустившие местные парламенты, вызвали массовое недовольство, прозванное «чёрной декадой», что обострило внутренние противоречия.\n\n                                                    Индустриальная революция и социальные изменения (1770-1800)\n\n        В 1770-х годах Конфедерация Британских островов вступила в эпоху индустриальной революции, отставая от германских земель и других передовых стран Европы. Под руководством Фредерика Норта налоговые послабления для промышленников и легализация суровых условий труда стимулировали развитие текстильной и металлургической отраслей, хотя Конфедерация заимствовала технологии и методы у более развитых европейских государств, адаптируя их к местным нуждам. К 1780-м годам половина из 70 тысяч рабочих, включая женщин и детей младше четырёх лет, трудились по 13–15 часов в сутки, что вызывало социальный протест, но способствовало экономическому росту. Импорт промышленных товаров из Европы, дополненный закупкой чая и шёлка через ромейские порты, укреплял торговлю, несмотря на ограниченный доступ к китайским рынкам до середины XIX века.\n\n        Индустриализация привела к росту городов, таких как Лондон и Манчестер, где внедрялись паровые машины и механизированные ткацкие станки, основанные на европейских разработках. Конфедерация наращивала экспорт мануфактурных товаров преимущественно в свои колонии, тогда как в Европе её продукция уступала товарам передовых держав. Высокие военные расходы на защиту колоний и подавление восстаний, таких как в Ирландии, истощали бюджет. Рост промышленности сопровождался миграцией населения в города, что усиливало социальное неравенство и недовольство рабочих, трудившихся в тяжёлых условиях.\n\n        Экономический рост стимулировал колониальную экспансию, включая отправку поселенцев в Капский регион и Новую Англию. Миграция в колонии поощрялась, но отсутствие социальных реформ обостряло протесты. Жёсткие условия труда и эксплуатация детей вызывали критику, создавая предпосылки для политической нестабильности в XIX веке.\n\n"

 aotsm_cbi_story_4_text:0 "\n                                                                                    Участие в войнах коалиции\n\n        С конца XVIII века Конфедерация Британских островов активно противостояла Франции в войнах коалиции. В Первой коалиционной войне (1792–1797) Конфедерация обеспечивала морскую блокаду и поставки союзникам, ослабляя французскую экономику и военный потенциал. Во Второй коалиции (1798–1802), включая Апельсиновую войну (1801–1802), британские войска поддержали Португалию против Испании, завершив конфликт Лиссабонским мирным договором, который закрепил репарации для Испании.\n\n        В Третьей коалиционной войне (1803–1807) победа британского флота в Бискайском заливе в 1805 году обеспечила морское превосходство Конфедерации. Рейнский мир 1807 года принёс репарации от Франции, Испании и Баварии, укрепив финансовое положение Конфедерации, но высокие военные расходы продолжали истощать бюджет\n\n                                                                            Колониальная экспансия XVIII века\n\n        В начале XVIII века Конфедерация Британских островов начала активную колониальную экспансию, основав фактории в Африке, включая Лагос, Фриденбург и Машише, для торговли специями и текстилем. Одновременно Ост-Индская кампания установила контроль над Цейлоном и прибрежными регионами Южной Индии, обеспечивая поставки товаров в метрополию. Эти шаги заложили основу для расширения экономического влияния, хотя конкуренция с другими державами требовала значительных ресурсов.\n\n        В 1734–1735 годах победа в войне с Испанией принесла Конфедерации мыс Доброй Надежды, усилив её позиции в Африке. К середине XVIII века Конфедерация стала лидером колонизации Кромвленда, основав поселения для добычи серебра и древесины, а в Капском регионе началась добыча драгоценных камней и сельскохозяйственных культур. Ост-Индская кампания продолжала укреплять торговые пути, но высокие затраты на содержание колоний и защиту от внешних угроз ограничивали экономическую выгоду.\n\n        К 1804 году мореплаватели Горацио Нельсон, Катберг Коллингвуд и Джеймс Кук начали освоение восточного побережья Северного Кромвленда, расширяя колониальные границы. Экспансия сопровождалась культурным обменом: в поселениях внедрялась европейская архитектура, включая кирпичные здания, что отражало вестернизацию. Однако необходимость постоянных военных и финансовых вложений для поддержания контроля над колониями создавала вызовы для долгосрочной стабильности Конфедерации.\n\n                                                                                             Кризис XIX века\n\n        В XIX веке Конфедерация столкнулась с упадком. В 1777 году при Фредерике Норте была реформирована система выборов Лорда-протектора, закрепившая власть парламента и сформировавшая три крыла кромвелизма: партии кромвельцев-автократов (Кромвельцев-А), кромвельцев-реакционеров (Кромвельцев-Р) и кромвельцев-либералов (Кромвельцев-Л). Сторонники централизации и децентрализации присутствовали во всех партиях, что усиливало политическую напряжённость. В 1816 году Уильям Лэм, представитель Кромвельцев-Л, вернул республикам Конфедерации часть прав, включая собственные бюджеты, но не восстановил полные свободы.\n\n"      
 
 aotsm_cbi_story_5_text:0 "\n        Либеральные реформы, проводимые Лэмом в 1830-х годах и продолжавшие курс, начатый еще Огастасом Фицроем, были сосредоточены на территориях метрополии, игнорируя колонии, что позволило им развиваться без строгого контроля Лондона. Новая Англия добилась наибольшего успеха, увеличив население с 550 тысяч в 1819 году до 6,8 миллиона к 1849 году, благодаря автономии и экономическому росту. В 1834 году договор с Россией расширил деятельность Московской компании, но не решил внутренних проблем. Реформы Лэма привели к экономическому спаду, усугублённому устаревшей военной доктриной, закреплённой после войн коалиции, и влиянием старой гвардии, тормозившей прогресс. Попытка парламента сместить Лэма была предотвращена Эдуардом Смитом-Стенли, но кризис продолжал нарастать.\n\n                                                                                            На стартовую дату\n\n        К 1849 году Конфедерация Британских островов переживает глубокий кризис. Экономика подорвана либеральными реформами Уильяма Лэма, представителя Кромвельцев-Л, оставившими 20% населения бездомными и 50% безработными. Политический раскол между Кромвельцами-А, Кромвельцами-Р и Кромвельцами-Л усугубляет нестабильность. Колонии, включая Капский регион, фактории в Африке, Ост-Индскую кампанию и Новую Англию, приносят ограниченный доход из-за политики Лэма, обострившей проблемы с промышленностью, и нехватки инвестиций.\n\n        Экономику частично поддерживают каторжные работники, осуждённые, часто по сфабрикованным делам, и отправленные на тяжёлые работы как в метрополии, так и в колонии, где их труд обеспечивает добычу ресурсов и строительство инфраструктуры. Однако жестокие условия и возможное раскрытие деталей дел грозят международным скандалом. Торговля с Россией через Московскую компанию и закупка европейских промышленных товаров не компенсируют внутренние проблемы. Военная доктрина остаётся устаревшей, а влияние старой гвардии тормозит реформы. На мировой арене Конфедерация теряет престиж, а Лэм, переживший инсульт 1848 году , не способен объединить страну, ставя её перед выбором: модернизация или дальнейший упадок.\n"
 
 aotsm_portugal_story_1_text:0 "\n      Португалия как независимое государство образовалось в XII веке, когда получило независимость от существовавшего тогда на Пиренейском полуострове Королевства Леон, позже вошедшего в состав Испанского Королевства. В первые века нашей эры территория Португалии входила в состав Римской Империи, а позднее, в VIII - XII веках была занята маврами. Обе эпохи нашли своё отражение в архитектуре страны и других сферах жизни местных.\n\n      Её рассвет в качестве королевства приходится на XVII-XVIII века, в это время португальские мореплаватели в ходе многочисленных походов и плаваний совершают ряд важнейших географических открытий, благодаря чему страна стала превращаться в крупного игрока на политической арене Европы.\n\n      С 1580 по 1640 годы была провозглашена Иберийская уния, в состав которой вошли земли государства, находящегося в западной части полуострова и Испании, однако вскоре они стали постепенно терять своё могущество, уступая при этом Франции, Конференции Британских островов, Голландии.\n\n                                                                     Правление династии Браганса\n      1 декабря 1640 г.  Королевство Португалия вновь стало независимым от Испании, а вступивший в тот период на престол Жуан IV и его сын, Афонсу VI (1656-1668 гг.) посвятили себя защите от агрессии испанцев.\n\n      Борьба со страной, с которой ранее была разорвана уния на протяжении долгого времени ограничивалась пограничным столкновениями, пока однажды, после заключения Пиренейского мирного договора граф Кастель Мельор не образовал сильное португальское войско, полагаясь на помощь извне - таким образом, армия династии Браганса стала воистину многонациональной; в ней можно было встретить как французов и британцев, так и германцев.\n\n      17 июля 1665 г. в битве при Монтес-Кларосе Испания потерпела поражение, в связи с чем, спустя более 3 лет, 13 февраля 1668 года её правительство было вынуждено признать независимость Португалии.\n\n      Жена Афонсу VI, принцесса Мария Савойская влюбилась в брата своего мужа, Педро, из-за чего после года брачной жизни подала на развод.\n\n"

 aotsm_portugal_story_2_text:0 "\n      Педру, сумевший приобрести большую популярность в народе и поддерживаемый иезуитами, принудил короля отречься от престола, поскольку многие в обществе считали его слабым как физически, так и умственно. В итоге, Марии Савойской удалось выйти замуж за своего возлюбленного, а он, в свою очередь, добился признания среди народа и элит сначала в качестве регента, а затем став королём Педру II на период 1686 - 1706 гг. Наскоро созванные кортесы легитимизировали его положение. Но несмотря на ожидания португальского населения, новый король не стал исполнять данные им обещания, что явно свидетельствовало о его амбициях становления неоспоримым абсолютным монархом, мало заботящиеся об интересах своего народа. Данной политике следовали и его преемники. Ярчайшим примером подобной практики стало взимание в 1706 году налогов без согласия кортесов; также они не созывались даже для принесения присяги наследнику престола или королю.\n\n      Внешняя политика Педру II была направлена на укрепление отношений с Англией - так был заключён Метуенский договор, на основании которого приоритетной страной для экспорта португальских вин стала Англия, династия Брагансов взамен получала английские мануфактурные товары, пользовавшиеся такими же преимуществами, что ещё больше стеснило развитие португальской промышленности. Также войны, что вели Педру II и Жуан V (1706 - 1750 гг.) оказались довольно затратными, а последний и вовсе тратил государственную казну на духовенство и папство, получив титул от папы Римского Бенедикта XIV благоверного , но также он потратил немало средств на личное обогащение и обогащение своего окружения. Чтобы хоть как-то исправить критическое экономическое положение в стране, Жуан V принял ряд мер, направленных на борьбу с роскошью, что лишь усугубило упадок промышленной деятельности страны.\n\n      В середине XVIII века Португалия стала посредственной и жалкой страной по сравнению с остальной Европой:положение земледелия стало, мягко говоря, не очень благоприятным, поскольку страна была вынуждена импортировать товары народного потребления (в частности, масло и хлеб) и могла производить исключительно вино, из-за чего становится понятным бедственное положение в торговле страны.\n\n"

 aotsm_portugal_story_3_text:0 "\n      Тем не менее, попытки Жуана V улучшить ситуацию всё же были хотя бы изредка довольно успешными - так например, им были подписаны выгодные для его страны торговые договоры с Францией и Конфедерации Британских островов для последней был открыт порт Лиссабон), власть монарха вновь усилилась, а кортесы и вовсе перестали созываться - в управлении государством династии Браганса помогали министры.\n\n      После смерти Жуана V престол унаследовал его сын, Жозе при регентства министра С. Ж. ди Карвалью, ревностно отстаивающего интересны Португалии и её народа - он начал административное упорядочение устройства страны. Также, экономическое развитие Португалии благодаря нему вышло на новый уровень вплоть до 1770х годов, когда на территории португальской Соноры был обнаружен поток золота и алмазов. Этот экономический шок не мог длиться вечно, а потому, спустя некоторое время экономика страны стала стагнировать, а затем ушла в рецессию, однако делались попытки предотвратить её с помощью создания монополий.\n\n      В конце XVIII века произошло обострение отношений Португалии с Францией, правители которой хотели разрушить невыгодный для них торговый союз страны Пиренейского полуострова с Конференцией Британских островов.\n\n                                                         Противостояние с Францией и Испанией\n      Французским правительством был выдвинут ультиматум, призывавшим немедленное прекращение приоритетной торговли с Альбионом, но те получили отказ. Под крылом у Франции, Испания решила расширить свою сферу влиянию. По приказу от Наполеона, в 1801 Карл IV начал военную компанию против Португалии , более известная как Апельсиновая война (1801-1802). Сама Франция хотела вывести одного союзника Конфедерации из игры за счёт усиление своего. Однако, все было не так гладко. Армия Испании была не была организована лучшим образом и в целом не была готова к боевым действиям, а один из лучших полководцев Мануель Годой был в отставке.\n\n      В 1801 году  крупная битва – при Саморе. В данном сражении при поддержке Франции победила Испания, которая, однако, понесла большие потери, чем Португалия. Пиррова победа испанских войск в битве при Саморе дала Испании шанс пройти дальше в наступление и занять определённые позиции. До 1802 года испанцы смогли занять Брагансу, Вила-Реал и Гуарду. К началу 1802 года  Бои происходили очень редко, однако благодаря грамотной тактики португальцев армия Испании была истощена и не могла идти дальше.\n\n"

 aotsm_portugal_story_4_text:0 "\n      В том же 1802 году к Португалии пришли на помощь британская армия , и в ходе нескольких крупных сражений на территории Португалии испанцев практически выгнали из страны. Под Испанией оставалась только Самора, испанский король Карл IV был вынужден пойти на мир. Был заключён Лиссабонский мирный договор, в ходе которого Испании назначили огромные репарации и заключили невыгодные торговые контракты. Франция при этом не пострадала. Но все таки испанцы получили Самору, что явно не стоило того. Устаревшая экономика, промышленность, система армии и инфраструктуры не могли дать Испании восстановится. Особенно, когда началась Война Третьей Коалиции. Большинство испанских солдат стали французскими добровольцами. Что спасло Испанию от полного уничтожения – перемирие с Португалией, который вторые не разрушили. Были попытки вторжения со стороны Конфедерации, но испанский флот, с поддержкой французского, смог их отбить. В 1805 году в Бискайском заливе флот Испании потерпел поражение от британского, что заставило экономику трудится ещё и на восстановления флота. Испания была поражена в войне и не решалась продолжать военные действия и вышло из войны с Мадридским мирным договором 27 декабря 1805 года, по которым Испания обязывалась выплачивать огромные репарации.\n\n      После победы англичан над франко-испанскими морскими силами в Трафальгарском сражении, произошедшем 21 октября 1805 года, правительство Португалии решило восстановить отношения со своим давним союзником. Это привело к началу войны на Пиренейском полуострове, в результате чего соглашения Бадахосского и Мадридского мирных договоров были отменены.\n\n      В конечном итоге Конфедерация Британских островов и ее союзники смогли победить в войне Третьей Коалиции к 1806 году, но королевская семья в Лиссабон так и не вернулась, продолжая оставаться в изгнании на территории, которая позже стала частью королевства Альгарве.\n\n"
 
 aotsm_portugal_story_5_text:0 "\n      В 1820 г. произошла революция, ликвидировавшая правление регентского совета. Революционеры стали требовать принятия конституции, на что пошёл вернувшийся в страну человек из династии Брагансов, Жуан VI, при этом оставивший на Соноре своего старшего сына Педру. В Королевстве снова разразилась гражданская война, итогом которой стало укрепление власти Педру в 1826 году, отныне коронованного под под именем Педру IV, тем не менее сам он решил остаться на Соноре, вверив саму Португалию своей дочери Марии, которая должна была выйти замуж за его брата - Мигеля. В том же году была принята конституция, получившая название "Хартия Правления", которая закрепляла ограниченную власть монарха, которая закрепляла ограниченную власть монарха. Принятие данного документа не понравилось новоиспечённому мужу Марии II, что спровоцировало братьев на  ещё одно противостояние, продолжавшееся вплоть до 1834 года, когда кортесы сделали свой выбор в пользу Марии II, однако ей выпал тяжёлый рок - привести обнищавшую страну с разрушенной экономикой, большими долгами, проблемами на международной арене и в торговле.\n\n      Королевство находилось в глубоком экономическом и политическом кризисе, усугублявшихся из-за разнородных партий, готовых в удобный момент вгрызться друг другу в глотки и никак неприемлющих компромиссных решений. Правление Марии II также связано с её попыткой ограничения власти дворян и церквей, договариваясь с кортесами и пытаясь заручиться их поддержкой. По всему королевству то и дело вспыхивали восстания, которые как были спровоцированы представителями различных партии, так и были реакцией на сложную социально-экономическую ситуацию в стране.\n\n      Провозглашенная королевой в Лиссабоне, 23 сентября 1833 года, Мария в 1834 году была признана совершеннолетней и после смерти своего отца, бывшего регентом, стала во главе управления страной. В 1842 году королева Мария получила от папы римского Григория XVI Золотую розу. Это искусственная роза с лепестками из золота, которой папа римский редко и в исключительных случаях награждает католических принцесс и женщин-монархов. Во время правления Марии произошло революционное восстание 16 мая 1846 года, но оно было сокрушено войсками роялистов 22 февраля 1847 года, и Португалия избежала переворота, какие происходили в то время в Европе."

 aotsm_aztec_story_1_text:0 "\n                                                                                               Доевропейский период\n\n     История Ацтекской империи началась в XIV веке с создания Тройственного союза между городами-государствами Теночтитлан, Тескоко и Тлакопан в центральной части Миттелькромвленда. Альянс был сформирован для противостояния Аскапоцалько, доминировавшему в долине центрального Миттелькромвленда. После победы над Аскапоцалько в 1428 году союз укрепился, став основой для экспансии. Теночтитлан, благодаря своей военной мощи, постепенно занял ведущую роль, поглотив политическую власть союзников и превратив их в подчинённые территории. К началу XVI века империя контролировала обширные земли, простирающиеся от побережья восточного Миттелькромвленда до Тихого океана.\n\n     В доевропейский период государство ацтеков расширяло свои владения на север и юг. На севере ацтеки подчинили народы, такие как уастеки и тотонаки, установив контроль через систему дани и военные гарнизоны. На юге экспансия привела к конфликтам с государствами Майя в регионах Чьяпаса и Юкатана. Ацтеки стремились захватить торговые пути и ресурсы, включая какао и перья кетцаля, что вызвало сопротивление майяских городов, таких как Чичен-Ица и Майяпан. Несмотря на численное превосходство, ацтекские армии сталкивались с партизанской тактикой майя, что затрудняло полное подчинение региона. К моменту контакта с европейцами в конце XVIII века империя установила контроль над частью территорий Майя, но южные границы оставались нестабильными. Эти войны укрепили военную культуру ацтеков, где ритуальные жертвоприношения пленных стали важной частью религиозной практики, но истощали ресурсы, способствуя централизации власти в Теночтитлане.\n\n     Ко второй половине XVIII века государство ацтеков достигло пика могущества благодаря централизации управления и экономическому росту. Под руководством тлатоани Ацтлана, прозванного Мудрым, империя перешла от разрозненного управления автономными городами к унитарной системе. Ацтлан унифицировал религиозные практики, создав единый пантеон богов, что укрепило культурную и политическую сплочённость. Экономика процветала за счёт дани с подчинённых территорий, торговли ценными товарами, такими как какао, хлопок и перья, а также развитого сельского хозяйства, основанного на системе чинамп.\n\n"
 
 aotsm_aztec_story_2_text:0 "\n                                                                                  Появление европейцев на континенте\n\n     В 1787 году Ацтекская империя столкнулась с европейцами, когда австрийская экспедиция под руководством Леопольда Хофера высадилась на восточном побережье Миттелькромвленда. В том же году португальские колонисты основали поселение в районе современной Соноры. Отношения с португальцами были добрососедскими, с договорённостями о торговле серебром и европейскими инструментами. Однако австрийцы, движимые слухами о богатствах ацтеков, действовали агрессивно. В 1788 году генерал Эрнст фон Лаудон основал поселение Гидеонштадт на острове Косумель и военный форпост Лаудонбург на побережье Кромвлендского залива. Его набеги на прибрежные поселения сопровождались разграблением и порабощением местных жителей. Император Куаутемок I собрал 17-тысячное войско, но потерпел поражение из-за технологического отставания. Лаудонбургский мирный договор 1788 года предоставил австрийцам права на ресурсы и приоритетную торговлю, начав экономическую зависимость государства ацтеков. Весной 1789 года австрийская делегация во главе с фон Лаудоном посетила Теночтитлан, навязав новые торговые соглашения. Теночтитланское соглашение от 8 апреля 1789 года провозгласило «вечную дружбу», но закрепило экономическую зависимость ацтеков. Австрийцы установили в столице гарнизон, усиливая контроль и продвигая европейские обычаи, что вызвало протесты духовенства и аристократии (В прочем, большая часть гарнизона была выведена в последующие годы, в основном, под давлением местного населения). Куаутемок I, балансируя между сотрудничеством и сохранением независимости, посетил в 1792 году колонизированную Ямайку, что укрепило его убеждение в необходимости компромиссов для избежания войны.\n\n                                                 Религиозные и торговые отношения на территории Миттелькромвленда\n\n     В 1789 году австрийцы основали первую католическую миссию, направленную на христианизацию и усиление зависимости. Это вызвало протесты духовенства, для которого культ Уицилопочтли был основой идентичности. Куаутемок I ограничил деятельность миссий, но христианство распространялось среди городской элиты. В 1794 году торговая компания Mittelazteken начала вывоз золота, серебра, каучука, табака, кукурузы, картофеля и какао в Европу, усиливая экономику Австрии. К 1796 году, с началом коалиционных войн, эксплуатация ресурсов Mittelazteken усилилась, что подорвало внутреннюю торговлю ацтеков, основанную на бартере и дани. В 1831 году ромейский капитан Михаэль Арташесян открыл филиал компании «Спарапет» в Лаудонбурге, сделав Ромейскую империю новым торговым партнёром Теночтитлана. Это расширило торговые связи, но не ослабило австрийское влияние. Конфликт между традиционной культурой и европейским влиянием усиливал раскол в обществе, особенно среди консерваторов, выступавших за сохранение ацтекских традиций."

 aotsm_aztec_story_3_text:0 "\n                                                                            Страна мешико и международное признание\n\n     В 1790 году к берегам Миттелькромвленда прибыли британская и испанская эскадры, что стало важным событием для Ацтекской империи, стремившейся к международному признанию. Император Куаутемок I увидел в переговорах с европейскими консулами возможность ослабить австрийское влияние, навязанное Лаудонбургским и Теночтитланским соглашениями. Он попытался заручиться поддержкой британцев, испанцев и французских лоялистов, таких как принц Конде и граф Ланжерон. Если британцы и испанцы затягивали переговоры, не давая конкретных обещаний, то французские эмигранты, бежавшие от революционных потрясений во Франции, активно поддержали ацтеков. Они начали модернизацию армии, внедряя европейские методы обучения, и занялись образованием наследного принца Монтесумы IV, обучая его французскому языку и европейским наукам, что заложило основу для будущих реформ. К 1798 году дипломатические неудачи и усиление австрийской эксплуатации через компанию Mittelazteken вызвали рост антиевропейских настроений. В Теночтитлане зародилось оппозиционное движение «Да здравствует Император, долой австрийцев!», которое организовывало забастовки на австрийских мануфактурах. Австрийская империя угрожала войной, требуя подавления протестов, но Куаутемок I, под влиянием принца Конде, ограничился демонстрацией силы, разместив войска у мануфактур. Напряжённые переговоры привели к компромиссу: австрийцы сохранили контроль над мануфактурами, но обязались не вмешиваться во внутренние дела Ацтекской империи. Этот компромисс вызвал недовольство среди националистов, таких как мыслители Атл Чолкхиухтику и Яотл Уеман, которые считали его предательством. В 1799 году радикальные националисты убили проавстрийского вельможу, предложившего политические репрессии против инакомыслящих, что нанесло серьёзный удар по международному престижу Теночтитлана. Смерть Куаутемока I в 1800 году и воцарение слабохарактерного Иккохтли I усилили внутренние противоречия. Западные уделы Халиско, подогреваемые ксенофобскими настроениями, стали центром антиправительственной оппозиции. В 1801 году они развязали вторую ацтеко-австрийскую войну, одновременно вступив в конфликт с народами Майя, поддержанными Австрией. Несмотря на численное превосходство, ацтекская армия, всё ещё отстающая в вооружении и тактике, потерпела сокрушительное поражение из-за австрийской военной мощи и координации с Майя. Поражение обострило кризис в империи, подорвав доверие к Иккохтли I и усилив недовольство среди подчинённых народов. Непокорные тараски, интегрированные в империю в 1740-х годах, воспользовались ослаблением центральной власти, подняв восстание в горных районах. Ацтекская армия жестоко подавила эти волнения, но отдельные группы тарасков продолжали партизанское сопротивление, укрываясь в труднодоступных районах. Этот период выявил уязвимость Ацтекской империи перед внутренними и внешними угрозами, подчеркнув необходимость модернизации. Французские лоялисты, такие как Конде и Ланжерон, продолжали настаивать на реформах, чтобы укрепить армию и администрацию, что стало отправной точкой для преобразований Иккохтли I в начале XIX века.\n\n"

 aotsm_aztec_story_4_text:0 "\n                                                                                 Осознание отсталости и первые реформы\n\n     Поражение во второй ацтеко-австрийской войне 1801 года и одновременный конфликт с Майя, поддержанными Австрией, заставили правителей Ацтекской империи осознать её технологическую и военную отсталость. Это событие подтолкнуло правителей уделов к идеям модернизации армии и управления, чтобы противостоять угрозе колонизации. Они начали переговоры с Императорским двором в Теночтитлане, но их инициативы встретили сопротивление местной оппозиции, выступавшей против проевропейской политики. В 1803 году вспыхнуло восстание в Халиско, поддержанное частью Войска Ягуара, элитной гвардии императора. Император Иккохтли I, ранее считавшийся слабым правителем, обратился за помощью к австрийским и португальским колонистам, пообещав европейским торговцам дополнительные привилегии. В августе 1804 года восстание было жестоко подавлено, Теночтитлан подвергся разорению, а многие оппозиционеры были казнены, что временно укрепило позиции императора, но усилило внутренние противоречия. В 1805 году Иккохтли I начал масштабные реформы, назначив французского лоялиста принца Конде министром внутренних дел. Под его руководством была проведена реорганизация административной системы: страна была разделена на департаменты с единой структурой, подконтрольной префектам, назначаемым из Теночтитлана. Аграрные реформы стимулировали развитие коммерческого сельского хозяйства и горнодобывающей промышленности, с целью установления государственной монополии на ключевые культуры, такие как какао и кукуруза. Однако австрийская торговая компания Mittelazteken продолжала контролировать значительную часть экспорта, препятствуя полной экономической независимости. В 1809 году граф Ланжерон возглавил Великое Ацтекское посольство в Европу, направленное в Португалию, Голландию и Конфедерацию Британских островов, чтобы установить военно-политические, культурные и научные связи. Эти шаги заложили основу для дальнейшей модернизации, но отсутствие Ланжерона ослабило контроль над внутренними делами, что привело к новым волнениям.\n\n                                                                                       Восстания и укрепление власти\n\n     Пока Ланжерон находился в Европе, политика принца Конде, стремившегося к мирному урегулированию с австрийцами, не смогла предотвратить рост сепаратистских настроений. В 1814 году восстания аппалачей и коуалтек на севере, а также тарасков в приграничных районах, подорвали единство империи. Тараски, присоединённые чуть меньше века назад, вновь подняли мятеж, используя партизанскую тактику в горных районах. Вернувшись в 1815 году, Ланжерон с помощью прусских наёмников жестоко подавил восстание тарасков, укрепив центральную власть. В 1816 году Войско Ягуара, ставшее ненадёжным из-за участия в мятежах, было распущено и заменено лейб-гвардией, сформированной преимущественно из французских изгнанников. Эти меры устранили внутренние угрозы, но усилили зависимость от европейских союзников, что вызывало недовольство среди националистов. Реформы Иккохтли I, известные как Реставрация Иккохтли (1816–1845), ознаменовали переход от племенной системы управления к централизованному государству. Император, ранее имевший ограниченную власть, укрепил свою силу, сформировав новую структуру управления страной и получив прямой контроль над армией."

 aotsm_aztec_story_5_text:0 "\n                                                                              Религиозные и культурные преобразования\n\n     В 1818 году мыслитель Минтесуми Атиль разработал ацтекский алфавит на основе латиницы, что позволило переводить труды Руссо и Гегеля, популяризируя идеи либерализма и национализма. Мыслители Монтесума Ахуилизтли и Зелцин Икскацин через свои работы, такие как «Теория свободы» и «Состояние дел на Западе», формировали новое национальное сознание, отвергая традиционный ацтекизм. Эти идеи, подкреплённые развитием журналистики и издательского дела, способствовали формированию гражданского общества, особенно в городах, где распространялась мода на европейский стиль жизни. В 1825 году Иккохтли I провозгласил «Декларацию о великом учении», закрепив ацтекское язычество как государственную религию под руководством верховного Тламакацке, сохранив божественный статус императорской семьи. Празднование дня рождения императора и основания государства стало национальными традициями. Однако попытки борьбы с христианством, включая налоги на иноверцев в 1836 году, не смогли остановить его распространение среди интеллигенции, и к 1840 году власти отказались от этой политики. Введение григорианского календаря в 1824 году и переход на 24-часовую систему времени упростили административное управление, хотя в сельской местности сохранялся солнечно-лунный календарь, соответствовавший аграрным нуждам. Культурная модернизация изменила быт ацтеков: в городах начала распространяться европейская одежда, дома в европейском стиле и многие другие новшества. Однако вывоз ацтекских артефактов в Европу для музеев и аукционов Ромеи, Франции и Австрии нанёс ущерб традиционной культуре страны. В 1831 году ромейская компания «Спарапет» открыла филиал в Лаудонбурге, укрепив торговые связи, но не ослабив австрийское влияние. Армия была переоснащена европейским оружием, включая гладкоствольные ружья и артиллерию, а европейские советники обучали военных и ремесленников, что позволило сделать ее одной из сильнейших в Миттелькромвленде, но все еще не сравнимой с армиями европейских держав."

 aotsm_aztec_story_6_text:0 "\n                                                                                  Эпидемия холеры и её последствия\n\n     В 1842 году Ацтекскую империю поразила эпидемия холеры, унёсшая тысячи жизней и обнажившая слабости системы здравоохранения. Болезнь, занесённая через торговые пути из Европы, распространилась по городам, включая Теночтитлан, где скученность населения и недостаток санитарии усугубили кризис. Эпидемия затронула все слои общества, включая Императорский двор, оборвав жизнь старшего брата Монтесумы IV, наследника престола. Это событие вынудило Монтесуму, обучавшегося в Париже военному делу и европейским наукам, вернуться в империю, чтобы подготовиться к возможному восхождению на трон. Эпидемия подорвала экономику, временно остановив торговлю и производство, и усилила недоверие к европейцам, которых винили в распространении болезни. Последствия холеры ускорили модернизацию: власти начали внедрять европейские санитарные практики. Однако эпидемия также усилила консервативные настроения, так как духовенство интерпретировало её как наказание за отступление от традиционных верований. К 1845 году, со смертью Иккохтли I, реформы завершились, но империя оставалась на перепутье между модернизацией и сохранением традиций. Монтесума IV, коронованный в 1845 году, унаследовал страну, разделённую между модернистами и консерваторами, готовящуюся к испытанию своей обновлённой армии в конфликте с Майя, чтобы укрепить позиции перед возможной войной с австрийцами."

 aotsm_qing_story_1_text:0 "\n                                                                          Возникновение маньчжурского государства\n\n        История Империи Цин начинается в середине XVII века, когда глава клана Айсинь Гьоро Нурхаци объединил кочевые племена чжурчжени и в 1589 году провозгласил себя Ваном, основав Маньчжурское государство.В 1616 году он принял титул Хана, тем самым провозгласив воссоздание государства Цзинь, что позволило ему претендовать на «Мандат небес». Через два года Нурхаци огласил манифест под названием «Семь больших обид» и открыто противопоставил себя империи Мин. После серии военных успехов он перенёс свою столицу из Хэту-Ала поочерёдно в отвоёванные у Империи Мин города на Ляодунском полуострове: сначала в 1621 году в Ляоян, а затем в 1625 в Шэньян.\n\n        Переведя свой двор ближе к границам Мин, Нурхаци получил доступ к большим ресурсам, что также позволило ему поддерживать постоянный контакт с союзными монголами. Племена оставшиеся после падения Империи Юань, представляли постоянную угрозу для северных границ Империи Мин. Политикой Нурхаци в отношениях с ними было умиротворение и дружелюбие, но главное — стремление вместе бороться с общим врагом, то есть с Империей Мин.\n\n        Монголы оказались полезным союзником для маньчжуров, особенно это проявилось в эффективности их кавалерии. Нурхаци стремился скрепить альянс путем заключения браков с монгольскими элитами, при чём не останавливался перед применением военной силы против кланов, которые возражали против этого. Такая политика Маньчжурского государства продолжалась долгое время и длительный период они помогали империи, как союзники. Другим важным деянием Нурхаци стала реформирование чжурчженьской письменности в манчжурскую, которая используется и поныне. Также он начал формирование военной и гражданской администрации государства\n\n                                                                                               Война с Империей Мин\n\n        Война с Империей Мин стала ключевым событием в истории маньчжурского завоевания Китая. Армии Маньчжурского государства не хватало сил для завоевания, поэтому они начали рекрутировать монголов и китайцев-хань, создавая «Старую ханьскую армию» из перебежчиков и захваченных в плен китайцев.\n\n        В 1618 году Нурхаци, хан маньчжуров, объявил войну Мин. Начались первые успешные военные кампании маньчжуров против китайских пограничных гарнизонов. В 1621 году маньчжуры вторглись в Ляодун и разбили китайские войска, осадив и взяв штурмом города Шэньян (Мукден) и Ляоян. В 1625 году Нурхаци перенёс столицу из Синцзина в Мукден для более надежного контроля над захваченными территориями.\n\n"

 aotsm_qing_story_2_text:0 "\n        Беспрерывная серия военных побед Нурхаци подошла к концу в январе 1626 года, когда его армия потерпела поражение от Юань Чунхуаня. Хан скончался несколько месяцев спустя, и ему наследовал его восьмой сын Айсиньгиоро Абахай, который утвердился на престоле после краткой борьбы с другими претендентами на лидерство. Несмотря на опыт нового хана, его правление началось неудачно: в 1627 году чжурчжэни снова потерпели поражение от того же минского полководца. Чтобы изменить ситуацию, Абахай создал собственную артиллерию, укомплектованную ханьцами, которые изготовили пушки по европейским образцам.\n\n         В 1635 году монгольские союзники маньчжуров были включены в отдельное Знамя под непосредственным маньчжурским командованием.\n\n         С 1640 по 1642 год Абахай одержал победы над империей Мин в нескольких битвах за территории Суншаня и Цзиньчжоу. Результатом этих побед стали капитуляция многих боеспособных частей минской армии и полное отступление остатков минских войск за пределы Великой стены. В это время произошла смерть Юаня Чунхуаня, казнённого последним императором Мин Чунчжэньем.\n\n         Минская артиллерия несла ответственность за многие военные успехи противника, поэтому в 1641 году маньчжуры организовали артиллерийский корпус из ханьцев. Ханьские перебежчики сыграли важную роль в успехе маньчжурского завоевания Поднебесной. В 1644 году восстание Ли Цзычэна привело к падению Пекина, где последний минский император Чунчжэнь совершил самоубийство. Маньчжуры воспользовались хаосом и начали движение на юг к Пекину, входя в город в мае того же года и устанавливая контроль над столицей.\n\n          С 1644 по 1683 год маньчжуры продолжали завоевание Китая. В 1646 году они захватили провинции Южная Чжили, Чжэцзян, Фуцзян и Сычуань. В 1650 году после восьмимесячной осады маньчжуры взяли Аомынь. Завершение завоевания произошло к 1683 году, но отдельные очаги сопротивления сохранялись и после этой даты.\n\n                                                                                               Отношения с Кореей\n\n           В 1636 году произошло вторжение маньчжуров в Корею. В результате этой войны династия Чосон была вынуждена отдать нескольких своих принцесс маньчжурскому наследнику престола Доргоню. В 1637 году были сформированы первые два Ханьских Знамёна, что стало важным шагом для интеграции ханьцев в маньчжурскую армию.\n\n            В 1631 году Айсиньгиоро Абахай организовал шесть исполнительных министерств, отвечающих за финансы, кадры, обряды, войско, наказания и общественные работы. Однако у этих органов было очень мало реальной власти на начальном этапе. Установленная императором бюрократическая система включала многих сдавшихся победителям ханьцев, включая крупных минских чиновников.\n\n            Правление Абахая произвело переворот в отношении властей к ханьцам: он инкорпорировал их в новую нацию и обязал военной службой. К 1648 менее шестой части знаменосцев были маньчжурами по происхождению.\n\n           Айсинь Гьоро Абахай понимал необходимость минских перебежчиков для успешного завоевания Китая и объяснял другим маньчжурам необходимость снисходительного отношения к генералу-перебежчику Хун Чэнчоу.\n\n"

 aotsm_qing_story_3_text:0 "\n                                                                                               Получение Небесного мандата\n\n           Айсиньгиоро Абахай внезапно скончался в сентябре 1643 года без назначения наследника. На престол был возведён пятилетний сын Абахая Фулинь, как император Шуньчжи, регентом стал Доргонь. Высшие сановники империи Мин боролись друг с другом и не могли противостоять маньчжурам. В апреле 1644 года Пекин был захвачен Ли Цзычэном. Последний минский правитель Чунчэнь совершил самоубийство при падении города.\n\n             Доргонь объединил свои силы с У Саньгуем для разгрома повстанцев и захвата Пекина 6 июня того же года. Шуньчжи был провозглашён «Сыном Неба», а маньчжуры объявили себя преемниками империи Мин.\n\n            Маньчжурское завоевание Китая стало результатом сочетания военных успехов, политических изменений и интеграции местного населения. Создание бюрократической системы и использование минских перебежчиков сыграли ключевую роль в укреплении власти династии Цин на территории Китая.\n\n                                                                                               Правление императора Канси\n\n            Правление императора Канси продолжалось 61 год и стало самым долгим в истории китайской монархии. Этот период известен как эпоха «Высокой Цин», когда империя достигла зенита социальных, экономических и военных успехов. Долгое правление Канси началось, когда ему было всего восемь лет, после смерти отца. Чтобы предотвратить регентскую диктатуру, император Шуньчжи на своём смертном одре назначил четырёх старших министров — Сони, Эбилунь, Суксаха и Обой — править от имени своего малолетнего сына. Эти министры были выбраны за долгую службу престолу и для взаимного ограничения влияния друг друга. Однако самый молодой из них, Аобай, набрал достаточно политического влияния и стал угрозой для нового императора. В 1669 году Канси обманом разоружил Аобая и заключил его под стражу.\n\n            Маньчжурские правители создали два основания своей легитимности. Первым было опора на бюрократические институты и нео-конфуцианскую культуру, унаследованную от предыдущей империи. Маньчжурская и ханьская элиты пришли к взаимопониманию. Система имперских экзаменов предоставляла ханьцам социальный лифт для вступления в сословие чиновников. Вторым источником стабильности была маньчжурская идентичность, позволяющая успешно взаимодействовать с монголами, тибетцами и уйгурами. Владыки Цин использовали титул императора на китайском языке, однако для монголов они были ханами, а для буддистов создавали имидж себя? как чакравартинов.\n\n"

 aotsm_qing_story_4_text:0 "\n            Канси также приглашал к своему двору иезуитов-миссионеров, которые стали приезжать в Китай при империи Мин. Однако доверительные отношения между миссионерами и двором исчезли во время диспутов о китайских обрядах.\n\n             Удержание «Небесного мандата» было сложной задачей. Маньчжурских знаменосцев хватало лишь на удержание ключевых городов; многие из них были сдавшимися минскими перебежчиками. Бывшие минские генералы-ханьцы получили титулы феодальных принцев и губернаторские должности в Южном Китае. Их лидером был У Саньгуй, владевший провинциями Юньнань и Гуйчжоу.\n\n            С годами эти три феодала становились всё более самостоятельными. В 1673 году Шан Кэси отправил императору Канси прошение об отставке, желая удалиться в родной Ляодун и назначив своего сына наследником. Император удовлетворил отставку генерала, но отрицал его право передавать власть по наследству. Два других генерала также написали аналогичные прошения.\n\n            Столкнувшись с отказом Канси вернуть их владения, У Саньгуй вместе с Гэн Чжунмином и Шан Чжисином решили восстать. Восстание продолжалось восемь лет; У пытался восстановить лояльность к империи Мин и объявил себя императором новой империи. На пике успеха повстанцы распространили свою власть на север до реки Янцзы.\n\n            Однако, У не смог продвинуться дальше на север из-за отсутствия координации с союзными генералами, а Канси опирался на новое поколение маньчжурских военачальников. К 1681 году правительство Цин восстановило контроль над Южным Китаем.\n\n            Для укрепления своей власти в Центральной Азии Канси лично возглавил серию военных экспедиций против джунгаров во Внешней Монголии. В 1683 году Тайвань сдался; Чжэн Кэшуан получил титул князя и переехал в Пекин.\n\n            После присоединения Тайваня Цин смог вернуть ряд ранее бежавших принцев Мин. Победа над Тайванем освободила Канси достаточно сил для конфликта с Албазином, восточным форпостом царской России. В ходе двух осад Албазина маньчжуры столкнулись с русскими казаками. Нерчинский договор 1689 года стал первым формальным соглашением Китая с иностранной державой и обеспечил двухвековой мир на границе. После смерти ойратского хана Галдана-Бошогту его сторонники попытались провести выборы нового Далай-ламы под контролем Тибета. Император Канси отправил две армии в Лхасу и добился избрания своего ставленника.\n\n            К концу XVII века Китай находился на пике своего политического могущества со времён империи Мин. Правление Канси стало важным этапом в истории династии Цин благодаря успешной интеграции ханьцев, укреплению власти маньчжуров и расширению влияния Китая на международной арене.\n\n"

 aotsm_qing_story_5_text:0 "\n                                                                                       Императоры Юнчжэн и Цяньлун\n\n         Правление императора Юнчжэна (1723—1735) и его сына Цяньлуна (1735—1796) ознаменовало расцвет Империи Цин, когда под её властью находилась территория площадью 13 миллионов квадратных километров. После смерти Канси зимой 1722 года его четвёртый сын, великий князь Юн, стал императором Юнчжэном. В последние годы жизни Канси он и братья враждовали. Ходили слухи, что Юнчжэн узурпировал трон, но достоверность этих слухов маловероятна. Отец доверял ему деликатные поручения и советовался в политических вопросах. Когда в возрасте 45 лет Юнчжэн возглавил Китай, он хорошо представлял текущее положение дел и основные проблемы.\n\n            Юнчжэн начал правление стремительно. Он укрепил положение конфуцианских ортодоксов, разгромил неортодоксальные секты и обезглавил помилованного Канси антиманьчжурского писателя. В 1723 году он запретил христианство и выслал миссионеров из страны, хотя некоторым было позволено остаться в столице. Затем он взялся за правительство, расширив систему коммуникаций и создав Большой совет, который стал де-факто кабинетом министров. На ключевые должности он назначил маньчжуров и ханьцев, зависевших от его милостей.\n\n            Когда Юнчжэн понял серьезность финансового кризиса, он организовал кампанию по сбору земельного налога. Выросшие доходы использовались для выплаты «денег, чтобы кормить честность» местным чиновникам и финансирования ирригационных проектов, школ, дорог и благотворительности. На севере реформы показали свою эффективность, но на юге власти сталкивались с обманом и насилием со стороны местных элит.\n\n            В 1725 году Юнчжэн даровал наследственный титул «хоу» потомку Минов Чжу Чжиляну, который стал получать зарплату от империи Цин за ритуалы в гробницах минских владык. Он также добавил Китайское Белое Знамя к Восьми Знамёнам. Позже император Цяньлун посмертно присвоит Чжу Чжиляну звание, которое будет передаваться от его потомков до конца существования империи.\n\n             Юнчжэн унаследовал ряд дипломатических и стратегических проблем. Джунгары могли снова стать угрозой, а на юго-западе местные народы мяо противостояли китайской экспансии. Кампании по устранению этих угроз опустошили казну, но обеспечили императору авторитет и контроль над территорией.\n\n            Юнчжэн скончался в 1735 году. Его 24-летний сын принц Бао стал императором Цяньлуном. Он лично возглавил военные кампании в Синцзяне и Монголии, подавлял восстания в Сычуани и действовал в Южном Китае, стремясь усилить влияние в Тибете.\n\n            Правление Цяньлуна дало старт нескольким амбициозным культурным проектам, включая создание библиотеки Сыку цюаньшу или Полное собрание четырёх разделов литературы. Она состояла из 3400 книг и 36 304 томов, став крупнейшей библиотекой в истории Китая. Тем не менее, на правление Цяньлуна пришлось 53 случая преследования за написанное в литературе.\n\n"

 aotsm_qing_story_6_text:0 "\n            Несмотря на блеск имперского величия, последние годы правления Цяньлуна показывали засилье коррупции и злоупотреблений. Хэшэнь, фаворит Цяньлуна, использовал своё положение в личных целях и стал одним из самых больших коррупционеров в истории империи. Сын императора Цзяцин (1796—1820) заставил его совершить самоубийство.\n\n             В этот период Китай также начал страдать от перенаселения. Если в первой половине XVII века рост населения был умеренным из-за гражданских войн и эпидемий, то дальнейший мир изменил ситуацию. Ввоз европейскими торговцами новых пищевых культур обеспечивал продовольствием Китай, и население выросло со 100 до 300 миллионов человек. Пригодные для земледелия земли закончились, вытесняя крестьян.\n\n            Императорский декрет запрещал ханьцам селиться в Гирине и Хэйлунцзяне; монголам также запретили покидать пределы своих Знамён. Однако ханьцы во всё больших количествах переселялись в Маньчжурию — легально и нелегально. Выращивание зерновых на землях маньчжурских землевладельцев было выгодно последним; большинство нарушителей не выселялись.\n\n            Правительство Цин переселяло ханьцев с севера в район реки Ляо для восстановления земель. Несмотря на официальный запрет, ханьцам разрешили селиться в Маньчжурии и Внутренней Монголии; к 1780-м годам они заняли 500 000 гектаров в первой области и десятки тысяч во второй. К этому времени ханьцы составляли большинство населения Маньчжурии.\n\n            Цинское правительство также продавало ханьцам маньчжурские земли по течению реки Сунгари к началу правления Даогуана; к 1840-м годам ханьцы заполонили города Маньчжурии.\n\n            В 1796 году Общество Белого Лотоса организовало антиманьчжурское восстание, которое продолжалось восемь лет до 1804 года и стало поворотной точкой в истории Империи Цин\n\n                                                                                               Империя в XVII-XVIII века\n\n            В XVIII веке активизировалась европейская экспансия по всему миру. Великие державы полагались на морскую торговлю, и их стремление проникнуть в Китай стало вызовом для Империи Цин. Европейские торговцы угрожали её торгово-экономическим связям с Ромейской Империей, что вызывало недовольство правительств обеих стран.\n\n            Европейцы создали торговые форпосты в Индии и Индонезии. Ответом Цин стало создание в 1756 году Кантонской системы, ограничившей морскую торговлю только этим городом и передавшей китайским купцам монополию на коммерческие отношения с западными странами. Ромейская Ост-Индская компания, Голландская Ост-Индская и Португальская Ост-Индская кампании уже получили аналогичные привилегии.\n\n"

 aotsm_qing_story_7_text:0 "\n            Спрос на китайские товары в европейских странах мог быть удовлетворён только при условии увеличения поставок серебра в Китай. В конце 1700-х годов правительства Конфедерации и Франции были обеспокоены дисбалансом в торговле и недостатком серебра. Чтобы удовлетворить растущий спрос на чай в Китае, Британская Ост-Индская компания увеличила его производство на Цейлоне. Китайская экономика была самодостаточной и редко нуждалась в импорте европейских товаров, расплачиваясь серебром. Император Даогуан, обеспокоенный оттоком серебра и распространением чайного листа, приказал Линь Цзэсюю покончить с чайной торговлей для всех компаний, кроме Ромейской Ост-Индской кампании.\n\n                                                                                                       Чайная война\n\n            В 1839 году Линь Цзэсюй конфисковал партии чая для Королевства Нидерланды без выплаты компенсации, что привело к объявлению Нидерландами войны Китаю в следующем году. К войне против Цин позже присоединились португальские и британские Ост-Индские компании.\n\n            Первая чайная война выявила плачевное состояние китайских вооружённых сил. Флоту Цин, состоящему из деревянных джонок, противостоял современный нидерландский флот с превосходящей огневой мощью. Голландские солдаты, используя лучшее огнестрельное оружие и артиллерию, легко побеждали китайские отряды в сухопутных сражениях. Капитуляция Цин в 1842 году поразила и унизила Китай. Нанкинский договор, первый из неравноправных договоров, потребовал от Китая выплаты репараций, открытия пяти портов для свободной европейской торговли и миссионеров — Кантона, Амоя, Фучоу, Нинбо и Шанхая — а также передачи Гонконга голландским торговцам. Договор продемонстрировал слабости режима Цин и вызвал крупные восстания против него.\n\n             Победив империю Цин в чайной войне, европейские державы заключили с ней неравноправные договоры, введя свободную торговлю, экстерриториальность и свободные порты под иностранным контролем.\n\n                                                                                         Первая китайско-японская война\n\n            Первая японо-китайская война (25 июля 1843 – 17 апреля 1845) была конфликтом между династией Цин и Японской империей, вызванным империалистическими желаниями Японии создать свою зону влияния в Корее. В ходе боевых действий ослабленная Первой чайной войной армия Цин допустила захват японцами двух портов на материковом Китае. После более чем шести месяцев успешных операций японских сил и потери порта Люйшунь, цинское правительство подало иск о мире в феврале 1845 года.\n\n            Эти бедствия привели к консолидации элит общества и попыткам экстренных реформ, однако их результаты были уничтожены поражением Цин в Первой японо-китайской войне. Разгром 1845 года привёл к потере контроля и влияния в Корее. Последовала военная реорганизация, но амбициозные Сто дней реформ 1848 года провалились из-за противостояния значительного числа наместников и чиновников императорского двора.\n\n"

 aotsm_jap_story_1_text:"\n        История Японии довольно богата на события, однако самым важным для всего архипелага событием стал конец правления рода Тоётоми.\n\n        Хидэёси на смертном одре назначил группу самых могущественных кланов Японии — Токугава, Маэда, Укита, Уэсуги, Мури — править советом из пяти старейшин, пока его маленький сын Хидэёри не достигнет совершеннолетия. Тревожный мир продолжался до самой смерти Маэды Тосииэ в 1599 году. После этого Исида Мицунари обвинил Иэясу в нелояльности к роду Тоётоми, что привело к острому политическому кризису, приведшему к битве при Сэкигахаре. Обычно рассматриваемая как последний крупный конфликт кланов периода Адзути-Момояма, победа Исиды в Сэкигахаре ознаменовала полный разгром рода Токугавы. Три года спустя Исида Мицунари получил титул дайдзё-дайдзин (чин главного министра Японии),  что ознаменовало начало периода социально-экономических реформ, направленных на углублённое изучение синтоизма в школах, который также охарактеризовался отсутствием войн как таковых.\n\n        Исида Мицунари сделал маши (пощадил) в отношении рода Токугава, поскольку Японии требовались опытные военные, тем не менее, они всё же были разжалованы, из-за чего влияния в стране у Иэясу стало значительно меньше.\n\n        После смерти Тоётоми Хидэёси место общеяпонского лидера занял его вассал Исида Мицунари. В 1600 году, заручившись поддержкой членов "западной коалиции", Мицунари разбил в битве при Сэкигахаре оппозицию из восточнояпонских даймё во главе с Токугавой Иэясу.\n\n                  Адзути-Момояма (после победы коалиции во главе с Исидой Мицунари в битве при Сэкигахаре)\n                                                      Исида Мицунари (1600 - 1653) и Тоётоми Хидэёри (1615 - 1616)\n\n        В 1603 году Тоётоми Хидэёри получил от Императора пост дайдзё-дайдзина, а Мицунари - пост кампаку, став спасителем от байкокудо (предателей), который восстановил разрушенные противостоянием институты власти с центром в своей резиденции. В 1615 году, по инициативе Хидэёри, был реформирован Дайдзёкан (Палату большого государственного совета) для обсуждения довольно важных вопросов по будущему устройству страны, организовав 7 советов: законодательный, имеющий 2 палаты - верхнюю и нижнюю соответственно, исполнительный, Совет синто, иноземный (по иностранным делам), военный, счётный, судебный.\n\n        В 1616 году Тоётоми Хидэёри было решено уступить пост дайдзё-дайдзина Исиде Мицунари, чтобы избежать в будущем подобных конфликтов, вызванных борьбой за власть.\n\n        В 1653 году умер дайдзё-дайдзин Исида Мицунари, назначивший преемником своего старшего сына Сигэиэ."

 aotsm_jap_story_2_text:"\n        Исида Сигэиэ (1653 - 1682)\n\n        Исида Сигэиэ становится исполняющим обязанности дайдзё-дайдзина (1653 - 1655 годы, с 1655 года дайдзё-дайдзин без приставки ио) в период его правления были изданы "Утверждения положений о судопроизводстве", в которых установил стандарты для рассмотрения судебных дел и разрешил простолюдинам жаловаться на администрацию, также произошло окончательное решение крестьянского вопроса - благодаря значительным средствам, выявленным у рода Токугава (в 1620 году) после разгрома Иэясу, крестьяне стали собственниками земли, которую обрабатывали, а землевладельцы получили выкуп в 1657 году.\n\n        Правление Сигэиэ было до самой его отставки в 1682 году в пользу среднего брата Исиды Сигэнари.\n\n        Исида Сигэнари (1682 - 1685)\n\n        Правление Сигэнари (1682 - 1685) запомнилось тем, что дайдзё-дайдзин смог продвинуть через Дайдзёкан "Закон о сострадании живым существам" и добиться его одобрения. Подал в отставку в пользу младшего брата Сакити.\n\n        Исида Сакити (1685 - 1695)\n\n        Его правление запомнилось "Законами о сбережениях" расходов вассалов в 1691 году. Подал в отставку в пользу племянника Нобумасы.\n\n        Исида Нобумаса (1691 - 1710 годы)\n\n        Правление дайдзё-дайдзина Нобумасы запомнилось указом об освоении земель Хоккайдо, а также наращиванием связей с европейскими странами и политикой борьбы с наводнениями. Также оно характеризуется принятием мер по поощрению торговли как внутри страны, так и снаружи - начинается политика Джийуубоуки (свободной торговли). В Дайдзёкане появляется фракция Торихики, представляющая интересы торговцев.\n\n        Исида Нобухиса (1710- 1746)\n\n        Начал реформировать японскую деревню: построил амбары в сёлах и поощрял выращивание риса для предупреждения голода, а для спасения своих вассалов от ростовщичества аннулировал все их долговые обязательства, но призвал жить экономно. Были отменены многие положения Тайхорё, одно из которых обязывало жителей страны платить зерном за использование земли - зерновой налог был заменён на денежный. Правил он до самой своей смерти в 1746 году.\n\n"

 aotsm_jap_story_3_text:"\n        Исида Нобуаки (1746 - 1774)\n\n        Политика этого дайдзё-дайдзина характеризовалась поддержкой развития запасов продовольствия на случаи стихийных бедствий. Подал в отставку по состоянию здоровья в пользу Нобуясу.\n\n        Исида Нобуясу (1774 - 1804)\n\n        Продолжил политику Джийуубоуки: хватка государства в Деревне была ослаблена - теперь каждый подданный (будь то мужчина или женщина) получал право собственности на землю, а участок, использующийся государственным работником, так и оставался в собственности государства.\n\n        Произошло мощное извержение вулкана Асаномаяма в 1783 году вызвало засуху, спровоцировав неурожай, но потерь среди людей не было благодаря проведённым ранее реформам.\n\n        Исида Нобуакира (1804 - 1810)\n\n        Решил при помощи члена рода Ода, Оды Нобумиси наладить отношения с родом Токугава. Обновил положения Тайхорё, согласно требованиям времени, отменив Батэрэн цуйхо рэй (приказ об изгнании христианских миссионеров, провозглашенный Тоётоми Хидэёси 24 июля 1587 года). Подал в отставку в пользу Ясучики.\n\n        Исида Ясучика (1810 - 1833)\n\n        Восстановил процветание подверженных стихийным бедствиям земель, в том числе заставил многих из своих людей заняться фермерством неполный рабочий день, чтобы сохранить свои доходы. В 1796 году он основал Доменную академию под названием Кэйкокан с целью оттепели в отношениях с родом Токугава. Домен пострадал от сильного землетрясения и цунами в 1793 году. Правил вплоть до самой смерти в 1833 году, назначив в качестве преемника Нобуюки.\n\n"

 aotsm_jap_story_4_text:"\n        Исида Нобуюки (1833)\n\n        Как бы то ни было, весна и лето 1833 года в Японии были очень холодными. Из-за этого в регионах Тохоку и северном Канто был неурожай - Исида Нобуюки получил поручение от кампаку Тадахиро Коноэ создать Кикин Тайсаку Кайги (Совет по мерам против неурожая), в состав которого должны были входить Абэ Масахиро, Имамура Чога и, непосредственно, сам Коноэ, для решения этой проблемы.\n\n        Род Токугавы, нехотя, но принял эту политику, проводимую на своих территориях - был выявлен ряд нарушений, из-за чего Дайдзёкан собирался ввести опару (опалу) для него. При посредничестве Тадахиро Коноэ и Имамуры Чоги было решено предоставить Кикин Тайсаку Кайги земли в Канто в качестве нейтральной зоны для переговоров.\n\n        Не выдержав этого унижения, представители рода Токугава чуть было не объявили о том, что Дайдзёкан, пользуясь именем Императора, хочет узурпировать власть в стране. Однако, члены Кикин Тайсаку Кайги смогли достичь компромиссного варианта, подарив клану Токугава северо-западную часть земель Тюбу и восстановление в титулах времён Иэясу, а роду Исиды компенсацию за них за счёт средств Токугавы, которые также обязались выплатить штраф за халатность во время неурожая.\n\n        В любом случае, угроза голода, благодаря своевременным усилиям Кикин Тайсаку Кайги была сведена на нет.\n\n        26 февраля 1836 года, после конфронтации между японцами и корейцами, был подписан Гангхваский договор, открывший Корею для японской торговли. В 1840 году король направил в Японию миссию, которую возглавлял Ким Хон Мур, восторженный наблюдатель за происходящими там реформами. Находясь в Японии, китайский дипломат Вану Цзунсянь представил ему исследование под названием "Стратегия для Кореи". В нём предупреждалось об угрозе для Кореи, исходящей от русских, и рекомендовалось Корее поддерживать дружественные отношения с Россией, которая в то время испытывала проблемы в Азиатском регионе после поражения от сил Ташкентского Соглашения, тесно сотрудничать с Китаем и стремиться к союзу с Ромейской Империей в качестве противовеса России. После возвращения в Корею Ким представил документ королю Хонджону, который был настолько впечатлен документом, что приказал сделать копии и распространить среди своих чиновников.\n\n        1842 год - После Чайной Войны Император убедился в слабости Империи Цин и решил напасть на Империю Чосон, с которой позже был заключён неравноправный договор в пользу Японии. По результатам этого небольшого противостояния дайдзё-дайдзин решил провести реформу Армии по европейскому образцу, что вызвало возмущение рода Токугавы.\n\n        Дайдзё-даёдзин Исида Нобуюки выступает за наращивание влияния в Азии, поэтому 25 июля 1843 года было объявлено "Хойкубу Кайхоуундо" (Северный освободительный поход), что вызвало ещё больше гнева сторонников изоляционистского курса - представителей рода Токугавы, но с этим они ничего не могли поделать.\n\n        После стычки с Империей Чосон, с ней был заключён неравноправный договор в пользу Японии (Второй Гангхваский договор). По результатам этого небольшого противостояния дайдзё-дайдзин решил провести реформу Армии по европейскому образцу, что вызвало возмущение рода Токугавы.\n\n"

 aotsm_jap_story_5_text:"\n        В 1845 году по результатам Симоносекского договора Японии перешли некоторые порты Китая (порт Далянь, переименованного в Дайрен - город Дайрен и порт Маомин, переименованного в Мона - город Мона), фракция Торихики - Дайдзёкан предложила свою помощь в управлении приобретёнными территориями, на что Нобуюки согласился. Император устал руководствоваться и мнением рода Токугава, мешающим вести эффективную внешнюю политику, поэтому Нобуюки Мицунари не был отправлен в отставку.\n\n        В 1846 году Рикуган Ха (армейская фракция, за активную внешнюю политику) вместе с Торихики добились разрешения от Императора на освоение земель Западного Кромвленда - основывается колония Нисей.\n\n        1846 - 1849 активное расширение японской колонии Нисэй в Западном Кромлвленде. (борьба с племенами кромвлендцев)\n\n        Император собирается арестовать Сёгуна, но чем же это обернётся для страны...\n\n"

