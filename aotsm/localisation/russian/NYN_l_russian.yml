 #CHARACTERS
 NYN_Zhang_Lexin_t:0 "Чжан Лэсин"

 #IDEAS
 NYN_mobile_detachments:0 "Подвижные отряды няньцзюней"
 NYN_mobile_detachments_desc:0 "Вооружённые объединения §Yняньцзюней§! привыкли действовать небольшими §Yподвижными отрядами§!, избегая затяжных столкновений с превосходящими силами противника. §YКонные воины§! совершают стремительные переходы, наносят внезапные удары по обозам и гарнизонам, после чего отступают прежде, чем неприятель успевает организовать преследование. Подобный образ ведения войны позволяет повстанцам компенсировать недостаток тяжёлого вооружения и регулярной военной подготовки."
 NYN_fragmented_rebel_bands:0 "Разобщённость повстанческих объединений"
 NYN_fragmented_rebel_bands_desc:0 "§YНяньцзюни§! представляют собой союз многочисленных вооружённых объединений, связанных общими интересами, родственными узами и неприятием императорской администрации. Каждый предводитель располагает собственными людьми и стремится сохранить самостоятельность в принятии решений. Отсутствие твёрдой §Yвоенной иерархии§! затрудняет согласование крупных операций и подчинение отдельных отрядов единому командованию, хотя местные вожаки способны быстро собирать новых сторонников."
 NYN_huaibei_smuggling:0 "Контрабандные промыслы Хуайбэя"
 NYN_huaibei_smuggling_desc:0 "На протяжении многих лет население §YХуайбэя§! (области к северу от реки Хуайхэ, включающей северные районы §YАньхоя§! и §YЦзянсу§!) занимается §Yнелегальной торговлей солью§!, перевозкой товаров в обход казённых застав и другими промыслами, не подконтрольными императорским чиновникам. Эти занятия обеспечивают местным вооружённым объединениям денежные средства, продовольствие и приток новых людей. Однако зависимость от неофициальной торговли и отсутствие устойчивой системы налогообложения препятствуют созданию полноценного государственного хозяйства и развитию организованного производства."
