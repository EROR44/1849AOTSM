l_russian:

 #Тут ванильные ивенты расположены, которые реплейснуты файлами мода

 ace_promoted.1.t: "Летчик-ас получает повышение"
 ace_promoted.2.t: "Возвращение аса"
 ace_promoted.1.d: "Мало кто рискует собой так отчаянно, как отважные пилоты [Root.GetAdjective]их ВВС. [From.GetName] [From.GetSurname], опытный пилот с позывным [From.GetCallsign], не просто возвращается без потерь из полетов над регионом [From.GetMissionRegion], но и одерживает убедительные победы в важнейших воздушных боях.\n\nСимвол истинного [Root.GetAdjective]ого мужества, [From.GetName] получает заслуженное повышение, с восторгом встречаемое публикой. Хотя для обычных людей война — скорее, ад, чем слава, герои необходимы, чтобы следовать их примеру."
 ace_promoted.1.d_major: "Мало кто рискует собой так отчаянно, как отважные пилоты [Root.GetAdjective]их ВВС. [From.GetName] [From.GetSurname], опытный пилот с позывным [From.GetCallsign], не просто возвращается без потерь из полетов над регионом [From.GetMissionRegion], но и пилотирует свой самолет [From.GetWing] с необычайным мастерством. Недавний полет над регионом [From.GetMissionRegion] доказал, что [From.GetName] — это настоящий ас, чье участие в боевых действиях неоценимо.\n\nСимвол истинного [Root.GetAdjective]ого мужества, [From.GetName] получает вполне заслуженное повышение, с восторгом встречаемое публикой. Хотя для обычных людей война — скорее, ад, чем слава, герои необходимы, чтобы следовать их примеру."
 ace_promoted.1.a: "Смелость города берет."
 ace_died.1.t: "Гибель пилота [From.GetCallsign] над регионом [From.GetMissionRegion]"
 ace_died.1.d: "Самый известный в государстве [From.Owner.GetName] ас-[From.GetAceType] [From.GetFullName] погиб, выполняя ответственное задание над регионом [From.GetMissionRegion]. К несчастью, поскольку [From.GetCallsign] является кумиром миллионов, такая смерть не пройдет незамеченной и станет для народа тяжелым ударом.\n\nМы хотели бы найти способ скрыть это, но долгое отсутствие такой известной персоны, как [From.GetName], скоро вызвало бы подозрения. В конечном итоге, эта гибель — тоже часть великой легенды, которая надолго переживет все наши мелкие текущие невзгоды."
 ace_died.1.d_major: "Самый известный в государстве [From.Owner.GetName] ас-[From.GetAceType] [From.GetFullName] погиб при выполнении ответственного задания. Самолет [From.GetWingShort] был замечен пикирующим в клубах пламени над регионом [From.GetMissionRegion] после боя с противником. К несчастью, поскольку [From.GetCallsign] является кумиром миллионов, такая смерть не пройдет незамеченной и станет для народа тяжелым ударом.\n\nМы хотели бы найти способ скрыть это, но долгое отсутствие такой известной персоны, как [From.GetName], скоро вызвало бы подозрения. В конечном итоге, эта гибель — тоже часть великой легенды, которая надолго переживет все наши мелкие текущие невзгоды."
 ace_died.1.a: "Живая легенда — это еще лучше."
 ace_killed_by_ace.1.t: "[From.GetFullName] сбит асом с позывным [Prev.GetCallsign]"
 ace_killed_by_ace.1.d: "Пилоты, возвращавшиеся из региона [From.GetMissionRegion], сообщают, что эскадрилья [Prev.Owner.GetAdjective]их самолетов, во главе которых был знаменитый ас с позывным [Prev.GetCallsign], нацелилась уничтожить [From.GetCallsign]. Сбив несколько вражеских самолетов и несколько раз увернувшись от [Prev.Owner.GetAdjective]ого огня, [From.GetCallsign] проиграл бой пилоту [Prev.GetCallsign], который сманеврировал более умело и прицельным попаданием пробил бак с горючим. Самолет [From.GetName] [From.GetSurname] загорелся и спикировал вниз над регионом [From.GetMissionRegion], объятый пламенем.\n\nМужество пилота [From.GetFullName] всегда было примером для многих. Гибель такого национального героя тяжело ударит по [From.Owner.GetAdjective]их ВВС и станет тяжелой утратой для всей нашей нации. Пока мы скорбим, [Prev.Owner.GetName] чествует [Prev.GetFullName] как героя, и наша трагедия становится еще более горькой."
 ace_killed_by_ace.1.d_major: "Пилоты, возвращавшиеся из региона [From.GetMissionRegion], сообщают, что эскадрилья [Prev.Owner.GetAdjective]их самолетов, во главе которых был знаменитый ас с позывным [Prev.GetCallsign], атаковала их. Их основная цель — [From.GetCallsign]. Сбив несколько вражеских самолетов и несколько раз увернувшись от [Prev.Owner.GetAdjective]ого огня, [From.GetCallsign] потерпел поражение: [Prev.GetCallsign] сманеврировал более умело и прицельным попаданием пробил бак с горючим. Самолет [Prev.GetWingShort], которым управлял [From.GetName] [From.GetSurname], загорелся и спикировал вниз над регионом [From.GetMissionRegion], объятый пламенем.\n\n[From.GetFullName] всегда проявлял несравненное мужество и был примером для многих. Гибель такого национального героя тяжело ударит по [From.Owner.GetAdjective]их ВВС и станет тяжелой утратой для всей нации. Пока мы скорбим, [Prev.Owner.GetName] чествует своего героя, и то, что [Prev.GetFullName] удостаивается таких похвал, делает трагедию еще горше."
 ace_killed_by_ace.1.a: "Сокрушительная потеря для всех нас"
 ace_killed_other_ace.1.t: "[From.GetFullName] сбил аса с позывным [Prev.GetCallsign]"
 ace_killed_other_ace.1.d: "Последний полет над регионом [From.GetMissionRegion] обернулся большим успехом для [From.Owner.GetAdjective]их ВВС по разным причинам. По донесениям стало известно о героизме, который проявил [From.GetFullName], одержав верх над [Prev.Owner.GetAdjective]им пилотом по имени [Prev.GetName] [Prev.GetSurname] с позывным [Prev.GetCallsign]. [From.GetCallsign] использовал себя как приманку, чтобы [Prev.GetCallsign] угодил в ловушку и [From.Owner.GetAdjective]ие пилоты смогли уничтожить эскадрилью, которую он вел. [From.GetCallsign] обманным маневром сбил с толку [Prev.Owner.GetAdjective]ие самолеты и одним выстрелом одержал победу. [Prev.GetCallsign] сгорел над регионом [From.GetMissionRegion].\n\n[Prev.GetFullName] был грозным врагом, сбившим многих [From.Owner.GetAdjective]их пилотов. Это великая победа, она показывает все величие наших героев и их подвигов."
 ace_killed_other_ace.1.d_major: "Последний полет над регионом [From.GetMissionRegion] обернулся большим успехом для [From.Owner.GetAdjective]их ВВС по разным причинам. По донесениям стало известно о героизме, который проявил [From.GetFullName], одержав верх над [Prev.Owner.GetAdjective]им пилотом по имени [Prev.GetName] [Prev.GetSurname] с позывным [Prev.GetCallsign]. [From.GetCallsign] использовал себя как приманку, чтобы [Prev.GetCallsign] угодил в ловушку и [From.Owner.GetAdjective]ие пилоты смогли уничтожить эскадрилью, которую он вел. [From.GetCallsign] обманным маневром сбил с толку [Prev.Owner.GetAdjective]ие самолеты и одним выстрелом одержал победу. [Prev.GetCallsign] сгорел над регионом [From.GetMissionRegion].\n\n[Prev.GetFullName] был грозным врагом, сбившим многих [From.Owner.GetAdjective]их пилотов. Это великая победа, она показывает все величие наших героев и их подвигов."
 ace_killed_other_ace.1.a: "[From.Owner.GetName] не забудет такую победу!"
 aces_killed_each_other.1.t: "[From.GetFullName] погиб"
 aces_killed_each_other.1.d: "Выполняя последнее задание, наш знаменитый ас-[From.GetAceType] [From.GetFullname] сразился с пилотом по имени [Prev.GetFullName]. Расстреляв все боеприпасы и не имея возможности ускользнуть, [From.GetCallsign] сманеврировал, уходя от огня [Prev.Owner.GetAdjective]их самолетов и пошел на таран против [Prev.GetCallsign].\n[From.GetCallsign] и [Prev.GetCallsign] погибли, их самолеты сгорели над регионом [From.GetMissionRegion].\n\nМы можем утешиться тем, что лучший [Prev.Owner.GetAdjective]ий ас [Prev.GetCallsign] больше не представляет для нас угрозы, но мы потеряли любимца публики и героя, вдохновлявшего весь [From.Owner.GetAdjective]ий народ."
 aces_killed_each_other.1.d_major: "Выполняя последнее задание, наш знаменитый ас-[From.GetAceType] [From.GetFullname] сразился с пилотом по имени [Prev.GetFullName]. Расстреляв все боеприпасы и не имея возможности ускользнуть, [From.GetCallsign] сманеврировал, уходя от огня [Prev.Owner.GetAdjective]их самолетов и пошел на таран против [Prev.GetCallsign].\n[From.GetCallsign] и [Prev.GetCallsign] погибли, их самолеты сгорели над регионом [From.GetMissionRegion].\n\nМы можем утешиться тем, что лучший [Prev.Owner.GetAdjective]ий ас [Prev.GetCallsign] больше не представляет для нас угрозы, но мы потеряли любимца публики и героя, вдохновлявшего весь [From.Owner.GetAdjective]ий народ."
 aces_killed_each_other.1.a: "Огромная потеря для всех нас"

 generic.1.t: "Государство [From.GetName] оказывает влияние на нашу политику"
 generic.1.d_neutral_good: "Уже довольно давно [From.GetAdjective]ое правительство демонстрирует желание сблизить исторические пути наших стран и проявляет особый интерес к [Root.GetAdjective]ой политике. С недавнего времени это стало более заметно: партия [From.GetRulingParty] начала пропагандировать [From.GetRulingIdeologyNoun_RU_lower_Acc], выступая с публичными речами, а также распространяя печатные материалы среди [Root.GetAdjective]ого населения. \n\nТеперь даже некоторые политики и видные чиновники под влиянием [From.GetAdjective]ой пропаганды начали выступать за то, чтобы постулаты этой идеологии стали господствующими в государстве [Root.GetName]."
 generic.1.d_bad: "Уже довольно давно [From.GetAdjective]ое правительство демонстрирует желание сблизить исторические пути наших стран, часто вмешиваясь во внутренние дела [Root.GetNameRuGen]. В последнее время это вмешательство стало особенно активным, и партия [From.GetRulingParty] начала открыто пропагандировать [From.GetRulingIdeologyNoun_RU_lower_Acc], совершенно не считаясь с [Root.GetAdjective]ими политическими традициями. Множество материалов, в которых восхваляется [From.GetRulingIdeologyNoun_RU_lower_Nom], также распространяются среди [Root.GetAdjective]ого населения. Похоже, что даже некоторые политики и видные чиновники под влиянием [From.GetAdjective]ой пропаганды начали выступать за то, чтобы постулаты этой идеологии стали господствующими в государстве [Root.GetName]."
 generic.1.a: "Интересно..."
 generic.1.b: "Да как они посмели!"

 generic.2.t: "Государство [From.GetNameDefCap] хочет присоединиться к альянсу [Root.GetFactionName]"
 generic.2.d.a: "На фоне нарастающей угрозы демократическим ценностям [alliance_applicant.GetAdjective]ие власти видят в нас защитников свободы. Они желают вступить в наш альянс, чтобы воспользоваться нашей защитой и помочь нам дать отпор антидемократическим силам."
 generic.2.d.b: "Наши попытки изменить существующий мировой порядок не ускользнули от внимания стран-единомышленниц. [alliance_applicant.GetAdjective]ие власти признают, что их лучшая надежда на процветающее будущее — встать на нашу сторону в грядущем конфликте. Поэтому они официально предложили выступить единым фронтом против наших врагов."
 generic.2.d.c: "[alliance_applicant.GetNameDefCap] признает, что должна объединиться с другими социалистическими республиками, дабы упрочить позиции коммунизма на мировой арене. Признав нашу ведущую роль в борьбе за права пролетариев всех стран, [alliance_applicant.GetAdjective]ой власти официально выразили желание вступить с нами в альянс."
 generic.2.d.e: "Отголоски недавних потрясений на международной политической арене продолжают звучать в разных уголках планеты. [alliance_applicant.GetAdjective]ие власти считают, что мы — их лучшая надежда на выживание в это трудное время. В связи с этим они направили нам просьбу о вступлении в наш альянс, чтобы мы смогли сообща пережить грядущую бурю."
 generic.2.a: "Мы приветствуем всех, кому близки идеалы свободы и демократии."
 generic.2.b: "Мир будет принадлежать самым сильным державам!"
 generic.2.c: "Если мы объединим усилия, революция будет обречена на успех."
 generic.2.e: "И мы выстоим под ее натиском!"
 generic.2.f: "Без них нам будет только лучше."
 generic.2.g: "У нас уже и так хватает союзников."
 generic.3.t: "Государство [alliance_inviter.GetNameDefCap] приглашает нас в альянс [alliance_inviter.GetFactionName]"
 generic.3.d: "Государство [alliance_inviter.GetNameDefCap] одобрило нашу заявку на вступление в альянс [alliance_inviter.GetFactionName]. Вместе с ними мы или выстоим, или потерпим крах."
 generic.3.a: "Вместе мы будем защищать демократию."
 generic.3.b: "Нас никто не остановит!"
 generic.3.c: "Нет лучших борцов за права пролетариев, чем мы!"
 generic.3.e: "На какое-то время мы забыли о наших разногласиях."
 generic.4.t: "Государство [alliance_inviter.GetNameDefCap] отклоняет заявку на вступление в альянс [alliance_inviter.GetFactionName]"
 generic.4.d: "Государство [alliance_inviter.GetNameDefCap] отклонило нашу заявку на вступление в альянс [alliance_inviter.GetFactionName]. Нам придется действовать без их помощи."
 generic.4.a: "И они называют себя защитниками свободы?!"
 generic.4.b: "Тогда мы их тоже раздавим!"
 generic.4.c: "Их революция прогнила до основания!"
 generic.4.e: "Между нами слишком серьезные разногласия."
 generic.5.t: "Государство [From.GetNameDefCap] приглашает государство [Root.GetNameDef] в альянс «[From.GetFactionName]»"
 generic.5.d.a: "Испытывая беспокойство в связи с недавними событиями на мировой арене, государство [alliance_inviter.GetNameDef] протянуло нам руку дружбы, предложив свою защиту, и призвало нас встать вместе с ним на защиту принципов свободы и демократии. Вступив в альянс [alliance_inviter.GetFactionName], мы сумеем гарантировать свободу наших граждан."
 generic.5.d.b: "Осознав, что даже сильным мира сего нужны союзники, [alliance_inviter.GetAdjective]ие власти пригласили нас вступить в альянс [alliance_inviter.GetFactionName]. Если мы примем их предложение, то получим шанс обрести свое место под солнцем."
 generic.5.d.c: "Наши идеологические союзники из [alliance_inviter.GetNameRuGen] обратили внимание на наш посильный вклад в защиту интересов рабочего класса, и сегодня утром мы получили предложение присоединиться к альянсу [alliance_inviter.GetFactionName]. Объединив усилия с другими социалистическими странами, мы раздуем пламя мировой революции с новой силой."
 generic.5.d.e: "Похоже, что [alliance_inviter.GetAdjective]ие власти считают нас стратегически важным партнером и полагают, что нам гораздо выгоднее работать сообща, чем пререкаться из-за идеологических разногласий. Сегодня утром [alliance_inviter.GetAdjective]ий посол отправил нам приглашение на вступление в альянс [alliance_inviter.GetFactionName]."
 generic.5.a: "Мы будем держаться вместе."
 generic.5.b: "Нам нужно лишь несколько тысяч убитых..."
 generic.5.c: "Мы будем сражаться бок о бок с нашими товарищами!"
 generic.5.e: "Это выгодное предложение."
 generic.6.t: "Государство [alliance_applicant.GetNameDefCap] принимает приглашение вступить в альянс [alliance_inviter.GetFactionName]"
 generic.6.d: "Государство [alliance_applicant.GetNameDefCap] приняло наше предложение вступить в альянс [alliance_inviter.GetFactionName]. Вместе с ними мы или выстоим, или потерпим крах."
 generic.7.t: "Государство [alliance_applicant.GetNameDefCap] отклоняет предложение вступить в альянс [alliance_inviter.GetFactionName]"
 generic.7.d: "Государство [alliance_applicant.GetNameDefCap] отклонило наше предложение вступить в альянс [alliance_inviter.GetFactionName]. Нам придется действовать без их помощи."
 generic.7.a: "Им не нужна наша помощь."
 
 generic.19.t: "Государство [From.GetName] поддерживает промышленность"
 generic.19.d: "Государство [From.GetNameDefCap] сообщает нам, что они поддерживают наше дело и предоставят нам определенную промышленную помощь, чтобы усилить наши позиции в борьбе с общими врагами."
 generic.20.t: "[From.GetNameDefCap] требует нашего подчинения"
 generic.20.d_friends: "Сегодня мы приняли делегацию, которую отправил [From.GetLeader]. Он заинтересован в расширении отношений между нашими странами и объединении [Root.GetAdjective]ого народа и державы [From.GetNameDef]. Если мы согласимся на то, что предлагает [From.GetLeader], [Root.GetNameDef] станет ограниченно автономной марионеткой державы [From.GetNameDef] и наше правительство будет реорганизовано так, как того желает [From.GetLeader].\n\nОстаётся открытым вопрос: что важнее — [Root.GetAdjective]ая независимость или дружба с государством [From.GetNameDef]?"
 generic.20.d_enemies: "Сегодня поступило сообщение из [From.GetNameRuGen]. В нём содержится требование: [Root.GetLeader] должен признать, что [From.GetLeader] — глава государства, а нашу нацию нужно организовать в нечто более соответствующее видению [From.GetAdjRuLower]им правительством [Root.GetNameRuGen]. Приняв эти требования, мы станем марионеткой [From.GetNameRuGen].\n\nНам не хотелось бы отдавать свою независимость нашим врагам за рубежом, но в этом сообщении содержится определённый элемент угрозы, позволяющий предположить, что в случае отказа выполнить то, что требует [From.GetLeader], мы вскоре окажемся в состоянии войны с державой [From.GetNameDef]."
 generic.20.a: "Подчиниться их требованиям."
 generic.20.b: "Лично я приветствую наших новых [From.GetAdjective]их хозяев."
 generic.20.c: "Это исключено!"
 generic.21.t: "[From.GetNameDefCap] подчиняется"
 generic.21.d: "[From.GetAdjective]ое правительство согласилось оставить свою независимость и стать марионеткой [Root.GetNameRuGen]. Мы уверены, что это приведёт нас к величию и поспособствует [Root.GetAdjective]им интересам в регионе."
 generic.21.a: "Превосходно."
 generic.22.t: "[From.GetNameDefCap] сопротивляется!"
 generic.22.d: "Сегодня прибыли дипломаты из [From.GetNameRuGen]. Они сообщили, что отклоняют наше предложение объединить [From.GetNameRuGen] и [Root.GetNameDef]. Как бы досадно это ни было, остаётся доступным — и весьма соблазнительным — вариант призвать государство [From.GetNameDef] к порядку силой."
 generic.22.a: "Весьма досадно."
 generic.23.t: "[From.GetNameDefCap] требует контроля над регионом [demanded_prov_target.GetName]"
 generic.23.d: "Сегодня к нам явилась враждебно настроенная делегация из [From.GetNameRuGen] и заявила свои претензии на всю территорию региона [demanded_prov_target.GetName]. [From.GetLeader] требует, чтобы мы немедленно вернули территорию, в противном случае неизбежна война. Наши визитёры утверждают, что [demanded_prov_target.Owner.GetAdjRuLower]ий контроль над этим регионом нелегитимен и что [demanded_prov_target.GetName] — неотъемлемая часть [From.GetAdjRuLower]ого государства.\n\nЕсли мы примем их требования, [demanded_prov_target.GetName] отойдёт [From.GetNameRuDat], но мы сохраним все национальные территории и претензии в регионе. В случае отказа, судя по всему, неизбежна война между нашими нациями."
 generic.23.a: "У нас нет выбора."
 generic.23.b: "[demanded_prov_target.GetName] останется в составе [Root.GetAdjective]ого государства!"
 generic.24.t: "Регион [demanded_prov_target.GetName] отдан!"
 generic.24.d: "[From.GetNameDefCap] принимает наши справедливые претензии на регион [demanded_prov_target.GetName] и уступает его государству [Root.GetNameDef].\nТеперь, так ловко и изящно уладив это дело, мы уверены, что между державами [Root.GetNameDef] и [From.GetNameDef] воцарится вечный мир."
 generic.25.t: "[From.GetNameDefCap] сопротивляется!"
 generic.25.d: "[From.GetNameDefCap] отказывается удовлетворить наши требования, и теперь нам надо решить, стоит ли выполнять угрозу вторжения. Если мы не сдержим своё слово, [Root.GetLeader] сильно потеряет в общественном восприятии и легитимность [Root.GetAdjective]ого правительства будет поставлена под сомнение."
 generic.25.a: "Так или иначе регион [demanded_prov_target.GetName] станет нашим."