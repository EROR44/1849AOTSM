 #CHARACTERS
 DNG_Bai_Yanhu_t:0 "Бай Яньху"

 #IDEAS
 DNG_hui_community_militias:0 "Общинное ополчение хуэй"
 DNG_hui_community_militias_desc:0 "§YМусульманские общины§! северо-западных провинций издавна полагаются на собственные связи взаимопомощи, местных старейшин и религиозных наставников. В условиях вооружённого противостояния эти объединения становятся основой для формирования ополчений, способных быстро собрать людей и организовать защиту родных поселений. Знание местности, общинная солидарность и стремление защитить свои семьи укрепляют стойкость повстанческих отрядов, особенно при обороне собственной территории."
 DNG_divided_resistance_centers:0 "Разрозненные центры сопротивления"
 DNG_divided_resistance_centers_desc:0 "Повстанческие объединения §YШэньси§! и §YГаньсу§! возникают вокруг отдельных городов, общин и влиятельных военачальников, каждый из которых располагает собственными отрядами и источниками снабжения. Несмотря на общность интересов и периодическое проведение совместных операций, между их руководителями отсутствует прочная система подчинения. Разногласия относительно военных целей, распределения ресурсов и методов борьбы затрудняют выработку единого плана действий и ослабляют согласованность войск."
 DNG_intercommunal_tensions:0 "Межобщинная напряжённость"
 DNG_intercommunal_tensions_desc:0 "Давние хозяйственные споры, борьба за землю и воду, местные столкновения и взаимное недоверие постепенно обостряют отношения между §Yмусульманскими и немусульманскими общинами§! северо-западных провинций. Неспособность императорской администрации справедливо урегулировать противоречия способствует распространению вооружённых ополчений и росту общественного недовольства. Напряжённость подрывает хозяйственную жизнь и препятствует восстановлению порядка, одновременно усиливая готовность населения поддерживать собственные вооружённые объединения."
