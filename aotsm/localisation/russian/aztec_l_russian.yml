 AZT_macehualtin_category_desc:0 "Созыв национального ополчения обеспечивает быстрый доступ к большому количеству войск в регионе в случае начала войны. За прошедшие столетия ополчение сослужило стране добрую службу, нередко заменяя регулярную армию в войнах. Когда они заканчивались, ополченцев отправляли по домам, и они возвращались к мирной жизни."
