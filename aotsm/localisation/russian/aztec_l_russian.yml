 AZT_epidemic_in_the_army_timed_idea:0 "Эпидемия в армии"
 AZT_epidemic_in_the_army_timed_idea_desc:0 "Невозможное возможно: в нашей армии произошел прецедент, о котором никто не мог и подумать. В некоторых воинских частях начались вспышки болезней из-за продолжительной антисанитарии, но события развивались настолько стремительно, что остановить её вовремя не удалось. Чем дольше мы ждем, тем глубже наша армия погружается в коллапс"
