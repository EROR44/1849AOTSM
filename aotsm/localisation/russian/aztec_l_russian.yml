 #EVENTS

 azt_event.1.t:0 "Новое Коколицтли"
 azt_event.1.d:0 "Невозможно было представить дальнейшее развитие страны без решения главной проблемы: последствиями Нового Коколицтли. Этими двумя словами все крупнейшие эпидемии, когда-либо происходившие в империи. Последнее из них - катастрофа 1842 года, оказалось наиболее сильным. Жертв было настолько много, что их трудно сосчитать даже самыми точными анализами. Разумеется, такое крупное событие не может не оставить негативный отпечаток на нашей современности. Те прошедшие 7 лет не столь сильно отличались от первого, разве что в после ухода коколицтли смертность упала, что дает шанс на восстановления. Однако по сей день оно прошло далеко не во всех частях страны. В Теночтитлане или, например, Куэтлаштане, мы едва вспомним о той трагедии, что постиг наш народ, однако зайдя в глубины империи мы с трудом увидим различия между тем, что было в начале эпидемии, и что происходит сейчас.\n\nРешить проблему, казалось, уже попросту невозможно, но император так не считал. Он верил, что без решительных мер страну не спасти, и намеревался добиться исполнения этих мер, чего бы ему это не стоило. По своей программе борьбы с последствиями коколицтли он решил использовать все средства, которые только имелись у родины. Главное по этому плану - результат. Он должен был перебить все расходы, на которые, по крайней мере, у империи хватало сил. Сегодня он издал указ, который гласит, что план производится в действие, и мы уже готовы использовать первые наши методы борьбы."
 azt_event.1.a:0 "Ни пуха, ни пера, к черту!"

 azt_event.2.t:0 "Ритуал счастья среди горя"
 azt_event.2.d:0 "Во времена отца нашего высочества Монтесумы II, достопочтенного Иккохитли I, страна, принявшая григорианский календарь, впервые отметила свой Новый Год не 13 марта, как это было раньше, а 1 января. Празднование 1825 года в императорском дворце проходило в формате пышного пира, а окончилось в лучших традициях празднования Нового Года: поджиганием свечей на свежесрубленных деревьях окоте и головокружительными танцами под веселящую песню барабанов.\n\nТот праздник стал самым масштабным из всех, что отмечались позже. Со временем, когда реформы требовали все больше средств, данное событие праздновали на порядок скуднее, зачастую оставляя все на воодушевленных местных жителей. Может быть, это связано, в том числе с пожарной безопасностью, ведь многие все еще помнят пожар в Куолапане, в котором по неосторожности сгорело 15 домов из квартала, полностью состоящего из деревянных построек.\n\nБольше всех к Новому Году 1825 приблизилось празднование 1849 года. Но прошло оно с особым подходом, наполненным ритуалами и обрядами. Мало кто мог праздновать в полной мере: почти в каждой семье горе, холера, а также голод, вызванный гуманитарной катастрофой, оставляли темное пятно в сердце каждого. Так, особо верующие проводили ритуал Тескатлипока. Несмотря запрет на жертвоприношения, ацтеки использовали обычные порезы в качестве обмена с богами на милость и избавление от беды, что не нарушало правил. А жители Теночтитлана могли порадовать себя обрядом снятия грехов и болезней с помощью жрецов, где присутствовал и верховный Тламакацке. Обряд включал генеральную уборку дома, окуривание помещений травами и омовение в священных водах. Человек исповедовался в проступках перед жрецом, который выступал посредником богини, после чего «смывал» с ацтека скверну. Всякий житель мог уверовать в скорое наступление лучших времен после всех наказаний, нанесенных богами."
 azt_event.2.a:0 "Новые праздники, старые традиции!"

 azt_event.3.t:0 "Император и его государство"
 azt_event.3.d:0 "Всякий правитель всходил на престол под покровительством главного бога ночи, судьбы, верховной власти и царей народа мешика - Тескатлипоки. Лишь Монтесума II придерживался мнения, что его долг в первую очередь лежит перед народом, измученным «Столетием унижений», начавшегося с прибытия европейцев, в частности - австрийцев. Это особенно укрепилось поездкой младшего сына прошлого императора империи, - Иккохитли I, в Европу, учиться наукам в лучшем университете Франции, а возможно и всего континента.\n\nПоследние 7 лет правления императора не отличались особыми успехами, особенно в сравнении с успехами его отца. Монтесума не знает, разделяет он его мнение о долге перед народом, но точно известно, что он великий реформатор, призванный сравниться с успехами Ацтлана Мудрого. Он видел в себе шанс для империи на благополучие, но он даже не догадывался, с чего лучше всего начать. Все попытки упирались в главную проблему этого десятилетия для страны: борьбу с последствиями эпидемии холеры, что в народе называется «Новым Коколицтли». Но останавливаться на этом он и не думал, хотя, впрочем, и успехов в решении этой проблемы не выявлялось.\n\nДля успешного правления, решений старых проблем, как ему казалось, будет недостаточно. Он считал, что в первую очередь нужно подготовить сердце каждого жителя - родину, империю. Но готова ли она к этому, выдержит ли она весь ветер перемен, при этом не покончив так же, как в свое время пала монархия Бурбонов во Франции, сможет ли все пойти так, как считал нужным император? Выяснить это ему больше всех и хотелось, нужен был лишь первый шаг..."
 azt_event.3.a:0 "Сможет ли император превзойти успехи своего отца?"

 azt_event.4.t:0 "Большой тур"
 azt_event.4.d:0 "После многих лет, прожитых в Европе во имя учения, император с особым почетом возвращался назад. Но за огнями Куэтлаштана скрывалась тьма. Непривычная тьма, длившаяся всю поездку до столицы, не переставала пугать императора. Лишь полнолуние дало тускло освещало единственную железную дорогу в стране.\n\nСпустя 7 лет император, наблюдая за ночными огнями его города, тяжело вспомнил свой опыт поездки по стране, осознавая, что он ни разу не был в других городах кроме как в столице и главной гавани страны кроме как проездом. И для него это звучало как оскорбление, высказанное самому себе самим собой, ведь трудно управлять страной практически вслепую.\n\nТо, что раньше бы было безумием со стороны императора из-за тогда еще бушевавшей эпидемии холеры, сейчас кажется способом найти подход, самому увидеть как выглядит его страна. Он захотел провести поездку по всей стране, зайдя в глубины империи, интересуясь ею и всем, что ее олицетворяет. В столице он видел империю такой же, какой он наблюдал Францию из его парижского балкона, но разглядеть Европу из своего дворца он все еще не мог."
 azt_event.4.a:0 "Что еще может прийти ему в голову?"

 azt_event.5.t:0 ""
 azt_event.5.d:0 ""
 azt_event.5.a:0 ""

 azt_event.6.t:0 "Встреча с Тламакацке"
 azt_event.6.d:0 "Император был заинтересован в получении поддержки среди традиционалистов, занимающие позицию противовеса для фракции модернистов, и верховного жреца язычества - Тламакацке, имеющего серьезное влияние на население страны. Для этого Монтесума пригласил его в свой дворец в Теночтитлане для встречи. Спустя несколько дней жрец прибыл к дворцу, где за ослепляющими от солнца фасадами, в саду Монтесумы II, император радушно встретил его. Через какое-то время они вошли во внутрь дворца, окутанного прохладой. Сквозь блики фресок и закрытые двери, вдали от любопытных ушей и под шелушение воды от фонтанов на улице, затесался немного иной разговор.\n\n— Знаешь ли, в кругах остальных жителей мы не самое однозначное правительство, - спросил Монтесума у жреца, - нас недолюбливают.\n— На деле уж точно любимее тех же колонистов\n— Да, может быть, но эти колонисты сидят в нашем дворце и управляют нашей страной как советники императора, и как бы это нам было необходимо, но это все равно подрывает доверие. Они считают, что тот же легион Конде - очередная кучка колонистов, пришедших разорять страну, но даже не догадываются, что они в том же положении, что и мы.\n— Народ не примет иностранного влияния, пока они не увидят, что оно из себя представляет, - чуть ли не перебивая ответил Тламакацке.\n— Я... Я хотел чтобы они уже сейчас не думали так, - попросил император, - их поддержка поможет быстрее прийти к процветанию.\n— Возможно, возможно. Как бы то ни было, им не нравится, что им пытаются навязать чью то веру отличной от их, им верны наши боги. Они верят, что они помогут им одолеть их, европейцев, от угнетения нашего же народа. Вот в это они поверят быстрее всех.\n— Хорошо, пару храмов и святилищ построить возможно, но твоя доля как посланника богов на земле, несомненно, поможет в этом. - сказал император..."
 azt_event.6.a:0 "Все же, получить желаемое ему удалось"

