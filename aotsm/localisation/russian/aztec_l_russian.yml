 azt_event.21.t:0 "Связь между поколениями"
 azt_event.21.d:0 "Как бы настойчиво и быстро не развивалось христианство в новооткрытых землях Кромвленда, у империи народа мешика все было полностью наоборот. Несмотря на сильное влияние католицизма среди элит нашей страны, обычные граждане продолжали нести проповедь религии, которая была основной для многих поколений, которая объясняла ацтеку каково его предназначение и кто его создал. Эта религия связывала поколения, сыновей с прадедами, прадедов с пра прадедами. Народ мешика задабривал богов своими ритуалами, богослужением и жертвоприношениями. Так было долгое время, пока в «Кодексе ацтекского народа», написанного при Ацтлане Мудром, впервые был закреплен запрет человеческих жертвоприношений.\n\nСегодня религия для ацтеков - наиболее ценное, что есть у каждого его гражданина. Она объединяет  всех за единой мыслью, заставляет не унывать даже в самые трудные времена. Но при этом все дурные события за последние 50 лет, все проигранные войны и Коколицтли народ считает наказанием от богов. Каждый видит в нем свои смыслы - банальное неповиновение, более радикальный считает, что мы отошли от старых традиций и жертвоприношений. А может кто-то считает, что императорская милость перестала нравится богам, и они наводят на некие мысли. То, что понятно каждому ацтеку, это то, что мы должны защищать все, что у нас есть, в первую очередь сердце нашей нации, а именно - религию."
 azt_event.21.a:0 "Мы должны извиниться перед богами"

 azt_mec_mittleazteken.1.t:0 "Поручение"
 azt_mec_mittleazteken.1.d:0 "Его Превосходительство император прекрасно знал положение дел в Европе. Читая все больше новостных заголовков, он все чаще видел в этом окно возможностей, но окно это, казалось, было заколочено. Как ни подойди, но все равно ни света не пройдет - тьма, то как тучи, то как гром.\n\nИ вдруг, нежданно-негаданно, как снег на голову, император увидел солдат австрийских гарнизонов посреди рынка с горстью монет. Тут же он поручил разузнать положение этого гарнизона изнутри. Уже через час он выслушивал доклад про то, как им резко уменьшили жалованье, а затем и вовсе перестали финансировать. С тех пор, как на континенте Австрия все больше погрязла в долгах, сэкономить решили в первую очередь на бюджете колоний. Косвенно это повлияло и на акции Миттелькромвлендских компаний, которые тоже требуют государственной поддержки. Во всей этой истории последнее место досталось лишь армии, и теперь этот гарнизон вынужден выживать на остаток своей казны.\n\nВыслушав все подробности и недолго подумав, император решил действовать. Но все таки он понимал, что прямое столкновение со странами принесет не более, чем еще одну проигранную войну для нас. Тогда он привел лучших своих дипломатов и поручил им направиться в сам Хьюстон, чтобы предложить переписать условия Теночтитланских соглашений на более выгодные к этой обстановке."
 azt_mec_mittleazteken.1.a:0 "- Будет исполнено, император!"

 azt_mec_mittleazteken.2.t:0 "Встреча с Mittleazteken: День 2"
 azt_mec_mittleazteken.2.d:0 "Утро следующего дня, казалось, встретило делегацию с надеждой. Собравшись, они опять выехали в торговую палату, но в этот раз взяв в разы больше документации. Точно так же как вчера, в 12 часов дня, двери закрылись окончательно, начав переговоры.\n\n- Знаете, мы внимательно все просмотрели, и готовы к обсуждению. Во-первых, поче...\n- Стойте, послушайте сначала нас... - ответили наши дипломаты\n\nДелегация Mittleazteken выглядела шокированной.\n\n-...Итак, мы остановились на выводе всех гарнизонов, чтобы вам не пришлось тратить деньги на их содержание\n- Так. А с чего это вы решили облегчить нагрузку на наши кошельки?\n- Да неважно, тем более у нас эпидемия холеры была, и вы еще большую часть гарнизонов из-за нее вывели, так зачем же и дальше их удерживать?\n- Ладно, убедили, все таки это дорого обходится в последнее время. Эй, Франц, принеси чернила, пустые бумаги у нас уже лежат!\n\nСпустя еще некоторое время бюрократических процессов, наша делегация покинула торговую палату. После этой встречи воздух казался намного чище, словно они уже на побережье залива. Выполнив поручение, они, немедля, собрались в порт обратно домой."
 azt_mec_mittleazteken.2.d.a:0 "Утро следующего дня, казалось, встретило делегацию с надеждой. Собравшись, они опять выехали в торговую палату, но в этот раз взяв в разы больше документации. Точно так же как вчера, в 12 часов дня, двери закрылись окончательно, начав переговоры.\n\n- Знаете, мы внимательно все просмотрели, и готовы к обсуждению. Во-первых, поче...\n- Стойте, послушайте сначала нас... - ответили наши дипломаты\n\nДелегация Mittleazteken выглядела шокированной.\n\n-...Итак, мы остановились на выводе всех гарнизонов, чтобы вам не пришлось тратить деньги на их содержание\n- Так. А с чего это вы решили облегчить нагрузку на наши кошельки?\n- Да неважно, тем более у нас эпидемия холеры была, и вы еще большую часть гарнизонов из-за нее вывели, так зачем же и дальше их удерживать?\n- Ладно, мы то может и согласны, но мы должны знать с чем имеем дело. - достаточно эгоистически сказал торговец Mittleazteken.\n- В плане?\n\nДипломат сам и не знал, в чем может быть подвох. Однако он не мог не воспользоваться шансом на облегчение кризиса из-за войны с пруссаками на материке. Выжать дополнительные деньги для покрытия дефицита для него стало первоочередным.\n\n- Мы хотим права на ваши рудники. У вас достаточно ресурсов, чтобы вы могли компенсировать заключение этой сделки. А мы будем развивать их по нашим технологиям, ты хоть тоже выгоду получишь."
 azt_mec_mittleazteken.2.a:0 "Миссия выполнена"
 azt_mec_mittleazteken.2.b:0 "- Хорошо, несите чернила..."
 azt_mec_mittleazteken.2.c:0 "- Да ну вас, монополистов!"

 azt_mec_mittleazteken.8.t:0 "Хьюстонская грубость"
 azt_mec_mittleazteken.8.d:0 "По прибытии в Хьюстон делегация, измученная усталостью. направилась в отель. Шум рынков и улиц постепенно сменился на родные для многих ацтеков тишину и покой. На следующий день делегаты направились в торговую палату на конках, где представители Mittleazteken ожидали их, халатно убирая кучу бумажек в архив. По приезду их встретили с неким презрением, напрягая даже до переговоров. Наступив обед, ровно в 12:00, обе стороны приступили к разговорам\n\n- Так каковы ваши предложения? - спросил делегат от Mittleazteken\n- Если бы вы бывали в Теночтитлане последние пару недель, вы бы увидели, что ваш гарнизон не получает финансирование.\n- Хорошо, спасибо, что приехали сюда предупредить нас о нашей же проблеме, это все?\n- Нет, - грубо ответил наш дипломат, - мы можем предложить вам выгодную сделку.\n\n“Что эти дикари могут знать о выгоде и капитализме”, - подумал переговорщик Mittleazteken.\n\n- Мы предлагаем вам убрать ваши гарнизоны с наших портов и городов, освободив вас от финансирования этих частей.\n- Так просто?\n\nПолучив бумагу со всеми условиями, он, словно увидев подвох, сказал: “Мы не готовы подписать все сейчас. Мы повнимательнее изучим, осмотрим”\n\n- Погодите, ну давайте мы обсудим что тут не так.\n- А что тут думать? Мы изучим, предложим правки и что-то и заключим.\n- У нас еще...\n- ВСЕ! Не занимайте у нас время, у нас 7 кораблей в порту простаивают и мы теряем прибыль, приходите завтра!"
 azt_mec_mittleazteken.8.a:0 "Они даже не выслушали нас!"

 azt_scripted_events.1.t:0 "Наследие «Великой реставрации»"
 azt_scripted_events.1.d:0 "В этот, как казалось раньше, обычный день в шумном Куэтлаштане произошло поистине историческое событие. Вечером группа изобретателей представила в своей небольшой аудитории свою разработку, затягивая время своей монотонностью. Усталость у зрителей, проработавших на протяжении дня на верфи, заменялась на скуку. Но незадолго до конца эту конференцию посетил нежданный для многих гость. В аудиторию тихо зашел адмирал в сопровождении капитана корабля «Акамапичтли». Того самого минного крейсера, строившегося последний десяток лет, и никогда никому не было до него дела, кроме как к рабочим верфи, которые постоянно обслуживали этот крейсер.\n\n— Здравствуйте, товарищи! Мы, кажется, немного задержались — с небольшой ухмылкой произнес адмирал.\n— О, мы вас как раз и ждали! Присаживайтесь на места поближе — ответил ученый.\n— И учтите, времени у меня не много, нужно ещё обойти корабль — слегка грубо ответил капитан\n— Ну, не буду долго тянуть... Мы на протяжении последних лет работали над электроприборами для вашего корабля. И знали бы вы, чем у нас будет оснащены корабли. В общем, даже мы изначально не знали.\n\nВсе матросы в аудитории, не отошедшие от удивления из-за присутствия адмирала и капитана, ещё больше напряглись. Капитан, чьи эмоции раньше не выражали сильного интереса, крайне внимательно слушал речь группы изобретателей.\n\n— Из нашего заждавшегося крейсера выйдет не только хороший корабль, он будет нашим первым «флагманом»... — горделиво и медленно говорили новаторы. \n— Эй, а что такое флагман? — шепча, спросил капитан.\n— Это значит командный центр, с него можно будет всем флотом управлять и командовать. — без раздумий прошептал адмирал.\n— ...И доступно это стало с помощью наших недавних разработок. Они позволилят в ближайшем будущем установить электроприборы в наши суда, что поможет координировать действия флота, например, прямо в гуще битвы. И самое главное — это то, что корабль вводится в состояние продолжения строительства. И все мы, не говоря уже о самом Императорском Величестве, будем крайне ждать спуска на воду.\n\nЗал был полон восхищением, хотя, казалось, что оно не было столь из-за гордости, сколько из отчаяния. Но точно было видно одно — капитан и адмирал ликовали и оглядывались на матросов, ещё не очень понимающих о чем шла речь, но они все равно все улыбались и искренне радовались.\nПо окончании конференцию покинули все. Почти все. Лишь те 2 опоздавших гостя остались в аудитории. Но дальнейшего разговора не слышал, наверное, никто, кроме их самих. Правда поговаривают, что говорили они о неком будущем пополнении флота."
 azt_scripted_events.1.a:0 "Величие отечественного флота"

