 AZT_reactionist_party:0 "НМП"
 AZT_reactionist_party_long:0 "Национально-модернистская партия - §Lпартия, основанная иностранцами принцем Конде и графом де Ланжероном во время Реставрации Иккохтли с целью примирения местного населения с преобразованиями страны по западному образцу. Основные идеи НМП заключаются в борьбе с австрийским колониальным гнетом и уничтожении пережитков прошлого любыми доступными методами.§!"
 
 AZT_authoritarian_party:0 "Сторонники Тламакацке"
 AZT_authoritarian_party_long:0 "Сторонники Тламакацке - §Lобширная религиозно-консервативная фракция во главе с Тламакацке, имеющая серьезное влияние на население страны. Ведущей концепцией фракции, как и самого Тламакацке, является консерватизм, традиционализм и национализм по отношению к колониалистам.§!"

 #LEADER
 AZT_Montesuma_IV_t:0 "Монтесума IV"
 POLITICS_MONTESUMA_IV_DESC:0 "Полное имя: §YМонтесума IV Акамапичтли§! \nДата рождения: §G3§! декабря §G1818§! года \n\nРодился в §YАцтекской Империи§!. Поскольку в стране не было приложено должных усилий по вестернизации, §YИккохтли§! решил привлечь французских эмигрантов, сбежавших от нового правительства §YФранции§! в §G1805§! году, самым известным из которых был граф §Yде Ланжерон§!, для исправления подобной ситуации.\n\nПоэтому принц стал изучать французский язык у этого графа с §G7§! лет, чтобы получить хорошее образование по европейским стандартам. По достижении §G18§! лет §YМонтесума§! смог закончить с отличием изучение всеобщей (учителем данного предмета был принц Конде) и родной истории (учителем которой был его отец). Несмотря на свои успехи, наследный принц не собирался останавливаться на достигнутом и потому решил поступить в парижский университет, что император сильно поощрил, предоставив спонсирование подобной инициативы.\n\nВ Париже §YМонтесума IV§! стал обучаться в основном военному ремеслу, латыни и математике, однако, §Oпосле смерти§! старшего брата от эпидемии холеры в §G1842§! году был вынужден вернуться на Родину. Затем, в §G1845§! году §Oумер§! и сам император §YИккохтли§!, поэтому §YМонтесума§! отныне был коронован, как император ацтеков §YМонтесума IV§!"
 
