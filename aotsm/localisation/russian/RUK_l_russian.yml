 #Leader names

 RUK_Sho_Iku_t:0 "Сё Ику"
 POLITICS_SHO_IKU_DESC:0 "Полное имя: §YСё Ику§!\nДата рождения: §G19§! августа §G1813§! года\nМесто рождения: §YЗамок Сюри§!, §Yкоролевство Рюкю§!\n\nРодился в семье правителя §YРюкю§! §YСё Ко§! и с юности готовился к управлению государством, получая конфуцианское образование. В §G1828§! году, в связи с болезнью отца, был назначен регентом и фактически принял на себя бремя власти, столкнувшись с нарастающими финансовыми трудностями королевства. Реальная власть в §YСюри§! уже тогда была ограничена §YЯпонией§!, но §YСё Ику§! искусно лавировал, сохраняя видимость самостоятельности.\n\nПосле смерти §YСё Ко§! в §G1834§! году §YСё Ику§! взошёл на трон, а в §G1838§! году получил формальное признание от императора §YИмперии Цин§! §YАйсинь Гьоро Мяньнина§!. Однако его правление пришлось на эпоху, когда §YРюкю§! окончательно превратилось в формальное государство — внешняя политика королевства полностью контролировалась §YЯпонией§!. Через порт §YНаха§! проходили основные торговые потоки между §YЯпонией§!, §YКитаем§! и западными державами, включая §YКонфедерацию Британских островов§! и §YРомейскую Империю§!, что делало §YРюкю§! ключевым узлом азиатско-европейской торговли в регионе.\n\nБудучи учёным-конфуцианцем, §YСё Ику§! много внимания уделял образованию, но его правление было омрачено финансовым кризисом. Доходы от пошлин уходили в имперскую казну, а не в казну §YРюкю§!, что ограничивало возможности для самостоятельных реформ. В §G1842§! году он направил посольство к императору §YОсахито§!, подтвердив лояльность трону. Однако даже признание императора не давало §YРюкю§! реальной самостоятельности — все ключевые решения принимались в §YКиото§!, а правитель оставался лишь номинальным главой."
 RUK_Sho_Tai_t:0 "Сё Тай"
 POLITICS_SHO_TAI_DESC:0 "Полное имя: §YСё Тай§!\nДата рождения: §G3§! августа §G1843§! года\nМесто рождения: §YЗамок Сюри§!, §Yкоролевство Рюкю§!\n\nРодился в семье правителя §YРюкю§! §YСё Ику§! и с раннего детства готовился к управлению государством, получая традиционное конфуцианское образование. Будучи старшим сыном, в §G1847§! году был объявлен наследником престола, а в §G1849§! году в малолетнем возрасте взошёл на трон после смерти отца, что создало серьёзные риски для сохранения формальной независимости §YРюкю§! от §YЯпонии§!.\n\nВступление на престол в столь юном возрасте совпало с периодом глубокого финансового кризиса в королевстве — казна была пуста, а крестьяне страдали от неурожаев и нехватки земли. Через порт §YНаха§! по-прежнему проходили основные торговые потоки между §YЯпонией§!, §YКитаем§! и западными державами, включая §YКонфедерацию Британских островов§! и §YРомейскую империю§!, однако реальные доходы от пошлин уходили в имперскую казну, а не на развитие §YРюкю§!. \n\nБудучи номинальным правителем, §YСё Тай§! столкнулся с растущим давлением со стороны §YЯпонии§!, требовавшей полного подчинения. Его малолетство делало королевство особенно уязвимым — все ключевые решения принимались в §YКиото§!, а правитель оставался лишь фигурой, символизирующей формальную независимость §YРюкю§!, которая с каждым годом становилась всё более призрачной."
 
