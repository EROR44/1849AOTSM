 modern_tank_equipment: "Основной танк"
 modern_tank_equipment_desc: "Современные танки — это маневренные, многоцелевые боевые машины, сочетающие в себе огневую мощь тяжелого танка с мобильностью среднего танка. Они предвосхитили появление современных основных боевых танков."
