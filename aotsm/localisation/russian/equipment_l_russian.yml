 gw_tank_equipment_desc: "Модель бронерованной машины на гусеничном ходу, первоначально разработанная прусскими военными. Предназначена в основном для поддержки пехоты при наступлении и оснащена несколькими пулеметами для этого."
 light_tank_equipment: "Легкий панзер"
 light_tank_equipment_desc: "Легкие панзеры-  маленькие и подвижные боевые машины. Они подходят для разведки и боя с легкобронированными противниками."
