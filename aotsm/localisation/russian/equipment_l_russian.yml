 super_heavy_tank_equipment: "Сверхтяжелый панзер"
 super_heavy_tank_equipment_desc: "Сверхтяжелые панзеры — эволюция концепции тяжелого панзера. Они крупнее, тяжелее, с более мощным вооружением, но при этом медленнее, испытывают проблемы на мягком грунте и способы пересекать лишь наиболее прочные мосты."
