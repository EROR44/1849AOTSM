 mothership_equipment: "Самолет-матка"
 mothership_equipment_short: "Самолет-матка"
 mothership_equipment_desc: "Очень большой самолет, способный перевозить на борту несколько истребителей, тем самым увеличивая радиус их действия по сравнению с обычными условиями. Авианосец неба."
