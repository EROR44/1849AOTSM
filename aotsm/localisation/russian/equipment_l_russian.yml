 modern_tank_destroyer_equipment_1_desc: "Современные противотанковые САУ выросли из легких и средних ПТ-САУ. Во главу угла в проекте поставлена мобильность и низкий силуэт."
 modern_tank_aa_equipment: "Современная ЗСУ"
 modern_tank_aa_equipment_desc: "Современное зенитное вооружение, будь то ракеты или скорострельные пушки, представляет смертельную опасность для вражеской авиации."
 modern_tank_aa_equipment_1: "Современная ЗСУ"
 modern_tank_aa_equipment_1_short: "Соврем. ЗСУ"
 modern_tank_aa_equipment_1_desc: "Современное зенитное вооружение, будь то ракеты или скорострельные пушки, представляет смертельную опасность для вражеской авиации."
 mechanized_equipment: "Бронетранспортёры"
 mechanized_equipment_short: "Бронетранспортёры"
 mechanized_equipment_desc: "Механизированная пехота оснащена бронетранспортерами или боевыми машинами. От моторизированной она отличается тем, что ее техника обеспечивает определенную защиту от вражеского огня, в то время как моторизированные подразделения обычно снабжаются небронированными машинами — джипами и грузовиками."
 mechanized_equipment_1: "Бронетранспортёры I"
 mechanized_equipment_1_short: "Бронетранспортёры I"
 mechanized_equipment_1_desc: "Механизированная пехота оснащена бронетранспортерами или боевыми машинами. От моторизированной она отличается тем, что ее техника обеспечивает определенную защиту от вражеского огня, в то время как моторизированные подразделения обычно снабжаются небронированными машинами — джипами и грузовиками."
 mechanized_equipment_2: "Бронетранспортёры II"
 mechanized_equipment_2_short: "Бронетранспортёры II"
 mechanized_equipment_2_desc: "Механизированная пехота оснащена бронетранспортерами или боевыми машинами. От моторизированной она отличается тем, что ее техника обеспечивает определенную защиту от вражеского огня, в то время как моторизированные подразделения обычно снабжаются небронированными машинами — джипами и грузовиками."
 mechanized_equipment_3: "Бронетранспортёры III"
 mechanized_equipment_3_short: "Бронетранспортёры III"
 mechanized_equipment_3_desc: "Механизированная пехота оснащена бронетранспортерами или боевыми машинами. От моторизированной она отличается тем, что ее техника обеспечивает определенную защиту от вражеского огня, в то время как моторизированные подразделения обычно снабжаются небронированными машинами — джипами и грузовиками."
 anti_air_equipment: "Буксируемое орудие ПВО"
 anti_air_equipment_short: "ПВО"
 anti_air_equipment_desc: "Зенитные орудия предназначены для борьбы с авиацией противника, хотя скорострельные пушки неплохо справляются и с наземными целями."
 anti_tank_equipment: "Буксируемое орудие ПТО"
 anti_tank_equipment_short: "ПТО"
 anti_tank_equipment_desc: "Артиллерийское орудие, стреляющее прямой наводкой бронебойными боеприпасами для поражения танков и других защищенных целей."
 anti_air_equipment_1: "Буксируемое орудие ПВО"
 anti_air_equipment_1_short: "ПВО"
 anti_air_equipment_1_desc: "Зенитные орудия предназначены для борьбы с авиацией противника, хотя скорострельные пушки неплохо справляются и с наземными целями."
 anti_tank_equipment_1: "Буксируемое орудие ПТО"
 anti_tank_equipment_1_short: "ПТО"
 anti_tank_equipment_1_desc: "Артиллерийское орудие, стреляющее прямой наводкой бронебойными боеприпасами для поражения танков и других защищенных целей."
 artillery_equipment: "Буксируемая артиллерия"
 artillery_equipment_short: "Артиллерия"
 artillery_equipment_desc: "Крупнокалиберные орудия, обслуживаемые орудийными расчетами, например пушки и гаубицы, способные отправлять снаряды на расстояние, значительно превышающее дальность стрелкового оружия."
 artillery_equipment_1: "Буксируемая артиллерия"
 artillery_equipment_1_short: "Артиллерия"
 artillery_equipment_1_desc: "Крупнокалиберные орудия — пушки и гаубицы, — способные доставлять снаряды на расстояние, значительно превышающее дальность стрелкового оружия."
 rocket_artillery_equipment_1: "Буксируемая реактивная артиллерия"
 rocket_artillery_equipment_1_short: "Ракеты"
 rocket_artillery_equipment_1_desc: "Реактивная артиллерия менее точна и скорострельна, чем традиционные орудия, однако недостатки окупаются эффектом от одновременного попадания нескольких ракет в цель."
 infantry_equipment: "Пехотное снаряжение"
 infantry_equipment_short: "Пехотное снар."
 infantry_equipment_desc: "Индивидуальное и коллективное стрелковое оружие, а также прочие элементы экипировки пехотинца."
 infantry_equipment_0: "Базовое пехотное снаряжение"
 infantry_equipment_0_short: "Базовое снаряж."
 infantry_equipment_0_desc: "Базовое снаряжение пехоты, разработанное до и во время Великой войны."
 infantry_equipment_1: "Пехотное снаряжение I"
 infantry_equipment_1_short: "Оружие I"
 infantry_equipment_1_desc: "Индивидуальное и коллективное стрелковое оружие, а также прочие элементы экипировки пехотинца."
 infantry_equipment_2: "Пехотное снаряжение II"
 infantry_equipment_2_short: "Оружие II"
 infantry_equipment_2_desc: "Индивидуальное и коллективное стрелковое оружие, а также прочие элементы экипировки пехотинца. Включает большое количество пистолетов-пулеметов и противотанковых ружей."
 infantry_equipment_3: "Пехотное снаряжение III"
 infantry_equipment_3_short: "Оружие III"
 infantry_equipment_3_desc: "Индивидуальное и коллективное стрелковое оружие, а также прочие элементы экипировки пехотинца. Включает штурмовые винтовки и противотанковые гранатометы."
 gw_armored_car_equipment: "Межвоенная бронемашина"
 gw_armored_car_equipment_desc: "Предыдущие бронемашины были обычными автомобилями с дополнительной тонкой обшивкой; эта же модель изначально спроектирована с учётом брони и лёгкого вооружения."
 armored_car_equipment_1: "Базовая бронемашина"
 armored_car_equipment_1_desc: "Улучшенный салон и дополнительное хранилище для боезапаса повышают боевую эффективность машины."
 armored_car_equipment_2: "Улучшенная бронемашина"
 armored_car_equipment_2_desc: "Чтобы бронемашины могли не только подбить лёгкую технику противника, но и вернуться назад, требуется приспособить их к изменениям на поле боя и снабдить более мощным вооружением и прочной броней."
 armored_car_at_equipment: "Противотанковая бронемашина"
 armored_car_at_equipment_desc: "Рано или поздно наши лёгкие механизированные части столкнутся с танками противника. Разработав специальной противотанковый вариант бронемашины, мы обеспечим себе шанс на победу."
 tank_armor_upgrade: "Броня"
 tank_armor_upgrade_desc: "Броня, которую не может пробить противник, — полезное преимущество для того, кто готов смириться с потерей скорости."
 tank_gun_upgrade: "Главное орудие"
 tank_gun_upgrade_desc: "Важно иметь орудие, которому по зубам броня противника."
 tank_aa_upgrade: "Зенитное вооружение"
 tank_aa_upgrade_desc: "Необходимо, чтобы наше зенитное вооружение успешно сбивало современные самолеты."
 tank_at_upgrade: "Противотанковое вооружение"
 tank_at_upgrade_desc: "Необходимо, чтобы наши противотанковые установки успешно уничтожали современные танки."
 tank_art_upgrade: "Артиллерийское вооружение"
 tank_art_upgrade_desc: "Необходимо, чтобы наша самоходная артиллерия обладала огневой мощью, способной уничтожить любые небронированные цели."
 tank_reliability_upgrade: "Надежность"
 tank_reliability_upgrade_desc: "Повышение надежности снижает вероятность поломок и, как следствие, избавляет от необходимости заменять снаряжение."
 mech_cost_upgrade: "Стоимость производства"
 mech_cost_upgrade_desc: "Оптимизация дизайна и замена менее важных материалов позволяют собирать машины быстрее, но дефектов будет чуть больше."
 tank_engine_upgrade: "Двигатель"
 tank_engine_upgrade_desc: "Улучшает мобильность, что дает тактические и стратегические преимущества, а также позволяет установить больше брони без потери скорости."
 ac_engine_upgrade: "Двигатель"
 ac_engine_upgrade_desc: "Улучшает мобильность, что даёт тактические и стратегические преимущества, а также позволяет установить больше брони без потери скорости."
 ship_gun_upgrade: "Орудия"
 ship_gun_upgrade_desc: "Важно иметь орудие, которому по зубам броня противника."
 ship_torpedo_upgrade: "Торпеды"
 ship_torpedo_upgrade_desc: "Торпеда — мощное оружие, доступное даже малым судам. Имеет высокий шанс нанести критический урон."
 ship_armor_upgrade: "Броня"
 ship_armor_upgrade_desc: "Более прочная броня, чтобы защитить корабль от вражеского огня."
 carrier_armor_upgrade: "Броня"
 carrier_armor_upgrade_desc: "Более прочная броня, чтобы защитить корабль от вражеского огня."
 ship_engine_upgrade: "Двигатель"
 ship_engine_upgrade_desc: "Корабль с более мощным двигателем может контролировать дистанцию до противника."
 ship_reliability_upgrade: "Надежность"
 ship_reliability_upgrade_desc: "Надежный корабль реже получает критические попадания, которые способны нанести колоссальный урон, если в конструкции есть уязвимые места."
 ship_anti_air_upgrade: "ПВО"
 ship_anti_air_upgrade_desc: "Больше пушек, направленных в воздух, — больше сбитых самолетов!"
 ship_ASW_upgrade: "ПЛО"
 ship_ASW_upgrade_desc: "Противолодочное вооружение позволяет обнаруживать и нейтрализовывать субмарины противника."
 destroyer_engine_upgrade: "Двигатель"
 destroyer_engine_upgrade_desc: "Корабль с более мощным двигателем может контролировать дистанцию до противника"
 sub_engine_upgrade: "Двигатель"
 sub_engine_upgrade_desc: "Корабль с более мощным двигателем может контролировать дистанцию до противника."
 sub_stealth_upgrade: "Незаметность"
 sub_stealth_upgrade_desc: "Самое главное преимущество подводной лодки — способность оставаться вне поля зрения и наносить удар, когда наступает подходящий момент."
 sub_torpedo_upgrade: "Торпеды"
 sub_torpedo_upgrade_desc: "Торпеда — мощное оружие, доступное даже малым судам. Имеет высокий шанс нанести критический урон."
 ship_deckspace_upgrade: "Палуба"
 ship_deckspace_upgrade_desc: "Больше места для размещения и запуска палубной авиации."
 plane_gun_upgrade: "Вооружение"
 plane_gun_upgrade_desc: "Улучшенное вооружение для воздушного боя."
 cv_plane_gun_upgrade: "Вооружение"
 cv_plane_gun_upgrade_desc: "Улучшенное вооружение для воздушного боя."
 plane_engine_upgrade: "Двигатель"
 plane_engine_upgrade_desc: "Выигрыш в скорости дает преимущество при выборе позиции и цели, что особенно важно для перехватчиков."
 plane_range_upgrade: "Дальность"
 plane_range_upgrade_desc: "Чем выше дальность действия, тем дальше самолет сможет вылетать на боевые задания."
 cv_plane_range_upgrade: "Дальность"
 cv_plane_range_upgrade_desc: "Чем выше дальность действия, тем дальше самолет сможет вылетать на боевые задания."
 plane_reliability_upgrade: "Надежность"
 plane_reliability_upgrade_desc: "Ненадежный самолет страдает от частых аварий во время вылетов."
 plane_naval_upgrade: "Атака"
 plane_naval_upgrade_desc: "Увеличенное количество противокорабельного оружия."
 cv_plane_naval_upgrade: "Атака"
 cv_plane_naval_upgrade_desc: "Увеличенное количество противокорабельного оружия."
 plane_bomb_upgrade: "Бомбардировка"
 plane_bomb_upgrade_desc: "Увеличенная бомбовая нагрузка для более мощных атак."
 plane_tac_bomb_upgrade: "Бомбардировка"
 plane_tac_bomb_upgrade_desc: "Увеличенная бомбовая нагрузка для более мощных атак."
 plane_cas_upgrade: "Атака"
 plane_cas_upgrade_desc: "Улучшенное вооружение против наземных целей"
 plane_armor_upgrade: "Броня"
 plane_armor_upgrade_desc: "Самозатягивающиеся топливные баки и бронирование повышают живучесть."
