 aotsm_handicraft_production_tech:0 "Ремесленное производство"
 aotsm_handicraft_production_tech_desc:0 "Изделия изготавливаются вручную опытными мастерами, передающими секреты обработки металла из поколения в поколение. Качество и производительность напрямую зависят от личного мастерства работника. Данный способ производства остаётся крайне медленным и не позволяет выпускать крупные партии однотипной продукции в сжатые сроки."
 aotsm_manufactory_production_tech:0 "Мануфактурное производство"
 aotsm_manufactory_production_tech_desc:0 "Внедрено разделение труда между группами рабочих, каждая из которых выполняет строго определённую операцию. Это позволяет значительно повысить производительность по сравнению с индивидуальным ремеслом. Однако отсутствие единых стандартов и калибров по-прежнему приводит к значительному проценту брака."
 aotsm_basic_machine_tools_tech:0 "Базовые станки"
 aotsm_basic_machine_tools_tech_desc:0 "Простейшие токарные и сверлильные агрегаты с приводом от водяного колеса или ручной тяги позволяют обрабатывать металлические заготовки с приемлемой точностью. Конструкция станков не лишена недостатков: вибрация и люфт снижают качество готовых деталей, требуя последующей доводки напильником."
 aotsm_improved_machine_tools_tech:0 "Улучшенные станки"
 aotsm_improved_machine_tools_tech_desc:0 "Чугунные станины и усиленная конструкция уменьшили вибрацию, обеспечив более чистую обработку поверхности. Детали теперь изготавливаются с меньшими допусками, что сокращает объём ручной подгонки. Производительность растёт вместе со стабильностью работы оборудования."
 aotsm_advanced_machine_tools_tech:0 "Усовершенствованные станки"
 aotsm_advanced_machine_tools_tech_desc:0 "Самоцентрирующие патроны, механические суппорты и автоматическая подача резца выводят обработку на новый уровень точности. Скорость изготовления узлов возрастает вдвое, а взаимозаменяемость деталей становится реальностью. Оборудование требует квалифицированного обслуживания, но полностью окупает затраты."

 aotsm_basic_equipment_refinement_tech:0 "Базовая доработка снаряжения"
 aotsm_basic_equipment_refinement_tech_desc:0 "Опытные оружейники производят подгонку штатных образцов стрелкового оружия под индивидуальные антропометрические параметры бойца. Регулировка приклада, установка удобной мушки и простая балансировка повышают меткость стрельбы. Работы выполняются в походных мастерских без использования сложного оборудования."
 aotsm_improved_equipment_refinement_tech:0 "Улучшенная доработка снаряжения"
 aotsm_improved_equipment_refinement_tech_desc:0 "Появление нарезных стволов и оптических прицелов требует тонкой доводки спусковых механизмов, затворных групп и прицельных приспособлений. Мастерские оснащаются измерительными инструментами для контроля усилия спуска и соосности канала ствола. Каждый экземпляр проверяется стрельбой перед отправкой в войска."
 aotsm_advanced_equipment_refinement_tech:0 "Усовершенствованная доработка снаряжения"
 aotsm_advanced_equipment_refinement_tech_desc:0 "Внедрена индивидуальная подгонка оружия с использованием регулируемых прицелов и эргономичных лож, повторяющих контуры плеча стрелка. Баллистические характеристики проверяются на специализированных стендах. Доработка превратилась в точный инженерный процесс, снижающий влияние человеческого фактора на точность боя."

 aotsm_primitive_conveyor_tech:0 "Примитивный конвейер"
 aotsm_primitive_conveyor_tech_desc:0 "Чугунные ролики и деревянные направляющие установлены между станками для механизированной передачи заготовок. Это избавляет рабочих от тяжёлого физического труда по переноске деталей и упорядочивает производственный процесс. Недостаточная надёжность механизмов и частые заклинивания требуют постоянного присмотра."
 aotsm_conveyor_production_tech:0 "Конвейерное производство"
 aotsm_conveyor_production_tech_desc:0 "Организована непрерывная технологическая цепочка: заготовка последовательно проходит через все станки без промежуточного складирования. Каждый рабочий выполняет только свою операцию, что увеличивает выработку и снижает простои. Производственный ритм становится стабильным и предсказуемым."
 aotsm_improved_conveyor_tech:0 "Улучшенный конвейер"
 aotsm_improved_conveyor_tech_desc:0 "Стальные ролики на подшипниках и ленточный привод от паровой машины обеспечивают плавное движение заготовок без рывков. Снижение трения и механических потерь позволило увеличить скорость конвейера и сократить время между операциями. Простои линии уменьшились вдвое."

 aotsm_flexible_conveyor_i_tech:0 "Гибкий конвейер I"
 aotsm_flexible_conveyor_i_tech_desc:0 "Конструкция конвейера дополнена съёмными направляющими, позволяющими переналаживать линию под различные типоразмеры изделий. Время перехода с одной номенклатуры на другую сокращается до одной смены. Гибкость производства достигается в ущерб надёжности, что требует дополнительного контроля."
 aotsm_flexible_conveyor_ii_tech:0 "Гибкий конвейер II"
 aotsm_flexible_conveyor_ii_tech_desc:0 "Разработана модульная система с регулируемыми упорами и универсальными фиксаторами, обеспечивающая быструю переналадку в течение двух часов. Конвейер легко адаптируется под выпуск различных типов вооружения без замены базовых узлов. Это повышает эффективность мелкосерийного производства."

 aotsm_standardized_conveyor_i_tech:0 "Стандартизированный конвейер I"
 aotsm_standardized_conveyor_i_tech_desc:0 "Введены единые типоразмеры роликов, звёздочек и ремней для всех конвейерных линий завода. Унификация запасных частей упрощает ремонт и снижает зависимость от индивидуальных заказов токарных мастерских. Время устранения неисправностей сокращается с нескольких дней до нескольких часов."
 aotsm_standardized_conveyor_ii_tech:0 "Стандартизированный конвейер II"
 aotsm_standardized_conveyor_ii_tech_desc:0 "Достигнута полная взаимозаменяемость всех узлов и деталей конвейеров в пределах предприятия. Ремонтный персонал обеспечен комплектами запасных частей, позволяющими восстанавливать линию без задержек. Это кардинально снижает простой оборудования и повышает общую производительность."

 aotsm_production_standardization_tech:0 "Стандартизация производства"
 aotsm_production_standardization_tech_desc:0 "Внедрена единая система чертежей, допусков и калибров для всех заводских цехов. Детали, изготовленные на разных участках, полностью взаимозаменяемы. Это позволяет сосредоточить усилия на увеличении объёмов выпуска, а не на подгонке каждого изделия вручную."

 aotsm_modern_construction_standards_tech:0 "Современные стандарты строительства"
 aotsm_modern_construction_standards_tech_desc:0 "Применение стального проката и унифицированных ферменных конструкций позволяет возводить заводские корпуса по типовым проектам. Сроки строительства сокращаются втрое, а прочность зданий достаточна для установки тяжёлых паровых машин и молотов. Единые габариты упрощают логистику оборудования."

 aotsm_smokeless_powder_tech:0 "Бездымный порох"
 aotsm_smokeless_powder_tech_desc:0 "На основе пироксилина разработан новый тип метательного заряда, практически не дающий дыма при выстреле. Значительное снижение демаскирующего эффекта позволяет стрелкам сохранять скрытность на поле боя. Начальная скорость пули возрастает на 25% при сохранении навески заряда."
 aotsm_double_base_propellant_application_tech:0 "Применение двухосновного пропеллента"
 aotsm_double_base_propellant_application_tech_desc:0 "Двухосновный состав, содержащий нитроцеллюлозу и нитроглицерин, обеспечивает повышенную энергетику горения и стабильную баллистическую кривую. Это позволяет увеличить дальность и кучность стрельбы из полевых орудий. Применение требует специальных мер безопасности из-за высокой чувствительности смеси."
 aotsm_synthetic_nitrogen_usage_tech:0 "Использование синтетического азота"
 aotsm_synthetic_nitrogen_usage_tech_desc:0 "Освоено промышленное получение азотных соединений непосредственно из атмосферного воздуха с применением химических методов. Данный подход обеспечивает производство взрывчатых веществ необходимым сырьём без привязки к природным месторождениям. Стабильность поставок более не зависит от внешних факторов и транспортных путей."
 aotsm_improved_nitrogen_synthesis_tech:0 "Улучшенная синтезация азота"
 aotsm_improved_nitrogen_synthesis_tech_desc:0 "Оптимизированы параметры давления и температуры в реакционных колоннах, а также подобран более эффективный катализатор. Выход аммиака увеличен почти вдвое без повышения расхода сырья. Внедрение непрерывной схемы производства сокращает энергозатраты на единицу продукции."
 aotsm_modernized_nitrogen_synthesis_tech:0 "Модернизированная синтезация азота"
 aotsm_modernized_nitrogen_synthesis_tech_desc:0 "Реакционные аппараты оснащены паровым обогревом и системой принудительной циркуляции газовой смеси. Степень конверсии повысилась на 40%, а чистота конечного продукта достигла показателей, достаточных для производства взрывчатых веществ высшего качества. Уменьшились потери реагентов и токсичные выбросы."
 aotsm_advanced_nitrogen_synthesis_tech:0 "Передовая синтезация азота"
 aotsm_advanced_nitrogen_synthesis_tech_desc:0 "Организован непрерывный каталитический цикл с полной рекуперацией тепла отходящих газов. Производительность заводского комплекса достигла объёмов, достаточных для обеспечения взрывчатыми веществами действующей армии. Данная технология признана наиболее передовой в своём классе."

 aotsm_steam_engine_tech:0 "Паровой двигатель"
 aotsm_steam_engine_tech_desc:0 "Универсальный тепловой двигатель, преобразующий энергию пара в механическую работу. Установка паровых машин на заводах позволяет отказаться от водяных колёс и ветряков, обеспечивая стабильный источник энергии вне зависимости от погодных условий и времени года. Производительность предприятий возрастает многократно, а расположение фабрик более не привязано к берегам рек."

 aotsm_main_transmission_shaft_tech:0 "Главный трансмиссионный вал"
 aotsm_main_transmission_shaft_tech_desc:0 "Центральный вал, передающий усилие от паровой машины ко всем станкам цеха через систему ремней и шестерён. Единый привод позволяет синхронизировать работу оборудования и упрощает управление производством. Внедрение трансмиссии снижает затраты на строительство индивидуальных двигателей для каждого станка и повышает надёжность фабричного механизма."

 aotsm_steam_hammer_tech:0 "Паровой молот"
 aotsm_steam_hammer_tech_desc:0 "Кузнечный молот с паровым приводом, способный обрабатывать металлические заготовки огромной массы. Ударная сила такого молота в десятки раз превосходит возможности ручного труда, позволяя ковать стволы крупных орудий и судовые валы. Точность дозирования удара открывает новые возможности для получения поковок сложной формы."

 aotsm_bessemer_process_tech:0 "Бессемеровский процесс"
 aotsm_bessemer_process_tech_desc:0 "Метод переработки чугуна в сталь путём продувки расплавленного металла воздухом. Кислород воздуха выжигает избыточный углерод и другие примеси, превращая хрупкий чугун в прочный и ковкий металл. Изобретение позволяет производить дешёвую сталь в промышленных масштабах, что кардинально меняет военное и гражданское машиностроение."

 aotsm_steam_turbine_application_tech:0 "Применение паровых турбин"
 aotsm_steam_turbine_application_tech_desc:0 "Внедрение паровых турбин вместо поршневых машин на крупных промышленных предприятиях. Вращательное движение рабочего колеса под действием струи пара обеспечивает более высокий КПД и плавность хода. Турбины незаменимы для привода генераторов и мощных насосов, позволяя передавать энергию на значительные расстояния без промежуточных преобразований."

 aotsm_electricity_generation_tech:0 "Генерация электричества"
 aotsm_electricity_generation_tech_desc:0 "Промышленное производство электрической энергии с использованием паровых турбин и динамомашин. Вращение ротора в магнитном поле создаёт электрический ток, пригодный для передачи на расстояние. Возможность освещать заводские цеха и питать электродвигатели открывает новую эру в промышленности, свободную от громоздких паровых трансмиссий."

 aotsm_lamp_electrical_engineering_tech:0 "Ламповая электротехника"
 aotsm_lamp_electrical_engineering_tech_desc:0 "Внедрение электрических ламп накаливания для освещения промышленных и бытовых помещений. Надёжные источники света позволяют организовать круглосуточную работу заводов и значительно повышают безопасность труда в ночные смены. Переход от газового и масляного освещения к электрическому знаменует собой наступление новой технологической эпохи."

 aotsm_analytical_engine_tech:0 "Аналитическая машина"
 aotsm_analytical_engine_tech_desc:0 "Программируемое вычислительное устройство на основе зубчатых колёс и перфокарт, способное выполнять сложные арифметические и логические операции. Машина позволяет автоматизировать расчёты баллистических таблиц, ведомостей снабжения и финансовых отчётов. Использование сменных программных носителей делает устройство универсальным инструментом для широкого спектра задач."

 aotsm_mechanical_interpreters_tech:0 "Механические интерпретаторы"
 aotsm_mechanical_interpreters_tech_desc:0 "Специализированные устройства для автоматического выполнения повторяющихся математических операций. Интерпретаторы значительно ускоряют обработку данных и снижают риск ошибок при ведении учёта на промышленных предприятиях и в артиллерийских управлениях."

 aotsm_modernized_mechanical_machine_tech:0 "Модернизированная механическая машина"
 aotsm_modernized_mechanical_machine_tech_desc:0 "Усовершенствованная версия аналитической машины с увеличенным объёмом памяти и расширенным набором выполняемых операций. Внедрение новых материалов и оптимизация зубчатых передач повышают скорость вычислений и надёжность работы. Машина становится неотъемлемым инструментом для конструкторских бюро и баллистических лабораторий."

 aotsm_electromechanical_summing_machine_tech:0 "Электромеханическая суммирующая машина"
 aotsm_electromechanical_summing_machine_tech_desc:0 "Устройство, сочетающее электрический привод с механическим счётным механизмом. Использование электродвигателей и релейных переключателей значительно ускоряет операции сложения и умножения. Компактность и простота обслуживания делают суммирующую машину доступной для бухгалтерских служб и армейских расчётных столов."

 aotsm_differential_analyzer_tech:0 "Дифференциальный анализатор"
 aotsm_differential_analyzer_tech_desc:0 "Специализированный аналоговый вычислительный прибор для решения дифференциальных уравнений. Устройство способно моделировать сложные физические процессы, включая полёт снарядов и работу механизмов. Анализатор незаменим при проектировании орудийных систем и баллистических расчётах, требующих высокой точности."

 aotsm_early_fire_control_system_tech:0 "Ранняя СУО"
 aotsm_early_fire_control_system_tech_desc:0 "Первые опытные образцы систем управления огнём для корабельной и береговой артиллерии. Механические вычислители позволяют учитывать дистанцию до цели и скорость ветра при расчёте поправок. Система значительно повышает вероятность попадания, хотя остаётся громоздкой и требует длительной подготовки расчётов."

 aotsm_basic_fire_control_system_tech:0 "Базовая СУО"
 aotsm_basic_fire_control_system_tech_desc:0 "Внедрение полноценных систем управления огнём с механическими вычислителями на флоте и в береговой обороне. Учёт дистанции, скорости собственного хода и курса цели позволяет вести прицельную стрельбу по движущимся кораблям. Повышение точности стрельбы приносит ощутимое преимущество в морских сражениях."

 aotsm_improved_fire_control_system_tech:0 "Улучшенная СУО"
 aotsm_improved_fire_control_system_tech_desc:0 "Модернизированные системы управления огнём с более сложными вычислительными устройствами. Добавлена возможность учёта влияния температуры воздуха, влажности и баллистического износа орудий. Автоматизированная передача данных с дальномеров позволяет сократить время между обнаружением цели и началом стрельбы."

 aotsm_advanced_fire_control_system_tech:0 "Усовершенствованная СУО"
 aotsm_advanced_fire_control_system_tech_desc:0 "Система управления огнём нового поколения, объединяющая данные от дальномеров, гироскопических стабилизаторов и баллистических вычислителей. Автоматический учёт качки корабля, скорости ветра и температуры заряда позволяет вести эффективный огонь даже в сложных метеоусловиях. Передача данных по электрическим линиям связи сокращает время реакции артиллерийских расчётов до минимума, обеспечивая значительное превосходство в морских сражениях."

 aotsm_wired_telegraph_tech:0 "Проводной телеграф"
 aotsm_wired_telegraph_tech_desc:0 "Система передачи информации на расстояние с использованием электрических сигналов и проводных линий связи. Кодирование сообщений азбукой Морзе позволяет обмениваться данными практически мгновенно на тысячи вёрст. Внедрение телеграфа кардинально изменяет систему управления войсками и организацию снабжения, делая коммуникацию быстрой и надёжной."

 aotsm_wireless_telegraph_tech:0 "Беспроводной телеграф"
 aotsm_wireless_telegraph_tech_desc:0 "Передача сигналов через эфир с использованием электромагнитных волн, свободная от необходимости прокладки кабелей. Радиосвязь позволяет поддерживать оперативное управление соединениями на поле боя и кораблями в открытом море. Мобильность и скорость развёртывания станций делают беспроводной телеграф незаменимым средством связи."

 aotsm_amplitude_modulation_tech:0 "Амплитудная модуляция сигнала"
 aotsm_amplitude_modulation_tech_desc:0 "Метод передачи информации путём изменения амплитуды несущего колебания в соответствии с передаваемым сигналом. Эта техника позволяет транслировать речевую информацию и музыку, что открывает эпоху радиовещания. В военном деле амплитудная модуляция используется для передачи голосовых команд и разведывательных данных без необходимости расшифровки кода."

 aotsm_radar_i_tech:0 "Радар I"
 aotsm_radar_i_tech_desc:0 "Первые экспериментальные установки радиообнаружения, использующие отражение радиоволн для обнаружения объектов. Простейшие передатчики и приёмники позволяют фиксировать наличие крупных целей, таких как корабли и дирижабли. Ограниченная точность и малая дальность действия не позволяют применять радар для точного наведения, но уже дают тактическое преимущество."

 aotsm_radar_ii_tech:0 "Радар II"
 aotsm_radar_ii_tech_desc:0 "Улучшенные радарные установки с увеличенной дальностью действия и способностью определять примерное расстояние до цели. Внедрение импульсного режима работы и использование более мощных генераторов повышает точность обнаружения. Радар становится надёжным средством раннего предупреждения о приближении вражеских кораблей и самолётов."

 aotsm_radar_iii_tech:0 "Радар III"
 aotsm_radar_iii_tech_desc:0 "Совершенствованные радары с возможностью определения не только расстояния, но и азимута цели. Использование узких антенн с направленным излучением позволяет вести круговой обзор и точно определять координаты воздушных и морских целей. Система интегрируется с зенитной и корабельной артиллерией для наведения орудий с высокой точностью."

 aotsm_radar_iv_tech:0 "Радар IV"
 aotsm_radar_iv_tech_desc:0 "Радарные станции передового поколения с возможностью автоматического сопровождения целей и выдачи данных для систем управления огнём. Использование нескольких частотных каналов и селекции движущихся целей позволяет эффективно подавлять помехи и выделять цели на фоне местных предметов. Высокая разрешающая способность даёт возможность различать типы воздушных судов и обеспечивать полное информационное превосходство."

 # PANZER MODULES

 aotsm_long_range_radio:0 "Радио дальнего действия"
 aotsm_long_range_radio_desc:0 "Разработка и установка мощных радиопередающих комплексов на командирские бронированные машины для обеспечения устойчивой связи на марше и в бою. Использование выдвижных антенных устройств и усиленных передатчиков позволяет поддерживать надёжную связь с соседними подразделениями и штабами. Наличие радиостанции на машине командира коренным образом меняет управление войсками, позволяя отдавать приказы и корректировать действия подразделений в реальном времени, не покидая поля боя."

 aotsm_tank_flags:0 "Сигнальные флаги"
 aotsm_tank_flags_desc:0 "Внедрение системы сигнальных флагов для управления броневыми подразделениями в условиях отсутствия надёжной радиосвязи. Командир взвода передаёт приказы с помощью цветных флагов, обозначающих смену направления, скорость движения и боевой порядок. Данный способ связи остаётся единственным надёжным средством оперативного управления в условиях дыма, пыли и шума боя. Простота и наглядность системы позволяют эффективно координировать действия подразделений без привлечения дополнительных средств."