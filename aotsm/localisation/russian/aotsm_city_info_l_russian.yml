 AOTSM_CITY_MOSCOW_BODY:0 "      Первое летописное упоминание §YМосквы§! относится к §G1147§! году и связано со встречей князя §YЮрия Долгорукого§! со §YСвятославом Ольговичем§!. Поселение существовало до этой даты; с именем §YДолгорукого§! традиционно связывается начало его укрепления. Положение у речных и сухопутных путей способствовало развитию торгового и оборонительного центра.\n\n      Историческое ядро города образуют §YКремль§!, §YКитай-город§! и окружающие посады. Соборы, монастыри и купеческие усадьбы сохраняют облик прежней столицы. §YМосква§! известна крупными рынками, ремесленными слободами и университетом, учреждённым в §G1755§! году. Радиальное расположение улиц отражает постепенное расширение застройки вокруг кремлёвских укреплений.\n\n      §YМосква§! сохраняет положение одного из ведущих торговых, производственных и образовательных центров §YРоссийского Государства§!. Мануфактуры и мастерские связаны с хозяйством центральных губерний, а купеческие дома обеспечивают движение товаров между областями страны. При размещении высших государственных учреждений в §YПетрограде§! здесь сохраняется значительная часть культурной и деловой жизни."

 #CITY REFERENCES
 aotsm_city_info_unavailable_t:0 "Справка не подготовлена"
 AOTSM_CITY_SPB_BODY:0 "      Город основан в §G1703§! году по распоряжению §YПетра I§!. Закладкой §YПетропавловской крепости§! в устье §YНевы§! было положено начало укреплённому центру, предназначенному для защиты выхода к §YБалтийскому морю§!. Вокруг крепости, адмиралтейских верфей и первых причалов сформировались жилые и торговые кварталы.\n\n      Городская территория расположена на островах невской дельты. Регулярные улицы, каналы и набережные связывают дворцовые ансамбли с административными зданиями, верфями и портовыми складами. К числу главных сооружений относятся §YПетропавловская крепость§!, §YАдмиралтейство§! и §YЗимний дворец§!; устройство города отражает его первоначальное назначение морской столицы.\n\n      В §YПетрограде§! сосредоточены высшие учреждения §YРоссийского Государства§! и резиденция §YПротектора§!. После перехода к республиканскому правлению столица сохранила значение главного административного центра. Судостроение, внешняя торговля и снабжение гарнизона поддерживают городское хозяйство; порт обеспечивает связи с балтийскими и западноевропейскими рынками."
 AOTSM_CITY_BERLIN_BODY:0 "      §YБерлин§! вырос из двух соседних торговых поселений на §YШпрее§!. На речном острове располагался §YКёлльн§!, упомянутый в §G1237§! году, а напротив него — §YБерлин§!, известный по документам с §G1244§! года. Общая переправа и торговые пути способствовали сближению поселений, образовавших основу будущего города.\n\n      Королевский дворец, арсенал и улица §YУнтер-ден-Линден§! определяют облик административного центра. Учебные заведения и художественные собрания соседствуют с казармами и производственными кварталами. Регулярная застройка отражает длительное развитие города под покровительством прусской монархии.\n\n      §YБерлин§! служит столицей §YПруссии§! и центром его военной промышленности. Государственные заказы поддерживают машиностроение и производство вооружения. Соперничество с §YАвстрийской Империей§! за влияние в германских землях усиливает значение военных ведомств, инженерных разработок и политических переговоров."
 AOTSM_CITY_BUDAPEST_BODY:0 "      Городской комплекс сложился из поселений §YБуды§!, §YПешта§! и Обуды, имеющих самостоятельную историю. Развитие укреплённой §YБуды§! связано с королём §YБелой IV§!: после монгольского нашествия §G1241–1242§! годов на Замковом холме был создан защищённый центр. Поселения на противоположном берегу развивались как торговые пункты.\n\n      §YДунай§! разделяет холмистую §YБуду§! с королевской резиденцией и равнинный §YПешт§! с рынками и ремесленными кварталами. Переправы обеспечивают хозяйственное единство обоих берегов. Замковые ансамбли, церковные здания и купеческая застройка отражают значение этого центра для венгерских земель.\n\n      §YБуда§! и §YПешт§! находятся под властью §YАвстрийской Империи§!. Подавление венгерского революционного движения при поддержке российских войск восстановило имперский контроль, но не устранило недовольства местного общества. Торговля по §YДунаю§! и снабжение прилегающих земель продолжаются в условиях усиленного военного и административного надзора."
 AOTSM_CITY_CONSTANTINOPOL_BODY:0 "      Город основан как §YВизантий§! эллинскими переселенцами из §YМегар§! в §GVII§! веке до нашей эры. В §G330§! году §YКонстантином I§! было торжественно открыто расширенное поселение, получившее значение новой имперской столицы. Положение у §YБосфора§! обеспечивало контроль над проливами и путями между Европой и Азией.\n\n      §YКонстантинополь§! по праву носит титул §0«столицы мира»§!. Город с населением почти §G18§! §Yмиллионов человек§! раскинулся на берегах §YБосфора§!, объединяя огромные базары, оживлённые порты и складские кварталы. Собор §YСвятой Софии§!, императорские ансамбли и крепостные стены определяют облик столицы, а §YШёлковый путь§! связывает её торговые дома с Европой и Азией.\n\n      §YКонстантинополь§! является столицей §YРомейской Империи§! и резиденцией династии §YЗахареас§!. Сосредоточение мировых торговых путей делает его важнейшим центром обмена и выражением экономической мощи государства. Верфи и ведомства обслуживают европейские и заморские владения, а соперничество с §YРоссийским Государством§! усиливает значение дипломатических и военных учреждений."
 AOTSM_CITY_KIEV_BODY:0 "      Возникновение §YКиева§! связано с ранними поселениями на днепровских высотах. Согласно летописному преданию, основание города приписывается §YКию§!, §YЩеку§!, §YХориву§! и их сестре §YЛыбеди§!; точная дата не установлена. Под §G862§! годом город упоминается в летописном рассказе об §YАскольде§! и §YДире§!. Положение у переправ и речных путей способствовало развитию укреплённого торгового центра.\n\n      Городская застройка объединяет §YСтарый город§!, §YПечерск§! и §YПодол§!, различающиеся рельефом и назначением. §YСофийский собор§! и §YКиево-Печерская лавра§! определяют значение §YКиева§! как религиозного центра. §YПодольские§! рынки и ремесленные кварталы связаны с днепровскими пристанями; монастырские комплексы и древние укрепления занимают господствующие высоты.\n\n      §YКиев§! служит важным административным, торговым и религиозным центром юго-западных земель §YРоссийского Государства§!. Паломничество поддерживает местные промыслы и торговлю, а речные перевозки связывают город с земледельческими областями. Развитие новых кварталов сопровождается сохранением обособленных частей застройки, разделённых оврагами и возвышенностями."
 AOTSM_CITY_LISABON_BODY:0 "      Истоки Лиссабона восходят к поселению у устья §YТежу§!, существовавшему в §GI§! тысячелетии до нашей эры. Его развитие связано с финикийскими мореплавателями и торговцами, использовавшими защищённую гавань. В римское время город был известен как Олисипо и обеспечивал связь океанских путей с внутренними областями.\n\n      Исторический облик Лиссабона определяется холмами, набережными и торговыми площадями. Старые кварталы соседствуют с регулярной застройкой §YБайши§!, созданной после землетрясения §G1755§! года. Замок Святого Георгия и сооружения Белена сохраняют память о разных этапах развития морской столицы.\n\n      §YЛиссабон§! служит столицей §YПортугальского Королевства§! и резиденцией §YМарии II§!. Работа двора и кортесов сопровождается борьбой политических группировок и тяжёлыми последствиями внутренних войн. Порт сохраняет значение для заморской торговли, однако государственные долги и хозяйственная нестабильность ограничивают восстановление городского благосостояния."
 AOTSM_CITY_MUNCHEN_BODY:0 "      Первое документальное упоминание Мюнхена относится к §G1158§! году и связано с деятельностью герцога §YГенриха Льва§!. Развитие поселения определялось устройством переправы через Изар и контролем над соляной торговлей. Возникновение рынка и таможенного пункта создало основу будущего городского центра.\n\n      §YФрауэнкирхе§!, герцогская резиденция и §YМариенплац§! образуют главные ансамбли старого города. Монастырские постройки и купеческие дома соседствуют с новыми площадями и художественными собраниями. Придворное покровительство поддерживает архитектуру, живопись и художественное ремесло.\n\n      §YМюнхен§! остаётся столицей §YБаварского Королевства§! и центром его административной и культурной жизни. Мастерские и торговые предприятия снабжают двор и местный рынок. Соперничество великих германских держав усиливает значение самостоятельной баварской политики и отношений с соседними государствами."
 AOTSM_CITY_NEAPOL_BODY:0 "      Город Неаполис был основан эллинскими переселенцами из §YКум§! на рубеже §GVI–V§! веков до нашей эры, рядом с более ранней Партенопой. Новое поселение создавалось как самостоятельный торговый центр на берегу удобного залива. Морские пути обеспечивали связи с эллинскими колониями и внутренними областями §YИталии§!.\n\n      Античная планировка сохраняется в расположении центральных улиц. Крепости Кастель-Нуово и Кастель-дель-Ово, дворцовые ансамбли и театр Сан-Карло определяют исторический облик Неаполя. Портовые кварталы и густонаселённые ремесленные улицы расположены у подножия возвышенностей, обращённых к Везувию.\n\n      §YНеаполь§! является важнейшим столичным и хозяйственным центром юга §YИталии§!. Порт, судовые мастерские и производство предметов потребления обслуживают обширный городской рынок. Придворные и административные учреждения соседствуют с кварталами ремесленников. Социальные различия и политические волнения осложняют поддержание порядка."
 AOTSM_CITY_PARIS_BODY:0 "      §YПариж§! вырос из поселения галльского племени паризиев на §YСене§!. В письменных источниках §YЛютеция§! известна со времени походов §YЦезаря§! в §G52§! году до нашей эры. Удобные переправы и речная торговля обеспечили развитие поселения, вокруг которого постепенно сложились кварталы будущей французской столицы.\n\n      Развитие города по обоим берегам §YСены§! определило расположение его главных ансамблей. Собор Парижской Богоматери, Лувр и старые торговые кварталы отражают последовательные этапы городской истории. Университетские учреждения, театры и типографии придают Парижу значение крупного образовательного и культурного центра.\n\n      §YПариж§! является столицей §YЧетвёртой Французской Республики§! и местом размещения её высших государственных учреждений. Недавние политические преобразования расширили деятельность партий и национальных мастерских. Борьба общественных движений, положение рабочих и организация производства остаются важнейшими вопросами городской жизни."
 AOTSM_CITY_PEKIN_BODY:0 "      Истоки Пекина восходят к древнему городу §YЦзи§!, история которого связана с государствами Северного §YКитая§! §GI§! тысячелетия до нашей эры. Положение у дорог между равниной и северными рубежами определило его военное и торговое значение. При императоре §YЮнлэ§! город был перестроен как столица династии §YМин§!, став основой последующей императорской резиденции.\n\n      §YЗапретный город§!, §YХрам Неба§! и система укреплённых районов определяют облик Пекина. Дворцовые ансамбли и главные улицы подчинены строгой планировке, отражающей придворную иерархию. Жилые переулки, рынки и ремесленные кварталы обеспечивают повседневную жизнь столицы и снабжение многочисленных учреждений.\n\n      §YПекин§! является столицей §YИмперии Цин§! и резиденцией императора §YДаогуана§!. Здесь сосредоточены высшие ведомства, военное командование и учреждения, обеспечивающие управление провинциями. Придворная жизнь соседствует с деятельностью торговых домов и мастерских, а снабжение двора, гарнизона и многочисленных жителей поддерживает постоянные хозяйственные связи с другими областями Поднебесной."
 AOTSM_CITY_ROME_BODY:0 "      По античному преданию, §YРим§! основан §YРомулом§! в §G753§! году до нашей эры. Формирование города происходило постепенно по мере сближения поселений на холмах у §YТибра§!. Переправы и положение между областями Центральной §YИталии§! способствовали их объединению и развитию общего торгового и военного центра.\n\n      Колизей, Форум и древние стены соседствуют с базиликами, монастырями и дворцовыми ансамблями. Собор Святого Петра и Ватикан определяют значение Рима как центра католического мира. Городская застройка сохраняет сооружения разных эпох, объединённые сетью старых улиц и площадей.\n\n      §YРим§! служит резиденцией Папы Римского и местом сосредоточения церковных учреждений. Паломничество, художественное ремесло и обслуживание духовенства занимают важное место в хозяйстве. Политические волнения итальянских земель усиливают противоречия между сторонниками сохранения церковной власти и участниками преобразовательных движений."
 AOTSM_CITY_VENA_BODY:0 "      Истоки Вены связаны с римским военным лагерем Виндобона, возникшим в §GI§! веке для охраны дунайской границы. После прекращения римского управления на его месте сохранилось поселение. Развитие средневекового города определялось торговыми путями и размещением княжеской резиденции.\n\n      Собор Святого Стефана, Хофбург и дворцовые ансамбли формируют исторический облик Вены. Старый центр окружён предместьями с мастерскими и жилыми кварталами. Театры, музыкальные учреждения и художественные собрания придают городу значение одного из ведущих культурных центров Европы.\n\n      §YВена§! является столицей §YАвстрийской Империи§! и резиденцией §YФранца Иосифа I§!. Недавние волнения и смена монарха усилили значение армии и центральных ведомств. Управление многонациональными владениями сосредоточено при дворе. Восстановление порядка сопровождается сохранением глубоких общественных и национальных противоречий."
 AOTSM_CITY_WARSAWA_BODY:0 "      Формирование §YВаршавы§! как города относится к рубежу §GXIII–XIV§! столетий и связано с деятельностью мазовецкого князя §YБолеслава II§!. Рядом с княжеским укреплением возникло торговое поселение. Место на высоком берегу §YВислы§! обеспечивало контроль над речным сообщением и переправами, а также обслуживало пути через мазовецкие земли.\n\n      Основу исторического центра составляют §YСтарый город§!, §YРыночная площадь§! и §YКоролевский замок§!. Дворцовые ансамбли, костёлы и городские резиденции отражают прежнее значение §YВаршавы§! как центра польской государственности. Торговые улицы соединяют старое ядро с предместьями, а §YВисла§! связывает город с внутренними областями и балтийскими портами.\n\n      В составе §YРоссийского Государства§! §YВаршава§! сохраняет значение крупного польского административного и культурного центра. В городском хозяйстве сочетаются ремесленные мастерские, торговые предприятия и обслуживание учреждений. Различия между местными традициями управления и порядками центральной власти придают особое значение отношениям администрации с городским обществом."
 AOTSM_CITY_TENOCHTITLAN_BODY:0 "      §YТеночтитлан§! основан ацтеками в §G1325§! году на острове озера §YТескоко§!. Согласно преданию, место поселения было указано богом §YУицилопочтли§! через знак орла на кактусе. Первоначально город зависел от §YАскапоцалько§!, но победа союза с §YТескоко§! и §YТлакопаном§! в §G1428§! году открыла путь к самостоятельности и превращению §YТеночтитлана§! в центр обширной державы.\n\n      Дамбы и каналы связывают городские кварталы с берегами озера, а искусственные земледельческие участки обеспечивают рынки продовольствием. Храмовые комплексы и дворцы соседствуют с торговыми площадями и ремесленными дворами. Каменная застройка и упорядоченные улицы дополняются зданиями европейского образца и газовыми фонарями, отражая перемены в быте столицы.\n\n      §YТеночтитлан§! является столицей §YАцтекской Империи§! и резиденцией §YМонтесумы IV§!. Государственные учреждения, издательства и учебные заведения поддерживают преобразования, начатые §YИккохтли I§!. Последствия холеры осложняют городскую жизнь, а влияние австрийских компаний ограничивает хозяйственную самостоятельность. При дворе продолжаются споры между сторонниками модернизации и защитниками традиций во главе с верховным §YТламакацке§!."
 AOTSM_CITY_ATHENS_BODY:0 "      Постоянные поселения в районе Афин существовали в §GIV§! тысячелетии до нашей эры. Точная дата основания не установлена. Античное предание связывает объединение общин §YАттики§! с §YТесеем§!. Укреплённая высота §YАкрополя§! обеспечивала защиту, а прилегающие равнины и дороги поддерживали развитие земледельческого и торгового центра.\n\n      §YАкрополь§! с §YПарфеноном§!, древняя агора и сохранившиеся античные сооружения определяют историческое значение города. Жилые кварталы и рынки размещаются у подножия укреплённой высоты. Памятники древнеэллинской культуры соседствуют с храмами и застройкой последующих эпох.\n\n      §YАфины§! входят в состав §YРомейской Империи§! и сохраняют положение местного административного, торгового и религиозного центра. Ремесло и обмен с земледельческими областями §YАттики§! обеспечивают повседневное хозяйство. Дороги к побережью связывают город с морскими перевозками, а культурное наследие поддерживает его особое значение среди эллинских земель."
 AOTSM_CITY_ZAKHARIAPOLIC_BODY:0 "      §YЗахареасполис§! вырос из прикаспийского поселения на §YАпшеронском полуострове§!, прежде носившего название §YБаку§!. Его развитие определялось удобной гаванью и дорогами, связывавшими побережье с внутренними областями §YЗакавказья§!. Укрепления защищали торговые пути и окрестные поселения, а морские перевозки способствовали становлению регионального центра.\n\n      Прибрежные кварталы и торговые дворы связаны с гаванью и дорогами §YЗакавказья§!. Старые укрепления соседствуют с административными и церковными зданиями. Собор Рождества Пресвятой Богородицы занимает важное место в общественной и церемониальной жизни Захареасполиса.\n\n      §YЗахареасполис§! является значительным административным и торговым центром кавказских владений §YРомейской Империи§!. Имперские учреждения и местная аристократия определяют его политическое положение. §YКаспийские§! перевозки и сухопутные связи поддерживают хозяйство, а присутствие представителей правящей династии придаёт особое значение придворным церемониям."
 AOTSM_CITY_JERUSALEM_BODY:0 "      §YИерусалим§! упоминается в египетских источниках начала §GII§! тысячелетия до нашей эры. Город развивался как укреплённое поселение на возвышенностях между Средиземноморским побережьем и внутренними областями. Связанные с ним религиозные предания и деятельность древних правителей постепенно придали ему значение священного центра.\n\n      Храм Гроба Господня, Храмовая гора и многочисленные обители сосредоточены в тесном пространстве старых кварталов. Улицы и рынки связывают святыни разных общин, а стены отделяют городское ядро от окрестных поселений. Паломничество придаёт местной торговле и ремеслу особый характер.\n\n      §YИерусалим§! занимает центральное положение в §YИудейском Федерате§!, связанном с Ромейской Империей. Местная администрация и религиозные учреждения участвуют в управлении городом и обслуживании паломников. Торговые дворы, мастерские и перевозки обеспечивают снабжение, а отношения между общинами требуют постоянного согласования прав на святыни и городской порядок."
 AOTSM_CITY_ALEXANDRIA_BODY:0 "      §YАлександрия§! основана §YАлександром Македонским§! в §G331§! году до нашей эры на средиземноморском побережье §YЕгипта§!. Расположение между морем и озером §YМареотидой§! позволяло устроить удобные гавани и связать морскую торговлю с внутренними областями страны. При §YПтолемеях§! город стал столицей §YЕгипта§! и одним из крупнейших центров эллинистического мира.\n\n      Облик §YАлександрии§! определяют приморские кварталы, гавани и укрепления. Крепость §YКайт-Бей§! занимает место древнего §YФаросского маяка§!, некогда служившего ориентиром для прибывавших судов. С городом связана история знаменитой §YАлександрийской библиотеки§! и §YМусейона§!, где развивались математика, астрономия и медицина. Античное наследие соседствует здесь с памятниками христианской и мусульманской традиций.\n\n      §YАлександрия§! является столицей §YЕгипетского Царства§!, власть в котором принадлежит коптам, и его важнейшим средиземноморским портом. Здесь сосредоточены государственные учреждения, торговые конторы, склады и судостроительные мастерские. Через гавани проходят товары из долины §YНила§! и заморских владений. Положение столицы связывает внутреннюю жизнь страны с интересами §YРомейской Империи§!, под протекторатом которой находится §YЕгипет§!."
 AOTSM_CITY_CAIR_BODY:0 "      §YКаир§! основан в §G969§! году полководцем §YДжаухаром ас-Сикилли§! по приказу фатимидского халифа §Yаль-Муизза§!. Новый город возводился севернее прежних поселений как резиденция правителя и столица §YФатимидского Халифата§!. Со временем дворцовый центр соединился с торговыми и ремесленными кварталами, унаследовав значение соседнего §YФустата§!.\n\n      Город расположен у южной оконечности дельты §YНила§!, на пересечении речных и сухопутных путей. Над плотной застройкой возвышается цитадель, заложенная при §YСалах ад-Дине§!. Мечеть §Yаль-Азхар§! известна как центр богословского образования, а старые коптские церкви сохраняют память о христианском прошлом §YЕгипта§!. Базары, мастерские и жилые дворы образуют тесно связанное городское пространство.\n\n      §YКаир§! является крупным торговым и ремесленным центром §YЕгипетского Царства§!. Через его рынки распределяются зерно, ткани и другие товары из долины §YНила§!. Хотя столичные учреждения сосредоточены в §YАлександрии§!, город сохраняет значение для хозяйственной и религиозной жизни страны. Коптские общины, мусульманские учебные заведения и купеческие объединения продолжают определять повседневную жизнь его кварталов."
 AOTSM_CITY_TIFLIS_BODY:0 "      Развитие Тифлиса как царского центра связывается с §YВахтангом Горгасали§! во второй половине §GV§! века. Более ранние поселения у Куры были расширены благодаря удобным переправам и тёплым источникам. Укрепления обеспечивали защиту дороги через долину и поддерживали управление прилегающими грузинскими землями.\n\n      Крепость §YНарикала§!, храмовые ансамбли и кварталы серных бань определяют исторический облик города. Склоновые улицы соединяют жилую застройку с торговыми дворами и переправами через Куру. Разнообразие общин и ремесленных традиций отражает положение Тифлиса на пересечении закавказских дорог.\n\n      §YТифлис§! является важным административным и торговым центром кавказских владений §YРомейской Империи§!. Местные учреждения, купеческие дома и гарнизон поддерживают связи между горными и равнинными областями. Относительная самостоятельность регионального управления сочетается с влиянием имперской власти и сохраняющимися местными противоречиями."
 AOTSM_CITY_EREVAN_BODY:0 "      Начало письменной истории §YЭребуни§! связано с крепостью, основанной царём §YАргишти I§! в §G782§! году до нашей эры. Укреплённый центр предназначался для закрепления власти §YУрарту§! в §YАраратской долине§! и размещения гарнизона. Позднейшее развитие поселений долины сформировало городскую среду, унаследовавшую древнее название.\n\n      Крепостные высоты и жилые кварталы связаны дорогами с земледельческими землями долины. Храмы, рынки и ремесленные дворы определяют облик города, где встречаются местные и дальние торговые пути. Историческая память об урартском прошлом сочетается с армянскими религиозными и культурными традициями.\n\n      §YЭребуни§! сохраняет значение административного и торгового центра в кавказских владениях §YРомейской Империи§!. Снабжение города связано с земледельческими поселениями Араратской долины. Отношения местных общин с имперской администрацией определяются прежними религиозными конфликтами, сохраняющимся влиянием армянских родов и необходимостью поддержания порядка."
 AOTSM_CITY_LONDON_BODY:0 "      §YЛондон§! основан римлянами около §G47§! года как торговое поселение у переправы через Темзу. Удобные речные подходы и связь с сухопутными дорогами обеспечили его быстрое развитие. Возникновение пристаней, укреплений и административных сооружений превратило поселение в один из главных городов римской Британии.\n\n      Сити, Тауэр, собор Святого Павла и Вестминстер представляют разные этапы городской истории. Торговое ядро соединено с портовыми районами и обширной жилой застройкой. Банки, биржевые учреждения, типографии и научные общества определяют многообразие городских занятий.\n\n      §YЛондон§! служит столицей §YКонфедерации Британских Островов§! и центром её внешней торговли. Государственные учреждения, финансовые дома и торговые компании координируют связи с заморскими владениями. Доки, склады и промышленные предприятия поддерживают хозяйство, а снабжение многочисленных жителей требует непрерывного движения грузов по §YТемзе§! и сухопутным дорогам."
 AOTSM_CITY_DUBLIN_BODY:0 "      Возникновение городского центра связано с укреплённым лагерем скандинавских поселенцев, основанным в §G841§! году у впадения Поддла в §YЛиффи§!. Поселение предназначалось для стоянки судов, торговли и военных действий. Более ранние ирландские поселения и последующее развитие порта также участвовали в формировании города.\n\n      Замок, соборы Святого Патрика и Христа, Тринити-колледж и набережные §YЛиффи§! образуют основные исторические ансамбли. Средневековые улицы соседствуют с регулярными площадями и жилыми кварталами. Морские связи и образовательные учреждения определяют значение Дублина для ирландских земель.\n\n      §YДублин§! сохраняет положение крупного административного, торгового и культурного центра §YИрландии§!. Порт обслуживает обмен с соседними островами и внутренними областями страны. Печатное дело, ремесло и предприятия по переработке сельскохозяйственных товаров поддерживают хозяйство. Положение городских низов остаётся важным общественным вопросом."
 AOTSM_CITY_EDINBURG_BODY:0 "      §YЭдинбург§! сформировался возле укрепления на скале, занятой поселением задолго до появления королевской администрации. При §YДавиде I§! в начале §GXII§! века поселение получило права королевского города, подтверждённые документом §G1127§! года. Замок обеспечивал защиту, а расположенный ниже рынок обслуживал прилегающие земли.\n\n      Эдинбургский замок, собор Святого Эгидия и дорога к Холируду образуют основу Старого города. Его тесная многоэтажная застройка отличается от регулярных улиц Нового города. Университет, издательства и научные общества придают Эдинбургу значение ведущего интеллектуального центра шотландских земель.\n\n      Административные учреждения, юридические занятия и образование сохраняют важное место в городской жизни. Издательское дело и ремесленные предприятия обслуживают местный и внешний рынки. Связи с портом Лит обеспечивают морские перевозки, тогда как различия между старыми кварталами и новыми районами заметны в условиях жизни населения."
 AOTSM_CITY_CARDIFF_BODY:0 "      Средневековый город возник возле нормандского замка, построенного в конце §GXI§! века на месте римского укрепления. Поселение у его южных ворот обслуживало гарнизон и местную торговлю. Положение возле реки §YТаф§! обеспечивало связь морского побережья с дорогами во внутренние области §YУэльса§!.\n\n      Замок, приходские церкви и старые рыночные улицы составляют историческое ядро Кардиффа. Городская застройка постепенно распространяется к портовым участкам. Удобные перевозки и близость богатых углём долин придают местной гавани значение, выходящее за пределы обычного прибрежного рынка.\n\n      Развитие угольной торговли увеличивает нагрузку на доки, склады и транспортные предприятия. Порт связывает хозяйство южноуэльских долин с морскими рынками, привлекая купцов и рабочих. Рост занятости сопровождается расширением жилых кварталов и обострением вопросов снабжения, санитарного состояния и городского управления."
 AOTSM_CITY_FRANKFURT_BODY:0 "      Первое документальное упоминание Франкфурта относится к §G794§! году, когда здесь находился двор §YКарла Великого§! и состоялся церковный собор. Поселение существовало ранее у важной переправы через Майн. Королевская резиденция и торговые пути способствовали развитию рынка и укреплённого городского центра.\n\n      Собор Святого Варфоломея, ратуша Рёмер и рыночные улицы определяют облик исторического ядра. С городом связаны выборы и коронации германских правителей. Ярмарки, издательское дело и купеческие объединения обеспечили Франкфурту известность далеко за пределами прилегающих земель.\n\n      Франкфурт сохраняет положение крупного торгового и финансового центра германских земель. Банкирские дома и ярмарочные связи обслуживают обмен между многочисленными государствами. Обсуждение германского единства усиливает общественную активность, а интересы городских деловых кругов требуют сохранения устойчивых межрегиональных связей."
 AOTSM_CITY_KENINGZBERG_BODY:0 "      Город возник возле крепости, заложенной Тевтонским Орденом в §G1255§! году на месте прусского поселения Твангсте. Название было дано в честь чешского короля §YПржемысла Отакара II§!, участвовавшего в походе ордена. Укрепление обеспечивало закрепление власти на завоёванных землях и контроль над речными путями.\n\n      Историческая застройка объединяет поселения по берегам и островам Прегеля. Замок, собор и университет составляют главные городские ансамбли. Мосты соединяют жилые кварталы с рынками, причалами и складами, обслуживающими торговлю с балтийским побережьем.\n\n      §YКёнигсберг§! сохраняет положение главного административного и торгового центра восточных владений §YПруссии§!. Через порт проходят товары из внутренних областей, а университет и учреждения поддерживают культурную жизнь. Военное значение города связано с гарнизоном, укреплениями и снабжением восточного направления."
 AOTSM_CITY_PRAHA_BODY:0 "      Формирование Праги связано с укреплёнными поселениями на §YВлтаве§!. Основание Пражского Града около §G880§! года приписывается князю §YБорживою I§! из рода §YПржемысловичей§!. Крепость и княжеская резиденция обеспечивали контроль над переправами, вокруг которых развивались торговые и ремесленные кварталы.\n\n      Пражский Град, собор Святого Вита и Карлов мост связывают основные части исторического города. Старе-Место, Нове-Место и Мала-Страна сохраняют различия первоначальной планировки. Университет, монастыри и старые торговые площади определяют культурное и образовательное значение Праги.\n\n      §YПрага§! является одним из главных городов богемских владений §YАвстрийской Империи§!. Ремесленные предприятия и мануфактуры обслуживают обширный внутренний рынок. Распространение чешской печати и культурных обществ сопровождается противоречиями между местным национальным движением и политикой германизации центральной власти."
 AOTSM_CITY_LEMBERG_BODY:0 "      Первое летописное упоминание города относится к §G1256§! году. Его основание традиционно связывается с князем §YДаниилом Романовичем§!, а название — с именем его сына §YЛьва§!. Укреплённое поселение возникло на пересечении дорог, соединявших галицкие земли с центральноевропейскими и восточными рынками.\n\n      Рыночная площадь, ратуша и храмовые ансамбли образуют историческое ядро Лемберга. Католические, православные, армянские и еврейские общины сформировали разнообразную городскую среду. Купеческие дома и ремесленные кварталы сохраняют следы многовекового обмена между соседними областями.\n\n      §YЛемберг§! выполняет административные и культурные функции в галицких владениях §YАвстрийской Империи§!. Учебные заведения, печать и торговые предприятия поддерживают его региональное значение. Отношения польского и русинского населения с имперской властью осложняются национальными противоречиями и политикой централизации."
 AOTSM_CITY_VENEZIA_BODY:0 "      Венецианская традиция относит основание города к §G421§! году. Поселения лагуны складывались постепенно, в том числе за счёт переселенцев с материка, искавших защиты от войн. Рыболовство, солеварение и морской обмен обеспечили их развитие и последующее объединение в самостоятельный городской центр.\n\n      Город расположен на островах, соединённых мостами и каналами. Площадь Святого Марка, Дворец дожей и Большой канал образуют главные архитектурные ансамбли. Арсенал, купеческие дворцы и пристани сохраняют память о самостоятельной морской державе и развитых ремесленных традициях.\n\n      §YВенеция§! находится в составе §YАвстрийской Империи§!. Портовое хозяйство, судостроительные занятия и производство художественных изделий поддерживают городскую экономику. Имперское управление сталкивается с устойчивыми местными традициями. Политические волнения усиливают напряжение между администрацией и сторонниками восстановления самостоятельности."
 AOTSM_CITY_BRNO_BODY:0 "      Первое письменное упоминание Брюнна относится к §G1091§! году и связано с княжеской крепостью в §YМоравии§!. Поселения у речных переправ и торговых дорог существовали ранее. Укреплённый центр обеспечивал управление прилегающими землями и защиту рынка, вокруг которого складывалась городская застройка.\n\n      Замок Шпильберк и собор Святых Петра и Павла определяют силуэт города. Рыночные площади соединены улицами ремесленников и купеческими кварталами. Старое ядро сохраняет крепостной характер, тогда как производственные поселения постепенно распространяются за пределы укреплений.\n\n      §YБрюнн§! служит важным административным и промышленным центром §YМоравии§! в составе §YАвстрийской Империи§!. Ведущее место занимает текстильное производство, привлекающее рабочие руки из окрестностей. Экономическое развитие сопровождается усилением связей между предприятиями, торговыми домами и имперской администрацией."
 AOTSM_CITY_STOGHOLM_BODY:0 "      Название Стокгольма впервые зафиксировано в документах §G1252§! года, связанных с §YБиргером Ярлом§! и королём Вальдемаром. Развитие поселения определялось необходимостью контроля над проходом между озером §YМеларен§! и §YБалтийским морем§!. Укрепления и гавань обеспечивали защиту внутренних земель и торговых путей.\n\n      Островной центр объединяет королевский дворец, церкви и старые торговые кварталы. Мосты и набережные связывают его с материковыми районами и портовыми участками. Морское положение сочетается с административными и культурными функциями, сложившимися вокруг шведского двора.\n\n      §YСтокгольм§! занимает центральное положение в §YСкандинавской Унии§! под властью §YГустава V§!. Объединение северных королевств усиливает значение двора и общих учреждений при сохранении местных органов управления. Торговые связи с германскими землями поддерживают порт, тогда как противостояние с Россией сохраняет важность балтийской обороны."
 AOTSM_CITY_KOPENHAVEN_BODY:0 "      Развитие города связано с торговым поселением у пролива Эресунн. Традиционной датой основания считается §G1167§! год, когда епископ §YАбсалон§! начал строительство крепости у гавани. Само поселение существовало ранее. Укрепление предназначалось для защиты прибрежной торговли и судоходства.\n\n      Городской центр включает дворцовые ансамбли, биржу и плотные кварталы, окружённые укреплениями. Гавани, верфи и складские участки определяют его морской характер. Положение у прохода между §YБалтикой§! и внешними морями придаёт Копенгагену особое хозяйственное и военное значение.\n\n      §YКопенгаген§! сохраняет датские административные учреждения и положение важного центра §YСкандинавской Унии§!. Признание власти §YГустава V§! сопровождается включением местных представителей в общие политические структуры. Портовая торговля и флотское хозяйство остаются основой экономики. Датские элиты стремятся сохранить влияние при объединённой монархии."
 AOTSM_CITY_OSLO_BODY:0 "      По средневековой традиции основание §YОсло§! относится к §G1048§! году и связывается с королём §YХаральдом Суровым§!. Поселение в глубине фьорда развивалось как торговый и королевский центр. Удобные морские подходы и дороги к внутренним долинам обеспечивали обмен между побережьем и норвежскими землями.\n\n      Крепость Акерсхус, гавань и регулярная застройка определяют исторический облик города. После пожара §G1624§! года городской центр был перенесён ближе к крепости. Купеческие дома, склады и лесные пристани связывают жилые кварталы с морскими перевозками и хозяйством окрестностей.\n\n      §YОсло§! является одним из основных норвежских центров §YСкандинавской Унии§!. Местные учреждения и торговые круги сохраняют значение при усилении связей со шведской короной. Вывоз леса, судоходство и ремесленное производство поддерживают городское хозяйство, а участие в общих органах власти требует согласования норвежских и общеунионных интересов."
 AOTSM_CITY_HELLSINKI_BODY:0 "      Город основан в §G1550§! году по распоряжению шведского короля §YГустава Вазы§! как торговый и портовый центр. Учреждение нового поселения должно было перенаправить балтийскую торговлю и создать противовес §YРевелю§!. Первоначальная застройка размещалась у устья §YВантаа§!; впоследствии городской центр был перенесён ближе к более удобным морским гаваням.\n\n      §YГельсингфорс§! расположен на изрезанном заливами побережье §YФинского залива§!. Регулярные площади и общественные здания соседствуют с деревянными жилыми кварталами, пристанями и складскими участками. Существенное значение имеет близость островной крепости §YСвеаборг§!, обеспечивающей защиту морских подступов и связь города с военно-морским хозяйством.\n\n      После перехода финляндских земель под российскую власть, закреплённого мирным договором §G1810§! года, город включён в систему балтийских связей §YРоссийского Государства§!. Порт обслуживает торговое судоходство и снабжение прибрежных гарнизонов. Мастерские, перевозки и местные рынки обеспечивают хозяйственные связи с внутренними областями §YФинляндии§!."
 AOTSM_CITY_RIGA_BODY:0 "      Основание §YРиги§! датируется §G1201§! годом и связывается с епископом §YАльбертом§!, разместившим здесь свою резиденцию. Поселение у нижнего течения §YДаугавы§! создавалось как опорный пункт церковной власти и морской торговли. Удобная гавань и выход к речным путям способствовали притоку купцов и формированию городского торгового сообщества.\n\n      Исторический центр отличается плотной застройкой, узкими улицами и крупными храмами. §YДомский собор§!, §Yцерковь Святого Петра§! и купеческие дома отражают значение §YРиги§! в балтийской торговле. Укрепления отделяют старые кварталы от предместий, а пристани и складские дворы связывают городской рынок с §YДаугавой§! и морскими перевозками.\n\n      §YРига§! занимает важное место во внешней торговле §YРоссийского Государства§!. Через порт вывозятся лес и сельскохозяйственные товары, поступающие из внутренних губерний; в обратном направлении идут заморские изделия и сырьё. Купеческие объединения, мастерские и портовые службы определяют хозяйственную жизнь города, сохраняющего собственные правовые и культурные традиции."
 AOTSM_CITY_MINKS_BODY:0 "      Первое летописное упоминание §YМинска§! относится к §G1067§! году и связано с походом князей §YЯрославичей§! и сражением на §YНемиге§!. К этому времени существовало укреплённое поселение; точная дата его основания и имя основателя не установлены. Развитие города определялось положением среди путей, соединявших земли §YПолоцка§!, §YСмоленска§! и среднего Поднепровья.\n\n      Городская территория расположена на §YСвислочи§!, в районе впадения §YНемиги§!. Замчище, §YВерхний город§! и торговые кварталы образуют историческое ядро. Православные храмы, католические монастырские комплексы и синагоги отражают разнообразие городских общин. Каменные общественные здания соседствуют с преимущественно деревянной жилой застройкой.\n\n      §YМинск§! выполняет административные и торговые функции в западных землях §YРоссийского Государства§!. Основу местного хозяйства составляют ремесло, мелкое производство и обмен с окрестными сельскохозяйственными районами. Ярмарки, лавки и постоялые дворы обслуживают движение товаров и приезжих, а губернские учреждения обеспечивают управление прилегающими территориями."
 AOTSM_CITY_ROSTOV_BODY:0 "      Началом истории §YРостова§! считается учреждение §YТемерницкой таможни§! по указу императрицы §YЕлизаветы Петровны§! в §G1749§! году. Таможенный пункт у §YДона§! предназначался для упорядочения торговли на южном направлении и сбора пошлин. При нём сформировалось поселение, развитие которого было связано с пристанями и последующим строительством крепости §YСвятого Димитрия Ростовского§!.\n\n      Город расположен на правом берегу §YДона§!, вблизи устья §YТемерника§!. Торговые улицы и купеческие дворы тяготеют к речным пристаням; застройка объединяет жилые кварталы, склады и производственные участки. Значение §YРостова§! определяется сочетанием речного порта, сухопутных дорог и выхода к §YАзовскому морю§!.\n\n      §YРостов§! служит торговым посредником между донскими землями, внутренними губерниями и южными морскими рынками. Через пристани проходят хлеб и другие сельскохозяйственные товары; мастерские обслуживают суда, перевозчиков и местных жителей. Развитие портового хозяйства укрепляет значение города в снабжении южных областей §YРоссийского Государства§!."
 AOTSM_CITY_CROMWELL_BODY:0 "      §YКромвель§! сложился на берегах §YПотомака§! в ходе европейского освоения восточного побережья §YКромвленда§!. Речное сообщение и выход к §YЧесапикскому заливу§! создавали условия для торговли с прибрежными поселениями и внутренними областями. Название города связано с именем §YОливера Кромвеля§! и политической традицией британских переселенцев.\n\n      Городская застройка тяготеет к реке, соединяющей пристани с торговыми дворами и жилыми кварталами. Склады и ремесленные мастерские обслуживают перевозки, а дороги связывают поселение с сельскохозяйственной округой. Положение между внутренними землями и атлантическим побережьем определяет его значение как места обмена товарами.\n\n      Хозяйственная жизнь §YКромвеля§! зависит от речной торговли, снабжения жителей и связей с соседними областями. Купеческие конторы поддерживают отношения с европейскими предприятиями, а мастерские перерабатывают поступающее сырьё. Развитие перевозок расширяет городской рынок и усиливает значение пристаней для окружающих поселений."
 AOTSM_CITY_HOUSTON_BODY:0 "      §YХьюстон§! основан братьями §YОгастесом§! и §YДжоном Алленами§! как торговое поселение на водных путях к §YЗаливу Святого Леопольда§!. Город назван в честь §YСэмюэла Хьюстона§!. Место для него было выбрано с расчётом на перевозку товаров между побережьем и внутренними землями. Пристани и складские площадки стали основой дальнейшего развития поселения.\n\n      Городская застройка сосредоточена вокруг рынков, торговых дворов и ремесленных кварталов. Невысокие жилые дома соседствуют с конторами и хозяйственными постройками. Речные перевозки обеспечивают доставку продовольствия, сырья и привозных изделий, а сухопутные дороги связывают город с сельскохозяйственной округой.\n\n      §YХьюстон§! является важным хозяйственным и политическим центром §YМиттелькромвленда§!. Здесь пересекаются интересы местных властей, торговых компаний и представителей §YАвстрийской Империи§!. Отношения с §YАцтекской Империей§! придают городу значение места дипломатических переговоров. Финансовые затруднения европейских предприятий осложняют торговлю и содержание зависимых от них учреждений."
 AOTSM_CITY_EDO_BODY:0 "      Развитие §YЭдо§! связано с замком, построенным военачальником §YОта Доканом§! в §G1457§! году. Укрепление контролировало подходы к равнине §YКанто§! и поселениям у залива. Торговые и ремесленные кварталы постепенно распространились вокруг замковой территории, используя речные протоки и удобные места для разгрузки судов.\n\n      Замок, рвы и протяжённые жилые районы образуют основу городской планировки. Каналы соединяют склады и рынки с пристанями, через которые поступают продовольствие и строительные материалы. Деловые улицы соседствуют с военными резиденциями, храмовыми участками и кварталами ремесленников.\n\n      §YЭдо§! является одним из главных торговых и производственных центров Японии. Политика свободной торговли расширяет возможности купеческих объединений и усиливает их участие в государственных делах. Снабжение многочисленных жителей поддерживает связи с областями §YКанто§!, а противоречия между военными родами и центральными учреждениями влияют на положение городских элит."
 AOTSM_CITY_KIOTO_BODY:0 "      Город основан в §G794§! году по распоряжению императора §YКамму§! как новая столица §YХэйан-кё§!. Размещение двора в просторной долине позволяло устроить резиденцию с регулярными улицами и административными кварталами. Планировка опиралась на китайские столичные образцы и закрепляла особое положение императорской власти.\n\n      Императорский дворец, храмовые комплексы и старые ремесленные улицы определяют облик §YКиото§!. Город известен ткачеством, художественными изделиями и придворными традициями. Монастыри, святилища и торговые кварталы образуют среду, в которой церемониальная жизнь сочетается с повседневной работой мастерских и рынков.\n\n      §YКиото§! является столицей Японии и местом сосредоточения императорского двора и центральных учреждений. Установленный после победы §YИсиды Мицунари§! порядок опирается на государственные советы и сохраняет влияние его рода. Обсуждение военных реформ и внешней торговли усиливает соперничество придворных, военных и торговых группировок."
 AOTSM_CITY_SHIN_KANTO_BODY:0 "      §YШин-Канто§! возник в ходе японского освоения §YЗападного Кромвленда§!, начатого в §G1846§! году с императорского разрешения. Переселенцы, торговцы и военные создавали здесь опорные поселения колонии §YНисэй§!. Название города сохраняет связь с областью §YКанто§! и отражает стремление перенести привычные формы общественной жизни на новое побережье.\n\n      Город представляет собой молодое прибрежное поселение с пристанями, складами и жилыми кварталами. Хозяйственные постройки соседствуют с участками новой застройки. Морское сообщение обеспечивает доставку людей, инструментов и продовольствия, а дороги в глубь территории связывают гавань с осваиваемыми землями.\n\n      §YШин-Канто§! служит одним из опорных пунктов японского присутствия в §YЗападном Кромвленде§!. Торговые объединения заинтересованы в расширении обмена, а военные обеспечивают защиту поселений и путей сообщения. Продвижение колонистов сопровождается столкновениями с местными народами. Снабжение из §YЯпонии§! и устройство хозяйства остаются необходимыми условиями дальнейшего роста города."
 AOTSM_CITY_BAODING_BODY:0 "      История Баодина связана с поселениями северокитайской равнины, существовавшими в эпоху §YХань§!. После разрушения монгольскими войсками город был восстановлен в §G1227§! году. Название §YБаодин§! закрепилось в §G1275§! году и отражало назначение укреплённого центра, обеспечивавшего безопасность столичного района.\n\n      Стены и ворота окружают старые административные, храмовые и торговые кварталы. §YСад Древнего лотосового пруда§! и резиденции чиновников определяют облик города. Положение на дорогах к Пекину объединяет функции регионального рынка, гарнизонного пункта и центра управления окрестными земледельческими областями.\n\n      §YБаодин§! является административным центром провинции §YЧжили§!, окружающей столичный район §YИмперии Цин§!. Резиденция наместника, местные учреждения и гарнизон обеспечивают управление обширными земледельческими территориями. Торговые дома и мастерские обслуживают население провинции, а дороги к Пекину поддерживают постоянное движение чиновников, купцов и грузов."
 AOTSM_CITY_NANJING_BODY:0 "      Возникновение Нанкина связано с укреплёнными и ремесленными поселениями на §YЯнцзы§! эпохи Сражающихся царств. В последующие столетия город неоднократно становился резиденцией правителей южнокитайских государств. При династии §YМин§! его столичное значение было закреплено строительством дворцового центра и обширных укреплений.\n\n      Город известен стенами эпохи §YМин§!, храмами и мавзолеем §YСяолин§!. Жилые и ремесленные кварталы соседствуют с садами и свободными участками внутри укреплённой территории. Пристани §YЯнцзы§! связывают торговые улицы с речными дорогами, обеспечивающими обмен между внутренними областями и морским побережьем.\n\n      §YНанкин§! называют Южной столицей Поднебесной, подчёркивая его историческое значение и особое положение среди городов §YИмперии Цин§!. Производство тканей, ремесленные мастерские и торговые дома обеспечивают связи с земледельческими областями. §YЯнцзы§! служит главным путём доставки товаров, а учреждения и культурные традиции сохраняют за городом роль важного регионального центра."
 AOTSM_CITY_HANYANG_BODY:0 "      Столичное развитие Ханьяна началось в §G1394§! году, когда король §YТхэджо§!, основатель династии §YЧосон§!, перенёс сюда двор. Поселение в защищённой горами долине было преобразовано в административный центр. Стены, ворота и дворцовые участки обеспечивали оборону и размещение учреждений новой династии.\n\n      Дворцы §YКёнбоккун§! и §YЧхандоккун§!, святилище §YЧонмё§! и укрепления определяют исторический облик города. Главные улицы соединяют церемониальные пространства с рынками и жилыми кварталами. Дороги к §YХангану§! обеспечивают доставку продовольствия и связь столицы с внутренними областями.\n\n      §YХаньян§! является резиденцией двора §YЧосон§! и центром управления корейскими землями. Договоры с Японией расширили иностранную торговлю и усилили споры о преобразовании страны. Ослабление влияния §YЦин§! меняет внешнеполитическое положение двора, вынуждая чиновников искать новые способы обеспечения самостоятельности государства."
 AOTSM_CITY_SENDAI_BODY:0 "      Формирование Сендая как замкового города началось в §G1601§! году по инициативе §YДатэ Масамунэ§!. Укреплённая резиденция на возвышенности предназначалась для управления его владениями и защиты прилегающих дорог. Вокруг замка размещались военные дворы, храмовые участки и поселения торговцев и ремесленников.\n\n      Замковая высота над §YХиросэ§! и регулярная сеть улиц определяют устройство города. Военные и торговые кварталы сохраняют различия первоначального назначения. Святилища и ремесленные улицы соседствуют с рынками, обслуживающими земледельческие области §YТохоку§!.\n\n      §YСендай§! сохраняет положение важного центра северо-восточной Японии. Торговля рисом, ремесло и управление окрестными землями поддерживают городское хозяйство. Пережитая угроза неурожая усилила значение продовольственных запасов и согласованного снабжения, а реформы центральных учреждений затрагивают отношения местных военных домов с императорской властью."
