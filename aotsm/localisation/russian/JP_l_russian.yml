 jap_event.1.t:0 "Нанбокусенсо"
 jap_event.1.d:0 "      Многолетнее противостояние между Императорским двором и кланом Токугава наконец достигло той точки, за которой уже нет пути назад. Реформы Дайдзёкана, усиление армии по европейскому образцу и начало колониальной экспансии в Западном Кромвленде разрушили и без того хрупкий баланс сил. Северные земли, верные Токугаве, расценили действия правительства как узурпацию власти и покушение на вековые устои. Попытки примирения, предпринятые Кикин Тайсаку Кайги, окончательно провалились — компромисс оказался невозможен. Япония встала на пороге вооружённого столкновения, и промедление лишь приближало неизбежное.\n\n      Сейчас конфликт перерос в открытую гражданскую войну. На юге, в Киото, сосредоточены силы Императора Осахито и реформаторского Дайдзёкана во главе с Исидой Нобуюки, выступающие за объединение страны и модернизацию. Им противостоит северный Сегунат Токугава, чьи войска удерживают оборонительные позиции в Тохоку и Тюбу, требуя сохранить изоляцию и традиционный уклад. Обе стороны стягивают войска к линии разграничения, вооружают ополчение и ищут союзников среди мелких кланов. Страна раскололась надвое, и теперь, надежды на мирные реформы будут потоплены в крови.\n\n      Особую позицию в этой сумятице занимает торговая фракция Торихики, сосредоточенная в городе Эдо. Её лидер, Имамура Чога, сохраняет нейтралитет, заявляя, что союз не намерен слепо следовать ни за Императором, ни за Сегуном. Торихики видят в войне лишь угрозу торговле и процветанию, однако их влияние растёт с каждым днём, и они готовы выступить третьей силой. Вопрос о том, кто выйдет победителем из этого противостояния — Император, Сегун или же Торихики, — остаётся открытым."
 jap_event.1.a:0 "За Сына Неба и единую Японию!"
 jap_event.1.b:0 "За Сегуна и священные традиции предков!"
 jap_event.1.c:0 "Пожалуй, стоит держаться в стороне от кровавой бойни."

