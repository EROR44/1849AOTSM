 JAP_Emperror_Komei_t:0 "Император Осахито"
 POLITICS_EMPERROR_KOMEI_DESC:0 "Полное имя: §YОсахито§!.\nДата рождения: §G22§! июля §G1831§! года.\nМесто рождения: §YКиото§!, §YЯпония§!.\n\nПринц §YОсахито§! родился §G22§! июля §G1831§! года в императорском дворце §YКиото§!. Он был четвертым сыном правящего императора §YНинко§! и старшей фрейлины §YОгимати Наоко§!. С ранних лет наследник престола воспитывался в строгих традициях синтоизма и конфуцианства, в окружении древних ритуалов и церемоний императорского двора, вдали от бурных политических событий, сотрясавших страну во времена позднего периода §YАдзути-Момояма§! и начала правления влиятельного рода §YИсида§!.\n\nВ §G1840§! году принц §YОсахито§! был официально провозглашен наследником престола. Десятого марта §G1846§! года, после кончины своего отца, императора §YНинко§!, принц вступил на Хризантемовый трон, приняв имя Император §YКомей§!. Формальная церемония интронизации состоялась в следующем, §G1847§! году. С самого начала правления новый монарх столкнулся с противодействием сёгуната §YТокугава§!, который, в отличие от императорского двора и влиятельных купеческих кругов, выступал за ограничение внешних контактов и сохранение традиционных порядков, тогда как император видел будущее страны в расширении торговых и политических связей с иностранными державами.\n\nПравление императора §YКомея§! проходило в условиях активной внешней экспансии, которую энергично поддерживал императорский двор. Под давлением императора, а также в результате активной деятельности фракций «§YТорихики§!» и «§YРикуган Ха§!», ратующих за освоение новых территорий, внешнеполитический курс страны продолжал набирать обороты. Вследствие заключенного §YСимоносекского договора§! §YЯпония§! получила контроль над рядом портов §YКитая§!, включая §YДалянь§!, переименованный в §YДайрен§!, и §YМаомин§!, переименованный в §YМона§!, что положило начало активной колониальной политике. Вскоре после этого, по инициативе тех же фракций, было получено высочайшее дозволение на освоение земель §YЗападного Кромвленда§!, где развернулось активное расширение японской колонии §YНисей§!, несмотря на упорное сопротивление местных племен. Император, уставший от постоянной оппозиции со стороны клана §YТокугава§!, мешавшей проведению эффективной внешней политики, сохранил свое доверие дайдзё-дайдзину §YИсиде Нобуюки§!, последовательно поддерживающему курс на открытость."
 JAS_Esinobu_Tokugava_t:0 "Есинобу Токугава"
 POLITICS_TOKUGAWA_YOSHINOBU_DESC:0 "Полное имя: Токугава Ёсинобу\nДата рождения: 28 октября 1837 года\nМесто рождения: Эдо, Японская Империя\n\n"
 TUK_Imamura_Choga_t:0 "Имамура Чога"
 POLITICS_IMAMURA_CHOGA_DESC:0 "Полное имя: Имамура Чога\nДата рождения: 27 июня 1792 года\nМесто рождения: Эдо, Японская Империя\n\nРодился в семье торговца и с детства помогал отцу, изучая коммерцию. После учёбы в реформированной школе, где он освоил навигацию и европейские языки, поступил в 1810 году в Императорскую военно-морскую академию. Десять лет служил на флоте, участвовал в экспедициях на Хоккайдо, наладил контакты с местными племенами и иностранными торговцами.\n\nВ 1820 году Чога ушёл с флота и начал торговую карьеру в Эдо, используя флотские связи. Он торговал шёлком, чаем и европейскими товарами, быстро завоевав репутацию благодаря умению вести переговоры и пониманию экономических тенденций. К 1830-м годам он стал влиятельной фигурой в деловых кругах и выступал за модернизацию экономики и расширение морской торговли.\n\nВ 1843 году Чога был избран лидером торговой фракции Торихики. Под его руководством фракция укрепила свои позиции, продвигая внедрение европейских технологий и расширение международной торговли. Чога сумел балансировать между традициями сёгуната и необходимостью реформ укрепив позиции Торихики, сделав ее ключевым игроком в экономике империи."

