 #Focuses
 # Emperor

 JAP_omisoka:0 "Омисока"
 JAP_omisoka_desc:0 "Омисока - это не просто праздник Нового года. Для нас это момент настоящего обновления: мы очищаем душу, укрепляем единство народа вокруг Императора и с надеждой прощаемся с прошлым, открывая новую главу в жизни Японии."
 JAP_continue_reforms:0 "Продолжить реформы"
 JAP_continue_reforms_desc:0 "Мы начали сложный путь перемен, и сейчас нельзя останавливаться. Нужно твёрдо продолжать модернизацию армии и государства, укреплять власть Императора и готовить страну к будущим вызовам, несмотря на сопротивление консерваторов."
 JAP_remove_old_officers:0 "Снятие старых офицеров"
 JAP_remove_old_officers_desc:0 "Многие офицеры до сих пор верны старому сёгунату и феодальным традициям. Пришло время заменить их на молодых и преданных людей, чтобы армия полностью подчинялась Императору и служила новой Японии."
 JAP_appoint_new_government:0 "Назначение нового правительства"
 JAP_appoint_new_government_desc:0 "Пора сформировать правительство, которое будет верным только Императору. Мы подберём министров из числа тех, кто искренне поддерживает реформы и готов смело вести страну вперёд."
 JAP_revision_of_taikoryo:0 "Пересмотр Тайхорё"
 JAP_revision_of_taikoryo_desc:0 "Старый свод законов Тайхорё давно устарел и мешает развитию страны. Его серьёзный пересмотр поможет создать современную правовую систему, перераспределить землю и обязанности, чтобы укрепить сильное централизованное государство."
 JAP_martial_law_kanto:0 "Военное положение в Канто"
 JAP_martial_law_kanto_desc:0 "Канто — промышленное сердце Японии, где бурно развиваются торговля и ремёсла. Однако стратегическая важность региона делает его целью для Токугава: сёгун уже укрепился на севере и всеми силами стремится распространить своё влияние и на Канто. Промедление грозит потерей контроля над регионом — военное положение становится крайней и необходимой мерой, чтобы не допустить укрепления позиций Токугава в Канто и сохранить регион в руках Императорского правительства."
 JAP_no_compromise_with_shogun:0 "Без компромиссов с Сёгуном"
 JAP_no_compromise_with_shogun_desc:0 "Любые переговоры с сёгунатом только узаконят его претензии на власть. Мы должны стоять твёрдо: только полная передача власти Императору. Другого пути к единой и сильной Японии просто нет."
 JAP_seek_compromise_with_shogun:0 "Искать компромисс с Сёгуном"
 JAP_seek_compromise_with_shogun_desc:0 "Гражданская война может разорить страну и ослабить нас перед внешними угрозами. Стоит попробовать мирный путь: предложить сёгуну почётную отставку, сохранить за ним некоторые церемониальные роли и заручиться поддержкой его сторонников."
 JAP_vote_on_amendments:0 "Голосование за поправки"
 JAP_vote_on_amendments_desc:0 "Чтобы реформы выглядели законными в глазах всех, нужно получить одобрение от представителей сословий. Соберём лояльных даймё и самураев - их голосование придаст нашим указам твёрдую правовую основу."
 JAP_message_from_karafuto:0 "Сообщение из Карафуто"
 JAP_message_from_karafuto_desc:0 "С далёкого севера, с Карафуто, пришли тревожные новости. Границы, безопасность, возможное влияние иностранцев - ситуация требует, чтобы мы немедленно обратили на это внимание."
 JAP_mobilize_imperial_army:0 "Мобилизовать Императорскую Армию Японии"
 JAP_mobilize_imperial_army_desc:0 "Угроза конфликта уже близко. Мы отдаём приказ о полной мобилизации императорских войск. Армия переходит в полную боеготовность - чтобы защитить трон и подавить любое сопротивление."
 JAP_attempt_to_arrest_shogun:0 "Попытка арестовать Сёгуна"
 JAP_attempt_to_arrest_shogun_desc:0 "Это рискованный шаг, но если удастся захватить сёгуна в его резиденции, мы сразу обезглавим оппозицию и сможем быстро завершить восстановление императорской власти. Провал, конечно, может привести к большой войне, но иногда нужно идти ва-банк."
 
 JAP_imp_end_with_segun:0 "Покончить с Сёгунатом"
 JAP_imp_end_with_segun_desc:0 "Императорский двор больше не намерен терпеть своеволие и двойную власть рода Токугава. Пришло время окончательно ликвидировать остатки сёгуната и восстановить полное единоличное правление Императора над всей страной."
 JAP_imp_foreign_aid:0 "Иностранная помощь"
 JAP_imp_foreign_aid_desc:0 "В условиях внутреннего кризиса Япония не может полагаться лишь на собственные силы. Для сдерживания сегуната и рывка в модернизации стране необходима поддержка извне - даже если она исходит от западных «варваров»."
 JAP_imp_mobilize_reserves:0 "Мобилизовать резервы"
 JAP_imp_mobilize_reserves_desc:0 "В условиях растущей внешней угрозы и внутренних противоречий необходимо провести мобилизацию всех доступных военных резервов. Каждый верный сын Империи должен быть готов встать на защиту трона."
 JAP_imp_use_all_resources:0 "Использовать все ресурсы"
 JAP_imp_use_all_resources_desc:0 "Полная мобилизация промышленных мощностей, сырьевых запасов и людских ресурсов империи. Государство переходит на режим тотального использования всех имеющихся средств ради будущей победы."
 JAP_imp_limited_economic_mobilization:0 "Ограниченная мобилизация экономики"
 JAP_imp_limited_economic_mobilization_desc:0 "Частичная перестройка экономики на военные нужды без крайних мер. Мы сохраняем баланс между гражданским сектором и военным производством, постепенно наращивая выпуск вооружений."
 JAP_imp_turn_to_rome:0 "Обратиться к Ромее"
 JAP_imp_turn_to_rome_desc:0 "Ромейская Империя может стать надёжным стратегическим партнёром и важным противовесом другим великим державам. Укрепление дипломатических и военных связей с Ромеей открывает Японии новые горизонты."
 JAP_imp_turn_to_cbo:0 "Обратиться к Конфедерации"
 JAP_imp_turn_to_cbo_desc:0 "Мы ищем поддержку и тесное сотрудничество с Конфедерацией. Такое партнёрство позволит укрепить международное положение Японии и получить доступ к передовым технологиям и ресурсам."
 JAP_imp_buy_outdated_equipment:0 "Покупка устаревшего снаряжения"
 JAP_imp_buy_outdated_equipment_desc:0 "Приобретение больших партий относительно дешёвого иностранного вооружения и снаряжения позволит быстро оснастить растущую армию и повысить её боеспособность в короткие сроки."
 JAP_imp_weaken_restrictions_on_foreign_goods:0 "Ослабить ограничения на иностранные товары"
 JAP_imp_weaken_restrictions_on_foreign_goods_desc:0 "Смягчение торговых ограничений и барьеров для иностранной продукции. Это стимулирует приток товаров, технологий и капитала, способствуя быстрому экономическому развитию империи."
 JAP_imp_guarantee_foreign_traders:0 "Гарантии иностранным торговцам"
 JAP_imp_guarantee_foreign_traders_desc:0 "Предоставление надёжной защиты и специальных привилегий иностранным купцам. Данная мера значительно расширит внешнюю торговлю в рамках политики свободной торговли Джийуубоуки."
 JAP_imp_invite_volunteers:0 "Приглашение добровольцев"
 JAP_imp_invite_volunteers_desc:0 "Призыв иностранных и отечественных добровольцев в ряды императорской армии. Это позволит быстро увеличить численность войск и привнести ценный боевой опыт в наши вооружённые силы."
 JAP_imp_emperor_speech:0 "Речь императора"
 JAP_imp_emperor_speech_desc:0 "Его Величество лично обратится к подданным с важной речью. Это выступление должно сплотить нацию, оправдать жёсткие меры против внутренних врагов и вдохновить народ на великие свершения."
 JAP_imp_military_industry_expansion:0 "Расширение военной промышленности"
 JAP_imp_military_industry_expansion_desc:0 "Масштабное строительство новых военных заводов, арсеналов и верфей. Значительное увеличение производственных мощностей необходимо для оснащения современной армии и флота империи."
 JAP_imp_torihiki_question:0 "Вопрос Торихики"
 JAP_imp_torihiki_question_desc:0 "Фракция Торихики, представляющая интересы торгового сословия, требует расширения своего влияния в Дайдзёкане и внешней политике. Их голос становится всё более значимым в управлении государством."
 JAP_imp_deal_with_tyrant:0 "Покончить с Тираном"
 JAP_imp_deal_with_tyrant_desc:0 "Род Токугава окончательно исчерпал терпение Императора. Настало время полностью покончить с этим тираном, ликвидировать его влияние и подчинить все земли прямой власти трона."

 JAP_lessons_of_war:0 "Уроки гражданской войны"
 JAP_lessons_of_war_desc:0 "Гражданская война показала, что старые методы ведут к гибели. Нужно сделать выводы, во избежании проблем в будущем. Каждая ошибка на поле боя должна стать уроком для новой армии."
 JAP_reconsider_military_structure:0 "Пересмотр военной структуры"
 JAP_reconsider_military_structure_desc:0 "Традиционные самурайские дружины неэффективны против современного строя. Необходимо пересмотреть иерархию и подчинение, создав единую вертикаль для армии. Только так мы выиграем будущие войны."
 JAP_general_staff_review:0 "Смотр генерального штаба"
 JAP_general_staff_review_desc:0 "Прошедшая гражданская война выявила некомпетентность многих офицеров. Генеральный смотр очистит штаб от непригодных, оставив лишь способных и преданных командиров. Армия начнёт с чистого листа."
 JAP_army_reforms:0 "Реформы в армии"
 JAP_army_reforms_desc:0 "Европейский военный опыт неоспорим — их тактика и оружие доказали своё превосходство. Нам нужна современная армия, способная защитить империю от любой угрозы. Реформы неизбежны и не терпят отлагательств."
 JAP_new_staff_creation:0 "Собрание нового штаба"
 JAP_new_staff_creation_desc:0 "Требуются свежие умы, ничем не связанные с поражениями прошлого. Эти люди получают власть разработать стратегию, которая приведёт армию к величию. Пусть говорят не родословные, а таланты."
 JAP_japanese_militarism:0 "Японский милитаризм"
 JAP_japanese_militarism_desc:0 "Оборона империи — высшая цель для каждого подданного. Вся нация, от знати до простолюдинов, должна быть готова встать под знамёна. Армия и народ едины. Таков наш путь."

 JAP_absolutely_new_path:0 "Абсолютно новый путь"
 JAP_absolutely_new_path_desc:0 "Мы стоим на распутье. Старые кланы тянут нас назад, но Император видит будущее — за новой армией. Возврата к прошлому нет. Либо мы создадим войско нового типа, либо падём жертвой собственного консерватизма."
 JAP_technical_experiments:0 "Технические испытания"
 JAP_technical_experiments_desc:0 "Новое оружие требует тщательной проверки в боевых условиях. Полигоны на Хоккайдо станут местом, где куётся завтрашняя победа. Каждая винтовка и каждое орудие должны быть безупречны."
 JAP_technologies_in_army:0 "Технологии в армию"
 JAP_technologies_in_army_desc:0 "Нарезные винтовки и паровые машины меняют природу войны. Нельзя полагаться лишь на мечи и самурайский дух. Технический прогресс — вот что отделяет живых от мёртвых на поле боя."
 JAP_new_strategy:0 "Новая стратегия"
 JAP_new_strategy_desc:0 "Фронтальные атаки истребили цвет нашей армии. Тактика должна стать гибкой, как бамбук на ветру. Обходные манёвры, засады и грамотное использование рельефа — вот наши козыри."
 JAP_metal_ony:0 "Металлические они"
 JAP_metal_ony_desc:0 "Тяжёлая пехота, закованная в броню и вооружённая новейшими ружьями. Эти железные демоны сметут любого врага. Они не знают страха и не ведают пощады — настоящие они в человеческом обличье."

 JAP_power_of_weapons:0 "Мощь орудий"
 JAP_power_of_weapons_desc:0 "Артиллерия решила исход битвы при Сэкигахаре. С тех пор ничего не изменилось — пушки правят полем боя. Кто владеет самой мощной артиллерией, тот владеет судьбой сражения."
 JAP_triumph_of_spirit:0 "Триумф духа"
 JAP_triumph_of_spirit_desc:0 "Техника бессильна против воли самурая. Наши солдаты докажут всему миру, что японский дух сокрушит любых варваров. Вера в Императора и преданность империи творят чудеса."
 JAP_improve_weapon_quality:0 "Улучшения качества орудий"
 JAP_improve_weapon_quality_desc:0 "Дешёвые ружья ломаются в первых же боях, а их пули летят мимо цели. Лучше меньше, но лучше — вот наш девиз. Каждое орудие должно быть произведено с максимальным качеством."
 JAP_train_every_cadre:0 "Обучить каждого"
 JAP_train_every_cadre_desc:0 "Рекруты из крестьян не уступают самураям, если их правильно обучить. Всеобщая военная подготовка — залог победы. Мы превратим каждого подданного в дисциплинированного солдата."
 JAP_path_to_godhood_through_service:0 "Путь к божественному через службу"
 JAP_path_to_godhood_through_service_desc:0 "Император — живое божество, сошедшее на землю. Служа ему на поле боя и проливая кровь за его дело, воин обретает вечную жизнь и место среди ками."
 JAP_main_virtue_of_honor:0 "Главенство чести"
 JAP_main_virtue_of_honor_desc:0 "Честь превыше всего — это аксиома для настоящего воина. Предатель и трус будут казнены независимо от их происхождения и былых заслуг перед империей."
 JAP_first_shell_then_assault:0 "Сначала обстрел, потом штурм"
 JAP_first_shell_then_assault_desc:0 "Бессмысленные лобовые атаки на укрепления Токугавы стоили нам тысяч жизней. Отныне врага сначала перемолят пушки, и лишь затем в дело пойдёт пехота."
 JAP_spirit_training:0 "Тренировка духа"
 JAP_spirit_training_desc:0 "Солдат, боящийся смерти, уже мёртв. Дзэн-медитация и суровый кодекс Бусидо сделают наших воинов бесстрашными. Их дух станет несокрушимой стеной."
 JAP_main_weapon:0 "Главенство орудий"
 JAP_main_weapon_desc:0 "Винтовка — это новая катана империи. Именно она принесёт победу в грядущих войнах. Каждый солдат должен в совершенстве владеть своим ружьём, как самурай владеет мечом."
 JAP_japan_sense_of_life:0 "Япония, как смысл жизни"
 JAP_japan_sense_of_life_desc:0 "Нет ничего выше благополучия и процветания империи. Ради Японии мы пожертвуем всем, включая собственную душу. Страна восходящего солнца — вот наше всё."

 JAP_imperial_view:0 "Императорский взгляд"
 JAP_imperial_view_desc:0 "Сам государь Осахито обратил свой мудрый взор на армию. Его священная воля станет путеводной звездой для всех грядущих реформ. Ослушаться воли Императора — значит подписать себе смертный приговор."
 JAP_new_approach:0 "Новый подход"
 JAP_new_approach_desc:0 "Нужно разумно сочетать западную науку и исконно японский дух. Не слепое копирование чужеземцев, а творческое переосмысление их достижений под нужды империи."
 JAP_rethinking_bushido:0 "Переосмысление Бусидо"
 JAP_rethinking_bushido_desc:0 "Древний кодекс чести не должен мешать победе. Современная война требует гибкости, хитрости и прагматизма. Слепая приверженность традициям в ущерб результату — глупость."
 JAP_new_army_old_spirit:0 "Новая армия, старый дух"
 JAP_new_army_old_spirit_desc:0 "Пусть винтовки и пушки будут западными, но сердца воинов останутся японскими. Государственный синтоизм скрепит ряды и даст солдатам духовную опору."
 JAP_army_of_precious_new_spirit:0 "Армия прежняя, дух новый"
 JAP_army_of_precious_new_spirit_desc:0 "Самурайство с его сословными предрассудками изжило себя. Нужен новый тип воина — без родословной, но с железной дисциплиной и безграничной преданностью Императору."
 JAP_army_of_modernity:0 "Армия современности"
 JAP_army_of_modernity_desc:0 "Европа уже доказала, что индустрия решает исход войн. Наша армия должна стать настоящей фабрикой смерти — эффективной, безжалостной и высокотехнологичной."

 JAP_bushido:0 "Бусидо"
 JAP_bushido_desc:0 "Путь воина — это путь смерти. Напомним каждому солдату о древних традициях, веками скреплявших Японию. Только верность кодексу сделает армию непобедимой."
 JAP_honor_or_death:0 "Честь или смерть"
 JAP_honor_or_death_desc:0 "Сдача в плен — величайший позор для воина и для всей империи. Лучше смерть, чем бесчестье. Такова воля небес и древних ками, хранящих нашу землю."
 JAP_die_for_homeland_twice:0 "Умри за родину дважды"
 JAP_die_for_homeland_twice_desc:0 "Смерть на поле боя — не конец, а лишь начало вечного служения. Япония ждёт своих павших героев в загробном мире, где они продолжат защищать империю."
 JAP_rejection_of_countless_war_methods:0 "Отказ от бесчестных методов войны"
 JAP_rejection_of_countless_war_methods_desc:0 "Партизанщина, шпионаж и удары в спину — удел трусов и подлецов. Настоящий самурай сражается с врагом в открытую, с высоко поднятой головой и незапятнанной честью."
 JAP_thousand_blades_of_sakura:0 "Тысяча лезвий сакуры"
 JAP_thousand_blades_of_sakura_desc:0 "Элитные отряды, вооружённые лучшими клинками Японии и новейшими винтовками. Цвет сакуры, обагрённый кровью врагов империи. Они не знают пощады и не берут пленных."

 JAP_mercenary_reform:0 "Реформа наёмничества"
 JAP_mercenary_reform_desc:0 "Ронины и авантюристы могут стать основой новой армии. Взяв их под строгий контроль государства, можно превратить разрозненных искателей удачи в дисциплинированную силу."
 JAP_improve_system:0 "Улучшить систему"
 JAP_improve_system_desc:0 "Хаотичный набор головорезов не годится для современной войны. Нужен чёткий учёт, контракты и единые требования ко всем наёмникам империи."
 JAP_transition_to_mixed_system:0 "Переход на смешанную систему"
 JAP_transition_to_mixed_system_desc:0 "Разумный баланс: костяк из профессиональных наёмников и широкое территориальное ополчение. Это дёшево, эффективно и не бьёт по казне."
 JAP_increase_army_budget:0 "Увеличить бюджет Армии"
 JAP_increase_army_budget_desc:0 "Наёмники не работают за веру. Конфискованные богатства Токугавы пойдут на лучшее снаряжение и щедрые контракты для профессионалов."
 JAP_expand_interaction_with_mercenaries:0 "Расширить взаимодействия с наёмниками"
 JAP_expand_interaction_with_mercenaries_desc:0 "Не стоит гнушаться помощи «варваров». Западные инструкторы за золото обучат наших наёмников самым эффективным тактикам современного боя."
 JAP_determine_supremacy_in_the_army:0 "Определить главенство в армии"
 JAP_determine_supremacy_in_the_army_desc:0 "Отныне не кланы, а наёмное командование, лояльное Императору, определяет военную политику. Токугава отстранены."
 JAP_new_authorities:0 "Новые полномочия"
 JAP_new_authorities_desc:0 "Наёмная армия получает право действовать без оглядки на старые советы — быстро, жёстко и эффективно."
 JAP_knights_of_the_arts:0 "Рыцари искусств"
 JAP_knights_of_the_arts_desc:0 "Все реформы позади. Старая армия ушла в небытие, уступив место новой — современной и дисциплинированной. Путь пройден - теперь Япония готова встретить грядущие бури. И пусть отныне каждого воина империи можно назвать рыцарем искусства — искусства побеждать."

 JAP_expansion_of_naval_influence:0 "Расширение военно-морского влияния"
 JAP_expansion_of_naval_influence_desc:0 "Японские амбиции простираются далеко за пределы родных островов. Чтобы империя могла заявить о себе как о великой державе, флоту надлежит выйти за пределы Японского и Восточно-Китайского морей. Присутствие в водах Жёлтого моря, у побережья Кореи и в просторах Тихого океана станет залогом того, что голос Японии услышат и в Пекине, и в европейских столицах. Лишь сильный флот способен защитить торговлю и обеспечить влияние в регионе."
 JAP_bet_on_large_fleet:0 "Ставка на крупный флот"
 JAP_bet_on_large_fleet_desc:0 "Для утверждения державного престижа Японии надлежит строить мощные броненосцы, подобные тем, что несут флаги западных государств. Такие суда станут опорой обороны родных берегов и позволят демонстрировать силу в водах близ Даляня и Маомина."
 JAP_bet_on_raider_fleet:0 "Ставка на рейдерский флот"
 JAP_bet_on_raider_fleet_desc:0 "Вместо возведения дорогостоящих эскадренных броненосцев, разумнее сделать ставку на быстроходные крейсеры. Они способны действовать на вражеских коммуникациях, наносить внезапные удары и уходить от преследования, что отвечает духу подвижной морской войны."
 JAP_large_ship_technologies:0 "Технологии крупных судов"
 JAP_large_ship_technologies_desc:0 "Для воплощения замысла о сильном линейном флоте необходимо овладеть передовыми кораблестроительными решениями. Речь идёт о совершенствовании броневых плит, артиллерии главного калибра и паровых машин, чтобы наши броненосцы не уступали вражеским."
 JAP_admiral_meeting:0 "Собрание адмиралов"
 JAP_admiral_meeting_desc:0 "Настал час созвать высших флотоводцев для обсуждения путей развития морских сил. Совет должен определить, сколько средств направить на постройку линейных кораблей, а сколько — на крейсера и эсминцы, чтобы флот рос гармонично и отвечал задачам империи."
 JAP_small_ship_technologies:0 "Технологии малых судов"
 JAP_small_ship_technologies_desc:0 "Успех рейдерской стратегии невозможен без современных эсминцев и лёгких крейсеров. Необходимо сосредоточиться на увеличении их скорости, дальности плавания и усилении торпедного вооружения, чтобы они могли успешно охотиться на транспорты противника."
 JAP_new_type_of_ships:0 "Новый тип судов"
 JAP_new_type_of_ships_desc:0 "Научно-технический прогресс открывает перед флотом новые возможности — речь о кораблях, несущих летательные аппараты. Они позволят вести разведку на огромных расстояниях и наносить удары там, куда не достаёт орудийный огонь."
 JAP_re_equip_old_ships:0 "Перевооружение старых судов"
 JAP_re_equip_old_ships_desc:0 "Корабли прежних лет, ещё хранящие верность имперскому флагу, нуждаются в обновлении. Замена артиллерии и паровых механизмов продлит им жизнь и позволит нести патрульную службу у берегов новых владений, не отвлекая современные корабли от главных задач."
  JAP_development_of_southern_sea_command:0 "Развитие доков южного военно-морского командования"
 JAP_development_of_southern_sea_command_desc:0 "Южные рубежи империи требуют особого внимания. Для этого надлежит расширить портовые мощности в регионах, прилегающих к Восточно-Китайскому морю. Новые сухие доки и ремонтные мастерские позволят принимать и обслуживать крупные корабли, обеспечивая постоянное присутствие флота у берегов новых владений."
 JAP_reconstruction_of_northern_naval_infrastructure:0 "Переоборудование северной военно-морской инфраструктуры"
 JAP_reconstruction_of_northern_naval_infrastructure_desc:0 "Воды Охотского и Японского морей остаются важнейшими для обороны. Старые северные базы следует модернизировать, углубив фарватеры и обновив причальные линии. Это позволит базировать там современные корабли и защищать северные острова от посягательств извне."
 JAP_research_trade_routes:0 "Изучение торговых путей"
 JAP_research_trade_routes_desc:0 "Прежде чем посылать корабли в дальние плавания, должно изучить морские коммуникации. Требуется составить подробные карты течений, ветров и навигационных опасностей в Тихом океане. Лишь зная пути, можно надёжно защищать собственную торговлю и пресекать контрабанду противника."
 JAP_development_of_corsair_ships:0 "Развитие каперских судов"
 JAP_development_of_corsair_ships_desc:0 "В случае войны быстрые рейдеры могут нанести серьёзный урон вражеской торговле. Предлагается построить серию лёгких крейсеров и вспомогательных судов, способных действовать на океанских просторах. Скрытность и скорость станут их главным оружием в деле ослабления противника."
 JAP_overtake_the_others:0 "Обогнать остальных"
 JAP_overtake_the_others_desc:0 "Япония не должна отставать от ведущих морских держав. Следует взять курс на опережение в кораблестроении, внедряя самые передовые технические решения. Только так флот сможет соперничать с европейскими эскадрами и утвердить превосходство в регионе."
 JAP_fleet_of_new_era:0 "Флот новой эпохи"
 JAP_fleet_of_new_era_desc:0 "Пришло время переосмыслить облик императорского флота. Современные требования войны и защиты интересов вынуждают строить корабли, сочетающие скорость, броню и огневую мощь. Прежние устаревшие проекты должны уступить место дерзким и новаторским решениям."
 JAP_new_command:0 "Новое командование"
 JAP_new_command_desc:0 "Для эффективного управления растущим флотом требуется создать отдельную структуру. Новое командование сосредоточит в своих руках планирование операций, снабжение и координацию эскадр. Это позволит избежать путаницы и направить усилия на достижение стратегических целей."
 JAP_define_targets:0 "Определить цели"
 JAP_define_targets_desc:0 "Прежде чем начать широкую кампанию, надлежит чётко определить, куда направить удар. Следует выделить приоритетные направления — будь то защита колониальных владений, контроль проливов или демонстрация силы в открытом море. Ясность замысла — половина победы."
 JAP_threaty_with_nisey:0 "Договор с Нисеем"
 JAP_threaty_with_nisey_desc:0 "Японская колония Нисей в Западном Кромвенде нуждается в прочных договорённостях. Заключение соглашения с местными властями обеспечит безопасность поселенцев и создаст условия для использования тамошних портов. Это укрепит позиции империи на тихоокеанском побережье."
 JAP_japan_rules_the_seas:0 "Япония правит морями"
 JAP_japan_rules_the_seas_desc:0 "Когда все усилия увенчаются успехом, настанет день, когда Япония станет подлинной хозяйкой океанских вод. От родных островов до дальних колоний — ни одно судно не пройдёт без ведома императорского флота. Это и есть конечная цель всех морских преобразований."

 #Air Forces

 JAP_where_spirits_dwell:0 "Там где живут духи"
 JAP_where_spirits_dwell_desc:0 "Древние предания гласят, что небеса и земли Японии населены восемью миллионами ками. Каждый порыв ветра, каждый раскат грома — их воля. Ныне настала пора узреть волю духов в воздушных просторах. Небеса всегда были обителью божеств, и флот, что поднимется в эти выси, обретёт их покровительство. Молитвы у синтоистских святилищ и старинные ритуалы призовут удачу в полётах, наполнив сердца лётчиков решимостью, дарованной свыше."

 JAP_heavenly_destruction:0 "Небесное разрушение"
 JAP_heavenly_destruction_desc:0 "В старых хрониках упоминается, что бог ветра Фудзин низвергал бури на врагов, а бог грома Райдзин метал свои молнии в нечестивцев. Подобно тому, как ками карали недругов, императорский флот обрушит с небес невиданную ранее мощь. Бомбы, сброшенные с высоты, сравняют укрепления противника с землёй и развеют вражеские порядки, как ураган развеивает листву."
 JAP_large_aircraft_models:0 "Модели большой авиации"
 JAP_large_aircraft_models_desc:0 "Для дальних походов и бомбардировок требуются машины, способные поднимать тяжёлые грузы. Крупные двухмоторные и четырёхмоторные летательные аппараты позволят наносить удары по целям, которые прежде казались недосягаемыми. Такие самолёты станут основой авиации, обеспечивая превосходство в воздухе."
 JAP_medium_aircraft_models:0 "Модели средней авиации"
 JAP_medium_aircraft_models_desc:0 "Наравне с большими машинами надлежит развивать авиацию среднего размера. Эти самолёты обладают большей манёвренностью, что делает их незаменимыми для поддержки войск и патрулирования прибрежных зон. Сочетание скорости и огневой мощи позволит им успешно действовать в любых условиях."
 JAP_new_explosives_production:0 "Производство новых взрывчатых веществ"
 JAP_new_explosives_production_desc:0 "Мощь авиационного удара определяется не только точностью, но и силой заряда. Следует наладить производство взрывчатых веществ нового типа, способных пробивать броню и разрушать массивные укрепления. Новая взрывчатка придаст бомбам сокрушительную силу, о которой ранее не помышляли."
 JAP_focus_on_payload:0 "Упор на грузоподъемность"
 JAP_focus_on_payload_desc:0 "Коль скоро авиация призвана нести смерть с небес, надлежит сделать ставку на увеличение бомбовой нагрузки. Наши конструкторы должны создавать самолёты, способные поднимать максимально возможное количество снарядов, чтобы каждый вылет приносил врагу наибольший урон."
 JAP_reduce_enemies_to_dust:0 "Обратить врагов в прах"
 JAP_reduce_enemies_to_dust_desc:0 "Цель авиации проста и сурова — стереть с лица земли всё, что стоит на пути империи. Стратегические бомбардировки должны превращать вражеские города, порты и заводы в руины. Ничто не укроется от ока пилотов, и ни один противник не избежит возмездия, обрушенного с высоты."
 JAP_priority_on_range:0 "Приоритет на дальность"
 JAP_priority_on_range_desc:0 "Япония отделена от многих потенциальных целей водными просторами, посему дальность полёта приобретает первостепенное значение. Увеличение радиуса действия авиации позволит достигать самых отдалённых уголков вражеской территории, нанося удары там, где нас не ждут."

 JAP_reign_in_the_heavens:0 "Правление в небесах"
 JAP_reign_in_the_heavens_desc:0 "Подобно тому, как богиня Аматэрасу правит небесным сводом, императорская авиация должна утвердить свою власть в воздушных просторах. Ни один неприятельский летательный аппарат не дерзнёт вторгнуться в поднебесное пространство, где отныне властвует воля императора. Небеса Японии будут неприступны."
 JAP_light_aircraft_models:0 "Модели лёгкой авиации"
 JAP_light_aircraft_models_desc:0 "Для разведки, патрулирования и молниеносных ударов требуются лёгкие и манёвренные машины. Эти самолёты способны быстро подниматься в воздух, уклоняться от вражеского огня и доставлять точные сведения о расположении сил противника, подобно быстрым гонцам древности."
 JAP_air_protocols_update:0 "Обновление воздушных протоколов"
 JAP_air_protocols_update_desc:0 "По мере роста авиации устаревшие наставления и правила более не отвечают требованиям времени. Необходимо пересмотреть тактику боевого применения, разработать новые сигналы и инструкции для пилотов, чтобы взаимодействие в воздухе и на земле стало безупречным."
 JAP_aviation_equipment_kit:0 "Комплект снаряжения для авиации"
 JAP_aviation_equipment_kit_desc:0 "Лётчик — главная ценность воздушного флота. Надлежит обеспечить их лучшим оснащением: тёплыми лётными куртками, надёжными парашютами, прицельными устройствами и рациями для связи. Лишь позаботившись о человеке, можно ждать от него победы."
 JAP_new_calibers_for_air_war:0 "Новые калибры для небесной войны"
 JAP_new_calibers_for_air_war_desc:0 "Воздушные схватки требуют особого оружия. Пулемёты и пушки, установленные на самолётах, должны иметь калибры, оптимальные для поражения вражеских машин. Разработка новых боеприпасов позволит с лёгкостью пробивать обшивку и наносить фатальный урон."
 JAP_conquer_asian_skies:0 "Покорить небеса Азии"
 JAP_conquer_asian_skies_desc:0 "Японская авиация обязана стать господствующей во всём азиатском регионе. От берегов Жёлтого моря до просторов Тихого океана — ни один враг не должен чувствовать себя в безопасности. Небеса Азии принадлежат империи, и мы докажем это на деле."
 JAP_priority_on_air_security:0 "Приоритет на воздушную безопасность"
 JAP_priority_on_air_security_desc:0 "Прежде чем устремляться в далёкие земли, надлежит обеспечить надёжную защиту собственного воздушного пространства. Истребители должны круглосуточно патрулировать небеса над островами и колониями, дабы отразить любую попытку вторжения с воздуха."

 JAP_electronics_development:0 "Развитие электроники"
 JAP_electronics_development_desc:0 "Современная война немыслима без достижений науки. Радиосвязь и приборы наведения, кои прежде считались диковиной, ныне становятся насущной потребностью. Внедрение электронных устройств на кораблях и в авиации позволит нашим силам действовать слаженно и с поразительной точностью."
 JAP_air_infrastructure_construction:0 "Строительство воздушной инфраструктуры"
 JAP_air_infrastructure_construction_desc:0 "Дабы авиация могла действовать на просторах империи и за её пределами, надлежит возвести сеть аэродромов и посадочных полос. Особое внимание — колонии Нисей и портам Дайрен с Мона, дабы самолёты могли достигать самых отдалённых уголков."
 JAP_new_wing_models:0 "Новые модели крыльев"
 JAP_new_wing_models_desc:0 "Форма крыла определяет судьбу летательного аппарата. Надлежит испытывать и внедрять новые аэродинамические профили, заимствуя идеи как у западных держав, так и у собственных инженеров. Это придаст нашим самолётам манёвренность и скорость, недоступные врагу."
 JAP_new_cockpit_models:0 "Новые модели кабин"
 JAP_new_cockpit_models_desc:0 "Удобство и обзор для пилота — залог успеха в воздушном бою. Следует разработать новые конструкции кабин с улучшенным остеклением, эргономичным расположением приборов и надёжной защитой. Лётчик должен чувствовать себя хозяином своей машины."

 JAP_lords_of_the_skies:0 "Владыки небес"
 JAP_lords_of_the_skies_desc:0 "Когда все приготовления завершатся, императорская авиация станет подлинным властелином воздушного океана. От восхода солнца над Фудзи до заката над Тихим океаном — ни одна вражеская птица не посмеет подняться в небо без нашего соизволения. Небеса навеки будут японскими."

 #Industry
 JAP_new_flame_of_asia:0 "Новое пламя Азии"
 JAP_new_flame_of_asia_desc:0 "Подобно тому, как паровой двигатель, изобретённый в XVII веке и усовершенствованный Уаттом в 1769 году, зажёг пламя промышленной революции на Западе, ныне Япония становится новым очагом индустриального прогресса в Азии. Победоносное завершение реформ и модернизация производства, вдохновлённые трудами Якоба Лейпольда, позволяют империи заявить о себе как о великой державе. Отныне в Токио, Дайрене и Моне кипит работа заводов, а дым паровых машин знаменует начало новой эпохи."

 JAP_japanese_economic_reforms:0 "Реформы японской экономической сферы"
 JAP_japanese_economic_reforms_desc:0 "Опираясь на опыт реформ Исиды Нобухисы, отменившего зерновой налог в пользу денежного, и политику Нобуясу, даровавшего подданным право собственности на землю, империя продолжит преобразования. Внедрение новых методов управления и развитие торговли с колонией Нисей укрепит экономику и наполнит казну."
 JAP_into_the_depths_of_japan:0 "В глубины Японии"
 JAP_into_the_depths_of_japan_desc:0 "С древних времён японские острова таят в себе несметные богатства. Подобно тому, как духи ками обитают в горах и лесах, в недрах земли сокрыты руды и ископаемые. Надлежит развивать горное дело и добычу полезных ископаемых, дабы обеспечить промышленность необходимыми материалами для строительства кораблей и самолётов."
 JAP_local_production_development:0 "Развитие местных производств"
 JAP_local_production_development_desc:0 "Дабы не зависеть от привозных товаров, следует поощрять ремёсла и мануфактуры в каждой провинции. Подобно тому, как Исида Нобухиса строил амбары в сёлах для предупреждения голода, ныне надлежит создавать мастерские и заводы, дабы каждый регион мог обеспечить себя и армию всем потребным."
 JAP_quality_over_quantity:0 "Качество превыше количества"
 JAP_quality_over_quantity_desc:0 "Японские мастера издревле славились своим искусством. Подобно тому, как кузнецы ковали безупречные клинки, современные инженеры должны создавать технику высочайшего качества. Лучше иметь немного отличных кораблей и самолётов, нежели множество посредственных. Качество оружия решает исход битвы."
 JAP_unique_economy:0 "Уникальная экономика"
 JAP_unique_economy_desc:0 "Подобно тому, как лейпольдит, открытый Якобом Лейпольдом и названный в его честь, обладает необычайными свойствами, экономика Японии должна идти своим путём. Сочетание передовых паровых технологий с традиционными методами хозяйствования позволит создать систему, не имеющую аналогов в мире, и укрепить могущество империи."

 JAP_first_agglomeration:0 "Первая агломерация"
 JAP_first_agglomeration_desc:0 "Токио, сердце империи, не должен уступать европейским столицам в величии и размахе. Следует объединить город с окрестными поселениями в единый промышленный и торговый узел. Подобно тому, как в древности столицы разрастались вокруг императорских дворцов, ныне токийские заводы и верфи создадут первый в Азии город-гигант, коий станет символом новой эпохи."

 JAP_city_expansion_west:0 "Расширение города на запад"
 JAP_city_expansion_west_desc:0 "Западные окраины Токио таят в себе земли, пригодные для строительства новых заводских корпусов и жилых кварталов. Направляя рост города на запад, мы соединим столицу с портовыми сооружениями Токийского залива, что позволит ускорить доставку сырья и вывоз готовой продукции, укрепляя экономическое могущество империи."
 JAP_outpace_constantinople:0 "Обогнать Константинополь"
 JAP_outpace_constantinople_desc:0 "Константинополь и ныне остаётся столицей Ромейской империи, торговым сердцем Европы и конечной точкой Великого шёлкового пути. Сюда стекаются товары с Востока и Запада, здесь вершится судьба половины мира. Но настал час, когда Токио должен превзойти сей древний град — не в богатстве истории, но в мощи промышленности и числе жителей. Пусть отныне взоры купцов и послов обращаются к восходящему солнцу, ибо Япония становится новым средоточием торговли и науки, затмевая былую славу Византия."
 JAP_tokyo_industry:0 "Токийская промышленность"
 JAP_tokyo_industry_desc:0 "Токио должен стать не только политическим, но и промышленным центром Японии. Надлежит строить в столице и её окрестностях паровые заводы, ткацкие фабрики и судостроительные верфи. Дым из труб Токио будет свидетельствовать о том, что империя вступила в век машин и паровых двигателей."
 JAP_living_city:0 "Живой город"
 JAP_living_city_desc:0 "Город подобен живому организму — он дышит, растёт и меняется. В Токио должны быть не только заводы, но и парки, школы, больницы и храмы. Заботясь о благосостоянии горожан, мы создадим столицу, в которой каждый житель будет чувствовать себя частью великой империи, а сам город станет примером для всей Азии."

 JAP_promotion_of_science:0 "Продвижение науки"
 JAP_promotion_of_science_desc:0 "Достижения европейской науки, от парового двигателя Уатта до открытия лейпольдита, доказали, что знание есть сила. Япония не может более оставаться в стороне от сего процесса. Надлежит поощрять учёных, издавать научные труды и перенимать передовой опыт западных держав, дабы империя процветала и не уступала никому в техническом прогрессе."

 JAP_new_institutions_construction:0 "Постройка новых институтов"
 JAP_new_institutions_construction_desc:0 "Для воспитания собственной научной школы требуются особые учреждения. Подобно тому, как в Пруссии изучали труды Лейпольда, а в Париже ставили опыты с паром, в Токио и Киото надлежит возвести академии и лаборатории. Сии институты станут кузницами знаний, где будут готовить инженеров и учёных для блага империи."
 JAP_civilian_tech_priority:0 "Приоритет гражданских технологий"
 JAP_civilian_tech_priority_desc:0 "Прежде чем думать о военных машинах, должно укрепить основы мирной жизни. Сельское хозяйство, текстильное производство, строительство дорог — вот что сделает Японию по-настоящему сильной. Подобно тому, как Исида Нобухиса заботился об амбарах для зерна, ныне мы вложим силы в технологии, улучшающие жизнь каждого подданного."
 JAP_scientific_infrastructure_development:0 "Развитие научной инфраструктуры"
 JAP_scientific_infrastructure_development_desc:0 "Наука требует не только умов, но и приборов. Надлежит создать сеть метеорологических станций, обсерваторий, химических лабораторий и испытательных полигонов. Только располагая надлежащей инфраструктурой, можно совершать открытия, подобные тем, что привели к созданию лейпольдита."
 JAP_military_tech_priority:0 "Приоритет военных технологий"
 JAP_military_tech_priority_desc:0 "Опыт войны с Цинской империей, завершившейся в 1845 году, показал, что без современного оружия победа достаётся дорогой ценой. Надлежит направить усилия учёных на создание новых образцов артиллерии, броненосцев и взрывчатых веществ. Сила армии и флота — вот что защитит империю от любых посягательств."
 JAP_eastern_lighthouse_of_knowledge:0 "Восточный маяк знаний"
 JAP_eastern_lighthouse_of_knowledge_desc:0 "Токио должен стать маяком, освещающим путь к прогрессу для всей Азии. Подобно тому, как Александрийский маяк указывал путь кораблям в древности, наши академии и библиотеки будут указывать путь к знаниям. От Кореи до колонии Нисей, от Дайрена до Мона — все будут черпать мудрость из японских источников, ибо мы становимся восточным центром просвещения."

 JAP_three_strategic_districts:0 "Три стратегических округа"
 JAP_three_strategic_districts_desc:0 "Империя, раскинувшаяся от колонии Нисей до портов Дайрен и Мона, требует новой системы управления. Разделение страны на три стратегических округа — столичный, северный и южный — позволит эффективно распределять ресурсы, координировать оборону и развивать промышленность в каждом регионе сообразно его особенностям."

 JAP_western_japan:0 "Западная Япония"
 JAP_western_japan_desc:0 "Западные земли империи, включая порты Дайрен и Мона, полученные по Симоносекскому договору, являются воротами в Азию. Здесь сосредоточена торговля с материком и базируется значительная часть флота. Развитие сей части страны укрепит присутствие Японии в Жёлтом море и обеспечит защиту новых территорий."
 JAP_beating_economic_heart:0 "Бьющееся экономическое сердце"
 JAP_beating_economic_heart_desc:0 "Экономика подобна сердцу, которое гонит кровь по жилам государства. Токио, Осака и Нагоя должны стать таким сердцем — центрами производства, где бьётся пульс торговли и промышленности. От развития сих городов зависит благосостояние всех земель, от колонии Нисей до северных рубежей."
 JAP_railway_boom:0 "Железнодорожный бум"
 JAP_railway_boom_desc:0 "Паровозы, движимые энергией пара, произвели переворот в перевозках во всём мире. Япония не может оставаться в стороне. Следует проложить рельсовые пути от Токио до портов Дайрена и Моны, соединив столицу с новыми владениями. Железные дороги ускорят доставку войск и грузов, связав империю воедино."
 JAP_where_japans_future_is_forged:0 "Там где куют японское будущее"
 JAP_where_japans_future_is_forged_desc:0 "Подобно тому, как древние кузнецы ковали клинки для самураев, ныне рабочие у доменных печей и ткацких станков куют будущее страны. Районы тяжёлой промышленности — вот место, где рождается новая Япония. Здесь, среди дыма и пара, создаются орудия прогресса, без коих империя не сможет удержать своё место в мире."
 JAP_transport_network_development:0 "Развитие транспортной сети"
 JAP_transport_network_development_desc:0 "Единая транспортная сеть — это кровеносная система государства. Дороги, мосты и каналы должны соединить все части империи, от столицы до самых дальних колоний. Развитие пароходных линий между островами и железных дорог на материке позволит быстро перебрасывать ресурсы и укреплять обороноспособность."
 JAP_automation_principle:0 "Принцип автоматизации"
 JAP_automation_principle_desc:0 "Труды Якоба Лейпольда и опыт создания паровых машин показывают, что машины могут заменить многие тысячи рук. Внедрение автоматизации на заводах и в шахтах повысит производительность и снизит зависимость от ручного труда. Сила Японии — в разумном применении машин, дающих человеку могущество, прежде невиданное."

 JAP_tokyo_city_of_future:0 "Токио - город будущего"
 JAP_tokyo_city_of_future_desc:0 "Токио должен стать воплощением грядущей эпохи — города, где пар и сталь служат человеку. Широкие проспекты, современные здания, заводы с новейшими паровыми машинами, электрическое освещение на улицах — всё это превратит столицу в чудо света, сравнимое с Константинополем в дни его расцвета, но исполненное духа прогресса."
 JAP_city_that_never_sleeps:0 "Город, который не спит"
 JAP_city_that_never_sleeps_desc:0 "В столице империи не должно быть ночи, когда замирает жизнь. Подобно тому, как в портах Дайрена и Моны круглосуточно идёт разгрузка судов, в Токио должны работать заводы и рынки, не зная отдыха. Ночные смены на фабриках, круглосуточное освещение улиц и непрестанное движение делают город живым организмом, готовым к труду в любой час."
 JAP_modern_city:0 "Современный город"
 JAP_modern_city_desc:0 "Образцовый город новой эпохи обязан соединять в себе достижения цивилизации и заботу о человеке. Канализация, водопровод, парковое хозяйство, трамвайные линии на паровой тяге — сии блага, коими уже пользуются в столицах Европы, должны появиться и в Токио. Лишь тогда наш город сможет именоваться современным."
 JAP_tokyo_capital_of_eastern_world:0 "Токио - столица Восточного мира"
 JAP_tokyo_capital_of_eastern_world_desc:0 "Константинополь называют столицей Западного мира, городом, где встречаются Европа и Азия. Токио же должен стать подлинной столицей Востока — средоточием политической, экономической и культурной жизни всей Азии. От берегов колонии Нисей до портов Китая — все обращают взоры к императорскому дворцу, где вершится судьба Востока."
 JAP_absorption_of_neighboring_prefectures:0 "Поглощение соседних префектур"
 JAP_absorption_of_neighboring_prefectures_desc:0 "Подобно тому, как великие города древности расширялись, поглощая окрестные земли, Токио должен включить в свои границы прилегающие префектуры. Это даст простор для строительства заводов, жилых кварталов и складов, объединив ресурсы региона в единую агломерацию, способную конкурировать с крупнейшими городами мира."
 JAP_cultural_industrial_domination:0 "Культурно-промышленная доминация"
 JAP_cultural_industrial_domination_desc:0 "Истинная власть над умами достигается не только силой оружия, но и превосходством в культуре и промышленности. Япония должна стать законодательницей моды во всём, от архитектуры до кораблестроения. Пусть европейцы уважают наши знания, а азиатские народы следуют нашему примеру. Доминация культуры и промышленности — вот путь к вечному величию."

 JAP_northern_japan:0 "Северная Япония"
 JAP_northern_japan_desc:0 "Северные земли империи, от Хоккайдо до Карафуто, таят в себе богатства, коим суждено стать основой могущества. Леса, полезные ископаемые и неосвоенные просторы ждут своего часа. Подобно тому, как первопроходцы осваивали Западный Кромвенд, ныне надлежит направить усилия на развитие севера, дабы каждый уголок Японии приносил пользу империи."
 JAP_from_farmers_to_workers:0 "Из фермеров в рабочих"
 JAP_from_farmers_to_workers_desc:0 "Век пара требует перемен в укладе жизни. Крестьяне, издревле возделывающие рисовые поля, должны стать рабочими у станков и у доменных печей. Подобно тому, как Исида Нобухиса призывал жить экономно и отменил зерновой налог, ныне мы призываем подданных осваивать новые профессии, дабы сила Японии возрастала не только в полях, но и на заводах."
 JAP_wealth_of_karafuto:0 "Богатство Карафуто"
 JAP_wealth_of_karafuto_desc:0 "Остров Карафуто, лежащий к северу от Хоккайдо, хранит несметные запасы угля и руды. Сии сокровища, подобные лейпольдиту в Пруссии, станут топливом для японской промышленности. Освоение недр Карафуто обеспечит заводы Токио, Дайрена и Моны необходимым сырьём, укрепив экономическую независимость империи."
 JAP_future_of_north:0 "Будущее севера"
 JAP_future_of_north_desc:0 "Суровые земли севера не должны оставаться пустошью. Используя достижения паровой техники, надлежит строить там шахты, лесопилки и рыбоконсервные заводы. Будущее севера — в разумном сочетании добычи природных ресурсов и их переработки, что создаст рабочие места и принесёт доход в казну."
 JAP_military_industry_center:0 "Центр военной промышленности"
 JAP_military_industry_center_desc:0 "Опыт войны с Цинской империей и внутренние смуты, подобные Нанбокусенсо — противостоянию между Сёгуном и императорским двором, доказали необходимость собственного производства оружия. На севере, вдали от потенциального вторжения с моря, надлежит создать центр военной промышленности. Пушки, снаряды, броненосцы и винтовки станут выпускать здесь, дабы армия и флот ни в чём не нуждались, а центральная власть более не зависела от милости придворных клик."
 JAP_new_industrial_district:0 "Новый индустриальный округ"
 JAP_new_industrial_district_desc:0 "Великие державы — Конфедерация Британских островов, Франция и Ромейская империя — давно осознали, что промышленные районы суть основа могущества. Японии необходимо создавать подобные округа, дабы не отставать от Запада. Новый индустриальный округ объединит заводы, шахты и транспортные узлы, став двигателем прогресса и символом того, что Япония вступает в число ведущих промышленных держав мира."

 JAP_support_entrepreneurs_and_first_business:0 "Поддержать предпринимателей и первый бизнес"
 JAP_support_entrepreneurs_and_first_business_desc:0 "Частная инициатива есть двигатель торговли и промышленности. Подобно тому, как фракция Торихики, представляющая интересы торговцев, получила право управлять портами Дайрен и Мона, ныне надлежит поощрять купцов и промышленников, дающих работу тысячам подданных. Кредиты, льготы и покровительство властей помогут первому бизнесу встать на ноги и укрепить экономику империи."
 JAP_japanese_economic_miracle:0 "Японское экономическое чудо"
 JAP_japanese_economic_miracle_desc:0 "Сочетание умелого управления, реформ, начатых ещё при Исиде Мицунари, и внедрения передовых паровых технологий способно сотворить чудо. Подобно тому, как Пруссия сумела стать лидером в производстве лейпольдита, Япония должна превратиться из аграрной страны в промышленную державу. Сие преображение и станет тем чудом, коему будут дивиться все народы мира."

 #After civil war tree

 JAP_restoration_of_order:0 "Восстановление порядка"
 JAP_restoration_of_order_desc:0 "Многолетнее противостояние между Императорским двором и кланом Токугава, уже названное современниками «Нанбокусенсо», наконец достигло своего завершения. Северные земли, требовавшие сохранения изоляции и традиционного уклада, и южные силы, выступавшие за объединение страны и модернизацию, сошлись в решающих битвах. Ныне, когда военное противостояние окончено, страна лежит в руинах, истерзанная братоубийственной войной. Настала пора залечить раны, восстановить разрушенное хозяйство и вернуть доверие между подданными. Пусть отныне японцы вновь обратят взоры к созиданию, ибо лишь в единстве и труде кроется истинное величие империи."

