 jap_gw_emperror_event.13.t:0 "Мобилизация населения"
 jap_gw_emperror_event.13.d:0 "      Ваше Императорское Величество, осмеливаюсь доложить, что сложившаяся военная обстановка требует принятия решительных мер. Мятежники Токугава, окопавшиеся в северных провинциях, получают подкрепления и укрепляют свои позиции, в то время как наши доблестные армии, верные Вам, несут потери в затяжных боях. Война против деспота затягивается, и враг использует каждую минуту промедления, чтобы посеять смуту и раскол в рядах Ваших подданных. Настал момент, когда мы обязаны обратиться к народу за помощью — не как к податному сословию, а как к полноправным защитникам Отечества. Только всеобщая мобилизация способна переломить ход войны и обеспечить нам численное превосходство, необходимое для окончательного сокрушения узурпатора.\n\n      Сердца патриотов по всей Империи горят желанием встать под Ваши знамёна. В Киото, Осаке и прилегающих землях уже формируются отряды добровольцев — крестьян, ремесленников и торговцев, готовых обменять свои орудия на мечи и ружья во имя единой Японии. Мелкие кланы, доселе сохранявшие нейтралитет, шлют гонцов с заверениями в верности и просьбами о включении их ополчений в состав имперской армии. Люди жаждут искупить свою пассивность и доказать преданность Государю, видя в грядущей битве возможность избавить страну от позора двойной власти. Ваше Величество, позвольте объявить всеобщий набор, разослать указы во все уголки подвластных нам территорий и дать каждому верноподданному шанс послужить Вам делом, а не словом. С поддержкой народа, воодушевлённого Вашим именем, мы сметём мятежников и навеки восстановим справедливость в нашей земле."
 jap_gw_emperror_event.13.a:0 "Ситуация требует решительных действий, объявите о мобилизации."

 jap_gw_emperror_event.14.t:0 "Речь императора"
 jap_gw_emperror_event.14.d:0 "      Сегодня, в час великого испытания для Японской Империи, Его Императорское Величество Осахито Комэй обратился к членам Дайдзёкана, высшим военным чинам и представителям столичного дворянства. Тронный зал, еще никогда не видевший столь суровой решимости на лике августейшего монарха, внимал каждому слову, произнесенному с непоколебимой твердостью. «Врата нашей страны распахнуты для мира, но наш суверенитет не предназначен для торга», — таков был лейтмотив обращения, положивший конец затянувшимся спорам о путях развития государства.\n\n      Обращаясь к армии и флоту, Государь подчеркнул незыблемость воинского долга перед Хризантемовым троном. «Воины Империи! Вы — щит и меч, вверенные мне небом. Тот, кто поднимает руку на волю императора, будь он даже сегун, — преступает закон и божественный порядок», — провозгласил Император, призвав войска к защите единства страны. Особые слова были обращены к простому люду: «Народ мой, не дайте смутьянам разрушить ваш покой. Империя стоит на вашем труде, и ваша верность — наша общая сила». Эти строки, переданные курьерами во все провинции, уже сегодня вселяют надежду в сердца граждан.\n\n      Завершая речь, Его Величество подтвердил неизменность курса на развитие и процветание державы, подчеркнув, что любое сопротивление воле монарха будет сломлено. «Наша эпоха — время созидания, а не разрушения. Тот, кто пытается остановить ход истории, будет сметен им же», — заявил Император, дав понять, что диалог с мятежным кланом Токугава исчерпан. «Да пребудет с нами Аматэрасу, и да восстановится мир под сенью трона!» — этими словами завершилось историческое обращение, которое, без сомнения, станет поворотной точкой в противостоянии и укрепит дух защитников Империи."
 jap_gw_emperror_event.14.a:0 "Мы будем стоять за Императора до последней капли крови!"

 jap_gw_emperror_event.15.t:0 "Всеобщая экономическая мобилизация"
 jap_gw_emperror_event.15.d:0 "      В условиях затяжного противостояния с мятежным сёгунатом Токугава, поставившего под угрозу само существование единой Японской Империи, перед Верховным командованием и Государственным советом со всей остротой встал вопрос о необходимости перевода всей экономики страны на военные рельсы. Традиционные методы хозяйствования, основанные на принципах саморегулирующегося рынка и частной инициативы, более не отвечали требованиям военного времени. Армия Империи, ведущая боевые действия на нескольких фронтах — от северных провинций до колониальных владений в Западном Кромвленде, — нуждалась в бесперебойном снабжении вооружением, боеприпасами, продовольствием и обмундированием. Медлительность частных поставщиков и спекулятивные колебания цен на стратегические ресурсы стали недопустимой роскошью, угрожающей боеспособности войск и, как следствие, судьбе государства. Дайдзёкан пришел к единодушному заключению: Империя должна незамедлительно приступить к проведению Всеобщей экономической мобилизации, подчинив все отрасли народного хозяйства единой цели — достижению победы.\n\n      Провозглашаемая мобилизация предусматривает введение жесткого государственного регулирования производства, распределения и потребления. Все промышленные предприятия, независимо от формы собственности, переходят под оперативное управление военного ведомства, получая обязательные плановые задания и приоритетный доступ к сырью. Сельское хозяйство обязуется предоставлять фиксированные объемы продовольствия для нужд армии и городов, при этом излишки продукции подлежат обязательной централизованной закупке по твердым ценам. Вводится всеобщая трудовая повинность для лиц, достигших определенного возраста, с возможностью перераспределения рабочей силы в пользу оборонных предприятий. Особое внимание уделяется контролю над финансовыми потоками: устанавливается государственная монополия на внешнюю торговлю стратегическими товарами, вводятся ограничения на банковские операции и ужесточается валютный контроль.\n\n      Его Императорское Величество, утверждая данный указ, подчеркнул, что Всеобщая экономическая мобилизация есть акт высшей государственной необходимости, и все тяготы, связанные с ней, будут рассматриваться как священный долг каждого подданного перед Отечеством. Временные лишения, сокращение гражданского потребления и ужесточение налогового бремени являются неизбежной платой за сохранение независимости и территориальной целостности Империи. Никакие экономические издержки не могут сравниться с утратой суверенитета и порабощением народа мятежным кланом, стремящимся вернуть страну в эпоху изоляции и застоя. Отныне каждый рисовый колос, каждая тонна руды, каждый станок и каждый трудящийся должны работать на фронт. Империя не остановится ни перед чем, ибо на кону стоит ее будущее, и любые жертвы, какие бы они ни были, окажутся оправданными, если они приведут нас к победе. Да поможет нам Небо в этом святом деле!т дух защитников Империи."
 jap_gw_emperror_event.15.a:0 "Империя готова к любым жертвам ради победы!"

 jap_gw_emperror_event.16.t:0 "Экономика военного времени"
 jap_gw_emperror_event.16.d:0 "      Вопрос о масштабах перевода народного хозяйства на военные рельсы продолжает оставаться предметом ожесточенных дискуссий в стенах Дайдзёкана. В то время как военное командование настаивает на тотальной экономической мобилизации, ряд ведущих советников и представителей купеческой фракции «Торихики» предостерегают от поспешных решений, способных нанести непоправимый урон экономическому фундаменту Империи. Опыт прошлых конфликтов наглядно демонстрирует, что чрезмерное и непродуманное изъятие ресурсов из гражданского сектора, огосударствление промышленности и принудительное перераспределение рабочей силы способны породить эффект, обратный ожидаемому. Вместо ускоренного насыщения армии, подобные меры могут привести к дезорганизации производства, падению производительности труда и, как следствие, к хроническому дефициту не только военной, но и гражданской продукции, что неизбежно подорвет моральный дух населения и лишит Империю внутренней опоры.\n\n      Учитывая данные обстоятельства, Государственный совет склоняется к реализации сценария ограниченной экономической мобилизации, предполагающей точечное и дозированное вмешательство в рыночные механизмы. Предлагается сконцентрировать усилия на приоритетном обеспечении армии за счет перераспределения существующих запасов, введения государственных заказов на ключевых оборонных предприятиях и частичного регулирования цен на стратегически важные товары. Крестьянским хозяйствам будет гарантирована фиксированная закупочная цена на зерно, однако изъятие излишков предлагается заменить системой добровольных поставок с государственным субсидированием. Трудовая повинность будет вводиться лишь в отношении отдельных категорий квалифицированных рабочих, необходимых для оборонных заводов, при сохранении свободы трудового найма в остальных отраслях. Финансовый контроль ограничится мониторингом крупных банковских операций и пресечением спекуляций на бирже, без введения жестких валютных ограничений. Данный подход позволит сохранить гибкость экономической системы, не допуская ее паралича от избыточного администрирования, и обеспечит стране возможность относительно быстрого восстановления после завершения конфликта.\n\n      Многие члены Дайдзёкана, включая представителей умеренного крыла армии, выразили поддержку данной стратегии, отметив, что победа, достигнутая ценой полного разорения страны, не может считаться полноценной. Император, выслушав аргументы обеих сторон, подчеркнул, что государственная мудрость заключается не только в умении использовать все доступные средства, но и в способности предвидеть последствия собственных решений. Сокрушить мятеж необходимо, однако превращать цветущую страну в выжженную пустошь ради сиюминутного военного успеха было бы равносильно победе над собственным будущим. Предложенные меры, сочетающие необходимую жесткость в вопросах обороны и разумную сдержанность в вопросах экономики, представляются наиболее взвешенным решением. Империя вступит на путь ограниченной мобилизации, сохранив тем самым свой экономический потенциал и обеспечив устойчивое развитие даже в условиях военного времени."
 jap_gw_emperror_event.16.a:0 "Мудрость правителя — не в силе удара, а в умении сохранить силу страны."

 jap_gw_emperror_event.17.t:0 "Расширение военной промышленности"
 jap_gw_emperror_event.17.d:0 "      В условиях затяжного военного конфликта, охватившего значительную часть территории Японской Империи, вопрос обеспечения действующей армии всем необходимым выходит на первый план. Существующие производственные мощности, ориентированные преимущественно на гражданские нужды, оказались неспособны в полной мере удовлетворить возросшие потребности фронта в вооружении, боеприпасах, транспортных средствах и обмундировании. Дайдзёкан, рассмотрев доклады военного ведомства, пришел к выводу, что дальнейшее промедление с реорганизацией промышленности недопустимо. Отныне стратегическим приоритетом государства становится кардинальное расширение военно-промышленного комплекса, предусматривающее как перепрофилирование существующих предприятий, так и строительство новых заводских корпусов, способных выпускать продукцию, отвечающую современным требованиям ведения боевых действий.\n\n      Первый этап программы предполагает проведение инвентаризации всех промышленных объектов, расположенных на территории Империи, с целью выявления потенциала для их переориентации на выпуск оборонной продукции. Текстильные фабрики, металлообрабатывающие цеха, судостроительные верфи и даже частные мастерские получат государственные заказы с четко установленными объемами производства и сроками исполнения. Особое внимание будет уделено организации массового выпуска стрелкового вооружения, артиллерийских снарядов и взрывчатых веществ, дефицит которых в последнее время становится все более ощутимым. Параллельно с этим запускается программа ускоренного строительства новых заводских комплексов в тыловых провинциях, менее подверженных угрозе вражеских налетов. Финансирование данных мероприятий будет осуществляться за счет перераспределения бюджетных средств, эмиссии государственных облигаций и привлечения частного капитала под гарантии Императорского правительства.\n\n      Вторым направлением реформы станет модернизация производственных процессов и внедрение передовых технологических решений, позволяющих существенно повысить производительность труда. Планируется широкое применение механизации на наиболее трудоемких участках, внедрение конвейерных методов сборки и организация массовой подготовки квалифицированных кадров через сеть ускоренных профессиональных курсов. На время военного положения отменяются некоторые бюрократические процедуры, замедлявшие ввод новых мощностей в эксплуатацию, а предприятиям оборонного сектора предоставляется приоритетный доступ к сырью и энергоресурсам. Военное ведомство, со своей стороны, обязуется обеспечить четкое и своевременное распределение готовой продукции по действующим частям, исключая возможность образования затоваривания складов или, напротив, возникновения критических перебоев с поставками. Данные меры, направленные на максимальную концентрацию промышленного потенциала Империи, призваны создать прочную материальную базу для достижения победы над мятежным сёгунатом и утверждения незыблемой власти Его Императорского Величества."
 jap_gw_emperror_event.17.a:0 "Кузница победы будет работать на полную мощь."

 jap_gw_emperror_event.18.t:0 "Вопрос «Торихики»"
 jap_gw_emperror_event.18.d:0 "      В ходе продолжающегося противостояния между Императорским двором и мятежным сёгунатом Токугава на политической арене все более отчетливо проявляет себя третья сила, которая, однако, до настоящего времени предпочитала держаться в стороне от конфликта. Речь идет о купеческой фракции «Торихики», которая за годы своего существования превратилась из простого торгового объединения в мощную экономико-политическую структуру, обладающую реальной властью и собственными вооруженными формированиями. На сегодняшний день «Торихики» фактически контролирует обширный регион Канто с его административным центром — городом Эдо, а также торговые фактории на материке, включая порты Дайрен и Мона. Данное положение дел делает фракцию самостоятельным игроком, чей нейтралитет в Нанбокусенсо становится предметом пристального внимания обеих противоборствующих сторон.\n\n      Императорский двор, осознавая стратегическую важность расположения «Торихики» и их экономических ресурсов, рассматривает возможность привлечения фракции на сторону законной власти. Взамен на передачу контроля над армией и территориями, находящимися в ведении «Торихики», Император готов гарантировать сохранение торговых привилегий, расширение прав купеческого сословия и предоставление постоянного представительства в Дайдзёкане. Более того, успешное завершение войны обещает «Торихики» эксклюзивное право на освоение новых колониальных рынков и участие в распределении военных трофеев. Однако руководство фракции должно осознавать, что сохранение нейтралитета в столь решающий для Империи час не может продолжаться бесконечно. Рано или поздно победа одной из сторон сделает положение «Торихики» крайне уязвимым — победитель не потерпит на своей территории независимого анклава, чья лояльность остается под вопросом.\n\n      В связи с вышеизложенным, Дайдзёкан от имени Его Императорского Величества принял решение направить «Торихики» официальное предложение о переходе на сторону Императорского двора. Посланники уже готовят проект соглашения, предусматривающего передачу всех вооруженных формирований и контролируемых территорий под верховное командование Императора в обмен на незыблемость торговых привилегий и расширение политического влияния фракции в послевоенном устройстве государства. Главе фракции надлежит дать ответ в кратчайшие сроки, ибо время не терпит, а судьба Империи решается здесь и сейчас. Дальнейшее промедление может быть расценено как нелояльность, и тогда Императорский двор будет вынужден рассматривать «Торихики» уже не как потенциального союзника, а как препятствие на пути к восстановлению единства страны."
 jap_gw_emperror_event.18.a:0 "Предложение направлено, теперь остается ждать ответа."

 jap_gw_emperror_event.19.t:0 "Предложение Его Императороскго Величества"
 jap_gw_emperror_event.19.d:0 "      Главам фракции «Торихики» и ее достопочтенному лидеру Имамуре Чоге от Его Императорского Величества Осахито Комэя.\n\n      Приветствую вас, доблестные мужи, стоящие у руля одного из влиятельнейших объединений нашей Империи. Обращаюсь к вам не как к подданным, коих долг беспрекословно следовать воле монарха, но как к равным партнерам, чья мудрость и предприимчивость снискали уважение даже при Императорском дворе. На протяжении долгих лет вы наблюдали за противоборством между сторонниками истинной власти и теми, кто, забыв о божественном происхождении Хризантемового трона, дерзнул оспаривать волю Неба. Сегодня настал час, когда созерцание более не является привилегией сильных. Время требует от вас действия, а от меня — признания вашей силы как законной и неотъемлемой части грядущего устройства нашей державы.\n\n      Осознавая всю полноту ответственности за судьбу Империи, я, Осахито Комэй, предлагаю вам заключить союз, скрепленный не только взаимной выгодой, но и общей целью — восстановлением мира и процветания под единой властью. В обмен на вашу верность, выраженную в передаче под мое верховное командование всех вооруженных сил «Торихики» и переходе под прямое управление Имперской администрации территорий, ныне контролируемых вами (включая регион Канто, город Эдо, а также заморские фактории в Дайрене и Моне), я гарантирую вам незыблемость всех ваших торговых привилегий и право на их расширение в пределах всей Империи и за ее границами. Ваши представители получат постоянные места в обновленном Дайдзёкане, где голос купеческого сословия будет звучать наравне с голосами военной аристократии. Более того, по окончании Нанбокусенсо именно «Торихики» будет предоставлено исключительное право на освоение новых колониальных рынков и участие в распределении военных трофеев. Я не требую от вас слепого подчинения — я предлагаю вам стать столпом новой Империи, где торговля, разум и труд будут цениться не менее, чем доблесть на поле боя.\n\n      Промедление же, напротив, грозит вам утратой всего достигнутого. Если победа останется за мной, я не смогу оставить на карте страны территорию, не подчиняющуюся единому закону. Если же верх одержит сёгунат, вы рискуете потерять всё — консервативная военщина не потерпит рядом с собой столь влиятельного и независимого соседа. Посему, вручая вам это послание, я ожидаю от вас не только благосклонного рассмотрения моего предложения, но и решительного ответа. Посланники моего двора готовы обсудить любые детали соглашения и немедленно приступить к его оформлению. Да пребудет с нами мудрость предков, и да поможет Небо нам найти верный путь к единству и процветанию Японской Империи. С глубочайшим уважением и надеждой на ваше благоразумие."
 jap_gw_emperror_event.19.a:0 "Мы принимаем волю Императора. «Торихики» встает под знамена Его Величества!"
 jap_gw_emperror_event.19.b:0 "Мы останемся верны нейтралитету, ибо мы служим Империи, а не партиям в ее распрях"

 jap_gw_emperror_event.20.t:0 "«Торихики» на нашей стороне!"
 jap_gw_emperror_event.20.d:0 "Ваше Императорское Величество!\n\n      Мы, главы фракции «Торихики», во главе с Имамурой Чогой, с глубоким почтением и благодарностью принимаем Ваше предложение о союзе. Осознавая всю полноту ответственности перед Империей и Вашим Троном, мы передаем под Ваше верховное командование все вооруженные силы «Торихики» и контролируемые нами территории, включая регион Канто, город Эдо и заморские фактории в Дайрене и Моне.\n\n      Мы верим, что объединение усилий купеческого сословия и Императорского двора станет залогом скорой победы над мятежным сёгунатом и возрождения единой процветающей державы. Отныне и навеки мы — Ваши верные слуги, готовые поддержать Вас словом, делом и кошельком. Да здравствует Император!"
 jap_gw_emperror_event.20.a:0 "Принимаю вашу верность. Отныне «Торихики» — столп Империи, и ваша преданность не будет забыта."

 jap_gw_emperror_event.21.t:0 "«Торихики» придерживается нейтральной позиции."
 jap_gw_emperror_event.21.d:0 "Ваше Императорское Величество!\n\n      Мы, главы фракции «Торихики», во главе с Имамурой Чогой, с глубочайшим уважением и почтением рассмотрели Ваше предложение о союзе. Однако, к нашему величайшему сожалению, мы вынуждены ответить отказом, ибо не считаем себя вправе вмешиваться в военное противостояние, жертвой которого могут стать тысячи невинных граждан.\n\n      Фракция «Торихики» всегда служила Империи словом и делом, но наше служение заключается в созидании и торговле, а не в участии в междоусобных распрях. Мы останемся верны своему нейтралитету, продолжая поддерживать экономику страны и благосостояние её граждан вне зависимости от исхода конфликта. Да хранит Небо Японскую Империю!"
 jap_gw_emperror_event.21.a:0 "Ваш выбор вызывает сожаление, но я уважаю нейтралитет."
 jap_gw_emperror_event.21.b:0 "Отказ есть предательство. Отныне «Торихики» — враг Империи!"

