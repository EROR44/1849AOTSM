 # Shogun

 JAP_shg_pacify_isida_clan:0 "Усмирить род Исиды"
 JAP_shg_pacify_isida_clan_desc:0 "Род Исиды, захвативший власть в Дайдзёкане и проводящий реформы вопреки воле Сёгуна, должен быть остановлен. Их стремление к модернизации и отказ от вековых устоев угрожают самому существованию Японии. Подобно тому, как в древности усмиряли мятежные кланы, надлежит нанести удар по оплотам Исиды и вернуть управление страной в руки тех, кто чтит заветы предков."
 JAP_shg_mobilize_clans:0 "Мобилизация кланов"
 JAP_shg_mobilize_clans_desc:0 "Верные Сёгуну кланы севера должны объединиться для защиты традиций. Подобно тому, как коалиция под предводительством Исиды Мицунари выступила против предателей у Сэкигахары, ныне мы созываем союзников для борьбы с теми, кто посягает на устои. Каждый самурай, каждый воин, хранящий верность пути Буси, обязан встать под знамёна Сегуната."
 JAP_shg_appeals_to_bushido:0 "Призыв к Бусидо"
 JAP_shg_appeals_to_bushido_desc:0 "Путь воина — единственное, что отличает истинного японца от варвара. Сёгун взывает к духу Бусидо, дабы каждый самурай вспомнил о долге и чести. Те, кто предал эти заветы, следуя за Исидой и его европейскими советниками, недостойны носить меч. Лишь верность кодексу принесёт победу и сохранит душу Японии."
 JAP_shg_seize_foreign_property:0 "Захват иностранной собственности"
 JAP_shg_seize_foreign_property_desc:0 "Влияние чужеземцев, проникших в Японию вместе с реформами, должно быть искоренено. Имущество иностранных купцов, фабрики и мастерские, построенные на японской земле, — всё это надлежит конфисковать. Очистим страну от западных вещей, кои разлагают умы и сеют смуту, чтобы вернуть Японии её истинный облик."
 JAP_shg_back_to_traditions:0 "Обратно к традициям"
 JAP_shg_back_to_traditions_desc:0 "Реформы Исиды, отмена Батэрэн щуйхо рэй, введение денежного налога, уподобление армии европейцам — всё это привело к разрыву с тысячелетней историей. Настал час возвращения к истинному пути. Надлежит восстановить старые законы, вновь утвердить синто как единственную религию и изгнать всё, что чуждо духу Ямато."
 JAP_shg_shogun_march:0 "Марш Сёгуна"
 JAP_shg_shogun_march_desc:0 "Сёгун лично поведёт войска на юг, дабы сокрушить мятежников и восстановить справедливость. Подобно тому, как некогда объединённые силы выступали против узурпаторов, ныне воинство верных кланов двинется на Киото и Токио. Марш Сёгуна станет предвестником возрождения былого порядка и краха тех, кто предал родину."
 JAP_shg_hunt_for_baikudo:0 "Охота за байкокудо"
 JAP_shg_hunt_for_baikudo_desc:0 "Исида Мицунари некогда именовал своих врагов байкокудо — предателями, продавшими страну. Ныне те, кто следует за ним, сами стали предателями. Сёгун объявляет охоту на всех, кто причастен к измене, — будь то высокородный даймё или простой чиновник. Предатели не должны избежать кары, ибо лишь возмездие восстановит справедливость."
 JAP_shg_shogun_takes_front:0 "Сёгун берёт фронт в свои руки"
 JAP_shg_shogun_takes_front_desc:0 "Промедление и нерешительность вождей лишь затягивают войну. Сёгун лично встаёт во главе армий, беря на себя ответственность за исход битвы. Его присутствие на поле боя вдохновит воинов и покажет, что глава Сегуната готов разделить с ними тяготы и опасности. Отныне враг узрит, что Сёгун ведёт своих людей к победе."
 JAP_shg_blockade_japan:0 "Блокада Японии"
 JAP_shg_blockade_japan_desc:0 "Дабы пресечь помощь мятежникам из-за моря и не допустить бегства изменников, надлежит установить блокаду всех портов, включая Дайрен и Мона. Ни одно иностранное судно не должно причалить к берегам империи без ведома Сегуна. Только полная изоляция позволит очистить Японию от скверны чужеземного влияния."
 JAP_shg_fate_of_torihiki:0 "Судьба Торихики"
 JAP_shg_fate_of_torihiki_desc:0 "Торговая фракция Торихики во главе с Имамурой Чогой, сохранявшая нейтралитет, ныне обязана определиться. Те, кто не с Сёгуном, — против него. Поддержка Торихики обеспечит Сегунат деньгами и припасами, а их отказ будет расценен как измена. Судьба купцов в руках самих купцов, но и Сёгун не потерпит двусмысленности."
 JAP_shg_final_push:0 "Финальный рывок"
 JAP_shg_final_push_desc:0 "Собрав все силы в единый кулак, Сегунат наносит решающий удар по позициям сторонников Исиды. Каждый самурай, каждый ополченец, каждый воин знает: сей бой решит судьбу Японии. Либо мы вернём стране её истинное лицо, либо навсегда утратим то, что отличает нас от варваров. Вперёд, к победе!"
 JAP_shg_cleanse_japan_of_foreign_influence:0 "Очистить Японию от чужого влияния"
 JAP_shg_cleanse_japan_of_foreign_influence_desc:0 "Когда враги будут разбиты и порядок восстановлен, Япония должна быть очищена от всего чужеродного. Европейские книги, огнестрельное оружие, западная одежда и обычаи — всё это надлежит изгнать из пределов империи. Пусть потомки помнят, что японская земля принадлежит лишь японцам, а чужое влияние есть яд, что разъедает душу нации."

 # Torihiki
 # Civil War Torihiki Section

 JAP_tuk_calm_the_isihara_clan:0 "Унмей но гему"
 JAP_tuk_calm_the_isihara_clan_desc:0 "Межклановые распри, раздирающие страну, суть угроза торговле и процветанию. Фракция Торихики берёт на себя роль миротворца, дабы утихомирить клан Исихары и не допустить эскалации. Подобно тому, как купцы издревле выступали посредниками между враждующими сторонами, ныне мы протягиваем руку примирения, ибо война есть враг всякого достатка."
 JAP_tuk_morisada_isihara:0 "Стратегия Исихары Морисады"
 JAP_tuk_morisada_isihara_desc:0 "Исихара Морисада, опытный стратег и торговец, предлагает использовать экономические рычаги для ослабления противников. Вместо войны — торговые санкции и перекрытие поставок. Сила Торихики — в деньгах и товарах, а посему разумнее применять их как оружие, нежели обнажать меч."
 JAP_tuk_masahiro_abe:0 "Стратегия Абэ Масахиро"
 JAP_tuk_masahiro_abe_desc:0 "Абэ Масахиро, входивший в состав Кикин Тайсаку Кайги, предлагает дипломатический путь. Переговоры, уступки и поиск компромисса — вот что способно предотвратить кровопролитие. Опыт совета по мерам против неурожая доказал: разумный диалог приносит плоды, где меч бессилен."
 JAP_tuk_remain_under_emperor_protection:0 "Под защитой императора"
 JAP_tuk_remain_under_emperor_protection_desc:0 "Император Осахито — символ единства нации, и его покровительство есть надёжный щит. Фракция Торихики признаёт власть Его Величества и ищет защиты у законного правителя. Под сенью императорского двора торговля и ремёсла будут процветать, а купцы — спокойно вести свои дела."
 JAP_tuk_increase_foreign_divisions:0 "Увеличить число иностранных дивизий"
 JAP_tuk_increase_foreign_divisions_desc:0 "Военные советники и наёмники из-за моря способны усилить оборону и принести новые знания. Увеличивая число иностранных отрядов, Торихики обретает силу, не зависящую от внутренних распрей. Европейская выучка и оружие станут гарантией безопасности торговых путей и портов."
 JAP_tuk_reduce_foreigners_in_squadrons:0 "Уменьшить количество иностранцев в наёмниках"
 JAP_tuk_reduce_foreigners_in_squadrons_desc:0 "Чрезмерная зависимость от чужеземцев вызывает недовольство среди японцев. Сократив число иностранных наёмников, Торихики продемонстрирует верность национальным интересам и умерит гнев тех, кто видит в европейцах угрозу. Японские воины должны сами защищать свою землю."

 JAP_tuk_transfer_monarchy_to_emperor:0 "Передача снаряжения Императору"
 JAP_tuk_transfer_monarchy_to_emperor_desc:0 "Торихики располагает немалыми запасами оружия и припасов. Передав их императорским войскам, фракция укрепит свою репутацию и докажет преданность законному правителю. Пусть Император знает: купцы не только торгуют, но и готовы поддержать его делом."
 JAP_tuk_mission_to_nicey:0 "Миссия в Нисее"
 JAP_tuk_mission_to_nicey_desc:0 "Колония Нисей в Западном Кромвенде нуждается в укреплении связей с метрополией. Торихики направляет туда торговую миссию, дабы наладить поставки редких товаров и разведать возможности для дальнейшего освоения. Богатства колонии суть ключ к процветанию всей империи."
 JAP_tuk_increase_labor_quotes:0 "Увеличить рабочие квоты"
 JAP_tuk_increase_labor_quotes_desc:0 "Заводы и верфи Токио, Дайрена и Моны требуют рабочих рук. Увеличивая квоты на наём труда, Торихики способствует занятости и росту производства. Чем больше японцев трудится у станков, тем меньше людей берётся за оружие — и тем прочнее мир."
 JAP_tuk_remove_kanto_front:0 "Отдаление фронта от Канто"
 JAP_tuk_remove_kanto_front_desc:0 "Канто — сердце торговли и промышленности, и военные действия не должны коснуться сих земель. Торихики прилагает все усилия, дабы отодвинуть фронт от столичного региона, сохранив заводы, склады и рынки. Мир в Канто есть залог будущего процветания."
 JAP_tuk_return_to_peaceful_life:0 "Вернуть мирную жизнь"
 JAP_tuk_return_to_peaceful_life_desc:0 "Настала пора сложить оружие и вернуться к мирным занятиям. Торихики выступает за немедленное прекращение боевых действий и восстановление обычной жизни. Пусть поля вновь заколосятся рисом, а купцы откроют лавки — мир есть высшее благо для всех японцев."
 JAP_tuk_development_of_civilian_sector:0 "Развитие гражданского сектора"
 JAP_tuk_development_of_civilian_sector_desc:0 "Военные заказы приносят прибыль, но именно гражданское производство есть основа долгосрочного процветания. Торихики направляет усилия на развитие лёгкой промышленности, сельского хозяйства и строительства, дабы экономика империи была устойчива и не зависела от прихотей войны."
 JAP_tuk_second_sunrise_of_japan:0 "Второй восход Японии"
 JAP_tuk_second_sunrise_of_japan_desc:0 "Как солнце восходит каждый день, так и Япония возродится из пепла смуты. Торихики видит в мирном развитии и торговле путь к новому рассвету. Когда мечи будут перекованы на плуги, а пушки — на паровые котлы, страна обретёт второй восход, более яркий, нежели первый."
 JAP_tuk_expand_economic_power:0 "Расширить экономическую помощь"
 JAP_tuk_expand_economic_power_desc:0 "Деньги и товары суть оружие, не уступающее мечу. Торихики расширяет экономическую помощь союзникам и пострадавшим от войны регионам, укрепляя своё влияние и завоёвывая благодарность. Тот, кто кормит и одевает, становится хозяином положения не хуже того, кто ведёт в бой."
 JAP_tuk_give_the_way_to_reformers:0 "Дать дорогу реформистам"
 JAP_tuk_give_the_way_to_reformers_desc:0 "Старые порядки и традиции Токугавы изжили себя. Торихики полагает, что реформисты, подобные Исиде Нобуюки, способны вывести Японию на новый путь. Даруя им поддержку, мы открываем дорогу прогрессу, торговле и процветанию — тому, ради чего существует наша фракция."
 JAP_tuk_remain_with_compromise_fraction:0 "Остаться фракцией компромисса"
 JAP_tuk_remain_with_compromise_fraction_desc: "Торихики, доселе хранившие нейтралитет, ныне принимают решение, кое определит судьбу всей фракции. Война, раздирающая Японию, не оставляет места для посредничества и компромиссов. Имамура Чога объявляет, что Торихики отказывается от прежней двусмысленности и передаёт все свои силы — людские, финансовые и промышленные — под начало Императора Осахито. Отныне торговые дома и военные отряды фракции поступают в распоряжение императорского двора, дабы совместными усилиями одолеть мятежный Сегунат и восстановить законную власть на всей территории Японии."
 JAP_tuk_fight_for_own_ideals:0 "Бороться за свои идеалы"
 JAP_tuk_fight_for_own_ideals_desc:0 "Пришло время отбросить осторожность и заявить о своих убеждениях открыто. Торихики не станет больше прятаться за чужими спинами — мы будем бороться за свои идеалы: свободу торговли, мир и процветание. Пусть весь мир узнает, что купцы способны не только считать деньги, но и вершить историю."
 
 JAP_tuk_increase_supply_procurement:0 "Увеличить закупку снаряжения"
 JAP_tuk_increase_supply_procurement_desc:0 "Снабжение армии требует постоянного пополнения припасов. Торихики, обладая разветвлённой сетью торговых связей, наращивает закупку оружия, пороха и провианта. Сие позволяет поддерживать боеспособность войск, независимо от того, кто из противоборствующих сторон получает преимущество на поле боя."
 JAP_tuk_appeal_to_neighbors:0 "Обращение к соседям"
 JAP_tuk_appeal_to_neighbors_desc:0 "Торихики направляет посланников к правителям сопредельных держав — Чосону, Цинской империи и влиятельным силам в Восточной Азии. Цель обращения — обеспечить нейтралитет соседей и предотвратить их вмешательство во внутренние дела Японии, дабы страна сама определяла свою судьбу. Особое внимание уделяется контактам с японскими колониями, а также колонией Нисей в Западном Кромвенде, дабы заручиться их поддержкой."
 JAP_tuk_army_reform:0 "Армейская реформа"
 JAP_tuk_army_reform_desc:0 "Война с Цинской империей и внутренние распри показали необходимость преобразований в военном деле. Торихики предлагает реформировать армию, внедряя современные методы организации и обучения. Реформа, начатая при Исиде Мицунари, получает продолжение, независимо от исхода противостояния между Императором и Сёгуном."
 JAP_tuk_naval_maneuvers:0 "Военно-морские манёвры"
 JAP_tuk_naval_maneuvers_desc:0 "Контроль над портами Дайрена, Моны и морскими путями к колонии Нисей требует постоянной боевой готовности флота. Торихики организует манёвры, дабы отработать взаимодействие кораблей и повысить боеспособность эскадр, сохраняя защиту берегов в любой ситуации."
 JAP_tuk_build_diplomatic_relations:0 "Постройка дипломатических отношений"
 JAP_tuk_build_diplomatic_relations_desc:0 "Япония не должна быть изолирована от мира, даже погружённая в смуту. Торихики выстраивает дипломатические отношения с иностранными государствами, дабы иметь возможность влиять на международную обстановку и защищать интересы страны независимо от того, кто у власти в Токио и Киото."
 JAP_tuk_sign_economic_agreements:0 "Подписание экономических договоров"
 JAP_tuk_sign_economic_agreements_desc:0 "Торговля не терпит перерывов. Торихики подписывает экономические соглашения с нейтральными государствами, гарантируя бесперебойный поток товаров и ресурсов в Японию. Договоры станут основой экономической стабильности вне зависимости от исхода гражданского противостояния."
 JAP_tuk_set_military_komissar:0 "Назначение военного комиссара"
 JAP_tuk_set_military_komissar_desc:0 "Для эффективной координации военных усилий Торихики назначает военного комиссара. Сей пост призван объединить экономическую и военную мощь фракции, обеспечивая слаженность действий на всех направлениях и возможность гибко реагировать на изменение обстановки."
 JAP_tuk_new_dawn_of_japan:0 "Новый расцвет Японии"
 JAP_tuk_new_dawn_of_japan_desc:0 "По завершении смуты Япония должна обрести новое дыхание. Торихики видит будущее, где промышленность, торговля и наука процветают, а страна занимает достойное место среди великих держав. Сей расцвет возможен лишь при условии, что все японцы вновь обратятся к созиданию."
 JAP_tuk_accept_foreign_specialists:0 "Принять иностранных специалистов"
 JAP_tuk_accept_foreign_specialists_desc:0 "Европейские знания в области инженерии, артиллерии и кораблестроения могут принести Японии неоценимую пользу. Торихики приглашает иностранных специалистов, дабы они передали свой опыт японским мастерам, но оставляет за собой право решать, как использовать полученные знания." 
 JAP_tuk_reassessment_of_values:0 "Пересмотр ценностей"
 JAP_tuk_reassessment_of_values_desc:0 "Смута заставляет переосмыслить многие устои. Торихики предлагает пересмотреть старые ценности, чтобы адаптировать их к новым реалиям. Традиции и прогресс не должны быть враждебны друг другу — они могут сосуществовать, создавая основу для сильной и процветающей Японии."
 JAP_tuk_the_fate_of_Japan_is_decided_by_us:0 "Судьба Японии решается нами!"
 JAP_tuk_the_fate_of_Japan_is_decided_by_us_desc:0 "Торихики более не сторонний наблюдатель. Фракция, контролирующая торговлю и экономику, способна определять будущее страны. Настал час заявить о себе как о силе, способной влиять на судьбу Японии, вне зависимости от того, какая из противоборствующих сторон одержит верх. Ответственность за будущее империи лежит на всех нас."

 JAP_tuk_transfer_factory_to_shogun:0 "Передача фабрик Сёгуну"
 JAP_tuk_transfer_factory_to_shogun_desc:0 "Промышленные мощности Торихики способны укрепить позиции Сегуната. Передавая фабрики и верфи в распоряжение северных войск, фракция обеспечивает их оружием, боеприпасами и снаряжением. Сия жертва позволит завоевать доверие Сёгуна и укрепить его позиции в борьбе против реформаторов."
 JAP_tuk_form_shogun_navy:0 "Формирование флота Сёгуната"
 JAP_tuk_form_shogun_navy_desc:0 "Сегунат нуждается в сильном флоте, дабы противостоять императорским эскадрам и защищать северные берега. Торихики передаёт Сёгуну свои корабли и судостроительные мощности, формируя боеспособный флот, способный блокировать порты противника и обеспечивать морское превосходство в Японском море."
 JAP_tuk_battle_of_wits_among_soldiers:0 "Битва за умы среди солдат"
 JAP_tuk_battle_of_wits_among_soldiers_desc:0 "Исход войны решается не только на поле боя, но и в сердцах воинов. Торихики разворачивает агитацию среди солдат, убеждая их в правоте дела Сегуната и призывая сохранять верность традициям. Слово способно сделать воина стойким там, где меч бессилен."
 JAP_tuk_cut_off_supplies_to_enemy:0 "Перерезать врагам снабжение"
 JAP_tuk_cut_off_supplies_to_enemy_desc:0 "Армия без припасов подобна телу без крови. Торихики использует свои торговые связи и контроль над портами, дабы перекрыть поставки продовольствия и оружия войскам Императора. Блокада портов Дайрена и Моны лишит противника возможности получать подкрепления из-за моря."
 JAP_tuk_break_with_past:0 "Порвать с прошлым"
 JAP_tuk_break_with_past_desc:0 "Торихики отказывается от прежней двусмысленности и более не ищет компромиссов. Фракция порывает с прошлым, где купцы стояли в стороне от политики, и становится опорой Сегуната. Отныне мы часть северного дела и разделим его победы и поражения."
 JAP_tuk_war_of_attrition:0 "Война на истощение"
 JAP_tuk_war_of_attrition_desc:0 "Изнурение противника есть путь к победе для того, кто не может одолеть его в открытом бою. Торихики финансирует рейды на южные коммуникации, перехватывает обозы и уничтожает склады, дабы год за годом подтачивать силы Императора, пока его армия не обескровится."
 JAP_tuk_military_dominance:0 "Доминация военных"
 JAP_tuk_military_dominance_desc:0 "Торихики признаёт, что в годину смуты военная сила есть высший аргумент. Фракция ставит интересы Сегуната и его военачальников выше торговой прибыли, направляя все ресурсы на укрепление армии и флота. Доминация военных — единственный путь к порядку."
 JAP_tuk_war_economy:0 "Экономика войны"
 JAP_tuk_war_economy_desc:0 "Война требует перестройки всей экономики. Торихики переводит свои предприятия на выпуск военной продукции, мобилизует рабочих и подчиняет торговлю нуждам фронта. Экономика подчинена одной цели — победе Сегуната, и ничто не должно отвлекать от сего."
 JAP_tuk_stay_with_compromis_fraction:0 "Остаться фракцией компромисса"
 JAP_tuk_stay_with_compromis_fraction_desc:0 "Торихики, сохранявшая нейтралитет, ныне принимает сторону Сегуната. Имамура Чога объявляет, что фракция отказывается от прежней двусмысленности и передаёт все свои силы — людские, финансовые и промышленные — под начало Сёгуна, дабы совместными усилиями одолеть Императора и восстановить традиционный порядок на всей территории Японии."
 JAP_tuk_clench_teeth:0 "Обнажить зубы"
 JAP_tuk_clench_teeth_desc:0 "Торихики делает вид, что безоговорочно поддерживает Сегунат, принимая от него помощь и ресурсы, но в последний момент разворачивает оружие против вчерашних союзников. Купцы вступают в войну на собственных условиях, нанося удар изнутри и перехватывая инициативу. Сей шаг есть риск, но он способен изменить ход противостояния."

