 #Ideas
 
 #Start Ideas
 
 JP_torche_of_asia:0 "Азиатский светоч"
 JP_torche_of_asia_desc:0 "Столица §YКиото§! сияет как символ прогресса Азии: здесь паровые машины соседствуют с императорскими садами, а лаборатории в Канто бьют рекорды §YКонфедерации§! в химии. Но слава §YЯпонии§! — §Oпалка о двух концах§!: пока Император инвестирует в университеты и заводы, сёгун в §YСендае§! копирует эти технологии через шпионов, превращая инновации в гонку за власть."
 JP_age_of_reform:0 "Эпоха реформ"
 JP_age_of_reform_desc:0 "С §G1820-х§! волна преобразований, инициированных Императором из §YКиото§!, накрыла §YЯпонию§!: открыты технокультуры, пересмотрены земельные законы, крестьяне получили право выкупа наделов. Но каждая реформа встречает §Oяростное сопротивление§! сёгуната в §YСендае§!. Там «новшества» клеймят, как предательство вековых устоев, а самураи северных провинций §Oоткрыто саботируют§! указы. Результат — §Rхаос§!: в деревнях царят двойные стандарты, налоги душат ремесленников, а в §YЭдо§! чиновники разрываются между двумя столицами. Прогресс стал минoй под единством империи."
 JP_army_trouble:0 "Армейские трудности"
 JP_army_trouble_desc:0 "Императорская гвардия в §YКиото§! и войска сёгуна в §YСендае§! — два враждебных лагеря под одной крышей. Лояльность определяют не приказы, а клановые связи: самураи из Тохоку идут за сёгуном, киотосские ополченцы — за Императором. Даже порох на складах §YЭдо§! делят по спискам, словно вчерашние трофеи."
 JP_shogunate_trouble:0 "Конфликт с Сёгуном"
 JP_shogunate_trouble_desc:0 "Раскол Японии оформился в трёх столицах: \n- §YКиото§! (трон Императора) \n- §YСендай§! (крепость сёгуната) \n- §YЭдо§! (нейтральный «город компромисса»)\n\n Здесь, в чайных доминах у замка §YЭдо§!, идут тайные переговоры. Но сёгун уже призвал самураев с §YХоккайдо§!, а император стягивает флот к §YОсаке§!... \n\n§RКонфликт может разгореться в любой момент§!."

 #Civil war ideas

 JAP_jap_civil_war:0 "Японская гражданская война"
 JAP_jap_civil_war_desc:0 "Императорский двор и реформаторский Дайдзёкан ведут решительную борьбу за полное восстановление императорской власти. Гражданская война идёт за устранение многовекового раскола и объединение всей страны под единой рукой §YСына Неба. Только так, по их убеждению, §YЯпония§! сможет преодолеть внутренние противоречия и уверенно войти в новую эпоху."
 JAP_imp_guarantee_foreign_traders_idea:0 "Гарантии иностранным торговцам"
 JAP_imp_guarantee_foreign_traders_idea_desc:0 "Предоставление надёжной защиты и специальных привилегий иностранным купцам. Данная мера значительно расширит внешнюю торговлю в рамках политики свободной торговли Джийуубоуки."

 JAP_for_the_fatherland_and_the_emperor:0 "За Отечество и Императора!"
 JAP_for_the_fatherland_and_the_emperor_desc:0 "Верность императорскому дому — это не просто долг, а священная обязанность каждого японца. В час, когда деспот Токугава поднял мятеж и расколол страну, только единство вокруг законного государя может спасти Японию от хаоса и упадка. Идея служения Отечеству и Императору объединяет воинов и крестьян, знатных и простых, в едином порыве сокрушить узурпатора и восстановить справедливость. Лишь сплотившись под знамёнами хризантемы, мы сможем защитить нашу землю и построить будущее, достойное великой Японии."

 JAP_cw_expand_millitary_industry_idea:0 "Приоритетное развитие военной промышленности"
 JAP_cw_expand_millitary_industry_idea_desc:0 "Промышленность Империи переориентирована исключительно на нужды фронта. Все ресурсы, сталь, топливо и рабочая сила направлены на расширение оборонных предприятий и бесперебойный выпуск вооружения. Гражданский сектор, испытывая острейший дефицит материалов и кадров, вынужден временно замедлить развитие, ибо победа требует немедленных жертв."

 JAP_the_heart_of_trade_of_empire:0 "Сердце торговли империи"
 JAP_the_heart_of_trade_of_empire_desc:0 "Политика §YДжийуубоуки§!, проводимая уже более полутора веков, превратила регион §YКанто§! и его столицу §YЭдо§! в настоящее сердце торговли всей §YЯпонской империи§!. Промышленно развитый §YКанто§! с его оживлёнными портами, складами и купеческими гильдиями стал главным узлом, через который поступают товары из §YКитая§!, §YКореи§! и европейских держав. §YТорихики§!, обосновавшаяся в §YЭдо§!, видит в контроле над этой торговлей ключ к экономическому и политическому могуществу."
 JAP_at_the_cutting_edge_of_westernisation:0 "На острие вестернизации"
 JAP_at_the_cutting_edge_of_westernisation_desc:0 "Промышленно развитый регион §YКанто§!, особенно город §YЭдо§! - стал авангардом вестернизации в §YЯпонии§!. Реформы армии по европейскому образцу, произведенные в §G1842§! году, активное освоение западных технологий и бурное промышленное развитие §YКанто§! позволяют уверенно заявлять, что именно решительное заимствование военных и промышленных методов Запада поможет империи укрепить своё положение в мире."
 JAP_jas_civil_war:0 "Японская гражданская война"
 JAP_jas_civil_war_desc:0 "Сторонники сёгуната Токугава ведут ожесточённое сопротивление вестернизации и реформам Дайдзёкана. Для них гражданская война - это священная борьба за сохранение древних традиций и удержание реальной власти в руках сёгуна. Только сильный сёгунат способен защитить §YЯпонию§! от губительного влияния западных варваров и сохранить тот порядок, который веками обеспечивал мир и стабильность империи."

 JAP_the_power_of_traditions:0 "Сила традиций"
 JAP_the_power_of_traditions_desc:0 "Сторонники сёгуната твёрдо убеждены, что именно незыблемая сила древних традиций способна сохранить душу §YЯпонии§!. Конфуцианские ценности, синтоистские ритуалы и вековые обычаи, которые веками поддерживали порядок при §YТокугава§!, остаются для них главной опорой. Они решительно отвергают поспешную вестернизацию, считая, что только верность традициям позволит уберечь империю от хаоса и потери своей сущности."
 JAP_the_way_of_samurai:0 "Путь самурая"
 JAP_the_way_of_samurai_desc:0 "Для самураев §YБусидо§! по-прежнему остаётся единственным истинным путём. В эпоху, когда реформаторы из Дайдзёкана и фракция Торихики пытаются навязать западные порядки, эти воины клянутся защищать старый порядок катаной и честью. Сохранение традиционного образа жизни, верность сёгуну и презрение к «варварским» новшествам — вот что для них значит настоящий §YПуть Самурая§!."
 JAP_tuk_civil_war:0 "Японская гражданская война"
 JAP_tuk_civil_war_desc:0 "Фракция §YТорихики§!, опирающаяся на промышленно развитый регион §YКанто§! с центром в §YЭдо§!, видит в разгоревшейся гражданской войне прежде всего угрозу и возможность для своей торговой империи. Для них конфликт - это борьба за будущее японской экономики: сохранение и расширение свободной торговли, контроль над потоками товаров, технологий и капиталов из §YКитая§!, §YКореи§! и §YЕвропы§!. §YТорихики§! стремятся к тому, чтобы независимо от исхода войны их торговые интересы и экономическое влияние в §YКанто§! остались неприкосновенными и только усилились."

