 TPN_denial_of_manchu_heritage_desc:0 "Последователи Шанди-цзяо считают маньчжурское владычество богохульной узурпацией прав Верховного Владыки на земле. Эта концепция требует полного отказа от всего, что связано с правлением чужеземной династии, включая обычаи, ритуалы и административные практики, насаждённые маньчжурами за века оккупации Китая."

