 SON_guarda_imperial_do_norte:0 "Guarda Imperial do Norte"
 SON_guarda_imperial_do_norte_desc:0 "Имперская гвардия Севера - войсковая структура, изначально созданная на территориях Соноры для охраны ключевых областей и городов. На текущий момент, фактически представляет собой профессиональную армию, обученную по образцу лучших европейских подразделений. Делится на регулярные части (Lanceiros, Caçadores) и нерегулярные ополчения (Voluntários da Fronteira).\n\nСостав подразделений гвардии многогранен: ядро состоит из немногочисленных офицеров, прибывших из метрополии, основная масса же - нанимается из приезжих и местного населения (жителей городов, индейцев, метисов и прочих). "
 SON_serebryanaya_papageria:0 "Серебряная Папагерия"
 SON_serebryanaya_papageria_desc:0 "В 1830-х годах на северо-западе Соноры были обнаружены богатые богатые серебряные и золотые россыпи, что привело к бурному развитию рудников в области, на фоне так называемой «Золотой лихорадки». \n\nНе смотря на постоянную необходимость пристутсвия подразделений «Гвардии Севера» и фактическом разгуле преступности в Папагерии, регион стабильно пополняет казну страны, что позволяет назвать его одним из ключевых источников дохода государства."
 SON_portugal_colonial_administration:0 "Португальская колониальная администрация"
 SON_portugal_colonial_administration_desc:0 "Португальская колониальная администрация связывает Сонору с метрополией через систему торговых привилегий, лицензий и налоговых послаблений. Взамен требует лояльности, отчётности и соблюдения интересов короны. Чем выше лояльность, тем шире доступ к рынкам, кредитам и защите. Однако, привилегии это палка о двух концах, с их увеличением растет и завесимость от Лиссабона."
 SON_apache_raids:0 "Набеги апачей"
 SON_apache_raids_desc:0 "Культура Апачей - культура воинов! Их путь строго поределен с рождения - для них воин не профессия, а идентичность. Вместе с наличием границ с их землями на северо-западе страны,  это приводит к периодическим набегам, разоряющим отдаленные регионы."

