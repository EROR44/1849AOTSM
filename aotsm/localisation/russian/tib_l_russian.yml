 #IDEAS
 
 TIB_nominal_authority_of_the_qing_empire:0 "Номинальная власть Империи Цин"
 TIB_nominal_authority_of_the_qing_empire_desc:0 "Власть империи Цин над Тибетом носит преимущественно номинальный характер. Император в Пекине считается верховным покровителем тибетского государства, однако, реального административного контроля почти не осуществляет. Управление в Лхасе находится в руках регента и высшего тибетского духовенства. Цин ограничивается редкими формальными вмешательствами, ритуальным утверждением перерождений через Золотую урну и символическим сюзеренитетом. Тибет сохраняет широкую внутреннюю автономию, фактически признавая императора Поднебесной, как духовно-политического покровителя."
 TIB_ambani:0 "Амбани"
 TIB_ambani_desc:0 "В Лхасе находятся два цинских амбаня - императорских резидента. Их резиденция располагается недалеко от Поталы. Амбани формально надзирают за внешними отношениями, военными делами и соблюдением «тибетских уложений» 1793 года. На практике их влияние ограничено: они могут давать рекомендации и отчитываться в Пекин, но реальная власть остаётся у тибетских регентов и монастырей. Амбани с небольшим отрядом солдат существуют в атмосфере почтительного, но холодного равнодушия со стороны местной знати и монахов."
 TIB_mountain_country:0 "Горное государство"
 TIB_mountain_country_desc:0 "Тибет - государство расположенное на «крыше мира»: высокогорном Тибетском плато, окружённом неприступными хребтами Гималаев и Куньлуня. Суровый климат, разреженный воздух и высокие горные барьеры создают сильную естественную изоляцию. Благодаря такому расположению страна хорошо защищена от недругов, но это приводит к нектороным другим трудностям."

 #CHARACTER

 TIB_Hedrup_Giaco_t:0 "Кхедруп Гьяцо"
 POLITICS_HEDRUB_GIACO_DESC:0 "Полное имя: §YКхедруп Гьяцо§!\nДата рождения: §G1 ноября 1838§!\nМесто рождения: §YГартанг, близ Дарцедо, Кхам, Тибет§!\n\n§YКхедруп Гьяцо§! родился в §G1838§! году в деревне §YГартанг§! в регионе §YКхам§!(восточный Тибет), в том же месте, где ранее появился на свет 7-й Далай-лама. В §G1841§! году его признали реинкарнацией 10-го Далай-ламы, а в мае §G1842§! года торжественно возвели на трон в §YПотале§!. Церемонию проводил 7-й Панчен-лама §YЛобсанг Тенпай Ньима§!, который дал мальчику имя §YКхедруп Гьяцо§!, постриг ему волосы и принял у него обеты. С ранних лет он обучался в монастырях §YСера§!, §YДрепунг§! и §YГанден§!. В §G1846§! году он принял предварительные монашеские обеты, а в §G1848§!–§G1849§! годах - обеты послушника (гецул).\n\nВ детстве и юности §YКхедруп§! жил под регентством, активно участвовал в религиозной жизни: посещал праздники, совершал паломничества, расширял летнюю резиденцию §YНорбулингка§! и даже написал аллегорическую книгу «§YИстория обезьян и птиц§!»."
 TIB_Ngawang_Yeshe_Tsultrim_Gyatso_t:0 "Нгаванг Еше Цултрим Гьяцо"
 POLITICS_NGAWANG_YESHE_TSUTRIM_GYATSO_DESC:0 "Полное имя: §YНгаванг Еше Цултрим Гьяцо§!\nДата рождения: §G1816§!\nМесто рождения: §YТибет§!\n\n§YНгаванг Еше Цултрим Гьяцо§! родился в §G1816§! году. В юности он был признан перерождением предыдущего Ретинг Ринпоче и возведён на Золотой трон монастыря §YРетинг§!. Он вступил в монашеский колледж §YСера§!, где проявил выдающиеся способности в изучении пяти основных буддийских трактатов: праманы, мадхьямаки, праджняпарамиты, абхидхармы и винаи.\n\nВ возрасте §G29§! лет он стал регентом Тибета, приняв бразды правления от имени малолетнего 11-го Далай-ламы §YКхедрупа Гьяцо§!. В те же годы он исполнял обязанности наставника, давая монашеские обеты юному перерожденцу, а также участвовал в управлении религиозными делами страны, поддерживая стабильность в монастырских кругах и продолжая традиции линии передачи учения Гелуг."
 TIB_Trinley_Giaco_t:0 "Тринлей Гьяцо"
 POLITICS_TRINLEY_GIACO_DESC:0 "Полное имя: §YТринлей Гьяцо§!\nДата рождения: §G28 декабря 1856§!\nМесто рождения: §YЛхока, Центральный Тибет§!\n\n§YТринлей Гьяцо§! родился в конце §G1856§! года в регионе §YЛхока§! (южный Тибет) в семье §YПхунцок Цеванга§! и §YЦеринг Юдон§!. Это произошло вскоре после внезапной смерти предыдущего, 11-го Далай-ламы §YКхедрупа Гьяцо§!. Мальчика довольно быстро обнаружили и в §G1858§! году привезли в §YЛхасу§!, где регент §YРетинг Нгаванг Еше Цултрим§! выполнил церемонию пострига и дал ему имя §YТринлей Гьяцо§!. В §G1860§! году, в возрасте около четырёх лет, его официально возвели на трон в §YПотале§!, а чуть позже приняли у него обеты послушника."

