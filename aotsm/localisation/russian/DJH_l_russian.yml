 #CHARACTERS
 DJH_Ma_Hualong_t:0 "Ма Хуалун"

 #IDEAS
 DJH_ma_hualong:0 "Ма Хуалун"
 DJH_ma_hualong_desc:0 "§YМа Хуалун§!, возглавивший §Yрелигиозное братство§! §YДжахрия§! после смерти своего отца §YМа Идэ§!, пользуется значительным уважением среди последователей ордена. Его положение §Yдуховного наставника§! позволяет объединять разрозненные общины, поддерживать связи между религиозными центрами и направлять деятельность местных руководителей. Личный авторитет §YМа Хуалуна§! способствует укреплению внутреннего порядка и политического единства, а преданность его сторонников становится важной опорой формирующейся государственной власти."
 DJH_trading_networks:0 "Торговая сеть Джахрия"
 DJH_trading_networks_desc:0 "Благодаря связям между мусульманскими общинами §YГаньсу§!, §YНинся§! и соседних областей братство §YДжахрия§! располагает разветвлённой системой торговых и хозяйственных отношений. §YКараванная торговля§!, земельные владения и поступления от сторонников обеспечивают руководство ордена средствами для содержания религиозных учреждений и поддержки местного хозяйства. Эти связи облегчают перевозку товаров, развитие путей сообщения и организацию производства, позволяя компенсировать ограниченность государственных ресурсов."
 DJH_jinjipu_stronghold:0 "Укреплённый центр Цзиньцзибао"
 DJH_jinjipu_stronghold_desc:0 "§YЦзиньцзибао§! служит главным опорным пунктом движения §YМа Хуалуна§!, объединяя административные, хозяйственные и религиозные учреждения братства §YДжахрия§!. Его укрепления, склады и организованная оборона позволяют местным отрядам рассчитывать на длительное сопротивление превосходящим силам неприятеля. Вместе с тем сосредоточение значительных ресурсов вокруг одного §Yукреплённого центра§! ограничивает свободу действий войск и делает движение особенно уязвимым перед продолжительной осадой и нарушением путей снабжения."
