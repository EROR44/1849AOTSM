 #Leader trait
 
 #Ideas
 
 MOL_land_reform:0 "Успешная земельная реформа"
 MOL_land_reform_desc:0 "§YМолдавия§! совершила тихую революцию: земли бояр-откупщиков были выкуплены государством и переданы крестьянам на условиях вечной аренды. Это не только ликвидировало феодальные пережитки, но и создало класс зажиточных фермеров. Их излишки зерна, табака и винограда теперь экспортируются в §YАвстрию§! и §YПруссию§!, а выручка инвестируется в мануфактуры. В §YЯссах§! и §YКишинёве§! уже дымят фабрики по переработке сельхозпродукции, а мастерские выпускают простые станки. Хотя до индустриального рывка далеко, княжество уверенно движется от сохи к паровому плугу, избегая социальных потрясений."
 MOL_peaceful_politic:0 "Мирная политика"
 MOL_peaceful_politic_desc:0 "Зажатая между §YАвстрийской Империей§!, §YРоссией§!, §YРомеей§! и §YБолгаро-Валахией§!, §YМолдавия§! избрала нейтралитет залогом выживания. Её армия – §G8000§! штыков – символична, зато дипломаты искусно играют на противоречиях соседей. В §YБухаресте§! и §YПетрограде§! молдавские послы подчёркивают выгоды транзитной торговли, в §YКонстантинополе§! – роль щита от российского влияния. «§YНаша сила – в нашем спокойствии§!», – гласит княжеский девиз. Даже пограничные конфликты с валахами улаживаются арбитражем §YВены§!."
 MOL_people_rule:0 "Власть в руках народа"
 MOL_people_rule_desc:0 "Уникальный для Балкан «§YЗемский Собор§!» (Sfatul Tarii) определяет судьбу §YМолдавии§!. Раз в §G5§! лет свободные мужчины-собственники избирают окружных старейшин, которые утверждают законы и контролируют чиновников. Князя избирают пожизненно, но лишь из кандидатов, одобренных Собором. После смерти §YСтефана IX§! (§G1847§! г.) знать безуспешно пыталась протащить пророссийскую кандидатуру – собрание земель предпочло либерального §YИоанна Кузу§!, сторонника союза с §YПруссией§!. Хотя боярство ропщет, простолюдины видят в Соборе заслон от тирании."
 MOL_antirussian_sentiment:0 "Анти-Русские настроения"
 MOL_antirussian_sentiment_desc:0 "Хотя победа декабристов в §G1825§! году устранила угрозу царского абсолютизма, новая §YРоссия§! сохранила имперские амбиции. К §G1848-м§! годам §YПетроград§! усилил давление на §YМолдавию§!, требуя «защиты православных» в §YБессарабии§!. В ответ §YЯссы§! заключили тайный оборонительный пакт с §YАвстрией§!, запретил преподавание на русском языке в школах и пригласил прусских офицеров для реформы армии. Церковь, сохраняя лояльность Константинопольскому патриархату, клеймит «петроградский республиканский экспансионизм», как угрозу независимости. На улицах звучит: «Лучше ромей, чем русский комиссар!». Местные бояре, связанные с российскими олигархами, саботируют земельную реформу, но Собор старейшин жестко пресекает их влияние через суды."
