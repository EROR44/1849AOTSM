l_russian:
 aotsm_demography_test_cancel_t:0 "Закрыть без изменений"
 aotsm_demography_test_change_tt:0 "Изменяет текущую долю крупнейшей группы в столичном регионе. Остальные доли перераспределяются пропорционально; сумма сохраняется равной 100%. Недоступно до инициализации или при доле цели 100%."
 aotsm_demography_test_1_1_t:0 "Увеличить текущую долю на 1%"
 aotsm_demography_test_1_5_t:0 "Увеличить текущую долю на 5%"
 aotsm_demography_test_1_10_t:0 "Увеличить текущую долю на 10%"
 aotsm_demography_test_1_title_t:0 "Тест: Увеличение доли этноса"
 aotsm_demography_test_1_desc_t:0 "Тест применяется к крупнейшей этнической группе столичного региона на момент выбора варианта. Процент рассчитывается от текущей доли группы: например, +10% превращает 50% в 55%. Остальные группы изменяются пропорционально. Население и государственная религия не меняются. Для изменения другой группы задайте её ID вместо переменной лидера в коде события."
